<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f2ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        标题 {header {
            文本对齐：居中；text-align: center;
            bottom外边距: 50px;margin-bottom: 50px;
            width: 100%;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            font-weight: 700;
        }
        
        /* 胶囊状搜索框样式 */
        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 60px;
            position: relative;
        }
        
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        
        .search-box {
            display: flex;
            width: 100%;
            background: white;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .search-box:focus-within {
            border-color: #6c5ce7;
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.15);
            transform: translateY(-2px);
        }
        
        .search-input {
            flex-grow: 1;
            padding: 20px 25px;
            font-size: 1.1rem;
            border: none;
            outline: none;
            background: transparent;
            color: #2d3436;
        }
        
        .search-input::placeholder {
            color: #b2bec3;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 0 35px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap; /* 防止按钮文字换行 */
        }
        
        .search-btn:hover {
            background: linear-gradient(135deg, #5a4bcf, #8b7bf5);
        }
        
        .search-btn i {
            font-size: 1.2rem;
        }
        
        /* 搜索提示 */
        .search-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            color: #636e72;
            font-size: 0.95rem;
        }
        
        .search-hint i {
            color: #6c5ce7;
        }
        
        /* 功能按钮区域 */
        .buttons-section {
            width: 100%;
            max-width: 1100px;
        }
        
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: #2d3436;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }
        
        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #6c5ce7, #00cec9);
            border-radius: 2px;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
        }
        
        .btn {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: white;
            border-radius: 20px;
            text-decoration: none;
            color: #2d3436;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.05), rgba(0, 206, 201, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        .btn:hover:before {
            opacity: 1;
        }
        
        .btn-icon {
            width: 60px;
            height: 60px;
            min-width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 1.8rem;
            color: white;
            position: relative;
            z-index: 1;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-content {
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }
        
        .btn-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .btn-desc {
            font-size: 0.95rem;
            color: #636e72;
            line-height: 1.5;
        }
        
        .btn-arrow {
            color: #b2bec3;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .btn:hover .btn-arrow {
            color: #6c5ce7;
            transform: translateX(5px);
        }
        
        /* 按钮颜色 */
        .btn-1 .btn-icon { background: linear-gradient(135deg, #ff7675, #fd79a8); }
        .btn-2 .btn-icon { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .btn-3 .btn-icon { background: linear-gradient(135deg, #55efc4, #00b894); }
        .btn-4 .btn-icon { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .btn-5 .btn-icon { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
        .btn-6 .btn-icon { background: linear-gradient(135deg, #dfe6e9, #b2bec3); }
        
        /* 页脚 */
        footer {
            margin-top: 80px;
            text-align: center;
            color: #636e72;
            font-size: 0.9rem;
            padding: 25px 0;
            width: 100%;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        /* 响应式设计 - 关键修改：移除了搜索框垂直布局的逻辑，确保始终横向 */
        @media (max-width: 1024px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2.4rem;
            }
            
            /* 调整手机端搜索框内边距，保证显示效果 */
            .search-input {
                padding: 16px 20px;
                font-size: 1rem;
            }
            
            .search-btn {
                padding: 0 25px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 768px) {
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                flex-direction: column;
                gap: 10px;
            }
            
            /* 移除原有的垂直布局代码，保持flex横向布局 */
            .search-box {
                border-radius: 50px;
                overflow: hidden;
            }
            
            .search-input {
                border-radius: 0;
                border-bottom: none;
            }
            
            .search-btn {
                border-radius: 0;
                padding: 0 20px;
            }
            
            .btn {
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .section-title {
                font-size: 1.5rem;
            }
            
            .logo-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            /* 进一步缩小手机端搜索框内边距 */
            .search-input {
                padding: 14px 18px;
                font-size: 0.95rem;
            }
            
            .search-btn {
                padding: 0 18px;
                font-size: 0.95rem;
            }
        }
        
        /* 图标字体替代方案 */
        .icon {
            display: inline-block;
            font-style: normal;
            font-weight: normal;
            line-height: 1;
            font-size: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
               
                <h1>搜索门户</h1>
            </div>
            <!-- 删除了tagline标语 -->
        </header>
        
        <main>
            <section class="search-container">
                <div class="search-wrapper">
                    <form class="search-box" action="https://www.sogou.com/web" method="get" target="_blank">
                        <input 
                            type="text" 
                            name="query" 
                            class="search-input" 
                            placeholder="输入关键词开始搜索..." 
                            required
                            aria-label="搜索框"
                        >
                        <button type="submit" class="search-btn">
                            <span class="icon">🔍</span> 搜索
                        </button>
                    </form>
                </div>
                
                <div class="search-hint">
                    <span class="icon">💡</span>
                    <span>搜索服务由搜狗搜索提供，安全快速</span>
                </div>
                
                <!-- 删除了搜索历史相关内容 -->
            </section>
            
            <section class="buttons-section">
                <h2 class="section-title">快捷功能入口</h2>
                <div class="buttons-grid">
                    <a href="./yingshi/1/" class="btn btn-1" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">📰</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">新闻资讯</div>
                            <div class="btn-desc">浏览国内外最新新闻动态，了解时事热点</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                    
                    <a href="./yingshi/2" class="btn btn-2" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">🖼️</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">图片搜索</div>
                            <div class="btn-desc">搜索海量高清图片素材，支持多种筛选条件</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                    
                    <a href="https://v.sogou.com" class="btn btn-3" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">🎬</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">视频内容</div>
                            <div class="btn-desc">探索海量视频资源，支持在线播放与下载</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                    
                    <a href="https://map.sogou.com" class="btn btn-4" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">🗺️</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">地图服务</div>
                            <div class="btn-desc">查找地点、规划路线，提供实时导航服务</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                    
                    <a href="https://fanyi.sogou.com" class="btn btn-5" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">🌐</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">翻译工具</div>
                            <div class="btn-desc">多语言翻译服务，支持文本、文档翻译</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                    
                    <a href="https://www.sogou.com/docs/help.htm" class="btn btn-6" target="_blank">
                        <div class="btn-icon">
                            <span class="icon">❓</span>
                        </div>
                        <div class="btn-content">
                            <div class="btn-title">帮助中心</div>
                            <div class="btn-desc">获取搜索使用指南、技巧和常见问题解答</div>
                        </div>
                        <div class="btn-arrow">→</div>
                    </a>
                </div>
            </section>
        </main>
        
        <footer>
            <p>© 2026 搜索门户</p>
            <p style="margin-top: 8px; font-size: 0.85rem;">本页面设计采用了现代化搜索框，提供更流畅的搜索体验</p>
        </footer>
    </div>
</body>

</html>
