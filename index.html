<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简洁主页</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #333;
}
.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
    padding: 30px;
    background-color: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}
.logo {
    margin-bottom: 30px;
}
.logo h1 {
    font-size: 2.8rem;
    background: linear-gradient(90deg, #4a6fa5, #ff6b6b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    letter-spacing: 1px;
}
.logo p {
    color: #666;
    font-size: 1.1rem;
    margin-top: 8px;
}
.search-section {
    margin-bottom: 50px;
}
.search-title {
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.search-title span:first-child {
    color: #4a6fa5;
    font-weight: bold;
}
.search-box {
    display: flex;
    max-width: 650px;
    margin: 0 auto;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    border-radius: 50px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.search-box:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}
.search-input {
    flex: 1;
    padding: 20px 25px;
    border: none;
    font-size: 1.1rem;
    background-color: #fff;
}
.search-input:focus {
    outline: none;
}
.search-button {
    background: linear-gradient(90deg, #4a6fa5, #6a93cb);
    color: white;
    border: none;
    padding: 0 40px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
}
.search-button:hover {
    background: linear-gradient(90deg, #3a5f95, #5a83bb);
}
.buttons-section {
    margin-bottom: 30px;
}
.section-title {
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.section-title span:first-child {
    color: #ff6b6b;
    font-weight: bold;
}
.buttons-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
}
@media (min-width: 768px) {
    .buttons-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
@media (max-width: 767px) and (min-width: 480px) {
    .buttons-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
@media (max-width: 479px) {
    .buttons-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
.video-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 10px;
    border-radius: 16px;
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    position: relative;
    overflow: hidden;
    min-height: 120px;
}
.video-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0));
    z-index: 1;
}
.video-btn span:first-child {
    font-size: 2.2rem;
    margin-bottom: 12px;
    z-index: 2;
}
.video-btn span:last-child {
    z-index: 2;
    font-size: 1rem;
}
.video-btn:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
}
.btn-bilibili {
    background: linear-gradient(135deg, #fb7299, #ff85a1);
}
.btn-youtube {
    background: linear-gradient(135deg, #ff0000, #ff4d4d);
}
.btn-tencent {
    background: linear-gradient(135deg, #0084ff, #00a1ff);
}
.btn-iqiyi {
    background: linear-gradient(135deg, #00c3ff, #00a2e8);
}
.btn-youku {
    background: linear-gradient(135deg, #ff8400, #ffa500);
}
.btn-netflix {
    background: linear-gradient(135deg, #e50914, #ff1e1e);
}
.footer {
    margin-top: 30px;
    color: #666;
    font-size: 0.9rem;
    padding-top: 20px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    width: 100%;
    text-align: center;
}
@media (max-width: 767px) {
    .container {
        padding: 20px 15px;
        border-radius: 15px;
    }
    .logo h1 {
        font-size: 2.2rem;
    }
    .search-box {
        flex-direction: row;
        border-radius: 50px;
        max-width: 100%;
        margin: 0 auto;
    }
    .search-input {
        padding: 16px 20px;
        font-size: 1rem;
        border-radius: 50px 0 0 50px;
    }
    .search-button {
        padding: 16px 25px;
        font-size: 1rem;
        border-radius: 0 50px 50px 0;
        white-space: nowrap;
    }
    .video-btn {
        padding: 20px 5px;
        min-height: 100px;
    }
    .video-btn span:first-child {
        font-size: 1.8rem;
    }
    .video-btn span:last-child {
        font-size: 0.9rem;
    }
}
@media (max-width: 360px) {
    .search-button span:last-child {
        display: none;
    }
    .search-button {
        padding: 16px 20px;
    }
    .search-button span:first-child {
        margin: 0;
    }
    .video-btn {
        padding: 15px 5px;
        min-height: 90px;
    }
    .video-btn span:last-child {
        font-size: 0.85rem;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>简洁主页</h1>
        <p>豆瓣搜索，先看影评</p>
    </div>
    <div class="search-section">
        <div class="search-title">
            <span>🔍</span>
            <span>豆瓣搜索</span>
        </div>
        <form class="search-box" action="https://m.douban.com/search" method="get" target="_blank">
            <input type="text" class="search-input" name="query" placeholder="输入影视搜索..." required>
            <button type="submit" class="search-button">
                <span>🔍</span>
                <span>搜索</span>
            </button>
        </form>
    </div>
    <div class="buttons-section">
        <div class="section-title">
            <span>▶</span>
            <span>视频网站</span>
        </div>
        <div class="buttons-grid">
            <a href="./yingshi/1" class="video-btn btn-bilibili" target="_blank">
                <span>B</span>
                <span>白象一站</span>
            </a>
            <a href="./yingshi/2" class="video-btn btn-youtube" target="_blank">
                <span>B</span>
                <span>白象二站</span>
            </a>
            <a href="https://v.qq.com" class="video-btn btn-tencent" target="_blank">
                <span>T</span>
                <span>腾讯视频</span>
            </a>
            <a href="https://www.iqiyi.com" class="video-btn btn-iqiyi" target="_blank">
                <span>I</span>
                <span>爱奇艺</span>
            </a>
            <a href="https://www.youku.com" class="video-btn btn-youku" target="_blank">
                <span>U</span>
                <span>优酷视频</span>
            </a>
            <a href="https://www.mgtv.com" class="video-btn btn-netflix" target="_blank">
                <span>N</span>
                <span>芒果视频</span>
            </a>
        </div>
    </div>
    <div class="footer">
        <p>© 2026 简洁主页</p>
    </div>
</div>
<script>
document.querySelector('.search-input').focus();
document.querySelectorAll('.video-btn').forEach(button => {
    button.addEventListener('click', function(e) {
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
            this.style.transform = '';
        }, 150);
    });
});
document.querySelector('.search-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        document.querySelector('.search-box').submit();
    }
});
window.addEventListener('load', function() {
    document.querySelector('.container').style.opacity = '0';
    document.querySelector('.container').style.transform = 'translateY(20px)';
    setTimeout(() => {
        document.querySelector('.container').style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        document.querySelector('.container').style.opacity = '1';
        document.querySelector('.container').style.transform = 'translateY(0)';
    }, 100);
});
</script>
</body>
</html>
