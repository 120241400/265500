<!DOCTYPE html> 
<html lang="zh-CN"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"> 
  <title>白象影视</title> 
  <meta name="description" content="白象影视-永久免费看全网视频，线路超多，资源超全">
  <link rel="shortcut icon" href="https://i0.wp.com/baixiangys.netlify.app/shouye/logo.png" />
  <style> 
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    } 
    html, body { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
    } 
    body { 
      position: relative; 
      color: #fff; 
    } 
    /* 壁纸层 - 更暗一些 */ 
    .wallpaper-layer { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: -1; 
      background-size: cover; 
      background-position: center center; 
      background-repeat: no-repeat; 
    } 
    .wallpaper-layer::before { 
      content: ""; 
      position: absolute; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%); 
    } 
    /* 状态栏 */ 
    .status-bar { 
      height: 36px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 0 16px; 
      font-size: 14px; 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      z-index: 100; 
      background: rgba(0,0,0,0.6); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
    } 
    .status-center { 
      font-size: 13px; 
      font-weight: 500; 
      color: rgba(255,255,255,0.95); 
      text-shadow: 0 1px 3px rgba(0,0,0,0.9); 
      letter-spacing: 0.5px; 
    } 
    /* 桌面容器 */ 
    .desktop-container { 
      position: fixed; 
      top: 36px; 
      bottom: 90px; 
      left: 0; 
      right: 0; 
      overflow: hidden; 
      -webkit-overflow-scrolling: touch; 
      user-select: none; /* 防止选中文本 */ 
      -webkit-user-select: none; 
    } 
    .desktop-wrapper { 
      display: flex; 
      height: 100%; 
      transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); 
    } 
    .desktop-page { 
      min-width: 100%; 
      height: 100%; 
      padding: 20px 16px; 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      align-content: flex-start; 
      gap: 16px; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
    } 
    /* 应用图标 - 自适应大小 */ 
    .app-icon { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      width: 20%; /* 默认一行最多5个 */ 
      min-width: 60px; 
      max-width: 80px; 
      padding: 8px 2px; 
      border-radius: 12px; 
      transition: all 0.2s ease; 
      flex-shrink: 0; 
      touch-action: manipulation; 
      -webkit-user-select: none; 
      user-select: none; 
    } 
    .app-icon:active { 
      transform: scale(0.92); 
      background: rgba(255,255,255,0.15); 
    } 
    .app-icon .icon-img { 
      width: 100%; 
      aspect-ratio: 1/1; 
      border-radius: 18px; 
      object-fit: cover; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4); 
      transition: all 0.3s ease; 
    } 
    .app-icon:hover .icon-img { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.5); 
    } 
    .app-icon .name { 
      font-size: 12px; 
      text-align: center; 
      color: rgba(255,255,255,0.95); 
      text-shadow: 0 1px 3px rgba(0,0,0,0.9); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      max-width: 100%; 
      font-weight: 500; 
      letter-spacing: 0.2px; 
      margin-top: 6px; 
    } 
    /* 底部 Dock 栏 - 调整图标大小 */ 
    .dock { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      height: 85px; /* 稍微降低高度 */ 
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 50%, transparent 100%); 
      backdrop-filter: blur(30px); 
      -webkit-backdrop-filter: blur(30px); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 16px; /* 减少间隙 */ 
      padding: 0 16px 20px; /* 调整内边距 */ 
      border-top: 1px solid rgba(255,255,255,0.1); 
      z-index: 80; 
    } 
    .dock .app-icon { 
      width: auto; 
      min-width: 50px; /* 减少最小宽度 */ 
      max-width: 60px; /* 减少最大宽度 */ 
      padding: 4px 6px; /* 减少内边距 */ 
    } 
    .dock .app-icon .icon-img { 
      width: 48px; /* 减小图标尺寸 */ 
      height: 48px; 
      border-radius: 16px; /* 稍微减小圆角 */ 
    } 
    .dock .app-icon .name { 
      font-size: 10px; /* 减小字体大小 */ 
      margin-top: 3px; /* 减少上边距 */ 
      font-weight: 500; 
      letter-spacing: 0.1px; 
    } 
    /* 页面指示器 */ 
    .page-indicator { 
      position: fixed; 
      bottom: 90px; /* 调整位置，避免与Dock栏重叠 */ 
      left: 50%; 
      transform: translateX(-50%); 
      display: flex; 
      gap: 6px; 
      z-index: 50; 
      padding: 8px 12px; 
      border-radius: 20px; 
      background: rgba(0,0,0,0.4); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      pointer-events: none; /* 移除点击事件，防止误触 */ 
    } 
    .page-dot { 
      width: 6px; 
      height: 6px; 
      border-radius: 50%; 
      background: rgba(255,255,255,0.3); 
      transition: all 0.3s ease; 
    } 
    .page-dot.active { 
      width: 20px; 
      border-radius: 3px; 
      background: rgba(255,255,255,0.95); 
    } 
    /* 应用窗口 */ 
    .app-window { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: #000; 
      z-index: 999; 
      display: none; 
      flex-direction: column; 
      opacity: 0; 
      transition: opacity 0.3s ease; 
    } 
    .app-window.show { 
      display: flex; 
      opacity: 1; 
    } 
    /* 标题栏 */ 
    .app-window .title-bar { 
      height: 36px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 12px; 
      background: rgba(0,0,0,0.9); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      flex-shrink: 0; 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
      z-index: 1000; 
    } 
    .app-window.fullscreen .title-bar { 
      display: none; /* 全屏时完全隐藏标题栏 */ 
    } 
    .app-window .title { 
      font-size: 14px; 
      font-weight: 600; 
      color: #fff; 
      text-align: center; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      flex: 1; 
      margin: 0 8px; 
    } 
    .app-window .title-btn { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
    } 
    .app-window .btn { 
      background: #ff4757; 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      padding: 6px 12px; 
      font-size: 12px; 
      cursor: pointer; 
      backdrop-filter: blur(10px); 
      transition: all 0.2s ease; 
      white-space: nowrap; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-width: 60px; 
      font-weight: 500; 
    } 
    .app-window .btn:hover { 
      opacity: 0.9; 
      transform: scale(0.98); 
    } 
    .app-window .btn:active { 
      transform: scale(0.95); 
    } 
    .app-window .close-btn { 
      background: #ff4757; 
    } 
    .app-window .fullscreen-btn { 
      background: #ff4757; 
    } 
    /* 页面内容区 */ 
    .app-window .content { 
      flex: 1; 
      overflow: hidden; 
      position: relative; 
      background: #000; 
    } 
    .app-window.fullscreen .content { 
      height: 100%; 
      top: 0; 
    } 
    .app-window .content iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
      background: #fff; 
    } 
    /* 响应式适配 - 图标自适应 */ 
    /* 小屏幕手机 */ 
    @media (max-width: 320px) { 
      .app-icon { 
        width: 25%; /* 一行4个 */ 
        min-width: 55px; 
      } 
      .app-icon .name { 
        font-size: 10px; 
      } 
      .dock { 
        gap: 10px; /* 进一步减小间隙 */ 
        padding: 0 10px 18px; 
      } 
      .dock .app-icon { 
        min-width: 45px; 
      } 
      .dock .app-icon .icon-img { 
        width: 44px; 
        height: 44px; 
      } 
      .dock .app-icon .name { 
        font-size: 9px; 
      } 
      .status-center { 
        font-size: 12px; 
      } 
      .page-indicator { 
        bottom: 85px; 
      } 
    } 
    /* 中等屏幕手机 */ 
    @media (min-width: 321px) and (max-width: 375px) { 
      .app-icon { 
        width: 20%; /* 一行5个 */ 
        min-width: 60px; 
      } 
      .app-icon .name { 
        font-size: 11px; 
      } 
      .dock { 
        gap: 12px; 
      } 
      .dock .app-icon .icon-img { 
        width: 46px; 
        height: 46px; 
      } 
    } 
    /* 大屏幕手机 */ 
    @media (min-width: 376px) and (max-width: 414px) { 
      .app-icon { 
        width: 20%; /* 一行5个 */ 
        min-width: 65px; 
      } 
      .app-icon .name { 
        font-size: 12px; 
      } 
      .dock { 
        gap: 16px; 
      } 
      .dock .app-icon .icon-img { 
        width: 48px; 
        height: 48px; 
      } 
    } 
    /* 平板手机 */ 
    @media (min-width: 415px) and (max-width: 767px) { 
      .desktop-page { 
        gap: 20px; 
        padding: 24px 20px; 
      } 
      .app-icon { 
        width: 20%; /* 一行5个 */ 
        min-width: 70px; 
      } 
      .app-icon .name { 
        font-size: 13px; 
      } 
      .dock { 
        gap: 20px; 
      } 
      .dock .app-icon { 
        min-width: 60px; 
      } 
      .dock .app-icon .icon-img { 
        width: 52px; 
        height: 52px; 
      } 
      .dock .app-icon .name { 
        font-size: 11px; 
      } 
    } 
    /* 平板 */ 
    @media (min-width: 768px) and (max-width: 1023px) { 
      .desktop-page { 
        gap: 24px; 
        padding: 28px 24px; 
      } 
      .app-icon { 
        width: 16.666%; /* 一行6个 */ 
        min-width: 80px; 
      } 
      .app-icon .name { 
        font-size: 13px; 
      } 
      .dock { 
        gap: 24px; 
        padding: 0 24px 20px; 
      } 
      .dock .app-icon { 
        min-width: 70px; 
      } 
      .dock .app-icon .icon-img { 
        width: 58px; 
        height: 58px; 
      } 
      .dock .app-icon .name { 
        font-size: 12px; 
      } 
    } 
    /* 桌面 */ 
    @media (min-width: 1024px) { 
      .desktop-page { 
        gap: 28px; 
        padding: 32px 28px; 
      } 
      .app-icon { 
        width: 14.285%; /* 一行7个 */ 
        min-width: 90px; 
      } 
      .app-icon .name { 
        font-size: 14px; 
      } 
      .dock { 
        gap: 30px; 
        padding: 0 30px 20px; 
      } 
      .dock .app-icon { 
        min-width: 80px; 
      } 
      .dock .app-icon .icon-img { 
        width: 60px; 
        height: 60px; 
      } 
      .dock .app-icon .name { 
        font-size: 13px; 
      } 
    } 
    /* 横屏模式 */ 
    @media (orientation: landscape) and (max-height: 500px) { 
      .desktop-container { 
        bottom: 70px; 
      } 
      .desktop-page { 
        padding: 12px 16px; 
        gap: 12px; 
      } 
      .app-icon { 
        width: 12.5%; /* 一行8个 */ 
        min-width: 55px; 
      } 
      .app-icon .icon-img { 
        width: 100%; 
      } 
      .dock { 
        height: 65px; 
        padding-bottom: 8px; 
        gap: 12px; 
      } 
      .dock .app-icon .icon-img { 
        width: 44px; 
        height: 44px; 
      } 
      .page-indicator { 
        bottom: 70px; 
      } 
    } 
    /* 触摸滑动优化 */ 
    .desktop-container { 
      touch-action: pan-y pinch-zoom; 
    } 
  </style> 
</head> 
<body> 
  <!-- 壁纸层 --> 
  <div class="wallpaper-layer" id="wallpaper"></div> 
  <!-- 状态栏 --> 
  <div class="status-bar"> 
    <div class="status-center" id="fullTime">加载中...</div> 
  </div> 
  <!-- 桌面容器 --> 
  <div class="desktop-container" id="desktopContainer"> 
    <div class="desktop-wrapper" id="desktopWrapper"> 
      <div class="desktop-page" id="page1"></div> 
      <div class="desktop-page" id="page2"></div> 
    </div> 
  </div> 
  <!-- 页面指示器 --> 
  <div class="page-indicator" id="pageIndicator"> 
    <div class="page-dot active"></div> 
    <div class="page-dot"></div> 
  </div> 
  <!-- 底部 Dock 栏 --> 
  <div class="dock" id="dock"></div> 
  <!-- 应用窗口 --> 
  <div class="app-window" id="appWindow"> 
    <div class="title-bar"> 
      <div class="title-btn"> 
        <button class="btn fullscreen-btn" onclick="toggleFullscreen()">全屏</button> 
      </div> 
      <div class="title" id="appTitle"></div> 
      <div class="title-btn"> 
        <button class="btn close-btn" onclick="closeApp()">关闭</button> 
      </div> 
    </div> 
    <div class="content" id="appContent"></div> 
  </div> 
  <script> 
    // ====================== 壁纸列表 ====================== 
    const wallpapers = [ 
      "http://bing.img.run/rand.php?https://picsum.photos/1920/1080", 
      "http://bing.img.run/rand.php?https://picsum.photos/1920/1080" 
    ]; 
    function initWallpaper() { 
      const wallpaperEl = document.getElementById("wallpaper"); 
      const randomIndex = Math.floor(Math.random() * wallpapers.length); 
      wallpaperEl.style.backgroundImage = `url(${wallpapers[randomIndex]})`; 
    } 
    // ====================== 应用列表 ====================== 
    const allApps = [ 
      [ 
        { 
          name: "影视一站", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_10621048_1773130897/256", 
          url: "./yingshi/1" 
        }, 
        { 
          name: "影视二站", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_11213962_1755480427/256", 
          url: "./yingshi/2" 
        }, 
        { 
          name: "影视三站", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54523428_1771074137/256", 
          url: "./yingshi/3" 
        }, 
        { 
          name: "影视四站", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_12215536_1762930668/256", 
          url: "./yingshi/4" 
        }, 
        { 
          name: "影视五站", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54432455_1763976606/256", 
          url: "./yingshi/5" 
        }, 
        { 
          name: "淘宝领券", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54508324_1769481196/256", 
          url: "./bfq/lingquan.html" 
        }, 
      ], 
      [ 
        { 
          name: "二维码生成", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54328693_1705943040/256", 
          url: "https://cli.im/" 
        }, 
      ] 
    ]; 
    const dockApps = [ 
        { 
          name: "切换主页", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54263391_1751532545/256", 
          url: "https://saas.bk-cdn01.com/t/eb5cddea-8710-4a43-af44-e9ceb4c9befe/u/76c8d21d-0c4b-45b4-93e9-aee594231a1b/1774345995229/shoujiyemian.html", 
          openType: "newTab"  // 新增：设置为新窗口打开
        }, 
        { 
          name: "豆包", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54357708_1773645997/256", 
          url: "https://www.doubao.com" 
        }, 
        { 
          name: "元宝", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_54375103_1773991338/256", 
          url: "https://yuanbao.tencent.com/" 
        }, 
        { 
          name: "文心一言", 
          icon: "https://pp.myapp.com/ma_icon/0/icon_52531223_1740990325/256", 
          url: "https://yiyan.baidu.com/" 
        },
    ]; 
    // ====================== 图标自适应逻辑 ====================== 
    function calculateIconSize() { 
      // 计算第一页的图标数量 
      const page1Count = allApps[0].length; 
      const screenWidth = window.innerWidth; 
      let iconWidth = 20; // 默认一行5个 
      // 根据第一页图标数量决定每行显示几个图标 
      if (screenWidth <= 320) { 
        // 小屏幕 
        iconWidth = 25; // 一行4个 
      } else if (page1Count <= 8) { 
        // 图标较少，一行显示4个 
        iconWidth = 25; 
      } else if (page1Count <= 12) { 
        // 图标适中，一行显示5个 
        iconWidth = 20; 
      } else if (page1Count <= 18) { 
        // 图标较多，一行显示6个 
        iconWidth = 16.666; 
      } else { 
        // 图标很多，一行显示7个 
        iconWidth = 14.285; 
      } 
      // 横屏模式调整 
      if (window.innerHeight <= 500 && window.innerWidth > window.innerHeight) { 
        iconWidth = 12.5; // 横屏时一行8个 
      } 
      return iconWidth; 
    } 
    // ====================== 渲染桌面 ====================== 
    function renderDesktop() { 
      // 先计算图标大小 
      const iconWidth = calculateIconSize(); 
      allApps.forEach((pageApps, pageIndex) => { 
        const pageEl = document.getElementById(`page${pageIndex + 1}`); 
        pageEl.innerHTML = ""; 
        pageApps.forEach((app, i) => { 
          const div = document.createElement("div"); 
          div.className = "app-icon"; 
          div.dataset.page = pageIndex; 
          div.dataset.index = i; 
          // 应用统一的宽度 
          div.style.width = `${iconWidth}%`; 
          div.innerHTML = ` 
            <img class="icon-img" src="${app.icon}" alt="${app.name}" loading="lazy"> 
            <div class="name">${app.name}</div> 
          `; 
          // 修改这里：根据openType属性决定打开方式
          div.onclick = () => { 
            if (app.openType === "newTab") { 
              window.open(app.url, "_blank"); 
            } else { 
              openApp(app.name, app.url); 
            } 
          }; 
          pageEl.appendChild(div); 
        }); 
      }); 
    } 
    function renderDock() { 
      const dockEl = document.getElementById("dock"); 
      dockEl.innerHTML = ""; 
      dockApps.forEach((app, i) => { 
        const div = document.createElement("div"); 
        div.className = "app-icon"; 
        div.dataset.dock = true; 
        div.dataset.index = i; 
        div.innerHTML = ` 
          <img class="icon-img" src="${app.icon}" alt="${app.name}" loading="lazy"> 
          <div class="name">${app.name}</div> 
        `; 
        // 修改这里：根据openType属性决定打开方式
        div.onclick = () => { 
          if (app.openType && app.openType === "newTab") { 
            window.open(app.url, "_blank"); 
          } else if (app.name === "主页") { 
            goToPage(0); 
          } else { 
            openApp(app.name, app.url); 
          } 
        }; 
        dockEl.appendChild(div); 
      }); 
    } 
    // ====================== 页面滑动功能 ====================== 
    let currentPage = 0; 
    const totalPages = 2; 
    let startX = 0; 
    let currentX = 0; 
    let isDragging = false; 
    let hasSwiped = false; // 标记是否已经执行了滑动操作 
    const desktopContainer = document.getElementById("desktopContainer"); 
    const desktopWrapper = document.getElementById("desktopWrapper"); 
    const pageIndicator = document.getElementById("pageIndicator"); 
    function updatePageIndicator() { 
      const dots = pageIndicator.querySelectorAll(".page-dot"); 
      dots.forEach((dot, i) => { 
        dot.classList.toggle("active", i === currentPage); 
      }); 
    } 
    function goToPage(page) { 
      currentPage = Math.max(0, Math.min(page, totalPages - 1)); 
      desktopWrapper.style.transform = `translateX(-${currentPage * 100}%)`; 
      updatePageIndicator(); 
    } 
    // 触摸事件 
    desktopContainer.addEventListener("touchstart", (e) => { 
      if (appWindow.classList.contains("show")) return; // 应用窗口打开时不处理滑动 
      startX = e.touches[0].clientX; 
      isDragging = true; 
      hasSwiped = false; // 重置滑动标记 
      desktopWrapper.style.transition = "none"; 
    }, { passive: true }); 
    desktopContainer.addEventListener("touchmove", (e) => { 
      if (!isDragging || appWindow.classList.contains("show")) return; 
      currentX = e.touches[0].clientX; 
      const diff = currentX - startX; 
      const offset = -currentPage * 100 + (diff / desktopContainer.offsetWidth) * 100; 
      desktopWrapper.style.transform = `translateX(${offset}%)`; 
      // 标记已经开始滑动 
      if (Math.abs(diff) > 10) { 
        hasSwiped = true; 
      } 
    }, { passive: true }); 
    desktopContainer.addEventListener("touchend", () => { 
      if (!isDragging || appWindow.classList.contains("show")) return; 
      isDragging = false; 
      desktopWrapper.style.transition = "transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1)"; 
      const diff = currentX - startX; 
      // 必须滑动超过50像素才切换页面，防止轻触切换 
      if (Math.abs(diff) > 50 && hasSwiped) { 
        if (diff > 0 && currentPage > 0) { 
          goToPage(currentPage - 1); 
        } else if (diff < 0 && currentPage < totalPages - 1) { 
          goToPage(currentPage + 1); 
        } else { 
          goToPage(currentPage); 
        } 
      } else { 
        // 滑动距离不足，回到当前页面 
        goToPage(currentPage); 
      } 
      hasSwiped = false; // 重置滑动标记 
    }); 
    // 鼠标拖拽支持 
    desktopContainer.addEventListener("mousedown", (e) => { 
      if (appWindow.classList.contains("show")) return; // 应用窗口打开时不处理滑动 
      startX = e.clientX; 
      isDragging = true; 
      hasSwiped = false; // 重置滑动标记 
      desktopWrapper.style.transition = "none"; 
      e.preventDefault(); // 防止文本选择 
    }); 
    document.addEventListener("mousemove", (e) => { 
      if (!isDragging || appWindow.classList.contains("show")) return; 
      currentX = e.clientX; 
      const diff = currentX - startX; 
      const offset = -currentPage * 100 + (diff / desktopContainer.offsetWidth) * 100; 
      desktopWrapper.style.transform = `translateX(${offset}%)`; 
      // 标记已经开始滑动 
      if (Math.abs(diff) > 10) { 
        hasSwiped = true; 
      } 
    }); 
    document.addEventListener("mouseup", () => { 
      if (!isDragging || appWindow.classList.contains("show")) return; 
      isDragging = false; 
      desktopWrapper.style.transition = "transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1)"; 
      const diff = currentX - startX; 
      // 必须滑动超过50像素才切换页面，防止轻触切换 
      if (Math.abs(diff) > 50 && hasSwiped) { 
        if (diff > 0 && currentPage > 0) { 
          goToPage(currentPage - 1); 
        } else if (diff < 0 && currentPage < totalPages - 1) { 
          goToPage(currentPage + 1); 
        } else { 
          goToPage(currentPage); 
        } 
      } else { 
        // 滑动距离不足，回到当前页面 
        goToPage(currentPage); 
      } 
      hasSwiped = false; // 重置滑动标记 
    }); 
    // 阻止桌面容器的点击事件，防止点击触发切换 
    desktopContainer.addEventListener("click", (e) => { 
      // 只有当点击的不是应用图标时才阻止默认行为 
      if (!e.target.closest('.app-icon')) { 
        e.preventDefault(); 
        e.stopPropagation(); 
      } 
    }, true); 
    // ====================== 应用弹窗 ====================== 
    const appWindow = document.getElementById("appWindow"); 
    const appTitle = document.getElementById("appTitle"); 
    const appContent = document.getElementById("appContent"); 
    let isFullscreen = false; 
    function openApp(name, url) { 
      if (!url) return; 
      appTitle.innerText = name; 
      // 修改sandbox属性，允许视频全屏播放 
      appContent.innerHTML = ` 
        <iframe src="${url}" allow="fullscreen; autoplay; encrypted-media" allowfullscreen sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-presentation"></iframe> 
      `; 
      appWindow.classList.add("show"); 
      document.body.style.overflow = "hidden"; 
      isFullscreen = false; 
      appWindow.classList.remove("fullscreen"); 
    } 
    function closeApp() { 
      appWindow.classList.remove("show"); 
      document.body.style.overflow = ""; 
      appContent.innerHTML = ""; 
      isFullscreen = false; 
      appWindow.classList.remove("fullscreen"); 
    } 
    function toggleFullscreen() { 
      isFullscreen = !isFullscreen; 
      if (isFullscreen) { 
        appWindow.classList.add("fullscreen"); 
      } else { 
        appWindow.classList.remove("fullscreen"); 
      } 
    } 
    // ESC键退出全屏或关闭应用 
    document.addEventListener("keydown", e => { 
      if (appWindow.classList.contains("show")) { 
        if (e.key === "Escape" || e.key === "Backspace") { 
          if (isFullscreen) { 
            toggleFullscreen(); 
          } else { 
            closeApp(); 
          } 
        } 
        if (e.key === "f" || e.key === "F") { 
          toggleFullscreen(); 
        } 
        return; 
      } 
    }); 
    // ====================== 时间显示 ====================== 
    function updateTime() { 
      const now = new Date(); 
      const months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]; 
      const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"]; 
      const month = months[now.getMonth()]; 
      const date = now.getDate(); 
      const day = days[now.getDay()]; 
      const hours = String(now.getHours()).padStart(2, "0"); 
      const minutes = String(now.getMinutes()).padStart(2, "0"); 
      const timeString = `${month}${date}日 ${day} ${hours}:${minutes}`; 
      document.getElementById("fullTime").innerText = timeString; 
    } 
    setInterval(updateTime, 1000); 
    updateTime(); 
    // ====================== 初始化 ====================== 
    initWallpaper(); 
    renderDesktop(); 
    renderDock(); 
    updatePageIndicator(); 
    // 窗口大小改变时重置布局 
    window.addEventListener("resize", () => { 
      goToPage(currentPage); 
      renderDesktop(); // 重新渲染以调整图标大小 
    }); 
    // 点击背景关闭弹窗 
    appWindow.addEventListener("click", (e) => { 
      if (e.target === appWindow) { 
        closeApp(); 
      } 
    }); 
  </script> 
</body>
