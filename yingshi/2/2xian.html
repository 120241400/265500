<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>影视搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #000;
            color: #e6e6e6;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 播放页样式 */
        #playPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            overflow: hidden;
        }

        /* 顶部信息栏 */
        .play-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-title {
            flex: 1;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            margin-right: 10px;
            padding: 0 10px;
        }

        .header-title.scrolling {
            animation: scrollText 10s linear infinite;
        }

        .header-title.error {
            color: #ff6b6b;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 顶部搜索框 - 默认隐藏 */
        .header-search-box {
            display: none;
            flex: 1;
            height: 36px;
            margin-right: 10px;
            align-items: center;
            gap: 8px;
        }

        .header-search-box.show {
            display: flex;
        }

        .header-search-input-wrapper {
            flex: 1;
            position: relative;
            height: 100%;
        }

        .header-search-input {
            width: 100%;
            height: 100%;
            padding: 0 32px 0 12px;
            background: rgba(50, 50, 50, 0.8);
            border: 1px solid rgba(255, 125, 0, 0.5);
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            outline: none;
        }

        .header-search-input:focus {
            border-color: #ff7d00;
            background: rgba(60, 60, 60, 0.9);
        }

        .header-search-input::placeholder {
            color: #888;
        }

        /* 清除按钮 */
        .search-clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.6);
            border: none;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .search-clear-btn:hover {
            background: rgba(255, 125, 0, 0.8);
            color: #fff;
        }

        .search-clear-btn.show {
            display: flex;
        }

        .header-search-btn {
            height: 36px;
            padding: 0 15px;
            background: #ff7d00;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .header-search-btn:hover {
            background: #ff9500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: rgba(255, 125, 0, 0.8);
            transform: scale(1.05);
        }

        .header-btn.active {
            background: #ff7d00;
        }

        /* 主内容区 */
        .play-main {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            height: calc(100vh - 100px);
            display: flex;
            transition: all 0.3s ease;
        }

        /* 播放器区域 */
        .player-section {
            flex: 1;
            height: 100%;
            background: #000;
            position: relative;
            transition: flex 0.3s ease;
        }

        .player-section.shrink {
            flex: 0 0 70%;
        }

        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .play-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .parse-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 1001;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 8px;
            display: none;
        }

        /* 选集/历史/详情侧边栏 */
        .episodes-sidebar, .detail-sidebar, .history-sidebar {
            width: 0;
            height: 100%;
            background: rgba(20, 20, 20, 0.98);
            overflow-y: auto;
            transition: width 0.3s ease, opacity 0.3s ease;
            border-left: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            position: relative;
        }

        .episodes-sidebar.show, .detail-sidebar.show, .history-sidebar.show {
            width: 30%;
            opacity: 1;
        }

        .episodes-sidebar::-webkit-scrollbar,
        .detail-sidebar::-webkit-scrollbar,
        .history-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .episodes-sidebar::-webkit-scrollbar-track,
        .detail-sidebar::-webkit-scrollbar-track,
        .history-sidebar::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .episodes-sidebar::-webkit-scrollbar-thumb,
        .detail-sidebar::-webkit-scrollbar-thumb,
        .history-sidebar::-webkit-scrollbar-thumb {
            background: #ff7d00;
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 16px;
            font-weight: bold;
            color: #ff7d00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sort-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .sort-btn {
            background: rgba(255, 125, 0, 0.2);
            border: 1px solid rgba(255, 125, 0, 0.4);
            color: #ff7d00;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: normal;
        }

        .sort-btn.active {
            background: #ff7d00;
            color: #fff;
            border-color: #ff7d00;
        }

        .sort-btn:hover {
            background: rgba(255, 125, 0, 0.6);
            color: #fff;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .close-sidebar-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .episodes-content {
            padding: 10px;
        }

        .drama-group {
            margin-bottom: 15px;
        }

        .drama-title-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 125, 0, 0.2);
            color: #ff7d00;
            border: 1px solid rgba(255, 125, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            gap: 8px;
        }

        .drama-title-btn:hover {
            background: rgba(255, 125, 0, 0.3);
        }

        .drama-title-btn.active {
            background: rgba(255, 125, 0, 0.4);
            border-color: #ff7d00;
        }

        /* 影片名称区域 - 左侧 */
        .drama-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }

        /* 右侧区域 - 包含类别标签和箭头 */
        .drama-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* 类别标签 */
        .type-tag {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(0, 168, 255, 0.2);
            color: #00a8ff;
            border: 1px solid rgba(0, 168, 255, 0.3);
            border-radius: 4px;
            font-size: 11px;
            font-weight: normal;
            white-space: nowrap;
        }

        .type-tag.domestic {
            background: rgba(255, 125, 0, 0.3);
            color: #ff7d00;
            border-color: rgba(255, 125, 0, 0.5);
        }

        .type-tag.short {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
        }

        /* 展开/折叠箭头 */
        .expand-icon {
            font-size: 12px;
            color: #fff;
            opacity: 0.7;
            transition: transform 0.2s;
        }

        .drama-title-btn.active .expand-icon {
            opacity: 1;
        }

        .episodes-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .episodes-container.single-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .episodes-container.single-column .episode-item {
            width: 100%;
            text-align: left;
            white-space: normal;
            word-break: break-word;
            overflow: visible;
            text-overflow: clip;
            padding: 10px 12px;
            line-height: 1.4;
        }

        /* 手机端单列样式 */
        @media (max-width: 768px) {
            .episodes-container.single-column {
                gap: 5px;
            }
            .episodes-container.single-column .episode-item {
                padding: 8px 10px;
                font-size: 13px;
            }
        }
        .episode-item {
            padding: 10px 5px;
            background: rgba(50, 60, 80, 0.8);
            color: #f0f0f0;
            border: 1px solid #445066;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .episode-item:hover {
            background: #00a8ff;
            border-color: #0088dd;
            transform: translateY(-2px);
        }

        .episode-item.active {
            background: #00a8ff;
            color: #fff;
            border-color: #0088dd;
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.5);
        }

        /* 详情侧边栏内容 */
        .detail-content {
            padding: 20px;
        }

        .detail-item {
            margin-bottom: 20px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #ff7d00;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-label::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background: #ff7d00;
            border-radius: 2px;
        }

        .detail-value {
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.6;
            padding-left: 10px;
        }

        .detail-value.actors {
            color: #00a8ff;
        }

        .detail-value.desc {
            text-align: justify;
            line-height: 1.8;
            color: #ccc;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
        }

        /* 历史记录样式 */
        .history-content {
            padding: 10px;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        .history-empty-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        .history-item {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 125, 0, 0.15);
            border-color: rgba(255, 125, 0, 0.3);
            transform: translateX(4px);
        }

        .history-item-title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-meta {
            color: #888;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-time {
            color: #666;
        }

        /* 底部信息栏 */
        .play-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-text {
            color: #ff7d00;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            padding: 0 15px;
        }

        /* 手机端选集/详情/历史面板 - 底部滑出 */
        @media (max-width: 768px) {
            .play-main {
                flex-direction: column;
                height: calc(100vh - 100px);
            }

            .player-section.shrink {
                flex: 0 0 45%;
            }

            .episodes-sidebar, .detail-sidebar, .history-sidebar {
                position: fixed;
                bottom: 50px;
                left: 0;
                width: 100%;
                height: 0;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
                z-index: 99999;
                transition: height 0.3s ease;
                background: rgba(20, 20, 20, 0.98);
            }

            .episodes-sidebar.show, .detail-sidebar.show, .history-sidebar.show {
                width: 100%;
                height: calc(55% - 50px);
            }

            .episodes-container {
                grid-template-columns: repeat(4, 1fr);
            }

            .header-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .header-title {
                font-size: 14px;
            }

            .header-search-box {
                margin-right: 5px;
            }

            .header-search-input {
                font-size: 13px;
            }

            .header-search-btn {
                padding: 0 10px;
                font-size: 12px;
            }

            .drama-title-btn {
                padding: 10px;
                font-size: 13px;
            }

            .type-tag {
                font-size: 10px;
                padding: 1px 4px;
            }
        }

        @media (max-width: 360px) {
            .episodes-container {
                grid-template-columns: repeat(3, 1fr);
            }

            .episode-item {
                font-size: 11px;
                padding: 8px 2px;
            }

            .drama-title-btn {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="playPage">
        <div class="play-header">
            <div class="header-title" id="headerTitle">搜索中...</div>
            <div class="header-search-box" id="headerSearchBox">
                <div class="header-search-input-wrapper">
                    <input type="text" class="header-search-input" id="headerSearchInput" placeholder="输入影片名称搜索">
                    <button class="search-clear-btn" id="searchClearBtn">×</button>
                </div>
                <button class="header-search-btn" id="headerSearchBtn">搜索</button>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="searchToggleBtn" title="搜索">🔍</button>
                <button class="header-btn" id="episodesBtn" title="选集">☰</button>
                <button class="header-btn" id="historyBtn" title="历史">🕐</button>
                <button class="header-btn" id="detailBtn" title="详情">?</button>
            </div>
        </div>

        <div class="play-main">
            <div class="player-section" id="playerSection">
                <div class="player-container">
                    <div class="parse-loading" id="parseLoading">请稍后...</div>
                    <iframe id="playIframe" class="play-iframe" allowfullscreen></iframe>
                </div>
            </div>

            <div class="episodes-sidebar" id="episodesSidebar">
                <div class="sidebar-header">
                    <span>选集列表</span>
                    <div class="sort-controls">
                        <button class="sort-btn" id="sortAscBtn" data-sort="asc">正序</button>
                        <button class="sort-btn" id="sortDescBtn" data-sort="desc">倒序</button>
                    </div>
                    <button class="close-sidebar-btn" id="closeEpisodesBtn">✕</button>
                </div>
                <div class="episodes-content" id="episodesContent"></div>
            </div>

            <div class="history-sidebar" id="historySidebar">
                <div class="sidebar-header">
                    <span>历史记录</span>
                    <button class="close-sidebar-btn" id="closeHistoryBtn">✕</button>
                </div>
                <div class="history-content" id="historyContent"></div>
            </div>

            <div class="detail-sidebar" id="detailSidebar">
                <div class="sidebar-header">
                    <span>影片详情</span>
                    <button class="close-sidebar-btn" id="closeDetailBtn">✕</button>
                </div>
                <div class="detail-content" id="detailContent">
                    <div class="detail-item">
                        <div class="detail-label">影片名称</div>
                        <div class="detail-value actors" id="detailName">未知</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">影片类别</div>
                        <div class="detail-value" id="detailCategory">未知</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">影片状态</div>
                        <div class="detail-value" id="detailStatus">未知</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">主演</div>
                        <div class="detail-value actors" id="detailActors">未知</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">影片简介</div>
                        <div class="detail-value desc" id="detailDescription">暂无简介</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="play-footer">
            <div class="footer-text">请勿相信视频中的广告</div>
        </div>
    </div>

    <script>
        const CORS_PREFIX = "https://seep.eu.org/";
        const PLAYER_URL = "https://www.265500.vip/bfq/wqplayer.html?url=";
        const API_CONFIG = [{ url: CORS_PREFIX + "https://caiji.xgzyapi.com/api.php/provide/vod/from/xiguam3u8", name: "量子", tag: "m3u8-6" }];

        const CATEGORY_PRIORITY = {
            HIGH: ['国产剧', '中国剧', '内地剧', '大陆剧', '国产电视剧', '内地电视剧', '大陆电视剧', '电视剧'],
            NORMAL: ['电影', '综艺', '动漫', '纪录片', '美剧', '韩剧', '日剧', '泰剧', '港剧', '台剧', '英剧'],
            LOW: ['短剧', '微短剧', '短剧大全', '解说', '电影解说', '影视解说', '影评', '吐槽', '预告片', '花絮']
        };

        let currentVideoName = "";
        let currentDramaData = null;
        let allDramaDataMap = new Map();
        let activeDramaId = "";
        let isEpisodesVisible = false, isDetailVisible = false, isHistoryVisible = false, isSearchVisible = false;
        let currentPlayingUrl = "";

        let dramaSortOrderMap = new Map();

        const playPage = document.getElementById('playPage');
        const headerTitle = document.getElementById('headerTitle');
        const headerSearchBox = document.getElementById('headerSearchBox');
        const headerSearchInput = document.getElementById('headerSearchInput');
        const headerSearchBtn = document.getElementById('headerSearchBtn');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const searchToggleBtn = document.getElementById('searchToggleBtn');
        const episodesBtn = document.getElementById('episodesBtn');
        const historyBtn = document.getElementById('historyBtn');
        const detailBtn = document.getElementById('detailBtn');
        const closeEpisodesBtn = document.getElementById('closeEpisodesBtn');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const playerSection = document.getElementById('playerSection');
        const episodesSidebar = document.getElementById('episodesSidebar');
        const historySidebar = document.getElementById('historySidebar');
        const detailSidebar = document.getElementById('detailSidebar');
        const episodesContent = document.getElementById('episodesContent');
        const historyContent = document.getElementById('historyContent');
        const playIframe = document.getElementById('playIframe');
        const parseLoading = document.getElementById('parseLoading');
        const sortAscBtn = document.getElementById('sortAscBtn');
        const sortDescBtn = document.getElementById('sortDescBtn');

        const detailName = document.getElementById('detailName');
        const detailCategory = document.getElementById('detailCategory');
        const detailStatus = document.getElementById('detailStatus');
        const detailActors = document.getElementById('detailActors');
        const detailDescription = document.getElementById('detailDescription');

        const HISTORY_KEY = 'video_search_history';
        const MAX_HISTORY = 50;

        window.onload = () => {
            playPage.style.display = 'block';
            searchToggleBtn.addEventListener('click', toggleSearch);
            headerSearchBtn.addEventListener('click', performSearch);
            headerSearchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
            headerSearchInput.addEventListener('input', toggleClearBtn);
            searchClearBtn.addEventListener('click', clearSearchInput);
            episodesBtn.addEventListener('click', showEpisodes);
            closeEpisodesBtn.addEventListener('click', hideEpisodes);
            historyBtn.addEventListener('click', showHistory);
            closeHistoryBtn.addEventListener('click', hideHistory);
            detailBtn.addEventListener('click', showDetail);
            closeDetailBtn.addEventListener('click', hideDetail);
            sortAscBtn.addEventListener('click', () => changeSortOrder('asc'));
            sortDescBtn.addEventListener('click', () => changeSortOrder('desc'));
            handleUrlParamSearch();
        };

        function optimizeSearchKeyword(keyword) {
            if (!keyword || typeof keyword !== 'string') return '';
            let optimized = keyword.trim();
            optimized = optimized.replace(/[\uFF08\uFF09\u3010\u3011\u300A\u300B]/g, (c) => ({ '\uFF08': '(', '\uFF09': ')', '\u3010': '[', '\u3011': ']', '\u300A': '<', '\u300B': '>' })[c] || c);
            let prev;
            do { prev = optimized; optimized = optimized.replace(/\([^()]*\)/g, '').replace(/\[[^\[\]]*\]/g, '').replace(/\{[^{}]*\}/g, '').replace(/<[^<>]*>/g, ''); } while (optimized !== prev);
            optimized = optimized.replace(/[:\uFF1A].*$/g, '').replace(/\s*(山寨版|抢先版|枪版|TC版|TS版|HD版|高清版|蓝光版|DVD版|VCD版|未删减版|完整版|导演剪辑版|加长版)$/i, '').replace(/\s*[IVXivx]+$/, '').replace(/\s*(第[一二三四五六七八九十百千万\d]+[部季集])$/, '').replace(/\s*[\d]+[部季集]$/, '');
            const zhiIndex = optimized.indexOf('之', 1);
            if (zhiIndex > 0 && !optimized.substring(0, zhiIndex).endsWith('人')) optimized = optimized.substring(0, zhiIndex);
            optimized = optimized.replace(/\s*版$/, '').replace(/\s+/g, ' ').trim();
            return optimized || keyword.trim();
        }

        function toggleClearBtn() { headerSearchInput.value.length ? searchClearBtn.classList.add('show') : searchClearBtn.classList.remove('show'); }
        function clearSearchInput() { headerSearchInput.value = ''; searchClearBtn.classList.remove('show'); headerSearchInput.focus(); }
        function toggleSearch() { isSearchVisible = !isSearchVisible; if(isSearchVisible) { headerTitle.style.display = 'none'; headerSearchBox.classList.add('show'); headerSearchInput.focus(); searchToggleBtn.classList.add('active'); hideEpisodes(); hideHistory(); hideDetail(); toggleClearBtn(); } else hideSearch(); }
        function hideSearch() { isSearchVisible = false; headerSearchBox.classList.remove('show'); headerTitle.style.display = 'block'; searchToggleBtn.classList.remove('active'); }
        function showSearchError(msg) { headerTitle.textContent = msg; headerTitle.classList.add('error'); setTimeout(() => headerTitle.classList.remove('error'), 3000); }

        function getCategoryPriority(typeName) { if(!typeName) return 1; const t = typeName.toLowerCase(); if(CATEGORY_PRIORITY.HIGH.some(k=>t.includes(k.toLowerCase()))) return 3; if(CATEGORY_PRIORITY.LOW.some(k=>t.includes(k.toLowerCase()))) return 0; return 1; }
        function isDomesticDrama(t) { return t ? CATEGORY_PRIORITY.HIGH.some(k=>t.toLowerCase().includes(k.toLowerCase())) : false; }
        function isShortDrama(t) { return t ? ['短剧','微短剧'].some(k=>t.toLowerCase().includes(k)) : false; }

        function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; } }
        function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }
        function addToHistory(dramaName, episodeName, dramaId) { if(!dramaName) return; let h = getHistory().filter(i=>i.dramaName!==dramaName); h.unshift({ dramaName, episodeName: episodeName||'未知', dramaId: dramaId||'', timestamp: Date.now() }); if(h.length>MAX_HISTORY) h = h.slice(0,MAX_HISTORY); saveHistory(h); }
        function formatTime(ts) { const diff=Date.now()-ts, minute=60e3, hour=60*minute, day=24*hour; if(diff<minute) return '刚刚'; if(diff<hour) return Math.floor(diff/minute)+'分钟前'; if(diff<day) return Math.floor(diff/hour)+'小时前'; if(diff<7*day) return Math.floor(diff/day)+'天前'; return new Date(ts).getMonth()+1+'/'+new Date(ts).getDate(); }
        function escapeHtml(s) { const div=document.createElement('div'); div.textContent=s; return div.innerHTML; }

        function renderHistory() {
            const history = getHistory();
            if(!history.length) { historyContent.innerHTML='<div class="history-empty"><div class="history-empty-icon">🕐</div><div>暂无历史记录</div></div>'; return; }
            historyContent.innerHTML = history.map(item => `<div class="history-item" data-name="${escapeHtml(item.dramaName)}"><div class="history-item-title">${escapeHtml(item.dramaName)}</div><div class="history-item-meta"><span>${escapeHtml(item.episodeName)}</span><span class="history-item-time">${formatTime(item.timestamp)}</span></div></div>`).join('');
            historyContent.querySelectorAll('.history-item').forEach(item => item.addEventListener('click', () => { headerSearchInput.value = item.dataset.name; toggleClearBtn(); hideHistory(); performSearch(); }));
        }
        function showHistory() { if(!isHistoryVisible) { hideEpisodes(); hideDetail(); hideSearch(); isHistoryVisible=true; playerSection.classList.add('shrink'); historySidebar.classList.add('show'); historyBtn.classList.add('active'); renderHistory(); } else hideHistory(); }
        function hideHistory() { isHistoryVisible=false; playerSection.classList.remove('shrink'); historySidebar.classList.remove('show'); historyBtn.classList.remove('active'); }

        // 判断选集是否为常规数字集（第XX集格式）
        function checkRegularEpisodes(episodes) { if(!episodes?.length) return true; const regularPattern = /^第\d+集$/; const regularCount = episodes.filter(ep => regularPattern.test(ep.name.trim())).length; return regularCount / episodes.length >= 0.8; }

        function getSortedEpisodes(dramaId, originalEpisodes) {
            if(!originalEpisodes) return [];
            const order = dramaSortOrderMap.get(dramaId) || 'asc';
            const copy = [...originalEpisodes];
            if(order === 'desc') return copy.reverse();
            return copy;
        }

        function refreshDramaEpisodes(dramaId) {
            const dramaData = allDramaDataMap.get(dramaId);
            if(!dramaData) return;
            const groupDiv = document.querySelector(`.drama-group[data-drama-id="${dramaId}"]`);
            if(!groupDiv) return;
            const titleBtn = groupDiv.querySelector('.drama-title-btn');
            const oldContainer = groupDiv.querySelector('.episodes-container');
            const isExpanded = oldContainer && (oldContainer.style.display === 'grid' || oldContainer.style.display === 'flex');
            const sortedEpisodes = getSortedEpisodes(dramaId, dramaData.episodes);
            const isRegular = checkRegularEpisodes(sortedEpisodes);
            const newContainer = document.createElement('div');
            newContainer.className = isRegular ? 'episodes-container' : 'episodes-container single-column';
            newContainer.style.display = isExpanded ? (isRegular ? 'grid' : 'flex') : 'none';
            sortedEpisodes.forEach((episode, idx) => {
                const btn = document.createElement('button');
                btn.className = 'episode-item';
                btn.textContent = episode.name;
                if(currentPlayingUrl && episode.url === currentPlayingUrl) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    if(allDramaDataMap.get(dramaId)) currentDramaData = allDramaDataMap.get(dramaId);
                    activeDramaId = dramaId;
                    highlightDramaGroup(dramaId);
                    updateDetailContent();
                    newContainer.querySelectorAll('.episode-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playEpisode(episode.url, dramaData.name, episode.name);
                    hideEpisodes();
                });
                newContainer.appendChild(btn);
            });
            if(oldContainer) oldContainer.replaceWith(newContainer);
            // 重新绑定展开/折叠事件
            const newTitleBtn = groupDiv.querySelector('.drama-title-btn');
            const expandIcon = newTitleBtn.querySelector('.expand-icon');
            const newEpContainer = groupDiv.querySelector('.episodes-container');
            const newBtn = newTitleBtn.cloneNode(true);
            newTitleBtn.parentNode.replaceChild(newBtn, newTitleBtn);
            const finalTitleBtn = groupDiv.querySelector('.drama-title-btn');
            const finalExpandIcon = finalTitleBtn.querySelector('.expand-icon');
            finalTitleBtn.addEventListener('click', () => {
                const epContainer = groupDiv.querySelector('.episodes-container');
                const isCurrExpanded = epContainer.style.display === 'grid' || epContainer.style.display === 'flex';
                if(isCurrExpanded) {
                    epContainer.style.display = 'none';
                    finalExpandIcon.textContent = '▶';
                    finalTitleBtn.classList.remove('active');
                } else {
                    epContainer.style.display = checkRegularEpisodes(getSortedEpisodes(dramaId, allDramaDataMap.get(dramaId).episodes)) ? 'grid' : 'flex';
                    finalExpandIcon.textContent = '▼';
                    finalTitleBtn.classList.add('active');
                    if(allDramaDataMap.get(dramaId)) currentDramaData = allDramaDataMap.get(dramaId);
                    activeDramaId = dramaId;
                    updateDetailContent();
                }
            });
            if(isExpanded) finalExpandIcon.textContent = '▼';
            else finalExpandIcon.textContent = '▶';
        }

        function changeSortOrder(order) {
            if(!currentDramaData) { alert("请先选择影片"); return; }
            const dramaId = currentDramaData.id;
            dramaSortOrderMap.set(dramaId, order);
            sortAscBtn.classList.toggle('active', order === 'asc');
            sortDescBtn.classList.toggle('active', order === 'desc');
            refreshDramaEpisodes(dramaId);
        }

        function createDramaGroup(drama, episodes, isActive) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'drama-group';
            groupDiv.dataset.dramaId = drama.id;
            const order = dramaSortOrderMap.get(drama.id) || 'asc';
            const sortedEpisodes = (order === 'desc') ? [...episodes].reverse() : [...episodes];
            const isRegular = checkRegularEpisodes(sortedEpisodes);
            const titleBtn = document.createElement('button');
            titleBtn.className = 'drama-title-btn';
            if(isActive) titleBtn.classList.add('active');
            let tagHtml = '';
            if(drama.typeName) {
                let tagClass = 'type-tag';
                let tagText = drama.typeName;
                if(isDomesticDrama(drama.typeName)) tagClass += ' domestic';
                else if(isShortDrama(drama.typeName)) { tagClass += ' short'; tagText = '短剧'; }
                tagHtml = `<span class="${tagClass}">${tagText}</span>`;
            }
            const arrowIcon = isActive ? '▼' : '▶';
            titleBtn.innerHTML = `<span class="drama-name">${drama.name}</span><span class="drama-right">${tagHtml}<span class="expand-icon">${arrowIcon}</span></span>`;
            const episodesContainer = document.createElement('div');
            episodesContainer.className = isRegular ? 'episodes-container' : 'episodes-container single-column';
            episodesContainer.style.display = isActive ? (isRegular ? 'grid' : 'flex') : 'none';
            sortedEpisodes.forEach((episode, idx) => {
                const episodeBtn = document.createElement('button');
                episodeBtn.className = 'episode-item' + (isActive && idx === 0 ? ' active' : '');
                episodeBtn.textContent = episode.name;
                episodeBtn.addEventListener('click', () => {
                    const clickedData = allDramaDataMap.get(drama.id);
                    if(clickedData) currentDramaData = clickedData;
                    activeDramaId = drama.id;
                    highlightDramaGroup(drama.id);
                    updateDetailContent();
                    episodesContent.querySelectorAll('.episode-item').forEach(btn => btn.classList.remove('active'));
                    episodeBtn.classList.add('active');
                    playEpisode(episode.url, drama.name, episode.name);
                    hideEpisodes();
                });
                episodesContainer.appendChild(episodeBtn);
            });
            titleBtn.addEventListener('click', () => {
                const isExpanded = episodesContainer.style.display === 'grid' || episodesContainer.style.display === 'flex';
                const expandIcon = titleBtn.querySelector('.expand-icon');
                if(isExpanded) {
                    episodesContainer.style.display = 'none';
                    expandIcon.textContent = '▶';
                    titleBtn.classList.remove('active');
                } else {
                    closeAllDramaGroups();
                    episodesContainer.style.display = checkRegularEpisodes(getSortedEpisodes(drama.id, allDramaDataMap.get(drama.id).episodes)) ? 'grid' : 'flex';
                    expandIcon.textContent = '▼';
                    const clickedData = allDramaDataMap.get(drama.id);
                    if(clickedData) currentDramaData = clickedData;
                    activeDramaId = drama.id;
                    titleBtn.classList.add('active');
                    updateDetailContent();
                }
            });
            groupDiv.appendChild(titleBtn);
            groupDiv.appendChild(episodesContainer);
            episodesContent.appendChild(groupDiv);
        }

        function closeAllDramaGroups() { document.querySelectorAll('.drama-group').forEach(g=>{ const btn=g.querySelector('.drama-title-btn'), cont=g.querySelector('.episodes-container'), icon=btn?.querySelector('.expand-icon'); if(cont) cont.style.display='none'; if(icon) icon.textContent='▶'; if(btn) btn.classList.remove('active'); }); }
        function highlightDramaGroup(dramaId) { document.querySelectorAll('.drama-title-btn').forEach(btn=>btn.classList.remove('active')); const group=document.querySelector(`.drama-group[data-drama-id="${dramaId}"]`); if(group) group.querySelector('.drama-title-btn')?.classList.add('active'); }

        function playEpisode(url, dramaName, episodeName) {
            parseLoading.style.display = 'block';
            const finalUrl = PLAYER_URL + encodeURIComponent(url);
            playIframe.src = finalUrl;
            playIframe.onload = () => parseLoading.style.display = 'none';
            currentVideoName = dramaName;
            currentPlayingUrl = url;
            addToHistory(dramaName, episodeName, activeDramaId);
            headerTitle.textContent = dramaName + ' - ' + episodeName;
            headerTitle.classList.remove('error', 'scrolling');
            headerTitle.classList.add('scrolling');
            setTimeout(() => headerTitle.classList.remove('scrolling'), 10000);
            document.title = dramaName + ' ' + episodeName;
        }

        function showEpisodes() { if(!currentDramaData) { alert("请先选择影片"); return; } if(!isEpisodesVisible) { hideDetail(); hideHistory(); hideSearch(); isEpisodesVisible=true; playerSection.classList.add('shrink'); episodesSidebar.classList.add('show'); episodesBtn.classList.add('active'); } else hideEpisodes(); }
        function hideEpisodes() { isEpisodesVisible=false; playerSection.classList.remove('shrink'); episodesSidebar.classList.remove('show'); episodesBtn.classList.remove('active'); }
        function showDetail() { if(!currentDramaData) { alert("请先选择影片"); return; } if(!isDetailVisible) { hideEpisodes(); hideHistory(); hideSearch(); isDetailVisible=true; playerSection.classList.add('shrink'); detailSidebar.classList.add('show'); detailBtn.classList.add('active'); updateDetailContent(); } else hideDetail(); }
        function hideDetail() { isDetailVisible=false; playerSection.classList.remove('shrink'); detailSidebar.classList.remove('show'); detailBtn.classList.remove('active'); }
        function updateDetailContent() { if(!currentDramaData) return; detailName.textContent = currentDramaData.name||'未知'; detailCategory.textContent = currentDramaData.typeName||'未知'; detailStatus.textContent = currentDramaData.remarks||'未知'; detailActors.textContent = currentDramaData.actor||'未知'; detailDescription.textContent = (currentDramaData.content||'暂无简介').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').trim(); }

        // 解析选集并保留原始名称（关键修正）
        function parseEpisodesWithOriginalNames(vodDetail) {
            const raw = vodDetail.vod_play || vodDetail.vod_play_url || vodDetail.vod_playurl || '';
            const parts = raw.replace(/\#/g, '$').split('$').filter(Boolean);
            let eps = [];
            let idx = 0;
            for(let i = 0; i < parts.length - 1; i += 2) {
                let rawName = parts[i].trim();
                let url = parts[i+1].trim();
                if(!url || (!url.startsWith('http') && !url.includes('m3u8'))) continue;
                idx++;
                let displayName = rawName;
                // 如果原始名称为空，则生成“第X集”
                if(!displayName) displayName = '第' + idx + '集';
                eps.push({
                    index: idx-1,
                    name: displayName,
                    url: url.startsWith('http') ? url : CORS_PREFIX + url
                });
            }
            return eps;
        }

        async function performSearch() {
            let keyword = headerSearchInput.value.trim();
            if(!keyword) { alert("请输入搜索关键词"); return; }
            keyword = optimizeSearchKeyword(keyword);
            hideSearch();
            parseLoading.style.display = 'block';
            try {
                const results = await Promise.all(API_CONFIG.map(api => fetch(api.url + '?wd=' + encodeURIComponent(keyword)).then(r=>r.json()).then(data=>({success:data.code===1, data, source:api})).catch(()=>({success:false,data:{},source:api}))));
                let dramaList = [];
                results.forEach(r => { if(r.success && r.data?.list?.length) { r.data.list.forEach(item => dramaList.push({ id:item.vod_id, name:item.vod_name, remarks:item.vod_remarks||'全集', source:r.source, actor:item.vod_actor||'未知', content:item.vod_content||'暂无简介', updateTime:item.vod_time||item.vod_updatetime||new Date().toISOString(), typeName:item.type_name||item.vod_class||'' })); } });
                if(!dramaList.length) { parseLoading.style.display='none'; showSearchError("未搜索到相关影片"); return; }
                dramaList.sort((a,b)=>getCategoryPriority(b.typeName)-getCategoryPriority(a.typeName)||new Date(b.updateTime)-new Date(a.updateTime));
                episodesContent.innerHTML="";
                activeDramaId="";
                allDramaDataMap.clear();
                playerSection.classList.remove('shrink'); episodesSidebar.classList.remove('show'); historySidebar.classList.remove('show'); detailSidebar.classList.remove('show'); episodesBtn.classList.remove('active'); historyBtn.classList.remove('active'); detailBtn.classList.remove('active');
                isEpisodesVisible=isDetailVisible=isHistoryVisible=false;
                for(let drama of dramaList) allDramaDataMap.set(drama.id, {...drama, episodes:[]});
                for(let i=0;i<dramaList.length;i++) {
                    const drama=dramaList[i];
                    try {
                        const api = API_CONFIG.find(a=>a.name===drama.source.name);
                        const resp=await fetch(api.url+'?ac=videolist&ids='+drama.id);
                        const json=await resp.json();
                        if(json.code===1 && json.list?.length) {
                            const vod=json.list[0];
                            const eps = parseEpisodesWithOriginalNames(vod);
                            const cached=allDramaDataMap.get(drama.id);
                            cached.episodes=eps;
                            if(vod){ cached.actor=vod.vod_actor||cached.actor; cached.content=vod.vod_content||cached.content; cached.remarks=vod.vod_remarks||cached.remarks; cached.typeName=vod.type_name||cached.typeName; }
                            allDramaDataMap.set(drama.id, cached);
                            if(!dramaSortOrderMap.has(drama.id)) dramaSortOrderMap.set(drama.id,'asc');
                            createDramaGroup(cached, cached.episodes, i===0);
                            if(i===0) { currentDramaData=cached; activeDramaId=drama.id; if(cached.episodes.length) playEpisode(cached.episodes[0].url, cached.name, cached.episodes[0].name); highlightDramaGroup(drama.id); updateDetailContent(); }
                        }
                    } catch(e){ console.error(e); }
                }
                parseLoading.style.display='none';
                showEpisodes();
                sortAscBtn.classList.add('active');
                sortDescBtn.classList.remove('active');
            } catch(e) { parseLoading.style.display='none'; showSearchError("搜索失败"); console.error(e); }
        }

        function handleUrlParamSearch() { const kw = new URLSearchParams(location.search).get('url'); if(kw?.trim()) { headerSearchInput.value=kw.trim(); toggleClearBtn(); performSearch(); } else toggleSearch(); }
    </script>
</body>
</html>
