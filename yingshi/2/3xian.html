<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1907视频解析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- 核心修改：添加允许全屏的属性 -->
    <iframe 
        id="player" 
        src="about:blank"
        allowfullscreen="true"          <!-- 基础全屏权限 -->
        webkitallowfullscreen="true"    <!-- 兼容webkit内核（如Safari） -->
        mozallowfullscreen="true"       <!-- 兼容Firefox -->
        msallowfullscreen="true"        <!-- 兼容IE/Edge -->
        allow="fullscreen *; autoplay *"<!-- 现代浏览器权限策略 -->
    ></iframe>
    
    <script>
        // 获取URL参数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 检查并加载视频
        function loadVideo() {
            const urlParam = getQueryParam('url');
            
            if (urlParam) {
                // 如果有URL参数，则加载对应视频
                const player = document.getElementById('player');
                player.src = `https://z1.m1907.top/?jx=${urlParam}`;
            } else {
                // 如果没有URL参数，则显示解析器首页
                const player = document.getElementById('player');
                player.src = 'https://z1.m1907.top/?jx=';
            }
        }
        
        // 页面加载时执行
        window.onload = loadVideo;
        
        // 监听URL变化
        window.onpopstate = function() {
            loadVideo();
        };
    </script>
</body>
</html>
