<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>请勿相信视频中的广告</title>
    <style>
        :root {
            --color-bg-primary: #0a0f1d;
            --color-bg-secondary: #111827;
            --color-btn-normal: #1e293b;
            --color-btn-hover: #273449;
            --color-btn-active: #1d4ed8;
            --color-border-normal: #2d3748;
            --color-text-primary: #e2e8f0;
            --shadow-normal: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-active: 0 0 15px rgba(29, 78, 216, 0.4);
            --radius-btn: 20px;
            --radius-modal: 16px;
            --radius-input: 12px;
            --gradient-btn: linear-gradient(135deg, #1e293b 0%, #273449 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
            border: none;
            outline: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--color-bg-primary);
            margin: 0;
            padding: 0;
            position: relative;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .nav-box, .footer-box {
            width: 100%;
            background: var(--color-bg-secondary);
            padding: 9px 10px;
            box-shadow: var(--shadow-normal);
            height: 46px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: relative;
            z-index: 1;
        }

        .footer-box {
            box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
            border-top: 1px solid #1e293b;
        }

        .nav-scroll {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .nav-scroll::-webkit-scrollbar {
            display: none;
        }

        .nav-list {
            display: flex;
            gap: 10px;
            width: max-content;
            margin: 0 auto;
        }

        .nav-btn {
            padding: 10px 30px;
            background: var(--gradient-btn);
            border: 1px solid var(--color-border-normal);
            border-radius: var(--radius-btn);
            font-size: 14px;
            color: var(--color-text-primary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            background: #273449;
            border-color: #334155;
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: var(--color-btn-active);
            color: #ffffff;
            font-weight: bold;
            box-shadow: var(--shadow-active);
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .search-container {
            flex: 1;
            width: 100%;
            background: var(--color-bg-secondary);
            overflow: hidden;
            position: relative;
        }

        #search-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 无关键词提示样式 */
        .empty-tip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-primary);
            font-size: 18px;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .search-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .search-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .search-modal-box {
            width: 90%;
            max-width: 500px;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-modal);
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
            border: 1px solid #1e293b;
        }

        .search-close {
            position: absolute;
            right: 18px;
            top: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-btn-normal);
            border: 1px solid var(--color-border-normal);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .search-close:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: rotate(90deg);
        }

        .search-modal-title {
            text-align: center;
            color: var(--color-text-primary);
            font-size: 19px;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .search-input-wrap {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #localInput {
            flex: 1;
            height: 48px;
            padding: 0 20px;
            border-radius: var(--radius-input);
            border: 1px solid var(--color-border-normal);
            background: var(--color-btn-normal);
            color: var(--color-text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #localInput:focus {
            border-color: var(--color-btn-active);
            background: #273449;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
        }

        #localSearchBtn {
            height: 48px;
            padding: 0 25px;
            border-radius: var(--radius-input);
            border: 1px solid var(--color-btn-active);
            background: var(--color-btn-active);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        #localSearchBtn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .nav-box, .footer-box {
                padding: 8px 10px;
                height: 42px;
            }

            .nav-btn {
                padding: 9px 24px;
                font-size: 13px;
            }

            .search-modal-box {
                width: 95%;
                padding: 25px 20px;
            }

            #localInput, #localSearchBtn {
                height: 46px;
                font-size: 14px;
            }

            .empty-tip {
                font-size: 16px;
            }
        }

        @supports (-webkit-touch-callout: none) {
            .app-container,
            .search-modal {
                height: -webkit-fill-available;
            }
        }

        /* 新增：全屏样式兼容 */
        :-webkit-full-screen #search-iframe {
            width: 100%;
            height: 100%;
        }
        :-moz-full-screen #search-iframe {
            width: 100%;
            height: 100%;
        }
        :fullscreen #search-iframe {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="nav-box">
            <div class="nav-scroll">
                <div class="nav-list">
                    <button class="nav-btn active" data-prefix="https://z1.m1907.top/?jx=">一线</button>
                    <button class="nav-btn" data-prefix="https://video.isyour.love/player/getplayer?url=">二线</button>
                    <button class="nav-btn" id="openSearch">🔍</button>
                    <button class="nav-btn" id="goHome">🎁 </button>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="empty-tip" id="emptyTip">请点击顶部按钮搜索</div>
            <!-- 修改：增强iframe的全屏属性配置 -->
            <iframe 
                id="search-iframe" 
                src="about:blank"
                allowfullscreen="true"
                webkitallowfullscreen="true"
                mozallowfullscreen="true"
                oallowfullscreen="true"
                msallowfullscreen="true"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture; gyroscope; accelerometer"
                sandbox="allow-scripts allow-same-origin allow-popups allow-fullscreen allow-forms"
                frameborder="0"
            ></iframe>
        </div>

        <div class="footer-box"></div>
    </div>

    <div class="search-modal" id="searchModal">
        <div class="search-modal-box">
            <button class="search-close" id="closeSearch">✕</button>
            <div class="search-modal-title">影视搜索</div>
            <div class="search-input-wrap">
                <input type="text" id="localInput" placeholder="请输入影片关键词...">
                <button id="localSearchBtn">确定</button>
            </div>
        </div>
    </div>

    <script>
        const CONSTANTS = {
            SOGOU_URL: 'https://265500.netlify.app/bfq/lingquan.html',
            DEFAULT_PREFIX: 'https://z1.m1907.top/?jx=',
            NON_ACTIVE_BUTTONS: ['openSearch', 'goHome']
        };

        const utils = {
            getUrlKeyword() {
                const params = new URLSearchParams(window.location.search);
                let keyword = params.get('url') || '';
                if (keyword.includes(' ')) {
                    keyword = keyword.split(' ')[0];
                }
                return keyword.trim();
            },

            resizeContainer() {
                const appContainer = document.querySelector('.app-container');
                if (appContainer) {
                    appContainer.style.height = window.innerHeight + 'px';
                }
            },

            toggleActiveNavBtn(activeBtn) {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (!CONSTANTS.NON_ACTIVE_BUTTONS.includes(btn.id)) {
                        btn.classList.toggle('active', btn === activeBtn);
                    }
                });
            },

            toggleEmptyTip(hasKeyword) {
                const emptyTip = document.getElementById('emptyTip');
                const iframe = document.getElementById('search-iframe');
                if (hasKeyword) {
                    emptyTip.style.display = 'none';
                    iframe.style.display = 'block';
                } else {
                    emptyTip.style.display = 'flex';
                    iframe.style.display = 'none';
                }
            },

            // 新增：处理iframe全屏兼容性
            enableIframeFullscreen() {
                const iframe = document.getElementById('search-iframe');
                // 监听iframe加载完成事件
                iframe.addEventListener('load', function() {
                    try {
                        // 向iframe发送全屏权限允许的消息（如果跨域则需要目标页面配合）
                        this.contentWindow.postMessage({ type: 'allowFullscreen' }, '*');
                    } catch (e) {
                        console.log('跨域iframe全屏消息发送失败:', e);
                    }
                });

                // 监听全屏变化事件，适配移动端
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
                document.addEventListener('mozfullscreenchange', handleFullscreenChange);
                document.addEventListener('MSFullscreenChange', handleFullscreenChange);
            }
        };

        // 新增：全屏状态变化处理函数
        function handleFullscreenChange() {
            const isFullscreen = !!document.fullscreenElement || 
                                !!document.webkitFullscreenElement || 
                                !!document.mozFullScreenElement || 
                                !!document.msFullscreenElement;
            
            const iframe = document.getElementById('search-iframe');
            if (isFullscreen) {
                // 全屏时确保iframe占满屏幕
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                document.body.style.overflow = 'hidden';
            } else {
                // 退出全屏后恢复样式
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const elements = {
                iframe: document.getElementById('search-iframe'),
                navButtons: document.querySelectorAll('.nav-btn'),
                searchModal: document.getElementById('searchModal'),
                closeSearchBtn: document.getElementById('closeSearch'),
                searchInput: document.getElementById('localInput'),
                searchBtn: document.getElementById('localSearchBtn'),
                emptyTip: document.getElementById('emptyTip')
            };

            const keyword = utils.getUrlKeyword();

            utils.resizeContainer();
            window.addEventListener('resize', utils.resizeContainer);
            window.addEventListener('orientationchange', utils.resizeContainer);

            // 新增：启用iframe全屏功能
            utils.enableIframeFullscreen();

            utils.toggleEmptyTip(!!keyword);

            if (keyword) {
                elements.iframe.src = `${CONSTANTS.DEFAULT_PREFIX}${encodeURIComponent(keyword)}`;
            }

            elements.navButtons.forEach(btn => {
                if (keyword && btn.classList.contains('active')) {
                    utils.toggleActiveNavBtn(btn);
                }

                btn.addEventListener('click', function () {
                    if (this.id === 'openSearch') {
                        elements.searchModal.classList.add('show');
                        elements.searchInput.focus();
                        return;
                    }

                    if (this.id === 'goHome') {
                        window.open(CONSTANTS.SOGOU_URL, '_blank');
                        return;
                    }

                    if (!keyword) return;
                    
                    utils.toggleActiveNavBtn(this);
                    const prefix = this.getAttribute('data-prefix');
                    elements.iframe.src = `${prefix}${encodeURIComponent(keyword)}`;
                });
            });

            elements.closeSearchBtn.addEventListener('click', () => {
                elements.searchModal.classList.remove('show');
            });

            elements.searchModal.addEventListener('click', (e) => {
                if (e.target === elements.searchModal) {
                    elements.searchModal.classList.remove('show');
                }
            });

            const doSearch = () => {
                let val = elements.searchInput.value.trim();
                if (val.includes(' ')) {
                    val = val.split(' ')[0];
                }
                if (val) {
                    location.href = `?url=${encodeURIComponent(val)}`;
                } else {
                    alert('请输入内容');
                }
            };

            elements.searchBtn.addEventListener('click', doSearch);
            elements.searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doSearch();
            });
        });
    </script>
</body>
</html>
