

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影视聚合 - 纯前端版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }





body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
  background: transparent; 
  color: #333; 
}
a { text-decoration: none; color: inherit; }

/* 顶部导航 */
.header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
.nav-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }

/* 炫彩变色站名 - 主页，慢速变化 */
.logo {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #ff6b6b);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow 12s linear infinite;
}
@keyframes rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 400% 50%; }
}

/* 搜索框 */
.search-box { display: flex; flex: 1; max-width: 500px; min-width: 250px; }
.search-input-wrap { position: relative; flex: 1; display: flex; }
.search-input-wrap input { width: 100%; }
.clear-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  line-height: 16px;
  text-align: center;
  border-radius: 50%;
  background: #ccc;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  display: none;
  transition: background 0.2s;
  user-select: none;
}
.clear-btn:hover { background: #ff6b6b; }
.clear-btn.show { display: block; }
.search-box input { flex: 1; padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 25px 0 0 25px; outline: none; font-size: 14px; transition: border-color 0.3s; background: rgba(255,255,255,0.9); }
.search-box input:focus { border-color: #ff6b6b; }
.search-box button { padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 0 25px 25px 0; cursor: pointer; font-size: 14px; transition: background 0.3s; }
.search-box button:hover { background: #ff5252; }

/* 主类型切换 - 放在header内部 */
.type-tabs-inline { display: flex; gap: 5px; }
.type-tab-inline { 
  padding: 8px 16px; 
  cursor: pointer; 
  border-radius: 20px; 
  transition: all 0.3s; 
  font-weight: 500; 
  font-size: 14px;
  background: rgba(245, 245, 245, 0.9);
  border: 1px solid transparent;
}
.type-tab-inline:hover { background: #ffebee; color: #ff6b6b; }
.type-tab-inline.active { background: #ff6b6b; color: white; }

/* 筛选区域 - 白底左右对齐浏览器边缘 */
.filter-section { 
  background: rgba(255, 255, 255, 0.95); 
  backdrop-filter: blur(10px); 
  padding: 12px 0; 
  margin: 0; 
  width: 100%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
}
.filter-row { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 8px; 
  align-items: center; 
  padding: 0 20px;
  max-width: 1200px;
  margin: 0 auto;
  justify-content: flex-start;
}
.filter-tag { 
  padding: 6px 14px; 
  border-radius: 20px; 
  font-size: 13px; 
  cursor: pointer; 
  transition: all 0.3s; 
  background: rgba(245, 245, 245, 0.9); 
  border: 1px solid transparent; 
}
.filter-tag:hover { background: #ffebee; color: #ff6b6b; }
.filter-tag.active { background: #ff6b6b; color: white; }

/* 内容网格 */
.content { max-width: 1200px; margin: 20px auto 0; padding: 0 20px 40px; }
.movie-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; }
.movie-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
.movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
.movie-cover { position: relative; padding-top: 140%; overflow: hidden; background: #eee; }
.movie-cover img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.movie-card:hover .movie-cover img { transform: scale(1.05); }
.movie-info { padding: 12px; }
.movie-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.movie-meta { font-size: 12px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 加载状态 */
.loading { text-align: center; padding: 60px; grid-column: 1 / -1; }
.spinner { display: inline-block; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #ff6b6b; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* 分页 */
.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
.page-btn { padding: 8px 16px; border-radius: 6px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e0e0e0; cursor: pointer; transition: all 0.3s; font-size: 14px; }
.page-btn:hover:not(:disabled) { background: #ff6b6b; color: white; border-color: #ff6b6b; }
.page-btn.active { background: #ff6b6b; color: white; border-color: #ff6b6b; }
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 错误提示 */
.error-msg { text-align: center; padding: 40px; color: #fff; background: rgba(0,0,0,0.3); border-radius: 8px; grid-column: 1 / -1; }

/* ==================== 播放页面 ==================== */
.play-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  flex-direction: column;
  overflow: hidden;
}
.play-overlay.active { display: flex; }




/* 播放器头部 - 电脑端完整显示 */
.play-header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  flex-shrink: 0;
  z-index: 101;
}
.play-header .nav-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

/* 播放页炫彩站名 - 慢速变化 */
.play-header .logo {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #ff6b6b);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow 12s linear infinite;
}

/* 播放器内父分类Tab */
.play-header .type-tabs-inline { display: flex; gap: 5px; }
.play-header .type-tab-inline { 
  padding: 8px 16px; 
  cursor: pointer; 
  border-radius: 20px; 
  transition: all 0.3s; 
  font-weight: 500; 
  font-size: 14px;
  background: rgba(245, 245, 245, 0.9);
  border: 1px solid transparent;
}
.play-header .type-tab-inline:hover { background: #ffebee; color: #ff6b6b; }
.play-header .type-tab-inline.active { background: #ff6b6b; color: white; }

.play-header .search-box {
  display: flex;
  flex: 1;
  max-width: 500px;
  min-width: 250px;
}
.play-header .search-input-wrap { position: relative; flex: 1; display: flex; }
.play-header .search-input-wrap input { width: 100%; }
.play-header .search-box input {
  flex: 1;
  padding: 10px 15px;
  border: 2px solid #e0e0e0;
  border-radius: 25px 0 0 25px;
  outline: none;
  font-size: 14px;
  background: rgba(255,255,255,0.9);
}
.play-header .search-box input:focus { border-color: #ff6b6b; }
.play-header .search-box button {
  padding: 10px 20px;
  background: #ff6b6b;
  color: white;
  border: none;
  border-radius: 0 25px 25px 0;
  cursor: pointer;
  font-size: 14px;
}

/* 播放器iframe区域 - 完全填充容器，四周不留空隙 */
.play-frame-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  min-height: 0;
  overflow: hidden;
}
.play-frame {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

/* ==================== 手机端适配 ==================== */
@media (max-width: 768px) {
  /* 主页布局 */
  .nav-container {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    justify-content: center;
    width: 100%;
  }
  .search-box {
    max-width: 100%;
    width: 100%;
    min-width: auto;
  }
  .type-tabs-inline {
    justify-content: center;
    width: 100%;
    flex-wrap: wrap;
  }
  .type-tab-inline {
    padding: 8px 14px;
    font-size: 13px;
  }
  .filter-row {
    padding: 0 12px;
  }
  .content {
    padding: 0 12px 30px;
  }
  .movie-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .movie-title {
    font-size: 13px;
  }
  .movie-meta {
    font-size: 11px;
  }
  .pagination {
    gap: 6px;
  }
  .page-btn {
    padding: 6px 12px;
    font-size: 13px;
  }
  .filter-tag {
    padding: 5px 10px;
    font-size: 12px;
  }

  /* 播放页面 - 手机端只显示站名和容器 */
  .play-header .type-tabs-inline,
  .play-header .search-box {
    display: none !important;
  }
  .play-header .nav-container {
    flex-direction: row;
    justify-content: center;
    padding: 12px 15px;
  }
  .play-header .logo {
    font-size: 20px;
    justify-content: center;
  }
}

@media (max-width: 480px) {
  .movie-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .type-tab-inline {
    padding: 6px 12px;
    font-size: 12px;
  }
}
</style>
<base target="_blank">
</head>
<body>

<!-- 顶部 - 站名 + 父分类Tab + 搜索框 -->
<div class="header">
  <div class="nav-container">
    <div class="logo" onclick="goHome()">影视聚合</div>
    <div class="type-tabs-inline" id="typeTabsInline">
      <div class="type-tab-inline active" data-catid="2" onclick="switchType(2)">📺 电视剧</div>
      <div class="type-tab-inline" data-catid="1" onclick="switchType(1)">🎬 电影</div>
      <div class="type-tab-inline" data-catid="3" onclick="switchType(3)">🎪 综艺</div>
      <div class="type-tab-inline" data-catid="4" onclick="switchType(4)">🎨 动漫</div>
    </div>
    <div class="search-box">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="输入关键词搜索影片..." oninput="toggleClearBtn(this)" onkeypress="if(event.key==='Enter') doSearch()">
        <span class="clear-btn" id="homeClearBtn" onclick="clearSearch('searchInput')">×</span>
      </div>
      <button onclick="doSearch()">🔍 搜索</button>
    </div>
  </div>
</div>

<!-- 筛选条件 - 白底左右对齐浏览器边缘 -->
<div class="filter-section" id="filterSection">
  <div class="filter-row" id="subFilterRow"></div>
</div>

<!-- 内容区 -->
<div class="content">
  <div class="movie-grid" id="movieGrid">
    <div class="loading"><div class="spinner"></div><p style="margin-top:15px;color:#999">加载中...</p></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- ==================== 播放页面（全屏覆盖层） ==================== -->
<div class="play-overlay" id="playOverlay">
  <!-- 播放器头部 - 电脑端显示站名+父标题+搜索框，手机端只显示站名 -->
  <div class="play-header">
    <div class="nav-container">
      <div class="logo" onclick="closePlayer()">影视聚合</div>
      <!-- 播放器内父分类Tab - 手机端隐藏，使用switchPlayType跳转 -->
      <div class="type-tabs-inline" id="playTypeTabs">
        <div class="type-tab-inline active" data-catid="2" onclick="switchPlayType(2)">📺 电视剧</div>
        <div class="type-tab-inline" data-catid="1" onclick="switchPlayType(1)">🎬 电影</div>
        <div class="type-tab-inline" data-catid="3" onclick="switchPlayType(3)">🎪 综艺</div>
        <div class="type-tab-inline" data-catid="4" onclick="switchPlayType(4)">🎨 动漫</div>
      </div>
      <!-- 播放器内搜索框 - 手机端隐藏 -->
      <div class="search-box">
        <div class="search-input-wrap">
          <input type="text" id="playSearchInput" placeholder="输入关键词搜索影片..." oninput="toggleClearBtn(this)" onkeypress="if(event.key==='Enter') doPlaySearch()">
          <span class="clear-btn" id="playClearBtn" onclick="clearSearch('playSearchInput')">×</span>
        </div>
        <button onclick="doPlaySearch()">🔍 搜索</button>
      </div>
    </div>
  </div>

  <!-- 播放器iframe - 完全填充容器，四周不留空隙 -->
  <div class="play-frame-wrap">
    <iframe class="play-frame" id="playFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
const CONFIG = {
  categories: {
    1: { name: '电影', sub: ['全部','喜剧','爱情','动作','恐怖','科幻','剧情','犯罪','奇幻','战争','悬疑','动画','文艺','纪录','传记','歌舞','古装','历史','惊悚','伦理','其他'] },
    2: { name: '电视剧', sub: ['全部','言情','剧情','伦理','喜剧','悬疑','都市','偶像','古装','军事','警匪','历史','励志','神话','谍战','青春','家庭','动作','情景','武侠','科幻','其他'] },
    3: { name: '综艺', sub: ['全部','脱口秀','真人秀','搞笑','选秀','八卦','访谈','情感','生活','晚会','音乐','职场','美食','时尚','游戏','体育','纪实','科教','曲艺','歌舞','财经','汽车'] },
    4: { name: '动漫', sub: ['全部','热血','科幻','美少女','魔幻','经典','励志','少儿','冒险','搞笑','推理','恋爱','治愈','幻想','校园','动物','机战','亲子','儿歌','运动','悬疑','怪物','战争','益智','青春','童话','竞技','动作','社会','友情','真人版','电影版','OVA版','TV版','新番动画','完结动画'] }
  },
  apiBase: 'https://api.web.360kan.com/v1/filter/list',
  searchBase: '/yingshi/2/jiexi.html?url=',
  pageSize: 24
};

let state = {
  catid: 2,
  cat: '',
  pageno: 1,
  isLoading: false
};

document.addEventListener('DOMContentLoaded', () => {
  // 同步更新主页和播放页的父分类激活状态
  document.querySelectorAll('.type-tab-inline').forEach(tab => {
    tab.classList.toggle('active', parseInt(tab.dataset.catid) === 2);
  });
  renderFilters();
  loadData();
});

function goHome() {
  window.location.href = window.location.pathname;
  window.location.reload();
}

// 主页父标题切换
function switchType(catid) {
  if (state.catid === catid || state.isLoading) return;
  state.catid = catid;
  state.cat = '';
  state.pageno = 1;

  // 同步更新主页和播放页的父分类Tab激活状态
  document.querySelectorAll('.type-tab-inline').forEach(tab => {
    const tabCatid = parseInt(tab.dataset.catid);
    tab.classList.toggle('active', tabCatid === catid);
  });

  renderFilters();
  loadData();
}

// 播放页父标题切换 - 先关闭播放器回到主页，再执行切换
function switchPlayType(catid) {
  // 先关闭播放器回到主页
  closePlayer();
  // 然后执行切换
  setTimeout(() => {
    switchType(catid);
  }, 50);
}

function switchSubCat(cat) {
  if (state.cat === cat || state.isLoading) return;
  state.cat = cat;
  state.pageno = 1;
  renderFilters();
  loadData();
}

function goPage(p) {
  if (p < 1 || state.isLoading) return;
  state.pageno = p;
  loadData();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) return;
  openPlayer(keyword);
}

function doPlaySearch() {
  const keyword = document.getElementById('playSearchInput').value.trim();
  if (!keyword) return;
  const frame = document.getElementById('playFrame');
  frame.src = CONFIG.searchBase + encodeURIComponent(keyword);
  document.title = keyword + ' - 影视聚合';
}

function openPlayer(title) {
  const overlay = document.getElementById('playOverlay');
  const frame = document.getElementById('playFrame');
  const playSearchInput = document.getElementById('playSearchInput');

  frame.src = CONFIG.searchBase + encodeURIComponent(title);
  playSearchInput.value = title;
  document.title = title + ' - 影视聚合';
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  const overlay = document.getElementById('playOverlay');
  const frame = document.getElementById('playFrame');
  const playSearchInput = document.getElementById('playSearchInput');

  overlay.classList.remove('active');
  frame.src = '';
  playSearchInput.value = '';
  document.title = '影视聚合 - 纯前端版';
  document.body.style.overflow = '';
}

function playMovie(title) {
  openPlayer(title);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePlayer();
  }
});

function renderFilters() {
  const row = document.getElementById('subFilterRow');
  const subs = CONFIG.categories[state.catid].sub;
  row.innerHTML = subs.map(sub => {
    const val = sub === '全部' ? '' : sub;
    const isActive = state.cat === val;
    return `<span class="filter-tag ${isActive ? 'active' : ''}" onclick="switchSubCat('${val}')">${sub}</span>`;
  }).join('');
}

function renderMovies(movies) {
  const grid = document.getElementById('movieGrid');
  if (!movies || movies.length === 0) {
    grid.innerHTML = '<div class="error-msg">暂无数据，请尝试其他分类</div>';
    return;
  }
  grid.innerHTML = movies.map(movie => `
    <div class="movie-card" onclick="playMovie('${escapeHtml(movie.title)}')">
      <div class="movie-cover">
        <img src="https:${movie.cdncover}" 
             alt="${escapeHtml(movie.title)}" 
             loading="lazy"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%%22 height=%22100%%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23eee%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22%23999%22>暂无封面</text></svg>'">
      </div>
      <div class="movie-info">
        <div class="movie-title">${escapeHtml(movie.title)}</div>
        <div class="movie-meta">${escapeHtml(movie.comment || '暂无简介')}</div>
      </div>
    </div>
  `).join('');
}

function renderPagination() {
  const p = state.pageno;
  const container = document.getElementById('pagination');
  let html = '';
  html += `<button class="page-btn" onclick="goPage(${p-1})" ${p<=1?'disabled':''}>上一页</button>`;
  const start = Math.max(1, p - 2);
  const end = p + 3;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i === p ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${p+1})">下一页</button>`;
  container.innerHTML = html;
}

function loadData() {
  if (state.isLoading) return;
  state.isLoading = true;
  document.getElementById('movieGrid').innerHTML = `
    <div class="loading"><div class="spinner"></div><p style="margin-top:15px;color:#999">加载中...</p></div>
  `;
  const url = `${CONFIG.apiBase}?catid=${state.catid}&rank=rankhot&cat=${encodeURIComponent(state.cat)}&year=&area=&act=&size=${CONFIG.pageSize}&pageno=${state.pageno}&callback=handleData&_=${Date.now()}`;
  const script = document.createElement('script');
  script.src = url;
  script.onerror = () => {
    state.isLoading = false;
    document.getElementById('movieGrid').innerHTML = 
      '<div class="error-msg">❌ 加载失败，请检查网络或稍后重试<br><button onclick="loadData()" style="margin-top:10px;padding:8px 20px;background:#ff6b6b;color:white;border:none;border-radius:4px;cursor:pointer">重新加载</button></div>';
  };
  const oldScript = document.getElementById('jsonp-script');
  if (oldScript) oldScript.remove();
  script.id = 'jsonp-script';
  window.handleData = (data) => {
    state.isLoading = false;
    script.remove();
    if (data && data.data && data.data.movies) {
      renderMovies(data.data.movies);
      renderPagination();
    } else {
      renderMovies([]);
    }
  };
  setTimeout(() => {
    if (state.isLoading) {
      state.isLoading = false;
      script.remove();
      document.getElementById('movieGrid').innerHTML = 
        '<div class="error-msg">⏱️ 请求超时，请稍后重试</div>';
    }
  }, 10000);
  document.head.appendChild(script);
}

function toggleClearBtn(input) {
  const btnId = input.id === 'searchInput' ? 'homeClearBtn' : 'playClearBtn';
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.classList.toggle('show', input.value.length > 0);
  }
}

function clearSearch(inputId) {
  const input = document.getElementById(inputId);
  if (input) {
    input.value = '';
    input.focus();
    toggleClearBtn(input);
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.goHome = goHome;
window.switchType = switchType;
window.switchPlayType = switchPlayType;
window.switchSubCat = switchSubCat;
window.goPage = goPage;
window.doSearch = doSearch;
window.doPlaySearch = doPlaySearch;
window.playMovie = playMovie;
window.openPlayer = openPlayer;
window.closePlayer = closePlayer;
window.loadData = loadData;
window.toggleClearBtn = toggleClearBtn;
window.clearSearch = clearSearch;
</script>
