<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自适应切换播放器</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
.msg{color:#fff;text-align:center;padding:30px;font-size:18px}
</style>
</head>
<body>
<div class="msg">正在识别设备加载播放器...</div>
<script>
// 获取url参数
function getParam(key){
    let str = location.search.slice(1);
    let arr = str.split('&');
    for(let i of arr){
        let kv = i.split('=');
        if(kv[0] === key) return decodeURIComponent(kv[1] || '');
    }
    return '';
}
let video = getParam('url');

// 精准移动端判断
function checkMobile(){
    let ua = navigator.userAgent;
    return /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
}

// 两个播放器固定地址
const PC_PLAYER = "https://www.265500.vip/bfq/ffplayer.html?url=";
const MOBILE_PLAYER = "https://www.265500.vip/bfq/wqplayer5.html?url=";

if(!video){
    document.querySelector('.msg').textContent = '错误：链接必须携带 ?url=视频地址';
}else{
    let baseUrl = checkMobile() ? MOBILE_PLAYER : PC_PLAYER;
    let fullPlayUrl = baseUrl + encodeURIComponent(video);
    // 替换页面内容为播放框架
    document.body.innerHTML = `<iframe src="${fullPlayUrl}" allowfullscreen allow="autoplay;encrypted-media"></iframe>`;
}
</script>
</body>
</html>
