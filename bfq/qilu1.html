<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>齐鲁播放器</title>
<script src="https://file.iqilu.com/custom/v/zhibo/js/hls.min.js"></script>
<style>
  :root{
    --c-accent-1:#b34dff;
    --c-accent-2:#f352a5;
    --grad-accent:linear-gradient(135deg,#b34dff 0%,#f352a5 100%);
    --tx-1:#eef1f8;
    --tx-2:#98a2b8;
    --tx-3:#5c6579;
    --line-1:rgba(255,255,255,.06);
    --line-2:rgba(255,255,255,.11);
    --r-s:8px;
    --r-m:12px;
    --r-full:999px;
    --sh-2:0 8px 24px rgba(0,0,0,.45);
    --sh-accent:0 4px 20px rgba(179,77,255,.28);
  }
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  #player{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block;transition:filter .15s ease-out}
  #brightnessOverlay{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2;transition:opacity .15s}
  #loadingIndicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;display:none}
  #loadingIndicator.show{display:block}
  #loadingIndicator .spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--c-accent-1);border-right-color:var(--c-accent-2);border-radius:50%;animation:spin .9s linear infinite;box-shadow:0 0 24px rgba(179,77,255,.35)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #centerIndicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);width:84px;height:84px;border-radius:50%;background:rgba(11,13,20,.7);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:6;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--sh-2)}
  #centerIndicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #centerIndicator svg{width:40px;height:40px;fill:#fff}
  #centerIndicator .rate-text{color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px}
  #centerIndicator.clickable{pointer-events:auto;cursor:pointer;background:#fff;border-color:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 12px 48px rgba(179,77,255,.4),var(--sh-2)}
  #centerIndicator.clickable svg{fill:#0b0d14}
  #topRightRate{position:fixed;top:calc(20px + env(safe-area-inset-top));right:20px;background:rgba(11,13,20,.82);border:1px solid var(--line-2);color:#fff;padding:6px 12px;border-radius:var(--r-s);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;z-index:15;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-2);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1)}
  #topRightRate.show{opacity:1;transform:translateY(0)}
  #gestureIndicator{position:fixed;top:calc(22px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(11,13,20,.82);border:1px solid var(--line-2);color:#fff;padding:11px 18px;border-radius:var(--r-m);display:none;align-items:center;gap:12px;z-index:15;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-2)}
  #gestureIndicator.show{display:flex}
  #gestureIcon{font-size:20px;line-height:1}
  #gestureText{font-size:14px;font-weight:700;white-space:nowrap}
  #gestureBar{width:130px;height:5px;background:rgba(255,255,255,.15);border-radius:var(--r-full);overflow:hidden;margin-top:6px}
  #gestureBarFill{height:100%;background:var(--grad-accent);width:0%;border-radius:var(--r-full);transition:width .1s;box-shadow:0 0 8px rgba(179,77,255,.6)}
  #errorOverlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(6,7,12,.88);padding:24px;text-align:center;cursor:pointer}
  #errorOverlay.show{display:flex}
  .err-box{max-width:440px}
  .err-icon{font-size:34px;margin-bottom:14px}
  .err-text{color:var(--tx-2);font-size:14px;line-height:1.8;word-break:break-all}
  #controls{position:fixed;left:0;right:0;bottom:0;width:100%;padding:0 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(6,7,12,.94) 0%,rgba(6,7,12,.72) 45%,rgba(6,7,12,.28) 78%,transparent 100%);transition:opacity .28s ease,transform .28s ease;opacity:1;z-index:20}
  #controls.hidden{opacity:0;pointer-events:none;transform:translateY(10px)}
  #miniProgressBar{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:19;pointer-events:none;opacity:1;transition:opacity .3s ease}
  #miniProgressBar.hidden{opacity:0}
  #miniProgressBuffered{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.25);width:0%;transition:width .25s ease}
  #miniProgressPlayed{position:absolute;left:0;top:0;height:100%;background:var(--grad-accent);width:0%;box-shadow:0 0 8px rgba(179,77,255,.5)}
  #progressWrap{position:relative;width:100%;height:26px;display:flex;align-items:center;cursor:pointer;margin-bottom:4px}
  #progressTrack{position:relative;width:100%;height:5px;background:rgba(255,255,255,.13);border-radius:var(--r-full);overflow:visible;transition:height .18s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
  #progressWrap:hover #progressTrack{height:8px}
  #progressBuffered{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.22);width:0%;border-radius:var(--r-full);transition:width .25s ease}
  #progressPlayed{position:absolute;left:0;top:0;height:100%;background:var(--grad-accent);width:0%;border-radius:var(--r-full);box-shadow:0 0 12px rgba(179,77,255,.5)}
  #progressThumb{position:absolute;right:-7px;top:50%;transform:translateY(-50%) scale(0);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(179,77,255,.35),0 2px 10px rgba(0,0,0,.7);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  #progressWrap:hover #progressThumb,#progressWrap.dragging #progressThumb{transform:translateY(-50%) scale(1)}
  #progressTip{position:absolute;bottom:32px;transform:translateX(-50%);background:rgba(11,13,20,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx-1);border:1px solid var(--line-2);padding:4px 10px;border-radius:var(--r-s);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap;display:none;z-index:20;box-shadow:var(--sh-2)}
  #controlsRow{display:flex;align-items:center;gap:8px;height:38px;flex-wrap:nowrap}
  #spacer{flex:1 1 auto;min-width:0}
  .ctrl-btn{background:rgba(255,255,255,.06);border:1px solid var(--line-1);color:var(--tx-1);font-size:13px;font-family:inherit;font-weight:500;padding:0 11px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:36px;height:34px;flex:0 0 auto;transition:all .2s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .ctrl-btn:hover{background:rgba(255,255,255,.14);border-color:var(--line-2);transform:translateY(-1px)}
  .ctrl-btn:active{transform:translateY(0) scale(.96)}
  .ctrl-btn.active{background:var(--grad-accent);border-color:transparent;color:#fff;box-shadow:var(--sh-accent)}
  .ctrl-btn svg{width:18px;height:18px;fill:currentColor;display:block}
  #playBtn{background:transparent;border-color:transparent;padding:0;min-width:36px;height:36px}
  #playBtn:hover{background:rgba(255,255,255,.1)}
  #playBtn svg{width:26px;height:26px}
  #rateBtn{font-variant-numeric:tabular-nums;min-width:56px;font-weight:700;letter-spacing:.3px}
  #timeDisplay{color:var(--tx-1);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;margin:0 4px}
  #timeDisplay .total{color:var(--tx-3);font-weight:500}
  @media(max-width:640px){
    #controls{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    #controlsRow{gap:6px;height:34px}
    .ctrl-btn{padding:0 9px;height:32px;min-width:32px;font-size:12.5px;border-radius:9px}
    .ctrl-btn svg{width:16px;height:16px}
    #playBtn{min-width:34px;height:34px}
    #playBtn svg{width:24px;height:24px}
    #rateBtn{min-width:50px}
    #timeDisplay{font-size:12px;margin:0 2px}
    #centerIndicator{width:76px;height:76px}
    #centerIndicator svg{width:34px;height:34px}
    #topRightRate{top:calc(16px + env(safe-area-inset-top));right:16px;padding:5px 10px;font-size:13px}
  }
</style>
</head>
<body>

<video id="player" playsinline webkit-playsinline x5-playsinline preload="auto" style="filter:brightness(1)"></video>
<div id="brightnessOverlay"></div>
<div id="loadingIndicator"><div class="spinner"></div></div>

<div id="centerIndicator">
  <svg id="ciPlay" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
  <svg id="ciPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  <span id="ciRate" class="rate-text" style="display:none">1.0x</span>
</div>

<div id="topRightRate">2x</div>

<div id="gestureIndicator">
  <span id="gestureIcon">☀</span>
  <div>
    <div id="gestureText">亮度 100%（正常）</div>
    <div id="gestureBar"><div id="gestureBarFill"></div></div>
  </div>
</div>

<!-- ✅ 默认不显示错误遮罩 -->
<div id="errorOverlay">
  <div class="err-box">
    <div class="err-icon">⚠</div>
    <div class="err-text" id="errText"></div>
  </div>
</div>

<div id="miniProgressBar" class="hidden">
  <div id="miniProgressBuffered"></div>
  <div id="miniProgressPlayed"></div>
</div>

<div id="controls">
  <div id="progressWrap">
    <div id="progressTrack">
      <div id="progressBuffered"></div>
      <div id="progressPlayed"><div id="progressThumb"></div></div>
    </div>
    <div id="progressTip">00:00</div>
  </div>
  <div id="controlsRow">
    <button id="playBtn" class="ctrl-btn" title="播放/暂停">
      <svg id="btnIconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="btnIconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div id="timeDisplay">
      <span id="curTime">00:00</span>
      <span class="total"> / <span id="durTime">00:00</span></span>
    </div>
    <div id="spacer"></div>
    <button id="rateBtn" class="ctrl-btn" title="播放速度：1.0x">1.0x</button>
    <button id="pipBtn" class="ctrl-btn" title="画中画" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
    </button>
    <button id="fullscreenBtn" class="ctrl-btn" title="全屏">
      <svg id="iconEnterFs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <svg id="iconExitFs" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
'use strict';

const params   = new URLSearchParams(location.search);
const videoSrc = (params.get('url') || params.get('src') || '').trim();

const video            = document.getElementById('player');
const controls         = document.getElementById('controls');
const playBtn          = document.getElementById('playBtn');
const btnIconPlay      = document.getElementById('btnIconPlay');
const btnIconPause     = document.getElementById('btnIconPause');
const rateBtn          = document.getElementById('rateBtn');
const pipBtn           = document.getElementById('pipBtn');
const fullscreenBtn    = document.getElementById('fullscreenBtn');
const progressWrap     = document.getElementById('progressWrap');
const progressPlayed   = document.getElementById('progressPlayed');
const progressBuffered = document.getElementById('progressBuffered');
const progressTip      = document.getElementById('progressTip');
const curTimeEl        = document.getElementById('curTime');
const durTimeEl        = document.getElementById('durTime');
const centerIndicator  = document.getElementById('centerIndicator');
const ciPlay           = document.getElementById('ciPlay');
const ciPause          = document.getElementById('ciPause');
const ciRate           = document.getElementById('ciRate');
const topRightRate     = document.getElementById('topRightRate');
const miniProgressBar      = document.getElementById('miniProgressBar');
const miniProgressPlayed   = document.getElementById('miniProgressPlayed');
const miniProgressBuffered = document.getElementById('miniProgressBuffered');
const gestureIndicator = document.getElementById('gestureIndicator');
const gestureIcon      = document.getElementById('gestureIcon');
const gestureText      = document.getElementById('gestureText');
const gestureBarFill   = document.getElementById('gestureBarFill');
const brightnessOverlay= document.getElementById('brightnessOverlay');
const loadingIndicator = document.getElementById('loadingIndicator');
const errorOverlay     = document.getElementById('errorOverlay');
const errText          = document.getElementById('errText');

const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const RATES   = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0];

let hls             = null;
let currentRate     = 1.0;
let brightnessVal   = 100;
let volumeVal       = 100;
let isVideoReady    = false;
let playToken       = 0;
let hideTimer       = null;
let centerTimer     = null;
let isSeekingByDrag = false;
let isCenterPersistent = false;
let isPointerOverControls = false;

function formatTime(s){if(!isFinite(s)||isNaN(s)||s<0)return'00:00';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=Math.floor(s%60);return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function formatRate(r){return(Number.isInteger(r)?r.toFixed(1):String(r))+'x'}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setBrightness(v){brightnessVal=Math.max(0,Math.min(100,v));const b=0.3+(brightnessVal/100)*0.7;video.style.filter=`brightness(${b.toFixed(3)})`;brightnessOverlay.style.opacity=brightnessVal<20?(((20-brightnessVal)/100)*0.6).toFixed(2):0}
function setVolume(v){volumeVal=Math.max(0,Math.min(100,Math.round(v)));video.volume=volumeVal/100;video.muted=(volumeVal===0)}
function applyRate(r){currentRate=r;try{video.playbackRate=r}catch(e){};rateBtn.textContent=formatRate(currentRate);rateBtn.classList.toggle('active',Math.abs(currentRate-1.0)>0.001);rateBtn.title='播放速度：'+formatRate(currentRate);if(Math.abs(currentRate-1.0)<0.001)topRightRate.classList.remove('show');else{topRightRate.textContent=currentRate+'x';topRightRate.classList.add('show')}}
function cycleRate(){let i=RATES.findIndex(r=>Math.abs(r-currentRate)<0.001);let next;if(i===-1){const j=RATES.findIndex(r=>r>currentRate);next=RATES[j===-1?0:j]}else{next=RATES[(i+1)%RATES.length]}applyRate(next);if(!isCenterPersistent)showCenterIndicator('rate',next);resetHideTimer()}
rateBtn.addEventListener('click',e=>{e.stopPropagation();cycleRate()});

function showControls(){controls.classList.remove('hidden');miniProgressBar.classList.add('hidden');resetHideTimer()}
function hideControls(){if(isPointerOverControls)return;if(!video.paused&&!video.ended){controls.classList.add('hidden');miniProgressBar.classList.remove('hidden');progressTip.style.display='none'}}
function resetHideTimer(){clearTimeout(hideTimer);hideTimer=null;if(isPointerOverControls)return;hideTimer=setTimeout(hideControls,3000)}
if(!isTouch){controls.addEventListener('mouseenter',()=>{isPointerOverControls=true;clearTimeout(hideTimer);controls.classList.remove('hidden');miniProgressBar.classList.add('hidden')});controls.addEventListener('mouseleave',()=>{isPointerOverControls=false;resetHideTimer()})}

function showCenterIndicator(type,rate){if(isCenterPersistent)return;ciPlay.style.display=type==='play'?'block':'none';ciPause.style.display=type==='pause'?'block':'none';ciRate.style.display=type==='rate'?'block':'none';if(type==='rate')ciRate.textContent=formatRate(rate==null?currentRate:rate);centerIndicator.classList.add('show');centerIndicator.classList.remove('clickable');clearTimeout(centerTimer);centerTimer=setTimeout(()=>centerIndicator.classList.remove('show'),700)}
function showCenterPersistent(){if(isCenterPersistent)return;isCenterPersistent=true;clearTimeout(centerTimer);ciPlay.style.display='block';ciPause.style.display='none';ciRate.style.display='none';centerIndicator.classList.add('show','clickable')}
function hideCenterPersistent(){if(!isCenterPersistent)return;isCenterPersistent=false;centerIndicator.classList.remove('show','clickable');ciPlay.style.display='none'}
function updateCenterState(){if(isVideoReady&&(video.paused||video.ended))showCenterPersistent();else hideCenterPersistent()}

function updatePlayIcons(){const p=!(video.paused||video.ended);btnIconPlay.style.display=p?'none':'block';btnIconPause.style.display=p?'block':'none'}

function togglePlay(){if(video.paused||video.ended){if(video.ended)try{video.currentTime=0}catch(e){};video.play().catch(()=>{})}else video.pause()}
playBtn.addEventListener('click',e=>{e.stopPropagation();togglePlay();showControls()});
centerIndicator.addEventListener('click',e=>{e.stopPropagation();if(video.paused||video.ended){if(video.ended)try{video.currentTime=0}catch(e){};video.play().catch(()=>{});showControls()}});
centerIndicator.addEventListener('pointerdown',e=>e.stopPropagation());

video.addEventListener('play',()=>{hideCenterPersistent();updatePlayIcons();resetHideTimer();if(isVideoReady)showCenterIndicator('pause')});
video.addEventListener('pause',()=>{updatePlayIcons();updateCenterState();showControls()});
video.addEventListener('ended',()=>{updatePlayIcons();updateCenterState();showControls()});

function updateProgressUI(){if(!isFinite(video.duration)||video.duration<=0){curTimeEl.textContent=formatTime(video.currentTime);return}const p=video.currentTime/video.duration*100;progressPlayed.style.width=p+'%';miniProgressPlayed.style.width=p+'%';let be=video.currentTime;try{for(let i=0;i<video.buffered.length;i++){if(video.buffered.start(i)<=video.currentTime+0.1&&video.buffered.end(i)>be)be=video.buffered.end(i)}}catch(e){};const bp=Math.min(be/video.duration*100,100);progressBuffered.style.width=bp+'%';miniProgressBuffered.style.width=bp+'%';curTimeEl.textContent=formatTime(video.currentTime);durTimeEl.textContent=formatTime(video.duration)}
video.addEventListener('timeupdate',updateProgressUI);video.addEventListener('progress',updateProgressUI);video.addEventListener('durationchange',updateProgressUI);video.addEventListener('loadedmetadata',updateProgressUI);

function getTimeFromClientX(cx){const r=progressWrap.getBoundingClientRect();const x=Math.max(0,Math.min(r.width,cx-r.left));return{time:(r.width?x/r.width:0)*(video.duration||0),x}}
progressWrap.addEventListener('mousemove',function(e){if(isTouch||isSeekingByDrag)return;if(!isFinite(video.duration)||video.duration<=0)return;const info=getTimeFromClientX(e.clientX);progressTip.textContent=formatTime(info.time);progressTip.style.left=info.x+'px';progressTip.style.display='block'});
progressWrap.addEventListener('mouseleave',()=>progressTip.style.display='none');
progressWrap.addEventListener('pointerdown',function(e){if(!isFinite(video.duration)||video.duration<=0)return;e.preventDefault();isSeekingByDrag=true;progressWrap.classList.add('dragging');try{progressWrap.setPointerCapture(e.pointerId)}catch(err){};const info=getTimeFromClientX(e.clientX);video.currentTime=info.time;updateProgressUI();showControls()});
progressWrap.addEventListener('pointermove',function(e){if(!isSeekingByDrag)return;const info=getTimeFromClientX(e.clientX);video.currentTime=info.time;updateProgressUI();progressTip.textContent=formatTime(info.time);progressTip.style.left=info.x+'px';progressTip.style.display='block'});
progressWrap.addEventListener('pointerup',function(e){if(!isSeekingByDrag)return;isSeekingByDrag=false;progressWrap.classList.remove('dragging');progressTip.style.display='none';try{progressWrap.releasePointerCapture(e.pointerId)}catch(err){};resetHideTimer()});
progressWrap.addEventListener('pointercancel',function(){isSeekingByDrag=false;progressWrap.classList.remove('dragging');progressTip.style.display='none'});

function isFullscreen(){return!!(document.fullscreenElement||document.webkitFullscreenElement)}
function toggleFullscreen(){const el=document.documentElement;if(!isFullscreen()){if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}else{if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}}
function updateFullscreenIcon(){const fs=isFullscreen();iconEnterFs.style.display=fs?'none':'block';iconExitFs.style.display=fs?'block':'none';fullscreenBtn.classList.toggle('active',fs)}
fullscreenBtn.addEventListener('click',e=>{e.stopPropagation();toggleFullscreen();resetHideTimer()});
document.addEventListener('fullscreenchange',updateFullscreenIcon);document.addEventListener('webkitfullscreenchange',updateFullscreenIcon);
const pipSupported=('pictureInPictureEnabled' in document)&&document.pictureInPictureEnabled;
if(!pipSupported)pipBtn.style.display='none';else{pipBtn.addEventListener('click',async e=>{e.stopPropagation();try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await video.requestPictureInPicture()}catch(err){}resetHideTimer()});video.addEventListener('enterpictureinpicture',()=>pipBtn.classList.add('active'));video.addEventListener('leavepictureinpicture',()=>pipBtn.classList.remove('active'))}

if(!isTouch){
  let cc=0,ct=null;
  video.addEventListener('mousemove',showControls);
  video.addEventListener('mouseleave',()=>{clearTimeout(hideTimer);hideTimer=setTimeout(hideControls,800)});
  video.addEventListener('click',()=>{cc++;if(cc===1)ct=setTimeout(()=>{showControls();cc=0},250);else if(cc===2){clearTimeout(ct);cc=0;togglePlay();showControls()}});
}

if(isTouch){
  let tsx=0,tsy=0,sb=100,sv=100,st=0,gm=null,mv=false,lt=0,lpt=null,ilf=false,srf=1;
  function showGesture(t,v,tx){gestureIcon.textContent=t==='brightness'?'☀':t==='volume'?'🔊':t==='rate'?'⏩':'⏱';gestureText.textContent=tx;gestureBarFill.style.width=Math.max(0,Math.min(100,v))+'%';gestureIndicator.classList.add('show')}
  function hideGesture(){gestureIndicator.classList.remove('show')}
  video.addEventListener('touchstart',function(e){const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;sb=brightnessVal;sv=volumeVal;st=video.currentTime;gm=null;mv=false;clearTimeout(lpt);lpt=setTimeout(function(){if(mv)return;ilf=true;srf=video.playbackRate;video.playbackRate=3;showGesture('rate',0,'3.0x 快进中…');showControls()},500)},{passive:true});
  video.addEventListener('touchmove',function(e){const t=e.touches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;if(!mv&&Math.abs(dx)<12&&Math.abs(dy)<12)return;if(!mv){mv=true;clearTimeout(lpt);gm=Math.abs(dy)>Math.abs(dx)?(tsx<window.innerWidth/2?'brightness':'volume'):'seek'}e.preventDefault();if(ilf)return;if(gm==='brightness'){const nv=Math.max(0,Math.min(100,sb+(-dy/(window.innerHeight/2))*100));setBrightness(nv);showGesture('brightness',nv,nv>=99.5?'亮度 100%（正常）':`亮度 ${Math.round(nv)}%`)}else if(gm==='volume'){const nv=Math.max(0,Math.min(100,sv+(-dy/(window.innerHeight/2))*100));setVolume(nv);showGesture('volume',nv,`音量 ${Math.round(nv)}%`)}else if(gm==='seek'&&isFinite(video.duration)&&video.duration>0){const sr=video.duration*.5,dt=(dx/window.innerWidth)*sr,nt=Math.max(0,Math.min(video.duration,st+dt));video.currentTime=nt;showGesture('seek',(nt/video.duration)*100,`${formatTime(nt)} / ${formatTime(video.duration)}`);updateProgressUI()}showControls()},{passive:false});
  video.addEventListener('touchend',function(){clearTimeout(lpt);if(ilf){ilf=false;video.playbackRate=srf;hideGesture();showCenterIndicator('rate',srf);showControls();return}hideGesture();if(!mv){const n=Date.now();if(n-lt<300){lt=0;togglePlay();showControls()}else{lt=n;showControls()}}});
  video.addEventListener('touchcancel',function(){clearTimeout(lpt);if(ilf){ilf=false;video.playbackRate=srf}hideGesture()},{passive:true});
}

document.addEventListener('keydown',function(e){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;switch(e.key){case' ':case'Spacebar':e.preventDefault();togglePlay();showControls();break;case'ArrowLeft':e.preventDefault();video.currentTime=Math.max(0,video.currentTime-(e.shiftKey?30:10));showControls();break;case'ArrowRight':e.preventDefault();if(video.duration)video.currentTime=Math.min(video.duration,video.currentTime+(e.shiftKey?30:10));showControls();break;case'ArrowUp':e.preventDefault();video.volume=Math.min(1,video.volume+.1);volumeVal=Math.round(video.volume*100);video.muted=false;showControls();break;case'ArrowDown':e.preventDefault();video.volume=Math.max(0,video.volume-.1);volumeVal=Math.round(video.volume*100);if(video.volume===0)video.muted=true;showControls();break;case'f':case'F':e.preventDefault();toggleFullscreen();break}});

function showError(msg){errText.innerHTML=escapeHtml(msg||'播放失败');errorOverlay.classList.add('show')}
errorOverlay.addEventListener('click',()=>errorOverlay.classList.remove('show'));
function showLoading(v){loadingIndicator.classList.toggle('show',!!v)}

/* ═════════ 卡顿检测 ═════════ */
let stallTimer=null,stallAnchor=0,stallRetries=0,stallActive=false;
function clearStallTimer(){if(stallTimer){clearTimeout(stallTimer);stallTimer=null}}
function onStallBegin(){if(!isVideoReady||video.paused||video.ended)return;if(!stallActive){stallActive=true;stallRetries=0;stallAnchor=video.currentTime}else if(video.currentTime>stallAnchor)stallAnchor=video.currentTime;showLoading(true);clearStallTimer();stallTimer=setTimeout(recoverStall,5000)}
function onStallEnd(){clearStallTimer();stallActive=false;stallRetries=0;showLoading(false)}
function recoverStall(){if(!stallActive)return;if(video.paused||video.ended){onStallEnd();return}stallRetries++;const t=stallAnchor;try{if(Math.abs(video.currentTime-t)>.5)video.currentTime=t;video.play().catch(()=>{})}catch(e){}if(hls){try{hls.stopLoad()}catch(e){};try{hls.startLoad(t)}catch(e){}}if(stallRetries>3){rebuildAtTime(t);return}clearStallTimer();stallTimer=setTimeout(recoverStall,5000)}
function createRecoveryHls(){const i=new Hls({maxBufferLength:60,maxMaxBufferLength:300,backBufferLength:90,maxBufferSize:60 * 1000 * 1000,enableWorker:true,lowLatencyMode:false});i.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{i.recoverMediaError();return}catch(e){}}if(d.type===Hls.ErrorTypes.NETWORK_ERROR){try{i.startLoad();return}catch(e){}}try{i.destroy()}catch(e){}if(hls===i)hls=null;onStallEnd();showError('视频加载失败，请刷新页面重试')});return i}
function rebuildAtTime(t){clearStallTimer();stallRetries=0;stallActive=false;showLoading(true);const rate=currentRate,tt=Math.max(0,t||0);if(hls){try{hls.destroy()}catch(e){}hls=null}function r(){try{video.currentTime=tt}catch(e){};try{video.playbackRate=rate}catch(e){};video.play().catch(()=>updateCenterState())}const onMeta=function(){video.removeEventListener('loadedmetadata',onMeta);r()};video.addEventListener('loadedmetadata',onMeta);const isM3u8=/\.m3u8(\?|#|$)/i.test(videoSrc);if(isM3u8&&window.Hls&&window.Hls.isSupported()){hls=createRecoveryHls();hls.on(Hls.Events.MANIFEST_PARSED,()=>{try{video.currentTime=tt}catch(e){}});hls.loadSource(videoSrc);hls.attachMedia(video);setTimeout(()=>{if(Math.abs(video.currentTime-tt)>1)try{video.currentTime=tt}catch(e){};if(video.paused&&!video.ended)video.play().catch(()=>{})},3000)}else{video.src=videoSrc;video.load()}}
video.addEventListener('waiting',onStallBegin);video.addEventListener('stalled',onStallBegin);video.addEventListener('playing',onStallEnd);video.addEventListener('canplay',onStallEnd);video.addEventListener('pause',onStallEnd);video.addEventListener('ended',onStallEnd);

/* ═════════ 初始化播放 ═════════ */
function destroyHls(){if(hls){try{hls.destroy()}catch(e){}hls=null}}

function play(url){
  const myToken=++playToken;
  return new Promise((resolve,reject)=>{
    destroyHls();isVideoReady=false;hideCenterPersistent();showLoading(true);
    let settled=false,timer=null,networkRetried=false;
    function cleanup(){if(timer)clearTimeout(timer);video.removeEventListener('loadedmetadata',onReady);video.removeEventListener('loadeddata',onReady);video.removeEventListener('canplay',onReady);video.removeEventListener('playing',onReady);video.removeEventListener('error',onErr)}
    function succeed(){if(settled)return;settled=true;cleanup();if(myToken!==playToken)return;showLoading(false);isVideoReady=true;applyRate(1.0);updatePlayIcons();updateProgressUI();const p=video.play();if(p&&typeof p.catch==='function')p.catch(()=>updateCenterState());resolve()}
    function fail(msg){if(settled)return;settled=true;cleanup();if(myToken!==playToken)return;showLoading(false);reject(new Error(msg||'视频加载失败'))}
    function onReady(){succeed()}
    function onErr(){fail(video.error&&video.error.message)}
    video.addEventListener('loadedmetadata',onReady);video.addEventListener('loadeddata',onReady);video.addEventListener('canplay',onReady);video.addEventListener('playing',onReady);video.addEventListener('error',onErr);
    timer=setTimeout(()=>{if(settled)return;if(video.readyState>=2&&video.currentTime>0){succeed()}else fail('加载超时')},20000);
    const isM3u8=/\.m3u8(\?|#|$)/i.test(url);
    if(isM3u8&&window.Hls&&window.Hls.isSupported()){
      hls=new Hls({maxBufferLength:60,maxMaxBufferLength:300,backBufferLength:90,maxBufferSize:60 * 1000 * 1000,enableWorker:true,lowLatencyMode:false});
      hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;if(myToken!==playToken)return;if(d.type===Hls.ErrorTypes.NETWORK_ERROR){if(!networkRetried){networkRetried=true;try{hls.startLoad()}catch(e){}}try{hls.destroy()}catch(e){}hls=null;fail('网络错误：无法加载视频流')}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(e){fail('媒体解码错误')}}else{try{hls.destroy()}catch(e){};hls=null;fail('视频加载失败，请检查地址')}});
      hls.loadSource(url);hls.attachMedia(video);
    }else if(isM3u8&&!(video.canPlayType('application/vnd.apple.mpegurl')||video.canPlayType('audio/mpegurl'))){
      fail('当前环境不支持 HLS 播放');
    }else{video.src=url;video.load()}
  });
}

/* ═════════ 启动流程 ✅ 核心修改 ═════════ */
video.addEventListener('contextmenu',e=>e.preventDefault());
setBrightness(100);setVolume(100);applyRate(1.0);updatePlayIcons();showLoading(false);

if(!videoSrc){
  // ✅ 只有完全没有 url 参数时才提示
  showError('缺少播放地址，请在网址后添加 ?url=视频地址');
}else{
  // ✅ 有地址 → 确保错误层隐藏，进入正常加载流程
  errorOverlay.classList.remove('show');
  play(videoSrc).catch(err=>{
    showError('播放失败：'+(err&&err.message?err.message:'未知错误'));
  });
}

})();
</script>
</body>
