<!doctype html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <title>忘情播放器</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
        }

        #container {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .resolution-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .resolution-display.show {
            opacity: 1;
        }
    </style>
    <script>
        // 初始化参数
        var m3u8Url = new URLSearchParams(location.search.substring(1)).get('url');
        var resumeKey = "";
        // 防抖定时器，避免高频存储进度
        let progressSaveTimer = null;
        // 标记是否已经设置过播放进度，防止重复设置
        let hasSetProgress = false;

        if (m3u8Url) {
            try {
                let parsedUrl = new URL(m3u8Url);
                let videoDomain = parsedUrl.hostname;
                let match = parsedUrl.pathname.match(/\/(\d+)_/);
                let videoId = match ? match[1] : 'unknown';
                resumeKey = `${videoDomain}-${videoId}:progress`;
            } catch (e) {
                console.error('解析URL失败:', e);
                resumeKey = `video-${Date.now()}:progress`;
            }
        }
    </script>
</head>

<body>
    <div id="container"></div>
    <div id="resolutionDisplay" class="resolution-display"></div>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            // 检查是否有视频地址
            if (!m3u8Url) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 24px;
                `;
                container.textContent = '使用方式 ?url=视频地址';
                return; // 停止执行
            }

            // 定义主用和备用JS链接
            const hlsJsSources = [
                'https://vip.dytt-tvs.com/frontend/players/js/hls.js',
                'https://www.265500.vip/bfq/hls.js'
            ];
            const artplayerJsSources = [
                'https://vip.dytt-tvs.com/frontend/players/artplayer/artplayer.js',
                'https://www.265500.vip/bfq/artplayer.js'
            ];

            function loadScript(srcArray) {
                return new Promise((resolve, reject) => {
                    let currentIndex = 0;
                    function tryLoad() {
                        if (currentIndex >= srcArray.length) {
                            reject(new Error(`All sources failed: ${srcArray.join(', ')}`));
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = srcArray[currentIndex];
                        script.onload = () => resolve(script);
                        script.onerror = () => {
                            console.warn(`Failed to load script from: ${srcArray[currentIndex]}, trying next...`);
                            currentIndex++;
                            tryLoad();
                        };
                        document.head.appendChild(script);
                    }
                    tryLoad();
                });
            }

            Promise.all([
                loadScript(hlsJsSources),
                loadScript(artplayerJsSources)
            ]).then(() => {
                console.log('All external scripts loaded successfully.');
                initializePlayer();
            }).catch((error) => {
                console.error('Failed to load required scripts:', error);
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '播放器脚本加载失败，请刷新页面重试';
            });

            function initializePlayer() {
                const resolutionDisplay = document.getElementById('resolutionDisplay');
                // 保存HLS实例引用，方便统一管理
                let hlsInstance = null;

                function showResolution(width, height) {
                    resolutionDisplay.textContent = `${width}×${height}`;
                    resolutionDisplay.classList.add('show');
                    setTimeout(() => {
                        resolutionDisplay.classList.remove('show');
                    }, 5000);
                }

                function getVideoResolution(videoElement) {
                    if (videoElement && videoElement.videoWidth && videoElement.videoHeight) {
                        return {
                            width: videoElement.videoWidth,
                            height: videoElement.videoHeight
                        };
                    }
                    return null;
                }

                // 防抖存储播放进度
                function savePlaybackProgress(time) {
                    if (!resumeKey || !time || isNaN(time)) return;
                    
                    // 清除之前的定时器
                    if (progressSaveTimer) clearTimeout(progressSaveTimer);
                    
                    // 500ms防抖，避免高频写入localStorage
                    progressSaveTimer = setTimeout(() => {
                        try {
                            localStorage.setItem(resumeKey, time.toFixed(1));
                        } catch (e) {
                            console.error('存储播放进度失败:', e);
                        }
                    }, 500);
                }

                window.player = new Artplayer({
                    container: '#container',
                    url: m3u8Url,
                    autoplay: true,
                    autoSize: false,
                    loop: false,
                    mutex: true,
                    setting: true,
                    pip: true,
                    flip: false,
                    lock: true,
                    fastForward: true,
                    playbackRate: true,
                    aspectRatio: true,
                    theme: '#ff0057',
                    fullscreen: true,
                    fullscreenWeb: false,
                    miniProgressBar: true,
                    autoOrientation: true,
                    airplay: false,
                    whitelist: ['*'],
                    customType: {
                        m3u8: function (video, url) {
                            // 先销毁旧的HLS实例
                            if (hlsInstance) {
                                try {
                                    hlsInstance.destroy();
                                } catch (e) {
                                    console.warn('销毁旧HLS实例:', e);
                                }
                                hlsInstance = null;
                            }

                            if (Hls.isSupported()) {
                                const hls = new Hls({
                                    // 禁用自动级别切换，避免频繁切换导致播放中断
                                    startLevel: -1,
                                    maxBufferLength: 30,
                                    maxMaxBufferLength: 60
                                });
                                hlsInstance = hls;

                                hls.loadSource(url);
                                hls.attachMedia(video);

                                // 监听级别切换事件，但避免触发不必要的操作
                                hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                                    console.log('级别切换:', data);
                                    // 延迟更长时间获取分辨率，避免切换过程中读取错误
                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) {
                                            showResolution(resolution.width, resolution.height);
                                        }
                                    }, 2000);
                                });

                                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                                    console.log('HLS清单解析完成');
                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) {
                                            showResolution(resolution.width, resolution.height);
                                        }
                                    }, 1500);
                                });

                                // 监听错误事件，避免错误导致播放中断
                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    console.error('HLS错误:', data);
                                    // 仅处理致命错误
                                    if (data.fatal) {
                                        switch (data.type) {
                                            case Hls.ErrorTypes.NETWORK_ERROR:
                                                console.log('网络错误，尝试重新加载');
                                                hls.startLoad();
                                                break;
                                            case Hls.ErrorTypes.MEDIA_ERROR:
                                                console.log('媒体错误，尝试恢复');
                                                hls.recoverMediaError();
                                                break;
                                            default:
                                                // 无法恢复的错误，销毁实例
                                                hls.destroy();
                                                break;
                                        }
                                    }
                                });

                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = url;
                                video.addEventListener('loadedmetadata', function () {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) {
                                        showResolution(resolution.width, resolution.height);
                                    }
                                });
                            } else {
                                window.player.notice.show = 'Unsupported playback format: m3u8';
                            }
                        },
                    }
                });

                // 视频元数据加载完成后再设置播放进度
                window.player.on('video:loadedmetadata', function () {
                    const videoElement = window.player.video;
                    if (videoElement) {
                        const resolution = getVideoResolution(videoElement);
                        if (resolution) {
                            setTimeout(() => {
                                showResolution(resolution.width, resolution.height);
                            }, 1000);
                        }

                        // 只设置一次播放进度
                        if (!hasSetProgress && resumeKey) {
                            try {
                                var progress = parseFloat(localStorage.getItem(resumeKey));
                                if (!isNaN(progress) && progress > 0 && progress < window.player.duration) {
                                    console.log('恢复播放进度:', progress);
                                    window.player.seek = progress;
                                }
                                hasSetProgress = true;
                            } catch (e) {
                                console.error('设置播放进度失败:', e);
                            }
                        }
                    }
                });

                // 优化进度存储逻辑 - 降低存储频率
                window.player.on('video:progress', (event) => {
                    const currentTime = window.player.currentTime;
                    // 只在播放中且时间有效时存储
                    if (currentTime && !window.player.paused && !isNaN(currentTime)) {
                        savePlaybackProgress(currentTime);
                    }
                });

                // 播放器销毁时清理资源
                window.player.on('destroy', () => {
                    if (progressSaveTimer) clearTimeout(progressSaveTimer);
                    if (hlsInstance) {
                        try {
                            hlsInstance.destroy();
                        } catch (e) {
                            console.warn('销毁HLS实例:', e);
                        }
                        hlsInstance = null;
                    }
                });

                // 防止播放错误导致重新加载
                window.player.on('error', (e) => {
                    console.error('播放器错误:', e);
                    // 阻止错误冒泡导致的播放器重置
                    e.preventDefault();
                });
            }
        });
    </script>
</body>

</html>
