<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自识别播放器</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #121212;
}
.nav-box {
    width: 100%;
    background: linear-gradient(to bottom, #1e1e1e, #2d2d2d);
    padding: 4px 6px;
    display: flex;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.nav-scroll {
    width: 100%;
    max-width: 1200px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.nav-scroll::-webkit-scrollbar {
    display: none;
}
.nav-list {
    display: flex;
    gap: 9px; /* 间距改为现在的3倍 */
    width: max-content;
    margin: 0 auto;
}
.nav-btn {
    padding: 4px 10px;
    background: linear-gradient(to top, #3a3a3a, #4a4a4a);
    border: 1px solid #555555;
    border-radius: 2px;
    font-size: 11px;
    color: #e0e0e0;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.25s ease;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
}
.nav-btn:hover {
    background: linear-gradient(to top, #4a4a4a, #5a5a5a);
}
/* 完全移除active样式，取消高亮效果 */
.nav-btn.active {
    background: linear-gradient(to top, #3a3a3a, #4a4a4a);
    color: #e0e0e0;
    font-weight: normal;
    box-shadow: none;
    border-color: #555555;
}
.search-container {
    width: 100%;
    height: calc(100vh - 26px);
    background: #ffffff;
}
#search-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
@media (max-width: 768px) {
    .nav-box {
        padding: 3px 4px;
    }
    .nav-btn {
        padding: 3px 8px;
        font-size: 11px;
    }
    .search-container {
        height: calc(100vh - 20px);
        background: #ffffff;
    }
}
</style>
</head>
<body>
<div class="nav-box">
    <div class="nav-scroll">
        <div class="nav-list">
            <!-- 播放器按钮保留原有前缀，用于关键词拼接 -->
            <button class="nav-btn" data-prefix="https://265500.netlify.app/bfq/ffplayer.html?url=">默认播放</button>
            <!-- 其他按钮修改为对应网站主页，不再带搜索参数 -->
            <button class="nav-btn" data-url="https://265500.netlify.app/bfq/lingquan.html">淘宝领券</button>
            <button class="nav-btn" data-url="">勿信广告</button>
        </div>
    </div>
</div>
<div class="search-container">
    <iframe id="search-iframe" src="about:blank"></iframe>
</div>
<script>
// 获取URL参数
function getUrlKeyword() {
    const params = new URLSearchParams(window.location.search);
    return params.get('url') || '';
}
// 通用URL清理函数：移除http/https前面的所有无关字符
function cleanUrl(rawUrl) {
    if (!rawUrl) return null;
    // 找到https开头的位置
    const httpsStartIndex = rawUrl.indexOf('https');
    if (httpsStartIndex !== -1) {
        return rawUrl.substring(httpsStartIndex);
    }
    // 找不到https，找http开头的位置
    const httpStartIndex = rawUrl.indexOf('http');
    if (httpStartIndex !== -1) {
        return rawUrl.substring(httpStartIndex);
    }
    // 不是URL，返回原始字符串（作为关键词）
    return rawUrl;
}
// 解析m3u8链接（基于清理后的URL）
function parseM3u8Url(cleanedUrl) {
    if (!cleanedUrl) return null;
    // 只处理以http/https开头且包含.m3u8的链接
    if ((cleanedUrl.startsWith('http://') || cleanedUrl.startsWith('https://')) && cleanedUrl.includes('.m3u8')) {
        // 找到.m3u8的结束位置，过滤后面的所有字符
        const m3u8EndIndex = cleanedUrl.indexOf('.m3u8');
        if (m3u8EndIndex !== -1) {
            return cleanedUrl.substring(0, m3u8EndIndex + 5); // +5 包含.m3u8
        }
    }
    // 不是m3u8链接
    return null;
}
document.addEventListener('DOMContentLoaded', function () {
    const iframe = document.getElementById('search-iframe');
    const btns = document.querySelectorAll('.nav-btn');
    const rawKeyword = getUrlKeyword();
    // 标记第一个播放器按钮
    const playerBtn = btns[0];
    // 第一步：清理URL（移除http/https前面的所有无关字符）
    const cleanedUrl = cleanUrl(rawKeyword);
    if (cleanedUrl) {
        // 第二步：默认加载时，判断是否是m3u8链接（只针对播放器按钮）
        const m3u8Url = parseM3u8Url(cleanedUrl);
        if (m3u8Url) {
            // 是m3u8链接，使用指定播放器打开
            iframe.src = `https://265500.netlify.app/bfq/ffplayer.html?url=${encodeURIComponent(m3u8Url)}`;
        } else {
            // 非m3u8链接：判断是完整URL还是关键词
            if (cleanedUrl.startsWith('http://') || cleanedUrl.startsWith('https://')) {
                // 是完整URL，直接在iframe打开
                iframe.src = cleanedUrl;
            } else {
                // 是关键词，使用播放器前缀搜索
                const defaultPrefix = playerBtn.getAttribute('data-prefix');
                iframe.src = defaultPrefix + encodeURIComponent(cleanedUrl);
            }
        }
    } else {
        // 无参数，显示空白
        iframe.src = 'about:blank';
    }
    btns.forEach((btn) => {
        btn.addEventListener('click', function () {
            const kw = getUrlKeyword();
            // 清理URL
            const cleanedUrl = cleanUrl(kw);
            // 区分第一个播放器按钮和其他按钮
            if (this === playerBtn) {
                // 第一个播放器按钮：保留原有逻辑（拼接关键词）
                if (!kw || !cleanedUrl) return;
                // 解析是否为m3u8链接
                const m3u8Url = parseM3u8Url(cleanedUrl);
                if (m3u8Url) {
                    // 播放器按钮 + m3u8链接：使用播放器打开
                    iframe.src = `https://265500.netlify.app/bfq/?url=${encodeURIComponent(m3u8Url)}`;
                } else {
                    if (cleanedUrl.startsWith('http://') || cleanedUrl.startsWith('https://')) {
                        // 完整URL：直接在iframe打开
                        iframe.src = cleanedUrl;
                    } else {
                        // 关键词：使用播放器前缀搜索
                        const prefix = this.getAttribute('data-prefix');
                        iframe.src = prefix + encodeURIComponent(cleanedUrl);
                    }
                }
            } else {
                // 其他按钮：直接打开对应网站主页，不拼接任何关键词
                const targetUrl = this.getAttribute('data-url');
                if (targetUrl) {
                    window.open(targetUrl, '_blank');
                }
            }
        });
    });
});
</script>
</body>
</html>
