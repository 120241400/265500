<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自动切换播放器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .tip {
            padding: 40px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="tip" id="tip">正在检测设备并加载播放器...</div>

<script>
/**
 * 获取 URL 参数
 */
function getQuery(name) {
    const reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
    const r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURIComponent(r[2]);
    return "";
}

// 获取视频地址
const videoUrl = getQuery("url");

if (!videoUrl) {
    document.getElementById("tip").innerHTML =
        "❌ 未检测到视频地址<br><br>请使用：<br>?url=视频链接";
} else {

    // 判断是否为手机
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent
        );
    }

    let playerUrl = "";

    if (isMobile()) {
        // 手机端播放器
        playerUrl = "https://www.265500.vip/bfq/wqplayer5.html?url=" + encodeURIComponent(videoUrl);
    } else {
        // 电脑端播放器
        playerUrl = "https://www.265500.vip/bfq/ffplayer.html?url=" + encodeURIComponent(videoUrl);
    }

    // 直接跳转播放器
    window.location.href = playerUrl;
}
</script>

</body>
</html>
