<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自适应视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .tip {
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="tip">视频加载中...</div>
    <script>
        // 获取地址栏视频参数 ?url=xxx
        function getUrlParam(name) {
            const reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            const r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }
        const videoUrl = getUrlParam('url');

        // 判断设备：手机/电脑
        function isMobile() {
            const userAgent = navigator.userAgent.toLowerCase();
            const mobileKeywords = ['android', 'iphone', 'ipad', 'ipod', 'windows phone', 'mobile'];
            return mobileKeywords.some(key => userAgent.includes(key));
        }

        // 播放器地址
        const pcPlayer = "./x5player-t.html?url=";
        const mobilePlayer = "./x5player-t.html?url=";

        if (!videoUrl) {
            document.querySelector('.tip').innerText = "缺少视频参数，请携带 ?url=视频地址 访问";
        } else {
            // 拼接完整播放链接
            let playSrc;
            if (isMobile()) {
                playSrc = mobilePlayer + encodeURIComponent(videoUrl);
            } else {
                playSrc = pcPlayer + encodeURIComponent(videoUrl);
            }
            // 生成iframe嵌入播放器
            document.body.innerHTML = `<iframe src="${playSrc}" allowfullscreen allow="autoplay"></iframe>`;
        }
    </script>
</body>
</html>
