<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智能播放器</title>
    <style>
        :root {
            --primary: #00d4ff;
            --primary-glow: rgba(0, 212, 255, 0.4);
            --bg-glass: rgba(255, 255, 255, 0.15);
            --bg-hover: rgba(255, 255, 255, 0.25);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: none;
        }

        .player-container.show-cursor {
            cursor: default;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .brightness-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.2s;
        }

        .center-play-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .center-play-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .center-play-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-play-btn::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
        }

        .center-play-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
            position: relative;
            z-index: 1;
        }

        .speed-tip {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.2s;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        .speed-tip.show {
            opacity: 1;
        }

        .gesture-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px 32px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .gesture-card.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .gesture-icon {
            width: 48px;
            height: 48px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .gesture-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            min-width: 100px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 24px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            opacity: 1;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 50;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .error-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            text-align: center;
        }

        .error-panel.show {
            display: flex;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            color: #ff4444;
            opacity: 0.8;
        }

        .retry-btn {
            background: var(--primary);
            border: none;
            color: #000;
            padding: 12px 32px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px var(--primary-glow);
            margin-top: 8px;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--primary-glow);
        }

        .retry-btn:active {
            transform: scale(0.95);
        }

        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
            transform: translateY(0);
            opacity: 1;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .controls.hide {
            transform: translateY(100%);
            opacity: 0;
        }

        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 4px 20px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
            opacity: 0.6;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px var(--primary-glow);
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            position: relative;
            z-index: 1;
        }

        .time-display {
            color: var(--text);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            min-width: 48px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .time-display.duration {
            color: var(--text-secondary);
        }

        .progress-wrapper {
            flex: 1;
            height: 44px;
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            margin: 0 -8px;
            padding: 0 8px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: visible;
            transition: height 0.2s;
        }

        .progress-wrapper:hover .progress-track {
            height: 6px;
        }

        .progress-loaded {
            position: absolute;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: inherit;
            transition: width 0.3s;
            z-index: 1;
        }

        .progress-played {
            position: absolute;
            height: 100%;
            background: var(--primary);
            border-radius: inherit;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.1s;
            z-index: 2;
        }

        .progress-handle {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            z-index: 3;
        }

        .progress-wrapper:hover .progress-handle,
        .progress-wrapper.dragging .progress-handle {
            transform: translateY(-50%) scale(1);
        }

        .progress-input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .control-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 8px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .speed-btn {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.5px;
            min-width: 56px;
            font-variant-numeric: tabular-nums;
        }

        .panel {
            position: fixed;
            right: 24px;
            bottom: 100px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px;
            z-index: 30;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .panel.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .panel-title {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 12px 12px;
        }

        .panel-item {
            padding: 12px 16px;
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0;
        }

        .panel-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .panel-item.active {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.15);
            font-weight: 600;
        }

        .panel-item.active::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
        }

        @media (min-width: 768px) {
            .controls {
                padding: 24px 32px calc(24px + env(safe-area-inset-bottom));
                gap: 20px;
            }
            
            .play-btn {
                width: 64px;
                height: 64px;
            }
            
            .play-btn svg {
                width: 28px;
                height: 28px;
            }
            
            .icon-btn {
                width: 48px;
                height: 48px;
            }
            
            .icon-btn svg {
                width: 24px;
                height: 24px;
            }

            .center-play-btn {
                width: 100px;
                height: 100px;
            }

            .center-play-btn svg {
                width: 40px;
                height: 40px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>

<div class="player-container" id="player">
    <video id="video" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
    
    <div class="brightness-overlay" id="brightnessOverlay"></div>
    
    <button class="center-play-btn" id="centerPlayBtn" aria-label="播放">
        <svg viewBox="0 0 24 24" id="centerPlayIcon">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </button>

    <div class="speed-tip" id="speedTip">2倍速</div>
    
    <div class="gesture-card" id="gestureCard">
        <svg class="gesture-icon" id="gestureIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
        </svg>
        <div class="gesture-text" id="gestureText">提示</div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="loading-text" id="loadingText">加载中</div>
        <div class="error-panel" id="errorPanel">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div id="errorText" style="color: #ff6b6b; font-size: 14px;">加载失败</div>
            <button class="retry-btn" id="retryBtn">重新加载</button>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="play-btn" id="playBtn" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" id="playIcon">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
        
        <div class="time-display" id="currentTime">00:00</div>
        
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-track">
                <div class="progress-loaded" id="progressLoaded"></div>
                <div class="progress-played" id="progressPlayed">
                    <div class="progress-handle"></div>
                </div>
            </div>
            <input type="range" min="0" max="100" value="0" class="progress-input" id="progressInput" aria-label="进度">
        </div>
        
        <div class="time-display duration" id="duration">00:00</div>
        
        <div class="control-actions">
            <button class="icon-btn speed-btn" id="speedBtn" title="播放速度">1.0x</button>
            <button class="icon-btn" id="fullscreenBtn" title="全屏" aria-label="全屏">
                <svg viewBox="0 0 24 24">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="panel" id="speedPanel">
        <div class="panel-title">播放速度</div>
        <div class="panel-item" data-speed="0.5">0.5x</div>
        <div class="panel-item active" data-speed="1.0">1.0x</div>
        <div class="panel-item" data-speed="1.3">1.3x</div>
        <div class="panel-item" data-speed="1.5">1.5x</div>
        <div class="panel-item" data-speed="2.0">2.0x</div>
    </div>
</div>

<script>
const HLS_CDN_LIST = [
    'https://cdn.jsdmirror.cn/npm/hls.js@latest',
    'https://gcore.jsdelivr.net/npm/hls.js@latest',
    'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js'
];

class SmartPlayer {
    constructor() {
        this.hls = null;
        this.currentCdnIndex = 0;
        this.isHlsLoaded = false;
        this.isVideoLoaded = false;
        
        this.icons = {
            play: '<path d="M8 5v14l11-7z"/>',
            pause: '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>',
            fullscreen: '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
            fullscreenExit: '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>',
            sun: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
            volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>',
            mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
            clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'
        };

        this.dom = {
            player: document.getElementById('player'),
            video: document.getElementById('video'),
            controls: document.getElementById('controls'),
            centerPlayBtn: document.getElementById('centerPlayBtn'),
            centerPlayIcon: document.getElementById('centerPlayIcon'),
            playBtn: document.getElementById('playBtn'),
            playIcon: document.getElementById('playIcon'),
            progressWrapper: document.getElementById('progressWrapper'),
            progressInput: document.getElementById('progressInput'),
            progressPlayed: document.getElementById('progressPlayed'),
            progressLoaded: document.getElementById('progressLoaded'),
            currentTime: document.getElementById('currentTime'),
            duration: document.getElementById('duration'),
            speedBtn: document.getElementById('speedBtn'),
            speedPanel: document.getElementById('speedPanel'),
            fullscreenBtn: document.getElementById('fullscreenBtn'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            spinner: document.getElementById('spinner'),
            loadingText: document.getElementById('loadingText'),
            errorPanel: document.getElementById('errorPanel'),
            errorText: document.getElementById('errorText'),
            retryBtn: document.getElementById('retryBtn'),
            toast: document.getElementById('toast'),
            gestureCard: document.getElementById('gestureCard'),
            gestureIcon: document.getElementById('gestureIcon'),
            gestureText: document.getElementById('gestureText'),
            brightnessOverlay: document.getElementById('brightnessOverlay'),
            speedTip: document.getElementById('speedTip')
        };

        this.state = {
            isPlaying: false,
            isDragging: false,
            speed: 1.0,
            brightness: 0,
            volume: 1.0,
            isFullscreen: false,
            retryCount: 0,
            maxRetries: 3,
            videoUrl: null,
            hideControlsTimer: null,
            isMouseInPlayer: false,
            originalSpeed: 1.0,
            lastCurrentTime: 0
        };

        this.gesture = {
            startX: 0, startY: 0, startTime: 0,
            startVolume: 0, startBrightness: 0, startProgress: 0,
            direction: null, isLongPress: false, longPressTimer: null,
            isMouseDown: false
        };

        this.timers = {
            gestureHint: null,
            seekThrottle: 0,
            toast: null,
            loadedCheck: null
        };

        this.init();
    }

    async init() {
        await this.loadHlsJs();
        this.setupEventListeners();
        this.setupKeyboard();
        this.setupMouseGestures();
        this.setupMouseBehavior();
        this.setupDblclick();
        this.loadVideo();
    }

    setupDblclick() {
        this.dom.player.addEventListener('dblclick', (e) => {
            if (e.target.closest('.controls') || e.target.closest('.panel')) return;
            this.togglePlay();
        });
    }

    loadHlsJs() {
        return new Promise((resolve, reject) => {
            if (window.Hls && window.Hls.isSupported) {
                this.isHlsLoaded = true;
                resolve();
                return;
            }

            const tryLoad = () => {
                if (this.currentCdnIndex >= HLS_CDN_LIST.length) {
                    reject(new Error('所有 CDN 加载失败'));
                    return;
                }

                const script = document.createElement('script');
                script.src = HLS_CDN_LIST[this.currentCdnIndex];
                script.onload = () => {
                    if (window.Hls) {
                        this.isHlsLoaded = true;
                        resolve();
                    } else {
                        this.currentCdnIndex++;
                        tryLoad();
                    }
                };
                script.onerror = () => {
                    this.currentCdnIndex++;
                    tryLoad();
                };
                document.head.appendChild(script);
            };

            tryLoad();
        }).catch(err => {
            console.warn('HLS.js 加载失败，将尝试原生播放:', err);
        });
    }

    isM3U8(url) {
        return url && (url.includes('.m3u8') || url.includes('.m3u'));
    }

    canPlayHLSNative() {
        const video = document.createElement('video');
        return video.canPlayType('application/vnd.apple.mpegurl') !== '';
    }

    loadVideo() {
        const url = new URLSearchParams(location.search).get('url');
        if (!url) {
            this.showError('请提供视频地址参数 ?url=');
            return;
        }

        this.state.videoUrl = url;
        this.state.retryCount = 0;
        this.showLoading(true);

        if (this.hls) {
            this.hls.destroy();
            this.hls = null;
        }

        const v = this.dom.video;

        if (this.isM3U8(url) && !this.canPlayHLSNative() && window.Hls && window.Hls.isSupported()) {
            this.hls = new Hls({
                debug: false,
                enableWorker: true,
                lowLatencyMode: true,
                maxBufferLength: 30,
                maxMaxBufferLength: 600,
                liveSyncDurationCount: 3,
                fragLoadingTimeOut: 20000,
                manifestLoadingTimeOut: 10000,
                levelLoadingTimeOut: 10000
            });

            this.hls.on(Hls.Events.MEDIA_ATTACHED, () => {});

            this.hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                this.onVideoLoaded();
            });

            this.hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            this.handleError();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            this.hls.recoverMediaError();
                            break;
                        default:
                            this.handleError();
                            break;
                    }
                }
            });

            this.hls.loadSource(url);
            this.hls.attachMedia(v);
        } else {
            v.src = url;
        }

        this.setupVideoEvents();
    }

    onVideoLoaded() {
        this.isVideoLoaded = true;
        this.dom.duration.textContent = this.formatTime(this.dom.video.duration);
        this.showLoading(false);
        this.showControls();
        this.showCenterPlayButton();
    }

    setupVideoEvents() {
        const v = this.dom.video;
        let lastUpdate = 0;
        
        v.addEventListener('timeupdate', () => {
            const now = Date.now();
            if (now - lastUpdate < 200) return;
            lastUpdate = now;
            this.state.lastCurrentTime = v.currentTime;
            this.updateProgress();
        });

        v.addEventListener('loadedmetadata', () => {
            this.onVideoLoaded();
        });

        v.addEventListener('durationchange', () => {
            if (v.duration && isFinite(v.duration)) {
                this.dom.duration.textContent = this.formatTime(v.duration);
            }
        });

        v.addEventListener('waiting', () => this.showLoading(true));
        
        v.addEventListener('canplay', () => {
            if (!this.isVideoLoaded) {
                this.onVideoLoaded();
            } else {
                this.showLoading(false);
            }
            if (v.duration && isFinite(v.duration)) {
                this.dom.duration.textContent = this.formatTime(v.duration);
            }
        });

        v.addEventListener('play', () => {
            this.state.isPlaying = true;
            this.updatePlayButton();
            this.hideCenterPlayButton();
        });

        v.addEventListener('pause', () => {
            this.state.isPlaying = false;
            this.updatePlayButton();
            this.showCenterPlayButton();
        });

        v.addEventListener('error', () => this.handleError());

        this.timers.loadedCheck = setInterval(() => this.updateLoadedProgress(), 500);
    }

    updateCenterButtonIcon(isPlay) {
        this.dom.centerPlayIcon.innerHTML = isPlay ? this.icons.play : this.icons.pause;
    }

    showCenterPlayButton() {
        this.updateCenterButtonIcon(true);
        this.dom.centerPlayBtn.classList.add('show');
    }

    hideCenterPlayButton() {
        this.dom.centerPlayBtn.classList.remove('show');
    }

    updateLoadedProgress() {
        const v = this.dom.video;
        if (!v.buffered || !v.buffered.length || !isFinite(v.duration)) return;
        
        let maxLoaded = 0;
        for (let i = 0; i < v.buffered.length; i++) {
            maxLoaded = Math.max(maxLoaded, v.buffered.end(i));
        }
        
        const percent = (maxLoaded / v.duration) * 100;
        this.dom.progressLoaded.style.width = percent + '%';
    }

    handleError() {
        if (this.state.retryCount < this.state.maxRetries) {
            this.state.retryCount++;
            this.showToast(`加载失败，重试 ${this.state.retryCount}/${this.state.maxRetries}`);
            
            setTimeout(() => {
                const lastTime = this.state.lastCurrentTime || 0;
                if (this.hls) {
                    this.hls.destroy();
                    this.hls = null;
                }
                this.loadVideo();
                
                setTimeout(() => {
                    if (this.dom.video.duration && isFinite(this.dom.video.duration)) {
                        this.dom.video.currentTime = lastTime;
                    }
                }, 300);
            }, 1500);
        } else {
            this.showError('视频加载失败，请检查网络或链接有效性');
        }
    }

    setupMouseBehavior() {
        const player = this.dom.player;
        
        player.addEventListener('mouseenter', () => {
            this.state.isMouseInPlayer = true;
            if (this.isVideoLoaded) {
                this.showControls();
            }
        });

        player.addEventListener('mouseleave', () => {
            this.state.isMouseInPlayer = false;
            this.scheduleHideControls();
        });

        player.addEventListener('mousemove', () => {
            if (this.state.isMouseInPlayer && this.isVideoLoaded) {
                this.showControls();
            }
        });
    }

    showControls() {
        this.dom.controls.classList.remove('hide');
        this.dom.player.classList.add('show-cursor');
        this.scheduleHideControls();
    }

    hideControls() {
        if (!this.state.isDragging && !this.gesture.isMouseDown && this.state.isPlaying) {
            this.dom.controls.classList.add('hide');
            this.dom.player.classList.remove('show-cursor');
            this.hidePanel();
        }
    }

    scheduleHideControls() {
        clearTimeout(this.state.hideControlsTimer);
        this.state.hideControlsTimer = setTimeout(() => {
            if (this.state.isMouseInPlayer && this.state.isPlaying) {
                this.hideControls();
            }
        }, 3000);
    }

    setupEventListeners() {
        this.dom.centerPlayBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.play();
        });

        this.dom.centerPlayBtn.addEventListener('mousedown', (e) => {
            e.stopPropagation();
        });

        this.dom.playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.togglePlay();
        });

        this.dom.progressWrapper.addEventListener('click', (e) => this.handleProgressClick(e));
        
        this.dom.progressInput.addEventListener('input', (e) => {
            this.state.isDragging = true;
            const time = (e.target.value / 100) * this.dom.video.duration;
            this.dom.currentTime.textContent = this.formatTime(time);
            this.dom.progressPlayed.style.width = e.target.value + '%';
            this.dom.progressWrapper.classList.add('dragging');
        });

        this.dom.progressInput.addEventListener('change', (e) => {
            const time = (e.target.value / 100) * this.dom.video.duration;
            this.seek(time);
            this.state.isDragging = false;
            this.dom.progressWrapper.classList.remove('dragging');
            this.scheduleHideControls();
        });

        this.dom.speedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.togglePanel();
        });

        document.querySelectorAll('#speedPanel .panel-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const speed = parseFloat(item.dataset.speed);
                this.setSpeed(speed);
                this.updateActivePanelItem(item);
                this.hidePanel();
            });
        });

        this.dom.fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.toggleFullscreen();
        });

        this.dom.retryBtn.addEventListener('click', () => {
            this.dom.errorPanel.classList.remove('show');
            this.dom.spinner.style.display = 'block';
            this.dom.loadingText.style.display = 'block';
            this.loadVideo();
        });

        this.setupTouchGestures();

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.panel') && !e.target.closest('#speedBtn')) {
                this.hidePanel();
            }
        });

        document.addEventListener('fullscreenchange', () => this.updateFullscreenIcon());
        document.addEventListener('webkitfullscreenchange', () => this.updateFullscreenIcon());
    }

    setupMouseGestures() {
        const player = this.dom.player;
        let lastX = 0, lastY = 0;
        let accumulatedX = 0, accumulatedY = 0;

        player.addEventListener('mousedown', (e) => {
            if (e.target.closest('.controls') || e.target.closest('.panel') || e.target.closest('.center-play-btn')) return;
            
            this.gesture.isMouseDown = true;
            this.gesture.startX = e.clientX;
            this.gesture.startY = e.clientY;
            this.gesture.startTime = Date.now();
            this.gesture.startVolume = this.dom.video.volume;
            this.gesture.startBrightness = this.state.brightness;
            this.gesture.startProgress = this.dom.video.currentTime;
            this.gesture.direction = null;
            this.gesture.isLongPress = false;
            accumulatedX = 0;
            accumulatedY = 0;
            lastX = e.clientX;
            lastY = e.clientY;

            this.gesture.longPressTimer = setTimeout(() => {
                if (this.gesture.isMouseDown) {
                    this.gesture.isLongPress = true;
                    this.state.originalSpeed = this.state.speed;
                    this.setSpeed(2.0);
                    this.dom.speedTip.classList.add('show');
                }
            }, 800);

            if (this.isVideoLoaded) {
                this.showControls();
            }
        });

        player.addEventListener('mousemove', (e) => {
            if (!this.gesture.isMouseDown || this.state.isDragging) return;
            
            const dx = e.clientX - lastX;
            const dy = lastY - e.clientY;
            lastX = e.clientX;
            lastY = e.clientY;
            
            accumulatedX += dx;
            accumulatedY += dy;
            
            const absX = Math.abs(accumulatedX);
            const absY = Math.abs(accumulatedY);

            if (absX > 5 || absY > 5) clearTimeout(this.gesture.longPressTimer);
            if (!this.gesture.direction && (absX > 10 || absY > 10)) {
                this.gesture.direction = absX > absY ? 'horizontal' : 'vertical';
            }

            if (this.gesture.direction === 'horizontal') {
                const duration = this.dom.video.duration;
                if (!duration) return;
                
                const seekRatio = accumulatedX / window.innerWidth;
                const seekTime = Math.max(0, Math.min(duration, this.gesture.startProgress + seekRatio * duration * 0.3));
                const originalTime = this.formatTime(this.gesture.startProgress);
                const targetTime = this.formatTime(seekTime);
                this.showGestureHint('clock', `${originalTime} → ${targetTime}`);
                
                if (Date.now() - this.timers.seekThrottle > 50) {
                    this.seek(seekTime);
                    this.timers.seekThrottle = Date.now();
                }
            } else if (this.gesture.direction === 'vertical') {
                const ratio = accumulatedY / window.innerHeight;
                if (this.gesture.startX < window.innerWidth / 2) {
                    const newBright = Math.max(0, Math.min(0.85, this.gesture.startBrightness - ratio));
                    this.setBrightness(newBright);
                    this.showGestureHint('sun', `亮度 ${Math.round((1-newBright)*100)}%`);
                } else {
                    const newVol = Math.max(0, Math.min(1, this.gesture.startVolume + ratio));
                    this.setVolume(newVol);
                    const icon = newVol === 0 ? 'mute' : 'volume';
                    this.showGestureHint(icon, `音量 ${Math.round(newVol*100)}%`);
                }
            }
        });

        const endMouseGesture = () => {
            if (!this.gesture.isMouseDown) return;
            
            clearTimeout(this.gesture.longPressTimer);
            this.gesture.isMouseDown = false;
            this.dom.speedTip.classList.remove('show');
            
            if (this.gesture.isLongPress) {
                this.setSpeed(this.state.originalSpeed);
            }
            
            this.hideGestureHint();
            this.scheduleHideControls();
        };

        player.addEventListener('mouseup', endMouseGesture);
        player.addEventListener('mouseleave', endMouseGesture);
    }

    setupTouchGestures() {
        const player = this.dom.player;
        
        player.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            this.gesture.startX = t.clientX;
            this.gesture.startY = t.clientY;
            this.gesture.startTime = Date.now();
            this.gesture.startVolume = this.dom.video.volume;
            this.gesture.startBrightness = this.state.brightness;
            this.gesture.startProgress = this.dom.video.currentTime;
            this.gesture.direction = null;
            this.gesture.isLongPress = false;

            this.gesture.longPressTimer = setTimeout(() => {
                this.gesture.isLongPress = true;
                this.state.originalSpeed = this.state.speed;
                this.setSpeed(2.0);
                this.dom.speedTip.classList.add('show');
            }, 800);

            if (this.isVideoLoaded) this.showControls();
        }, { passive: false });

        player.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1 || this.state.isDragging) return;
            e.preventDefault();

            const t = e.touches[0];
            const dx = t.clientX - this.gesture.startX;
            const dy = this.gesture.startY - t.clientY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (absX > 10 || absY > 10) clearTimeout(this.gesture.longPressTimer);
            if (!this.gesture.direction && (absX > 10 || absY > 10)) {
                this.gesture.direction = absX > absY ? 'horizontal' : 'vertical';
            }

            if (this.gesture.direction === 'horizontal') {
                const duration = this.dom.video.duration;
                if (!duration) return;
                const seekRatio = dx / window.innerWidth;
                const seekTime = Math.max(0, Math.min(duration, this.gesture.startProgress + seekRatio * duration * 0.5));
                
                const originalTime = this.formatTime(this.gesture.startProgress);
                const targetTime = this.formatTime(seekTime);
                this.showGestureHint('clock', `${originalTime} → ${targetTime}`);
                
                if (Date.now() - this.timers.seekThrottle > 100) {
                    this.seek(seekTime);
                    this.timers.seekThrottle = Date.now();
                }
            } else if (this.gesture.direction === 'vertical') {
                const ratio = dy / window.innerHeight;
                if (this.gesture.startX < window.innerWidth / 2) {
                    const newBright = Math.max(0, Math.min(0.85, this.gesture.startBrightness - ratio));
                    this.setBrightness(newBright);
                    this.showGestureHint('sun', `亮度 ${Math.round((1-newBright)*100)}%`);
                } else {
                    const newVol = Math.max(0, Math.min(1, this.gesture.startVolume + ratio));
                    this.setVolume(newVol);
                    const icon = newVol === 0 ? 'mute' : 'volume';
                    this.showGestureHint(icon, `音量 ${Math.round(newVol*100)}%`);
                }
            }
        }, { passive: false });

        player.addEventListener('touchend', () => {
            clearTimeout(this.gesture.longPressTimer);
            this.dom.speedTip.classList.remove('show');
            
            if (this.gesture.isLongPress) {
                this.setSpeed(this.state.originalSpeed);
            }
            
            this.hideGestureHint();
            this.scheduleHideControls();
        });
    }

    setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            if (!this.dom.video.src && !this.hls) return;
            switch(e.key) {
                case ' ': case 'k':
                    e.preventDefault();
                    this.togglePlay();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    this.seek(this.dom.video.currentTime - 10);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    this.seek(this.dom.video.currentTime + 10);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    this.setVolume(Math.min(1, this.dom.video.volume + 0.1));
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    this.setVolume(Math.max(0, this.dom.video.volume - 0.1));
                    break;
                case 'f':
                    e.preventDefault();
                    this.toggleFullscreen();
                    break;
                case 'm':
                    e.preventDefault();
                    this.dom.video.muted = !this.dom.video.muted;
                    this.showToast(this.dom.video.muted ? '静音' : '声音开启');
                    break;
            }
        });
    }

    async play() {
        try {
            await this.dom.video.play();
        } catch (err) {
            console.warn('播放失败:', err);
        }
    }

    pause() {
        this.dom.video.pause();
    }

    togglePlay() {
        this.dom.video.paused ? this.play() : this.pause();
    }

    seek(time) {
        const v = this.dom.video;
        if (!isFinite(v.duration)) return;
        time = Math.max(0, Math.min(v.duration, time));
        v.currentTime = time;
        if (v.paused && this.state.isPlaying) this.play();
    }

    handleProgressClick(e) {
        const rect = this.dom.progressWrapper.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const time = ratio * this.dom.video.duration;
        if (isFinite(time)) {
            this.seek(time);
            this.dom.progressInput.value = ratio * 100;
            this.updateProgress();
        }
    }

    updateProgress() {
        const v = this.dom.video;
        if (!isFinite(v.duration) || this.state.isDragging) return;
        const percent = (v.currentTime / v.duration) * 100;
        this.dom.progressInput.value = percent;
        this.dom.progressPlayed.style.width = percent + '%';
        this.dom.currentTime.textContent = this.formatTime(v.currentTime);
    }

    setSpeed(speed) {
        this.state.speed = speed;
        this.dom.video.playbackRate = speed;
        this.dom.speedBtn.textContent = speed.toFixed(1) + 'x';
        this.dom.speedBtn.classList.toggle('active', speed !== 1.0);
    }

    setVolume(vol) {
        this.dom.video.volume = vol;
        this.state.volume = vol;
    }

    setBrightness(val) {
        this.state.brightness = val;
        this.dom.brightnessOverlay.style.opacity = val;
    }

    async toggleFullscreen() {
        const doc = document;
        const el = doc.documentElement;
        
        try {
            if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                else if (this.dom.video.webkitEnterFullscreen) this.dom.video.webkitEnterFullscreen();
            } else {
                if (doc.exitFullscreen) await doc.exitFullscreen();
                else if (doc.webkitExitFullscreen) await doc.webkitExitFullscreen();
            }
        } catch (err) {
            console.warn('全屏切换失败:', err);
        }
    }

    updateFullscreenIcon() {
        const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
        this.dom.fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24">${isFullscreen ? this.icons.fullscreenExit : this.icons.fullscreen}</svg>`;
    }

    togglePanel() {
        this.dom.speedPanel.classList.toggle('show');
    }

    hidePanel() {
        this.dom.speedPanel.classList.remove('show');
    }

    updateActivePanelItem(activeItem) {
        document.querySelectorAll('#speedPanel .panel-item').forEach(item => {
            item.classList.remove('active');
        });
        activeItem.classList.add('active');
    }

    showToast(msg) {
        const toast = this.dom.toast;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(this.timers.toast);
        this.timers.toast = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    showGestureHint(type, text) {
        clearTimeout(this.timers.gestureHint);
        const iconMap = {
            sun: this.icons.sun,
            volume: this.icons.volume,
            mute: this.icons.mute,
            clock: this.icons.clock,
            zap: this.icons.zap
        };
        this.dom.gestureIcon.innerHTML = iconMap[type] || this.icons.clock;
        this.dom.gestureText.textContent = text;
        this.dom.gestureCard.classList.add('show');
    }

    hideGestureHint() {
        this.timers.gestureHint = setTimeout(() => {
            this.dom.gestureCard.classList.remove('show');
        }, 600);
    }

    showLoading(show) {
        if (show) {
            this.dom.loadingOverlay.classList.remove('hide');
            this.dom.spinner.style.display = 'block';
            this.dom.loadingText.style.display = 'block';
            this.dom.errorPanel.classList.remove('show');
        } else {
            this.dom.loadingOverlay.classList.add('hide');
        }
    }

    showError(msg) {
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.display = 'none';
        this.dom.errorPanel.classList.add('show');
        this.dom.errorText.textContent = msg;
    }

    updatePlayButton() {
        const isPlaying = !this.dom.video.paused;
        this.dom.playIcon.innerHTML = isPlaying ? this.icons.pause : this.icons.play;
    }

    formatTime(seconds) {
        if (!isFinite(seconds)) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    destroy() {
        if (this.hls) {
            this.hls.destroy();
            this.hls = null;
        }
        clearTimeout(this.state.hideControlsTimer);
        clearTimeout(this.timers.gestureHint);
        clearTimeout(this.timers.toast);
        clearInterval(this.timers.loadedCheck);
        clearTimeout(this.gesture.longPressTimer);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    window.player = new SmartPlayer();
    
    window.addEventListener('beforeunload', () => {
        if (window.player) window.player.destroy();
    });
});
</script>
