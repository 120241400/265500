<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技浏览器-青蓝</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: transparent; color: #e0e0e0; }
        .container { display: flex; height: 100vh; background: transparent; }
        .sidebar { 
            width: 140px; background: rgba(10,10,14,0.97); border-right: 1px solid #1b1b28;
            transition: transform 0.3s ease; z-index: 1000; height: 100vh; display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 10px 12px; border-bottom: 1px solid #1b1b28; background: rgba(15,15,22,0.97); }
        .btn-list { padding: 10px; flex: 1; overflow-y: auto; overflow-x: hidden; }
        .btn-list::-webkit-scrollbar { width: 3px; }
        .btn-list::-webkit-scrollbar-track { background: #11111a; }
        .btn-list::-webkit-scrollbar-thumb { background: #00ccff; border-radius: 3px; }
        .nav-btn {
            display: block; width: 100%; padding: 9px 10px; margin: 6px 0;
            background: rgba(18,18,26,0.97); border: 1px solid #29293d; border-radius: 6px;
            text-align: left; cursor: pointer; transition: all 0.25s; font-size: 12px; color: #c0c8d8;
        }
        .nav-btn:hover { background: rgba(24,24,36,0.97); border-color: #00ccff; color: #fff; box-shadow: 0 0 6px rgba(0,204,255,0.4); }
        .nav-btn.active { background: #00ccff; color: #000; border-color: #00ccff; box-shadow: 0 0 10px rgba(0,204,255,0.7); }
        .main-content { flex: 1; position: relative; background: transparent; }
        .content-header {
            height: 40px; padding: 0 15px; background: rgba(15,15,22,0.97);
            border-bottom: 1px solid #1b1b28; display: flex; align-items: center; justify-content: center;
        }
        .iframe-container { height: calc(100% - 40px); background: transparent; }
        iframe { width: 100%; height: 100%; border: none; }
        .toggle-btn {
            position: fixed; top: 6px; left: 8px; z-index: 2000; padding: 6px 10px;
            background: #00ccff; color: #000; border: none; border-radius: 6px; cursor: pointer; display: none; font-size: 12px;
        }
        .search-modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.92); z-index:3000; align-items: center; justify-content: center; padding:20px;
        }
        .search-modal.show { display: flex; }
        .search-box { width:100%; max-width:400px; display:flex; gap:8px; }
        .search-input {
            flex:1; padding:10px 15px; background: #151520; border:1px solid #2d2d44; border-radius:6px;
            color:#e0e8f8; font-size:14px; outline:none;
        }
        .search-input:focus { border-color: #00ccff; box-shadow: 0 0 0 2px rgba(0,204,255,0.25); }
        .search-btn { padding:0 20px; background: #00ccff; border:none; border-radius:6px; color:#000; cursor:pointer; }
        .search-btn:hover { background: #00b3e6; }
        @media (max-width:768px) {
            .sidebar { position:fixed; top:0; left:0; height:100vh; transform:translateX(-100%); width:140px; }
            .sidebar.show { transform:translateX(0); }
            .toggle-btn { display:block; }
            .sidebar-header h3 { visibility:hidden; position:relative; }
            .sidebar-header h3::after { content:" "; visibility:visible; position:absolute; left:0; top:0; }
            .search-box { max-width:100%; }
        }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; }
        .overlay.show { display:block; }
    </style>
</head>
<body>
    <button class="toggle-btn" id="toggleBtn">☰☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="search-modal" id="searchModal">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="请输入搜索内容...">
            <button class="search-btn" id="searchSubmit">搜索</button>
        </div>
    </div>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3 style="font-size: 14px;">导航</h3></div>
            <div class="btn-list" id="btnList"></div>
        </div>
        <div class="main-content">
            <div class="content-header"><h3 id="pageTitle" style="font-size: 14px;">选择网站</h3></div>
            <div class="iframe-container"><iframe id="contentFrame" allowfullscreen></iframe></div>
        </div>
    </div>
    <script>
        const websites = [
            { name: "原版", url: "https://www.265500.vip/bfq/wqplayer.html?url={keyword}" },
            { name: "一版", url: "https://www.265500.vip/bfq/wqplayer备用.html?url={keyword}" },
            { name: "二版", url: "https://www.265500.vip/bfq/wqplayer好.html?url={keyword}" },
            { name: "三版", url: "https://sun123p.neocities.org/999/ziyuanzhan/3?url={keyword}" },
            { name: "四版", url: "https://sun123p.neocities.org/999/ziyuanzhan/4?url={keyword}" },
            { name: "五版", url: "https://sun123p.neocities.org/999/ziyuanzhan/5?url={keyword}" },
            { name: "一版", url: "https://sun123p.neocities.org/999/ziyuanzhan/1?url={keyword}" },
            { name: "二版", url: "https://sun123p.neocities.org/999/ziyuanzhan/2?url={keyword}" },
            { name: "三版", url: "https://sun123p.neocities.org/999/ziyuanzhan/3?url={keyword}" },
            { name: "四版", url: "https://sun123p.neocities.org/999/ziyuanzhan/4?url={keyword}" },
            { name: "五版", url: "https://sun123p.neocities.org/999/ziyuanzhan/5?url={keyword}" },
            { name: "一版", url: "https://sun123p.neocities.org/999/ziyuanzhan/1?url={keyword}" },
            { name: "二版", url: "https://sun123p.neocities.org/999/ziyuanzhan/2?url={keyword}" },
            { name: "三版", url: "https://sun123p.neocities.org/999/ziyuanzhan/3?url={keyword}" },
            { name: "四版", url: "https://sun123p.neocities.org/999/ziyuanzhan/4?url={keyword}" },
            { name: "五版", url: "https://sun123p.neocities.org/999/ziyuanzhan/5?url={keyword}" },
            { name: "一版", url: "https://sun123p.neocities.org/999/ziyuanzhan/1?url={keyword}" },
            { name: "二版", url: "https://sun123p.neocities.org/999/ziyuanzhan/2?url={keyword}" },
            { name: "三版", url: "https://sun123p.neocities.org/999/ziyuanzhan/3?url={keyword}" },
            { name: "四版", url: "https://sun123p.neocities.org/999/ziyuanzhan/4?url={keyword}" },
            { name: "五版", url: "https://sun123p.neocities.org/999/ziyuanzhan/5?url={keyword}" },
            { name: "一版", url: "https://sun123p.neocities.org/999/ziyuanzhan/1?url={keyword}" },
            { name: "二版", url: "https://sun123p.neocities.org/999/ziyuanzhan/2?url={keyword}" },
            { name: "三版", url: "https://sun123p.neocities.org/999/ziyuanzhan/3?url={keyword}" },
            { name: "四版", url: "https://sun123p.neocities.org/999/ziyuanzhan/4?url={keyword}" },
            { name: "五版", url: "https://sun123p.neocities.org/999/ziyuanzhan/5?url={keyword}" },
            { name: "十线", url: "https://file.uhsea.com/2602/2638f348c2de4dabb18d96e18c2837a1AZ.html?url={keyword}" },
            { name: "量子", url: "https://file.uhsea.com/2602/c8b5f909bdb90d6b5ecc85538ee25319CW.html?url={keyword}" },
            { name: "乐播", url: "https://file.uhsea.com/2602/1b7068880680eff544ca9f72707b42e7M6.html?url={keyword}" }
        ];
        const btnList = document.getElementById('btnList'), contentFrame = document.getElementById('contentFrame'), pageTitle = document.getElementById('pageTitle');
        const toggleBtn = document.getElementById('toggleBtn'), overlay = document.getElementById('overlay'), sidebar = document.getElementById('sidebar');
        const searchModal = document.getElementById('searchModal'), searchInput = document.getElementById('searchInput'), searchSubmit = document.getElementById('searchSubmit');
        const baseUrl = window.location.origin + window.location.pathname;
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        function getSearchKeyword() { 
            const fullKeyword = getUrlParameter('url').trim();
            const pureKeyword = fullKeyword.split(' ')[0];
            return pureKeyword;
        }
        function generateSearchUrl(site, keyword) { 
            return keyword ? site.url.replace('{keyword}', encodeURIComponent(keyword)) : site.url.replace('{keyword}', ''); 
        }
        function loadWebsite(site, keyword) {
            contentFrame.src = generateSearchUrl(site, keyword);
            pageTitle.textContent = site.name;
        }
        function openSearchModal() { searchModal.classList.add('show'); searchInput.focus(); }
        function submitSearch() {
            const fullKeyword = searchInput.value.trim();
            const pureKeyword = fullKeyword.split(' ')[0];
            if (!pureKeyword) { searchInput.focus(); return; }
            window.location.href = `${baseUrl}?url=${encodeURIComponent(pureKeyword)}`;
            searchModal.classList.remove('show'); searchInput.value = '';
        }
        function initializeLoad() {
            const keyword = getSearchKeyword();
            if (keyword) { loadWebsite(websites[0], keyword); return { site: websites[0], keyword: keyword }; }
            else { if (websites.length > 0) { loadWebsite(websites[0], ''); return { site: websites[0], keyword: '' }; } }
            return null;
        }
        function generateAllButtons() {
            const searchBtn = document.createElement('button'); searchBtn.className = 'nav-btn'; searchBtn.textContent = '搜索'; searchBtn.onclick = openSearchModal; btnList.appendChild(searchBtn);
            websites.forEach((site) => {
                const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.textContent = site.name;
                btn.onclick = () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
                    loadWebsite(site, getSearchKeyword());
                    if (window.innerWidth <= 768) { sidebar.classList.remove('show'); overlay.classList.remove('show'); }
                };
                btnList.appendChild(btn);
            });
        }
        const loadedData = initializeLoad(); generateAllButtons();
        setTimeout(() => {
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach((btn, index) => {
                if (index > 0 && index < navBtns.length) {
                    if (loadedData && websites[index-1].name === loadedData.site.name) btn.classList.add('active');
                    else if (!loadedData && index === 1) btn.classList.add('active');
                }
            });
        }, 100);
        toggleBtn.onclick = () => { sidebar.classList.add('show'); overlay.classList.add('show'); };
        overlay.onclick = () => { sidebar.classList.remove('show'); overlay.classList.remove('show'); };
        searchModal.onclick = (e) => { if (e.target === searchModal) { searchModal.classList.remove('show'); searchInput.value = ''; } };
        searchSubmit.onclick = submitSearch;
        searchInput.onkeydown = (e) => { if (e.key === 'Enter') submitSearch(); };
        let currentUrl = window.location.href;
        setInterval(() => {
            if (window.location.href !== currentUrl) {
                currentUrl = window.location.href;
                const keyword = getSearchKeyword();
                const activeBtn = document.querySelector('.nav-btn.active');
                if (activeBtn) {
                    const site = websites.find(s => s.name === activeBtn.textContent);
                    if (site) loadWebsite(site, keyword);
                } else if (websites.length > 0) loadWebsite(websites[0], keyword);
            }
        }, 500);
    </script>
</body>
</html>
