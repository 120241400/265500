<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>忘情播放器</title>
    <!-- 保留核心样式文件 -->
    <link rel="stylesheet" type="text/css" href="/bfq/1.css">
</head>
<body onload="init()">
    <!-- 播放器容器 -->
    <div id="a1"></div>

    <!-- 引入播放器核心JS -->
    <script src="/bfq/2.js"></script>
    <script src="/bfq/3.js"></script>

    <script type="text/javascript">
        // 核心配置变量（仅保留使用到的）
        Artplayer.DEGUG = false;
        const videoid = "98f13708210194c475687be6106a3b84";
        
        // 全局HLS实例缓存
        let hlsInstance = null;
        // 移除重试配置（不再自动重试）
        
        // Cookie操作工具函数（播放进度缓存）
        function setCookie(name, value) {
            const Days = 30;
            const exp = new Date();
            exp.setTime(exp.getTime() + Days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${escape(value)};expires=${exp.toGMTString()}`;
        }

        function getCookie(name) {
            const arr = document.cookie.match(new RegExp(`(^| )${name}=([^;]*)(;|$)`));
            return arr ? unescape(arr[2]) : null;
        }

        // 播放进度保存
        function timeHandler(t) {
            if (t > -1) setCookie(`${videoid}_time`, t);
        }

        // 移除reloadM3u8函数（不再自动重试播放）

        // 初始化HLS播放器（优化版，移除自动重试和多余提示）
        function initHlsPlayer(video, url, art) {
            if (Hls.isSupported()) {
                // HLS高级配置：保留性能优化，移除重试相关配置
                hlsInstance = new Hls({
                    // 加载速度优化
                    maxBufferLength: 120,          
                    maxMaxBufferLength: 120,       
                    startLevel: -1,               
                    maxBufferSize: 200 * 1024 * 1024,
                    
                    // 稳定性优化
                    enableWorker: true,           
                    lowLatencyMode: false,        
                    backBufferLength: 90,         
                    enableCodecsFetch: true,      
                    
                    // 移除错误恢复相关的重试配置
                    abrEwmaDefaultEstimate: 500000,
                    abrEwmaFastLive: 3.0,         
                    abrEwmaSlowLive: 9.0,
                    maxFragLookUpTolerance: 0.25, 
                    
                    // 缓存优化
                    enableManifestCache: true,    
                    manifestLoadingTimeOut: 10000,
                    fragLoadingTimeOut: 15000,    
                    
                    // 移除加载重试配置
                    maxLoadingRetry: 0,           
                    startLevelLoadRetry: 0,       
                });

                // 监听HLS错误事件：只显示指定提示，移除自动重试
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS错误:', data);
                    
                    // 只在致命错误时显示指定提示
                    if (data.fatal) {
                        art.notice.show = '加载缓慢，请刷新或者更换线路';
                    }
                    // 移除非致命错误的提示
                });

                // 移除MANIFEST_PARSED事件的提示
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    retryConfig.currentRetry = 0; // 重置重试计数（仅保留，无实际作用）
                });

                hlsInstance.on(Hls.Events.FRAG_LOADED, () => {
                    // 分片加载完成，无提示
                });

                // 加载并绑定视频
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                // 视频可播放时自动播放
                video.addEventListener('canplay', () => {
                    if (art.options.autoplay) {
                        art.play();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // 原生支持（如iOS）
                video.src = url;
                // 移除原生错误提示
                video.addEventListener('error', (e) => {
                    // 只显示指定提示，移除错误码展示
                    art.notice.show = '加载缓慢，请刷新或者更换线路';
                });
            } else {
                // 格式不支持时也显示指定提示
                art.notice.show = '加载缓慢，请刷新或者更换线路';
            }
        }

        // 初始化播放器
        function init() {
            // 解析URL参数中的播放地址
            let playUrl = "";
            if (location.search) {
                const myurl = new URLSearchParams(location.search.substring(1)).get('url');
                if (myurl) playUrl = myurl;
            }

            // 获取缓存的播放进度
            let cookieTime = getCookie(`${videoid}_time`);
            cookieTime = cookieTime ? Number(cookieTime) : 0;

            // 初始化Artplayer播放器
            const art = new Artplayer({
                container: '#a1',
                url: playUrl,
                autoplay: true,
                autoSize: false,
                loop: false,
                mutex: true,
                pip: true,
                setting: true,
                flip: false,
                lock: true,
                fastForward: true,
                playbackRate: true,
                aspectRatio: true,
                theme: '#ff0057',
                fullscreen: true,
                fullscreenWeb: true,
                miniProgressBar: true,
                autoOrientation: true,
                airplay: false,
                whitelist: ['*'],
                preload: 'auto',
                // 自定义m3u8格式支持
                customType: {
                    m3u8: function (video, url) {
                        initHlsPlayer(video, url, art);
                    }
                }
            });

            // 监听播放时间变化，保存进度
            art.on('timeupdate', (info) => {
                timeHandler(info.currentTime);
            });

            // 如果有缓存进度，跳转到对应位置
            if (cookieTime > 0) {
                art.on('ready', () => {
                    art.seek(cookieTime);
                });
            }

            // 监听播放器错误：只显示指定提示
            art.on('error', (err) => {
                console.error('播放器错误:', err);
                art.notice.show = '加载缓慢，请刷新或者更换线路';
            });
        }

        // 屏蔽全局错误（保留原有需求）
        window.onerror = function () {
            return true;
        };
    </script>
</body>


</html>
