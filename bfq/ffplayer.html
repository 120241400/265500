<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>忘情播放器</title>
    <!-- 保留核心样式文件 -->
    <link rel="stylesheet" type="text/css" href="https://265500.netlify.app/bfq/1.css">
</head>
<body onload="init()">
    <!-- 播放器容器 -->
    <div id="a1"></div>

    <!-- 引入播放器核心JS -->
    <script src="https://265500.netlify.app/bfq/2.js"></script>
    <script src="https://265500.netlify.app/bfq/3.js"></script>

    <script type="text/javascript">
        // 核心配置变量（仅保留使用到的）
        Artplayer.DEGUG = false;
        const videoid = "98f13708210194c475687be6106a3b84";
        
        // 全局HLS实例缓存，用于错误重试
        let hlsInstance = null;
        // 重试配置
        const retryConfig = {
            maxRetry: 3,        // 最大重试次数
            retryDelay: 2000,   // 重试延迟(ms)
            currentRetry: 0     // 当前重试次数
        };
        
        // Cookie操作工具函数（播放进度缓存）
        function setCookie(name, value) {
            const Days = 30;
            const exp = new Date();
            exp.setTime(exp.getTime() + Days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${escape(value)};expires=${exp.toGMTString()}`;
        }

        function getCookie(name) {
            const arr = document.cookie.match(new RegExp(`(^| )${name}=([^;]*)(;|$)`));
            return arr ? unescape(arr[2]) : null;
        }

        // 播放进度保存
        function timeHandler(t) {
            if (t > -1) setCookie(`${videoid}_time`, t);
        }

        // m3u8重新加载函数（用于错误重试）
        function reloadM3u8(video, url, art) {
            if (retryConfig.currentRetry >= retryConfig.maxRetry) {
                art.notice.show = `加载失败：已重试${retryConfig.maxRetry}次仍无法连接`;
                retryConfig.currentRetry = 0;
                return;
            }
            
            retryConfig.currentRetry++;
            art.notice.show = `加载中断，正在重试(${retryConfig.currentRetry}/${retryConfig.maxRetry})...`;
            
            // 清理旧实例
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            
            // 延迟重试
            setTimeout(() => {
                initHlsPlayer(video, url, art);
            }, retryConfig.retryDelay * retryConfig.currentRetry); // 指数退避策略
        }

        // 初始化HLS播放器（优化版）
        function initHlsPlayer(video, url, art) {
            if (Hls.isSupported()) {
                // HLS高级配置：提升加载速度+稳定性
                hlsInstance = new Hls({
                    // 加载速度优化
                    maxBufferLength: 120,          // 最大缓冲区长度(秒)，预加载更多
                    maxMaxBufferLength: 120,       // 最大缓冲区上限
                    startLevel: -1,               // 自动选择最佳起始码率
                    maxBufferSize: 200 * 1024 * 1024, // 缓冲区大小限制(200MB)
                    
                    // 稳定性优化
                    enableWorker: true,           // 启用WebWorker解析m3u8，不阻塞主线程
                    lowLatencyMode: false,        // 非超低延迟场景关闭，提升兼容性
                    backBufferLength: 90,         // 后退缓冲区长度，防止拖动卡顿
                    enableCodecsFetch: true,      // 提前获取解码器信息
                    
                    // 错误恢复
                    abrEwmaDefaultEstimate: 500000, // 初始带宽估计(500kbps)
                    abrEwmaFastLive: 3.0,         // 快速适应带宽变化
                    abrEwmaSlowLive: 9.0,
                    maxFragLookUpTolerance: 0.25, // 分片查找容错
                    
                    // 缓存优化
                    enableManifestCache: true,    // 缓存m3u8清单
                    manifestLoadingTimeOut: 10000, // 清单加载超时(10秒)
                    fragLoadingTimeOut: 15000,    // 分片加载超时(15秒)
                    
                    // 重试配置
                    maxLoadingRetry: 2,           // 分片加载最大重试次数
                    startLevelLoadRetry: 3,       // 起始码率加载重试次数
                });

                // 监听HLS错误事件
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS错误:', data);
                    
                    // 网络错误/加载错误：重试
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                reloadM3u8(video, url, art);
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                reloadM3u8(video, url, art);
                                break;
                        }
                    } else {
                        // 非致命错误，仅提示
                        art.notice.show = `加载警告：${data.details}`;
                    }
                });

                // 监听加载状态，提升用户体验
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    art.notice.show = '视频清单解析完成，开始加载...';
                    retryConfig.currentRetry = 0; // 重置重试计数
                });

                hlsInstance.on(Hls.Events.FRAG_LOADED, () => {
                    // 分片加载完成，可用于统计/优化
                });

                // 加载并绑定视频
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                // 视频可播放时自动播放
                video.addEventListener('canplay', () => {
                    if (art.options.autoplay) {
                        art.play();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // 原生支持（如iOS）
                video.src = url;
                // 监听原生错误
                video.addEventListener('error', (e) => {
                    art.notice.show = `原生播放错误：${e.target.error.code}`;
                });
            } else {
                art.notice.show = '不支持播放格式：m3u8';
            }
        }

        // 初始化播放器
        function init() {
            // 解析URL参数中的播放地址
            let playUrl = "";
            if (location.search) {
                const myurl = new URLSearchParams(location.search.substring(1)).get('url');
                if (myurl) playUrl = myurl;
            }

            // 获取缓存的播放进度
            let cookieTime = getCookie(`${videoid}_time`);
            cookieTime = cookieTime ? Number(cookieTime) : 0;

            // 初始化Artplayer播放器
            const art = new Artplayer({
                container: '#a1',
                url: playUrl,
                autoplay: true,
                autoSize: false,
                loop: false,
                mutex: true,
                pip: true,
                setting: true,
                flip: false,
                lock: true,
                fastForward: true,
                playbackRate: true,
                aspectRatio: true,
                theme: '#ff0057',
                fullscreen: true,
                fullscreenWeb: true,
                miniProgressBar: true,
                autoOrientation: true,
                airplay: false,
                whitelist: ['*'],
                // 预加载配置：提升首次加载速度
                preload: 'auto',
                // 自定义m3u8格式支持（优化版）
                customType: {
                    m3u8: function (video, url) {
                        initHlsPlayer(video, url, art);
                    }
                }
            });

            // 监听播放时间变化，保存进度
            art.on('timeupdate', (info) => {
                timeHandler(info.currentTime);
            });

            // 如果有缓存进度，跳转到对应位置
            if (cookieTime > 0) {
                // 等待播放器就绪后再跳转，防止失效
                art.on('ready', () => {
                    art.seek(cookieTime);
                });
            }

            // 监听播放器错误
            art.on('error', (err) => {
                console.error('播放器错误:', err);
                if (playUrl.includes('.m3u8') && hlsInstance) {
                    reloadM3u8(art.video, playUrl, art);
                }
            });
        }

        // 屏蔽全局错误（保留原有需求）
        window.onerror = function () {
            return true;
        };
    </script>
</body>
</html>
