<!doctype html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <title>忘情播放器</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
        }

        #container {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .resolution-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .resolution-display.show {
            opacity: 1;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        .gesture-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .gesture-hint.show {
            opacity: 1;
        }
    </style>
    <script>
        function extractVideoUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawUrl = urlParams.get('url');
            if (!rawUrl) return null;
            const httpIndex = rawUrl.toLowerCase().indexOf('http');
            if (httpIndex >= 0) {
                return rawUrl.substring(httpIndex);
            }
            return rawUrl;
        }

        function isVideoUrl(url) {
            if (!url) return false;
            const videoExtensions = ['.m3u8', '.mp4', '.avi', '.flv'];
            const lowerUrl = url.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }
    </script>
</head>

<body>
    <div id="container"></div>
    <div id="resolutionDisplay" class="resolution-display"></div>
    <div id="gestureHint" class="gesture-hint"></div>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            const videoUrl = extractVideoUrl();

            if (!videoUrl) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 24px;
                `;
                container.textContent = '使用方式 ?url=视频地址';
                return;
            }

            if (!isVideoUrl(videoUrl)) {
                const container = document.getElementById('container');
                const iframe = document.createElement('iframe');
                iframe.className = 'iframe-container';
                iframe.allowFullscreen = true;
                iframe.src = videoUrl;
                container.appendChild(iframe);
                return;
            }

            const hlsJsSources = [
                'https://gcore.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js',
                'https://cdn.jsdmirror.cn/npm/hls.js@latest/dist/hls.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js'
            ];
            const artplayerJsSources = [
                'https://gcore.jsdelivr.net/npm/artplayer@latest/dist/artplayer.js',
                'https://cdn.jsdmirror.cn/npm/artplayer@latest/dist/artplayer.js',
                'https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.0.9/artplayer.js'
            ];

            function loadScript(srcArray) {
                return new Promise((resolve, reject) => {
                    let currentIndex = 0;

                    function tryLoad() {
                        if (currentIndex >= srcArray.length) {
                            reject(new Error(`All sources failed: ${srcArray.join(', ')}`));
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = srcArray[currentIndex];
                        script.onload = () => resolve(script);
                        script.onerror = () => {
                            console.warn(`Failed to load script from: ${srcArray[currentIndex]}, trying next...`);
                            currentIndex++;
                            tryLoad();
                        };
                        document.head.appendChild(script);
                    }
                    tryLoad();
                });
            }

            Promise.all([
                loadScript(hlsJsSources),
                loadScript(artplayerJsSources)
            ]).then(() => {
                console.log('All external scripts loaded successfully.');
                initializePlayer(videoUrl);
            }).catch((error) => {
                console.error('Failed to load required scripts:', error);
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '播放器脚本加载失败，请刷新页面重试';
            });

            function initializePlayer(url) {
                const resolutionDisplay = document.getElementById('resolutionDisplay');
                const gestureHint = document.getElementById('gestureHint');
                let hlsInstance = null;
                let currentBrightness = 100;
                let hintTimeout = null;
                let resolutionTimer = null;
                let lastResolutionKey = '';

                function showResolution(width, height, force = false) {
                    if (!width || !height) return;
                    const key = `${width}x${height}`;
                    if (!force && key === lastResolutionKey) return;
                    lastResolutionKey = key;

                    resolutionDisplay.textContent = `${width}×${height}`;
                    resolutionDisplay.classList.add('show');

                    if (resolutionTimer) {
                        clearTimeout(resolutionTimer);
                        resolutionTimer = null;
                    }
                    resolutionTimer = setTimeout(() => {
                        resolutionDisplay.classList.remove('show');
                        resolutionTimer = null;
                    }, 3000);
                }

                function showGestureHint(text) {
                    gestureHint.textContent = text;
                    gestureHint.classList.add('show');
                    clearTimeout(hintTimeout);
                    hintTimeout = setTimeout(() => {
                        gestureHint.classList.remove('show');
                    }, 1000);
                }

                function getVideoResolution(videoElement) {
                    if (videoElement && videoElement.videoWidth && videoElement.videoHeight) {
                        return { width: videoElement.videoWidth, height: videoElement.videoHeight };
                    }
                    return null;
                }

                window.player = new Artplayer({
                    container: '#container',
                    url: url,
                    autoplay: true,
                    autoSize: false,
                    loop: false,
                    mutex: true,
                    setting: true,
                    pip: true,
                    flip: false,
                    lock: true,
                    fastForward: true,
                    playbackRate: true,
                    aspectRatio: true,
                    theme: '#ff0057',
                    fullscreen: true,
                    fullscreenWeb: false,
                    miniProgressBar: true,
                    autoOrientation: true,
                    airplay: false,
                    whitelist: ['*'],
                    notice: false,
                    customType: {
                        m3u8: function (video, m3u8Url) {
                            if (hlsInstance) {
                                try { hlsInstance.destroy(); } catch (e) { console.warn('销毁旧HLS实例:', e); }
                                hlsInstance = null;
                            }

                            if (Hls.isSupported()) {
                                const hls = new Hls({
                                    startLevel: -1,
                                    autoStartLoad: true,
                                    maxBufferLength: 60,
                                    maxMaxBufferLength: 240,
                                    capLevelToPlayerSize: false,
                                    startLevel: Infinity
                                });
                                hlsInstance = hls;

                                hls.loadSource(m3u8Url);
                                hls.attachMedia(video);

                                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                                    console.log('HLS清单解析完成, 可用级别:', data.levels.length);
                                    const maxLevel = data.levels.length - 1;
                                    hls.currentLevel = maxLevel;

                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height, true);
                                    }, 1500);
                                });

                                hls.on(Hls.Events.LEVEL_SWITCHED, function () {
                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height);
                                    }, 2000);
                                });

                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    console.error('HLS错误:', data);
                                    if (data.fatal) {
                                        console.log('发生致命错误，停止播放');
                                        hls.destroy();
                                        hlsInstance = null;
                                        video.style.opacity = '0.5';
                                    }
                                });

                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = m3u8Url;
                                video.addEventListener('loadedmetadata', function () {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) showResolution(resolution.width, resolution.height, true);
                                });
                            } else {
                                console.error('Unsupported playback format: m3u8');
                            }
                        },
                    }
                });

                function initTouchGestures() {
                    const container = document.getElementById('container');
                    const video = window.player.video;

                    let touchStartX = 0;
                    let touchStartY = 0;
                    let lastY = 0;
                    let isLeftSide = false;
                    let isDragging = false;
                    let moved = false;

                    // 触摸是否落在控制栏/设置面板等 Artplayer 自己的 UI 上
                    function isOnControls(target) {
                        if (!target || typeof target.closest !== 'function') return false;
                        return !!(target.closest('.art-bottom') ||
                                  target.closest('.art-controls') ||
                                  target.closest('.art-settings') ||
                                  target.closest('.art-contextmenus') ||
                                  target.closest('.art-info') ||
                                  target.closest('.art-layer'));
                    }

                    container.addEventListener('touchstart', (e) => {
                        if (e.touches.length !== 1) return;
                        if (isOnControls(e.target)) {
                            isDragging = false;
                            return;
                        }
                        const touch = e.touches[0];
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                        lastY = touch.clientY;
                        isLeftSide = touch.clientX < container.offsetWidth / 2;
                        isDragging = true;
                        moved = false;
                    }, { passive: true });

                    container.addEventListener('touchmove', (e) => {
                        if (!isDragging || e.touches.length !== 1) return;
                        const touch = e.touches[0];
                        const dx = Math.abs(touch.clientX - touchStartX);
                        const dy = Math.abs(touch.clientY - touchStartY);

                        // 只有明显的垂直滑动才认定为亮度/音量手势
                        if (dy > 10 && dy > dx) {
                            e.preventDefault();
                            e.stopPropagation();
                            moved = true;

                            const deltaY = lastY - touch.clientY;
                            lastY = touch.clientY;

                            if (isLeftSide) {
                                currentBrightness += deltaY * 0.8;
                                currentBrightness = Math.max(20, Math.min(100, currentBrightness));
                                video.style.filter = `brightness(${currentBrightness}%)`;
                                showGestureHint(`亮度: ${Math.round(currentBrightness)}%`);
                            } else {
                                let volume = video.volume * 100;
                                volume += deltaY * 0.8;
                                volume = Math.max(0, Math.min(100, volume));
                                video.volume = volume / 100;
                                showGestureHint(`音量: ${Math.round(volume)}%`);
                            }
                        }
                    }, { passive: false });

                    container.addEventListener('touchend', (e) => {
                        if (moved) {
                            // 手势滑动结束时阻止事件继续传播给 Artplayer，
                            // 避免它把这次滑动当成"点击"而重新显示控制栏
                            e.stopPropagation();

                            // 如果正在播放，主动隐藏控制栏，避免控制栏被手势"唤醒"后一直挂着
                            if (window.player && window.player.playing && window.player.controls) {
                                try { window.player.controls.hide(); } catch (err) { /* ignore */ }
                            }
                        }
                        isDragging = false;
                        moved = false;
                    });

                    container.addEventListener('touchcancel', () => {
                        isDragging = false;
                        moved = false;
                    });
                }

                window.player.notice = { show: () => {}, hide: () => {} };

                window.player.on('video:loadedmetadata', function () {
                    const videoElement = window.player.video;
                    if (videoElement) {
                        const resolution = getVideoResolution(videoElement);
                        if (resolution) {
                            setTimeout(() => {
                                showResolution(resolution.width, resolution.height, true);
                            }, 1000);
                        }
                    }
                });

                window.player.on('ready', () => {
                    initTouchGestures();
                    window.player.video.style.filter = `brightness(${currentBrightness}%)`;
                });

                window.player.on('destroy', () => {
                    if (resolutionTimer) {
                        clearTimeout(resolutionTimer);
                        resolutionTimer = null;
                    }
                    if (hintTimeout) {
                        clearTimeout(hintTimeout);
                        hintTimeout = null;
                    }
                    if (hlsInstance) {
                        try { hlsInstance.destroy(); } catch (e) { console.warn('销毁HLS实例:', e); }
                        hlsInstance = null;
                    }
                });

                window.player.on('error', (e) => { console.error('播放器错误:', e); e.preventDefault(); return false; });
                window.player.on('networkError', (e) => { console.error('网络错误:', e); e.preventDefault(); return false; });
                window.player.on('decodeError', (e) => { console.error('解码错误:', e); e.preventDefault(); return false; });
            }
        });
    </script>
</body>

</html>
