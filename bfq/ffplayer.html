<!doctype html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <title>忘情ffplayer播放器</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #container {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* ========== Artplayer 容器内样式 - 确保全屏时可见 ========== */
        .artplayer-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ========== 顶部提示栏 - 必须在 artplayer 容器内 ========== */
        .wq-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .wq-top-bar.hidden {
            opacity: 0;
            transform: translateY(-100%);
        }

        .wq-top-bar .wq-ad-hint {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .wq-top-bar .wq-time {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ========== 手势提示 - 必须在 artplayer 容器内 ========== */
        .wq-gesture-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            font-weight: 500;
        }

        .wq-gesture-hint.show {
            opacity: 1;
        }

        /* ========== 分辨率显示 - 必须在 artplayer 容器内 ========== */
        .wq-resolution {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        .wq-resolution.show {
            opacity: 1;
        }

        /* 进度条自动隐藏样式 */
        .artplayer-controls {
            transition: opacity 0.3s ease, transform 0.3s ease !important;
        }
        .artplayer-controls.artplayer-controls-hide {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(100%) !important;
        }
    </style>
    <script>
        function extractVideoUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawUrl = urlParams.get('url');
            if (!rawUrl) return null;
            const httpIndex = rawUrl.toLowerCase().indexOf('http');
            if (httpIndex >= 0) {
                return rawUrl.substring(httpIndex);
            }
            return rawUrl;
        }

        function isVideoUrl(url) {
            if (!url) return false;
            const videoExtensions = ['.m3u8', '.mp4', '.avi', '.flv'];
            const lowerUrl = url.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }
    </script>
<base target="_blank">
</head>

<body>
    <div id="container"></div>
    
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            const videoUrl = extractVideoUrl();

            if (!videoUrl) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 24px;
                `;
                container.textContent = '使用方式 ?url=视频地址';
                return;
            }

            if (!isVideoUrl(videoUrl)) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '仅支持视频格式（m3u8/mp4/avi/flv）';
                return;
            }

            const hlsJsSources = [
                'https://gcore.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js',
                'https://cdn.jsdmirror.cn/npm/hls.js@latest/dist/hls.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js'
            ];
            const artplayerJsSources = [
                'https://gcore.jsdelivr.net/npm/artplayer@latest/dist/artplayer.js',
                'https://cdn.jsdmirror.cn/npm/artplayer@latest/dist/artplayer.js',
                'https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.0.9/artplayer.js'
            ];

            function loadScript(srcArray) {
                return new Promise((resolve, reject) => {
                    let currentIndex = 0;
                    function tryLoad() {
                        if (currentIndex >= srcArray.length) {
                            reject(new Error(`All sources failed: ${srcArray.join(', ')}`));
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = srcArray[currentIndex];
                        script.onload = () => resolve(script);
                        script.onerror = () => {
                            console.warn(`Failed to load script from: ${srcArray[currentIndex]}, trying next...`);
                            currentIndex++;
                            tryLoad();
                        };
                        document.head.appendChild(script);
                    }
                    tryLoad();
                });
            }

            Promise.all([
                loadScript(hlsJsSources),
                loadScript(artplayerJsSources)
            ]).then(() => {
                console.log('All external scripts loaded successfully.');
                initializePlayer(videoUrl);
            }).catch((error) => {
                console.error('Failed to load required scripts:', error);
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '播放器脚本加载失败，请刷新页面重试';
            });

            function initializePlayer(url) {
                let hlsInstance = null;
                let controlsHideTimer = null;
                let savedTime = 0;
                let saveTimer = null;
                let timeUpdateTimer = null;
                let isFullscreen = false;
                let currentBrightness = 100;

                // ========== 手势状态机 ==========
                const GestureState = {
                    IDLE: 0,
                    SEEK: 1,
                    VOLUME: 2,
                    BRIGHTNESS: 3
                };
                let gestureState = GestureState.IDLE;
                let gestureStartX = 0;
                let gestureStartY = 0;
                let gestureStartTime = 0;
                let gestureLastX = 0;
                let gestureLastY = 0;
                let gestureStartVolume = 0;
                let gestureStartBrightness = 100;
                let gestureHintTimeout = null;

                // ========== DOM 元素引用 ==========
                let topBar, adHint, timeEl, gestureHint, resolutionEl;

                // ========== 创建自定义 UI 元素（挂载到 Artplayer 容器内）==========
                function createCustomElements(artContainer) {
                    // 顶部提示栏
                    topBar = document.createElement('div');
                    topBar.className = 'wq-top-bar';
                    
                    adHint = document.createElement('div');
                    adHint.className = 'wq-ad-hint';
                    adHint.textContent = '请勿相信视频中的广告';
                    
                    timeEl = document.createElement('div');
                    timeEl.className = 'wq-time';
                    timeEl.textContent = '--:--';
                    
                    topBar.appendChild(adHint);
                    topBar.appendChild(timeEl);
                    artContainer.appendChild(topBar);

                    // 手势提示
                    gestureHint = document.createElement('div');
                    gestureHint.className = 'wq-gesture-hint';
                    artContainer.appendChild(gestureHint);

                    // 分辨率显示
                    resolutionEl = document.createElement('div');
                    resolutionEl.className = 'wq-resolution';
                    artContainer.appendChild(resolutionEl);
                }

                // ========== 时间更新 ==========
                function updateCurrentTime() {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    if (timeEl) timeEl.textContent = `${hours}:${minutes}`;
                }

                // ========== 存储键 ==========
                function getStorageKey() {
                    return 'wq_time_' + url;
                }

                function saveProgress() {
                    const video = window.player && window.player.video;
                    if (video && isFinite(video.currentTime) && video.currentTime > 0) {
                        localStorage.setItem(getStorageKey(), video.currentTime);
                    }
                }

                function clearProgress() {
                    localStorage.removeItem(getStorageKey());
                }

                function restoreProgress() {
                    const t = parseFloat(localStorage.getItem(getStorageKey())) || 0;
                    if (t > 0) savedTime = t;
                }

                restoreProgress();

                // ========== 显示/隐藏控制 ==========
                function showTopBar() {
                    if (topBar) topBar.classList.remove('hidden');
                }

                function hideTopBar() {
                    if (topBar) topBar.classList.add('hidden');
                }

                function showControls() {
                    const controls = document.querySelector('.artplayer-controls');
                    if (controls) controls.classList.remove('artplayer-controls-hide');
                    showTopBar();
                    
                    clearTimeout(controlsHideTimer);
                    controlsHideTimer = setTimeout(() => {
                        const controls = document.querySelector('.artplayer-controls');
                        if (controls) controls.classList.add('artplayer-controls-hide');
                        hideTopBar();
                    }, 1000);
                }

                function bindControlsAutoHide() {
                    const container = document.getElementById('container');
                    ['mousemove', 'click', 'touchstart', 'mouseenter'].forEach(evt => {
                        container.addEventListener(evt, () => showControls(), { passive: true });
                    });
                }

                // ========== 分辨率显示 ==========
                function showResolution(width, height) {
                    if (resolutionEl) {
                        resolutionEl.textContent = `${width}×${height}`;
                        resolutionEl.classList.add('show');
                        setTimeout(() => resolutionEl.classList.remove('show'), 9000);
                    }
                }

                // ========== 手势提示 ==========
                function showGestureHint(text) {
                    if (gestureHint) {
                        gestureHint.textContent = text;
                        gestureHint.classList.add('show');
                        clearTimeout(gestureHintTimeout);
                        gestureHintTimeout = setTimeout(() => {
                            gestureHint.classList.remove('show');
                        }, 1000);
                    }
                }

                function formatTime(sec) {
                    if (!isFinite(sec) || sec < 0) return '00:00';
                    sec = Math.floor(sec);
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    const s = sec % 60;
                    const mm = String(m).padStart(2, '0');
                    const ss = String(s).padStart(2, '0');
                    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
                }

                function getVideoResolution(videoElement) {
                    if (videoElement && videoElement.videoWidth && videoElement.videoHeight) {
                        return { width: videoElement.videoWidth, height: videoElement.videoHeight };
                    }
                    return null;
                }

                // ========== 全屏状态处理 ==========
                function updateFullscreenUI() {
                    const fsElement = document.fullscreenElement || 
                                     document.webkitFullscreenElement || 
                                     document.mozFullScreenElement || 
                                     document.msFullscreenElement;
                    
                    // 检查是否处于全屏状态
                    isFullscreen = !!(fsElement || (window.player && window.player.fullscreen));
                    
                    if (isFullscreen) {
                        // 全屏模式：隐藏广告，保留时间
                        if (adHint) adHint.style.display = 'none';
                        if (timeEl) timeEl.style.display = 'block';
                    } else {
                        // 非全屏模式：显示广告和时间
                        if (adHint) adHint.style.display = 'block';
                        if (timeEl) timeEl.style.display = 'block';
                    }
                }

                // 监听全屏变化
                ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(event => {
                    document.addEventListener(event, updateFullscreenUI);
                });

                // ========== 精准手势系统 ==========
                function initTouchGestures() {
                    const container = document.getElementById('container');
                    const video = window.player.video;
                    const MIN_SWIPE = 10;
                    const DIRECTION_LOCK = 2.0; // 方向锁定阈值

                    container.addEventListener('touchstart', (e) => {
                        if (e.touches.length !== 1) return;
                        const touch = e.touches[0];
                        
                        gestureStartX = touch.clientX;
                        gestureStartY = touch.clientY;
                        gestureLastX = touch.clientX;
                        gestureLastY = touch.clientY;
                        gestureStartTime = Date.now();
                        gestureState = GestureState.IDLE;
                        gestureStartVolume = video.volume;
                        gestureStartBrightness = currentBrightness;
                        
                    }, { passive: true });

                    container.addEventListener('touchmove', (e) => {
                        if (e.touches.length !== 1 || gestureState === GestureState.IDLE) return;
                        e.preventDefault();
                        
                        const touch = e.touches[0];
                        const deltaX = touch.clientX - gestureLastX;
                        const deltaY = touch.clientY - gestureLastY;
                        const totalDeltaX = touch.clientX - gestureStartX;
                        const totalDeltaY = touch.clientY - gestureStartY;
                        
                        gestureLastX = touch.clientX;
                        gestureLastY = touch.clientY;

                        // 方向判定阶段
                        if (gestureState === GestureState.IDLE) {
                            const absX = Math.abs(totalDeltaX);
                            const absY = Math.abs(totalDeltaY);
                            
                            if (Math.max(absX, absY) < MIN_SWIPE) return;
                            
                            if (absX > absY * DIRECTION_LOCK) {
                                gestureState = GestureState.SEEK;
                            } else if (absY > absX * DIRECTION_LOCK) {
                                const width = container.offsetWidth;
                                gestureState = (gestureStartX < width / 2) ? GestureState.BRIGHTNESS : GestureState.VOLUME;
                            }
                            return;
                        }

                        // 执行阶段（已锁定方向）
                        switch (gestureState) {
                            case GestureState.SEEK: {
                                const seekRatio = deltaX / container.offsetWidth;
                                const seekTime = seekRatio * 90;
                                if (Math.abs(seekTime) > 0.5) {
                                    const newTime = Math.max(0, Math.min(video.duration || Infinity, video.currentTime + seekTime));
                                    video.currentTime = newTime;
                                    const direction = seekTime > 0 ? '快进' : '后退';
                                    showGestureHint(`${direction} ${formatTime(Math.abs(seekTime))}`);
                                }
                                break;
                            }
                            case GestureState.VOLUME: {
                                const volumeRatio = -deltaY / container.offsetHeight;
                                const volumeChange = volumeRatio * 2;
                                let newVolume = gestureStartVolume + volumeChange;
                                newVolume = Math.max(0, Math.min(1, newVolume));
                                video.volume = newVolume;
                                showGestureHint(`音量: ${Math.round(newVolume * 100)}%`);
                                break;
                            }
                            case GestureState.BRIGHTNESS: {
                                const brightnessRatio = -deltaY / container.offsetHeight;
                                const brightnessChange = brightnessRatio * 200;
                                let newBrightness = gestureStartBrightness + brightnessChange;
                                newBrightness = Math.max(20, Math.min(100, newBrightness));
                                currentBrightness = newBrightness;
                                video.style.filter = `brightness(${currentBrightness}%)`;
                                showGestureHint(`亮度: ${Math.round(currentBrightness)}%`);
                                break;
                            }
                        }
                    }, { passive: false });

                    const endGesture = () => {
                        gestureState = GestureState.IDLE;
                    };
                    
                    container.addEventListener('touchend', endGesture, { passive: true });
                    container.addEventListener('touchcancel', endGesture, { passive: true });
                }

                // ========== 初始化 Artplayer ==========
                window.player = new Artplayer({
                    container: '#container',
                    url: url,
                    autoplay: true,
                    autoSize: false,
                    loop: false,
                    mutex: true,
                    setting: true,
                    pip: true,
                    flip: false,
                    lock: true,
                    fastForward: true,
                    playbackRate: true,
                    aspectRatio: true,
                    theme: '#ff0057',
                    fullscreen: true,
                    fullscreenWeb: false,
                    miniProgressBar: true,
                    autoOrientation: true,
                    airplay: false,
                    whitelist: ['*'],
                    notice: false,
                    customType: {
                        m3u8: function (video, m3u8Url) {
                            if (hlsInstance) {
                                try { hlsInstance.destroy(); } catch (e) { console.warn('销毁旧HLS实例:', e); }
                                hlsInstance = null;
                            }

                            if (Hls.isSupported()) {
                                const hls = new Hls({
                                    startLevel: -1,
                                    autoStartLoad: true,
                                    maxBufferLength: 60,
                                    maxMaxBufferLength: 240,
                                    capLevelToPlayerSize: false,
                                    startLevel: Infinity
                                });
                                hlsInstance = hls;

                                hls.loadSource(m3u8Url);
                                hls.attachMedia(video);

                                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                                    console.log('HLS清单解析完成, 可用级别:', data.levels.length);
                                    const maxLevel = data.levels.length - 1;
                                    hls.currentLevel = maxLevel;

                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height);
                                    }, 1500);
                                });

                                hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height);
                                    }, 2000);
                                });

                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    console.error('HLS错误:', data);
                                    saveProgress();
                                    if (data.fatal) {
                                        console.log('发生致命错误，停止播放');
                                        hls.stopLoad();
                                        video.pause();
                                    }
                                });

                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = m3u8Url;
                                video.addEventListener('loadedmetadata', function () {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) showResolution(resolution.width, resolution.height);
                                });
                            } else {
                                console.error('Unsupported playback format: m3u8');
                            }
                        },
                    }
                });

                // ========== 事件绑定 ==========
                window.player.on('video:loadedmetadata', function () {
                    const videoElement = window.player.video;
                    if (videoElement) {
                        if (savedTime > 0 && videoElement.currentTime < 1) {
                            videoElement.currentTime = savedTime;
                        }
                        const resolution = getVideoResolution(videoElement);
                        if (resolution) {
                            setTimeout(() => showResolution(resolution.width, resolution.height), 1000);
                        }
                    }
                });

                window.player.on('ready', () => { 
                    // 获取 Artplayer 容器并创建自定义元素
                    const artContainer = document.querySelector('.artplayer-container') || document.getElementById('container');
                    createCustomElements(artContainer);
                    
                    // 初始化手势
                    initTouchGestures();
                    
                    // 设置初始亮度
                    window.player.video.style.filter = `brightness(${currentBrightness}%)`;
                    
                    // 绑定控制栏自动隐藏
                    bindControlsAutoHide();
                    
                    // 启动时间更新
                    updateCurrentTime();
                    timeUpdateTimer = setInterval(updateCurrentTime, 1000);
                    
                    // 初始状态隐藏
                    setTimeout(() => {
                        const controls = document.querySelector('.artplayer-controls');
                        if (controls) controls.classList.add('artplayer-controls-hide');
                        hideTopBar();
                    }, 1000);
                    
                    // 恢复进度
                    if (savedTime > 0 && window.player.video) {
                        window.player.video.currentTime = savedTime;
                        showGestureHint('已恢复上次进度: ' + formatTime(savedTime));
                    }
                    
                    // 定时保存进度
                    saveTimer = setInterval(saveProgress, 5000);

                    // 监听 Artplayer 全屏事件
                    window.player.on('fullscreen', (state) => {
                        isFullscreen = state;
                        if (state) {
                            if (adHint) adHint.style.display = 'none';
                        } else {
                            if (adHint) adHint.style.display = 'block';
                        }
                    });

                    // 监听网页全屏事件
                    window.player.on('fullscreenWeb', (state) => {
                        isFullscreen = state;
                        if (state) {
                            if (adHint) adHint.style.display = 'none';
                        } else {
                            if (adHint) adHint.style.display = 'block';
                        }
                    });
                });

                window.player.on('destroy', () => {
                    saveProgress();
                    clearInterval(saveTimer);
                    clearInterval(timeUpdateTimer);
                    if (hlsInstance) {
                        try { hlsInstance.destroy(); } catch (e) { console.warn('销毁HLS实例:', e); }
                        hlsInstance = null;
                    }
                    clearTimeout(controlsHideTimer);
                });

                window.player.on('error', (e) => { console.error('播放器错误:', e); saveProgress(); });
                window.player.on('networkError', (e) => { console.error('网络错误:', e); saveProgress(); });
                window.player.on('decodeError', (e) => { console.error('解码错误:', e); saveProgress(); });
                window.player.on('video:ended', () => { clearProgress(); });
                window.player.on('video:pause', () => { saveProgress(); });
            }
        });

        // 页面关闭前保存进度
        window.addEventListener('beforeunload', () => {
            if (window.player && window.player.video) {
                const video = window.player.video;
                const url = extractVideoUrl();
                if (url && isFinite(video.currentTime) && video.currentTime > 0) {
                    localStorage.setItem('wq_time_' + url, video.currentTime);
                }
            }
        });
    </script>
</body>
</html>
