<!doctype html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <title>忘情ffplayer播放器</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
        }

        #container {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .resolution-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .resolution-display.show {
            opacity: 1;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        .gesture-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .gesture-hint.show {
            opacity: 1;
        }

        /* 进度条自动隐藏样式 */
        .artplayer-controls {
            transition: opacity 0.3s ease, transform 0.3s ease !important;
        }
        .artplayer-controls.artplayer-controls-hide {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(100%) !important;
        }

        /* ========== 新增：顶部提示栏样式 ========== */
        .top-hint-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .top-hint-bar.hidden {
            opacity: 0;
            transform: translateY(-100%);
        }

        .top-hint-left {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .top-hint-center {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <script>
        function extractVideoUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawUrl = urlParams.get('url');
            if (!rawUrl) return null;
            const httpIndex = rawUrl.toLowerCase().indexOf('http');
            if (httpIndex >= 0) {
                return rawUrl.substring(httpIndex);
            }
            return rawUrl;
        }

        function isVideoUrl(url) {
            if (!url) return false;
            const videoExtensions = ['.m3u8', '.mp4', '.avi', '.flv'];
            const lowerUrl = url.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }
    </script>
<base target="_blank">
</head>

<body>
    <div id="container"></div>
    
    <!-- ========== 新增：顶部提示栏 ========== -->
    <div id="topHintBar" class="top-hint-bar">
        <div class="top-hint-left">请勿相信视频中的广告</div>
        <div id="currentTime" class="top-hint-center">--:--</div>
    </div>
    
    <div id="resolutionDisplay" class="resolution-display"></div>
    <div id="gestureHint" class="gesture-hint"></div>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            const videoUrl = extractVideoUrl();

            if (!videoUrl) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 24px;
                `;
                container.textContent = '使用方式 ?url=视频地址';
                return;
            }

            if (!isVideoUrl(videoUrl)) {
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '仅支持视频格式（m3u8/mp4/avi/flv）';
                return;
            }

            const hlsJsSources = [
                'https://gcore.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js',
                'https://cdn.jsdmirror.cn/npm/hls.js@latest/dist/hls.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js'
            ];
            const artplayerJsSources = [
                'https://gcore.jsdelivr.net/npm/artplayer@latest/dist/artplayer.js',
                'https://cdn.jsdmirror.cn/npm/artplayer@latest/dist/artplayer.js',
                'https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.0.9/artplayer.js'
            ];

            function loadScript(srcArray) {
                return new Promise((resolve, reject) => {
                    let currentIndex = 0;
                    function tryLoad() {
                        if (currentIndex >= srcArray.length) {
                            reject(new Error(`All sources failed: ${srcArray.join(', ')}`));
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = srcArray[currentIndex];
                        script.onload = () => resolve(script);
                        script.onerror = () => {
                            console.warn(`Failed to load script from: ${srcArray[currentIndex]}, trying next...`);
                            currentIndex++;
                            tryLoad();
                        };
                        document.head.appendChild(script);
                    }
                    tryLoad();
                });
            }

            Promise.all([
                loadScript(hlsJsSources),
                loadScript(artplayerJsSources)
            ]).then(() => {
                console.log('All external scripts loaded successfully.');
                initializePlayer(videoUrl);
            }).catch((error) => {
                console.error('Failed to load required scripts:', error);
                const container = document.getElementById('container');
                container.style.cssText = `
                    background-color: black;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 18px;
                    padding: 20px;
                    text-align: center;
                `;
                container.textContent = '播放器脚本加载失败，请刷新页面重试';
            });

            function initializePlayer(url) {
                const resolutionDisplay = document.getElementById('resolutionDisplay');
                const gestureHint = document.getElementById('gestureHint');
                const topHintBar = document.getElementById('topHintBar');
                const currentTimeEl = document.getElementById('currentTime');
                
                let hlsInstance = null;
                let startY = 0;
                let isLeftSide = false;
                let isDragging = false;
                let currentBrightness = 100;
                let hintTimeout = null;
                let controlsHideTimer = null;
                let savedTime = 0;
                let saveTimer = null;
                let timeUpdateTimer = null;

                // ========== 新增：时间更新函数 ==========
                function updateCurrentTime() {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    currentTimeEl.textContent = `${hours}:${minutes}`;
                }

                // 以视频URL为key，恢复上次播放进度
                function getStorageKey() {
                    return 'wq_time_' + url;
                }

                function saveProgress() {
                    const video = window.player && window.player.video;
                    if (video && isFinite(video.currentTime) && video.currentTime > 0) {
                        localStorage.setItem(getStorageKey(), video.currentTime);
                    }
                }

                function clearProgress() {
                    localStorage.removeItem(getStorageKey());
                }

                function restoreProgress() {
                    const t = parseFloat(localStorage.getItem(getStorageKey())) || 0;
                    if (t > 0) savedTime = t;
                }

                // 加载时立即恢复
                restoreProgress();

                function showResolution(width, height) {
                    resolutionDisplay.textContent = `${width}×${height}`;
                    resolutionDisplay.classList.add('show');
                    setTimeout(() => {
                        resolutionDisplay.classList.remove('show');
                    }, 9000);
                }

                function showGestureHint(text) {
                    gestureHint.textContent = text;
                    gestureHint.classList.add('show');
                    clearTimeout(hintTimeout);
                    hintTimeout = setTimeout(() => {
                        gestureHint.classList.remove('show');
                    }, 1000);
                }

                function formatTime(sec) {
                    if (!isFinite(sec) || sec < 0) return '00:00';
                    sec = Math.floor(sec);
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    const s = sec % 60;
                    const mm = String(m).padStart(2, '0');
                    const ss = String(s).padStart(2, '0');
                    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
                }

                function getVideoResolution(videoElement) {
                    if (videoElement && videoElement.videoWidth && videoElement.videoHeight) {
                        return { width: videoElement.videoWidth, height: videoElement.videoHeight };
                    }
                    return null;
                }

                // ========== 修改：显示/隐藏顶部提示栏（与进度条同步）==========
                function showTopHintBar() {
                    topHintBar.classList.remove('hidden');
                }

                function hideTopHintBar() {
                    topHintBar.classList.add('hidden');
                }

                // 显示进度条并设置3秒后隐藏
                function showControls() {
                    const controls = document.querySelector('.artplayer-controls');
                    if (controls) {
                        controls.classList.remove('artplayer-controls-hide');
                    }
                    // 同时显示顶部提示栏
                    showTopHintBar();

                    clearTimeout(controlsHideTimer);
                    controlsHideTimer = setTimeout(() => {
                        const controls = document.querySelector('.artplayer-controls');
                        if (controls) {
                            controls.classList.add('artplayer-controls-hide');
                        }
                        // 同时隐藏顶部提示栏
                        hideTopHintBar();
                    }, 1000);
                }

                // 绑定进度条自动隐藏事件
                function bindControlsAutoHide() {
                    const container = document.getElementById('container');

                    // 鼠标移动显示进度条
                    container.addEventListener('mousemove', () => {
                        showControls();
                    });

                    // 点击显示进度条（手机和电脑都适用）
                    container.addEventListener('click', () => {
                        showControls();
                    });

                    // 触摸事件（手机端）
                    container.addEventListener('touchstart', () => {
                        showControls();
                    });

                    // 鼠标进入播放器区域也显示
                    container.addEventListener('mouseenter', () => {
                        showControls();
                    });
                }

                window.player = new Artplayer({
                    container: '#container',
                    url: url,
                    autoplay: true,
                    autoSize: false,
                    loop: false,
                    mutex: true,
                    setting: true,
                    pip: true,
                    flip: false,
                    lock: true,
                    fastForward: true,
                    playbackRate: true,
                    aspectRatio: true,
                    theme: '#ff0057',
                    fullscreen: true,
                    fullscreenWeb: false,
                    miniProgressBar: true,
                    autoOrientation: true,
                    airplay: false,
                    whitelist: ['*'],
                    notice: false,
                    customType: {
                        m3u8: function (video, m3u8Url) {
                            if (hlsInstance) {
                                try { hlsInstance.destroy(); } catch (e) { console.warn('销毁旧HLS实例:', e); }
                                hlsInstance = null;
                            }

                            if (Hls.isSupported()) {
                                const hls = new Hls({
                                    startLevel: -1,
                                    autoStartLoad: true,
                                    maxBufferLength: 60,
                                    maxMaxBufferLength: 240,
                                    capLevelToPlayerSize: false,
                                    startLevel: Infinity
                                });
                                hlsInstance = hls;

                                hls.loadSource(m3u8Url);
                                hls.attachMedia(video);

                                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                                    console.log('HLS清单解析完成, 可用级别:', data.levels.length);
                                    const maxLevel = data.levels.length - 1;
                                    hls.currentLevel = maxLevel;

                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height);
                                    }, 1500);
                                });

                                hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                                    setTimeout(() => {
                                        const resolution = getVideoResolution(video);
                                        if (resolution) showResolution(resolution.width, resolution.height);
                                    }, 2000);
                                });

                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    console.error('HLS错误:', data);
                                    saveProgress();
                                    if (data.fatal) {
                                        console.log('发生致命错误，停止播放');
                                        hls.stopLoad();
                                        video.pause();
                                    }
                                });

                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = m3u8Url;
                                video.addEventListener('loadedmetadata', function () {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) showResolution(resolution.width, resolution.height);
                                });
                            } else {
                                console.error('Unsupported playback format: m3u8');
                            }
                        },
                    }
                });

                function initTouchGestures() {
                    const container = document.getElementById('container');
                    const video = window.player.video;

                    container.addEventListener('touchstart', (e) => {
                        if (e.touches.length !== 1) return;
                        const touch = e.touches[0];
                        startY = touch.clientY;
                        const x = touch.clientX;
                        const width = container.offsetWidth;
                        isLeftSide = x < width / 2;
                        isDragging = true;
                    });

                    container.addEventListener('touchmove', (e) => {
                        if (!isDragging || e.touches.length !== 1) return;
                        e.preventDefault();
                        const touch = e.touches[0];
                        const deltaY = startY - touch.clientY;
                        startY = touch.clientY;

                        if (isLeftSide) {
                            currentBrightness += deltaY * 0.8;
                            currentBrightness = Math.max(20, Math.min(100, currentBrightness));
                            video.style.filter = `brightness(${currentBrightness}%)`;
                            showGestureHint(`亮度: ${Math.round(currentBrightness)}%`);
                        } else {
                            let volume = video.volume * 100;
                            volume += deltaY * 0.8;
                            volume = Math.max(0, Math.min(100, volume));
                            video.volume = volume / 100;
                            showGestureHint(`音量: ${Math.round(volume)}%`);
                        }
                    });

                    container.addEventListener('touchend', () => { isDragging = false; });
                    container.addEventListener('touchcancel', () => { isDragging = false; });
                }

                window.player.notice = { show: () => {}, hide: () => {} };

                window.player.on('video:loadedmetadata', function () {
                    const videoElement = window.player.video;
                    if (videoElement) {
                        // 恢复进度（如果 ready 事件未成功设置）
                        if (savedTime > 0 && videoElement.currentTime < 1) {
                            videoElement.currentTime = savedTime;
                        }
                        const resolution = getVideoResolution(videoElement);
                        if (resolution) {
                            setTimeout(() => {
                                showResolution(resolution.width, resolution.height);
                            }, 1000);
                        }
                    }
                });

                window.player.on('ready', () => { 
                    initTouchGestures();
                    window.player.video.style.filter = `brightness(${currentBrightness}%)`;
                    // 播放器就绪后绑定进度条自动隐藏
                    bindControlsAutoHide();
                    
                    // ========== 新增：启动时间更新 ==========
                    updateCurrentTime();
                    timeUpdateTimer = setInterval(updateCurrentTime, 1000);
                    
                    // 初始状态隐藏进度条和顶部提示栏
                    setTimeout(() => {
                        const controls = document.querySelector('.artplayer-controls');
                        if (controls) {
                            controls.classList.add('artplayer-controls-hide');
                        }
                        hideTopHintBar();
                    }, 1000);
                    
                    // 恢复上次播放进度
                    if (savedTime > 0 && window.player.video) {
                        window.player.video.currentTime = savedTime;
                        showGestureHint('已恢复上次进度: ' + formatTime(savedTime));
                    }
                    // 每5秒自动保存进度
                    saveTimer = setInterval(() => {
                        saveProgress();
                    }, 5000);
                });

                window.player.on('destroy', () => {
                    saveProgress();
                    clearInterval(saveTimer);
                    clearInterval(timeUpdateTimer); // 清理时间更新定时器
                    if (hlsInstance) {
                        try { hlsInstance.destroy(); } catch (e) { console.warn('销毁HLS实例:', e); }
                        hlsInstance = null;
                    }
                    clearTimeout(controlsHideTimer);
                });

                window.player.on('error', (e) => { console.error('播放器错误:', e); saveProgress(); });
                window.player.on('networkError', (e) => { console.error('网络错误:', e); saveProgress(); });
                window.player.on('decodeError', (e) => { console.error('解码错误:', e); saveProgress(); });
                window.player.on('video:ended', () => { clearProgress(); });
                window.player.on('video:pause', () => { saveProgress(); });
            }
        });

        // 页面关闭/刷新前保存当前视频进度
        window.addEventListener('beforeunload', () => {
            if (window.player && window.player.video) {
                const video = window.player.video;
                const url = extractVideoUrl();
                if (url && isFinite(video.currentTime) && video.currentTime > 0) {
                    localStorage.setItem('wq_time_' + url, video.currentTime);
                }
            }
        });
    </script>
</body>
</html>
