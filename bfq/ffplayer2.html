
<!doctype html>
<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
	<meta http-equiv="X-UA-Compatible" content="IE=9" />
	<title>系统播放器</title>
	<style>
	    html,body{
            width:100%;
            height:100%;
            overflow: hidden;
        }
        * {
            margin: 0;
            padding: 0;
        }
        #container {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            width:100%;
            height:100%;
        }
        
        .resolution-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .resolution-display.show {
            opacity: 1;
        }
	</style>
	<script>
	    var m3u8Url = new URLSearchParams(location.search.substring(1)).get('url')
	    var resumeKey = "";
	    if (m3u8Url) {
	     	let parsedUrl = new URL(m3u8Url);
            let videoDomain = parsedUrl.hostname;
            let match = parsedUrl.pathname.match(/\/(\d+)_/);
            let videoId = match ? match[1] : null;   
            resumeKey = `${videoDomain}-${videoId}:progress`;
	    }
	</script>
</head>
<body>
    <div id="container">
        
    </div>
    <div id="resolutionDisplay" class="resolution-display"></div>
    
    <script src="https://vip.dytt-tvs.com/frontend/players/js/hls.js"></script>
    <script src="https://vip.dytt-tvs.com/frontend/players/artplayer/artplayer.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            // 创建分辨率显示元素
            const resolutionDisplay = document.getElementById('resolutionDisplay');
            
            // 显示分辨率的函数
            function showResolution(width, height) {
                resolutionDisplay.textContent = `${width}×${height}`;
                resolutionDisplay.classList.add('show');
                
                // 5秒后隐藏
                setTimeout(() => {
                    resolutionDisplay.classList.remove('show');
                }, 5000);
            }
            
            // 获取视频分辨率的函数
            function getVideoResolution(videoElement) {
                if (videoElement.videoWidth && videoElement.videoHeight) {
                    return {
                        width: videoElement.videoWidth,
                        height: videoElement.videoHeight
                    };
                }
                return null;
            }
            
            window.player = new Artplayer({
                container: '#container',
                url: m3u8Url,
                autoplay: true,
                autoSize: false,
                loop: false,
                mutex: true,
                setting: true,
                pip: true,
                flip: false,
                lock: true,
                fastForward: true,
                playbackRate: true,
                aspectRatio: true,
                theme: '#ff0057',
                fullscreen: true,
                fullscreenWeb: false,
                miniProgressBar: true,
                autoOrientation: true,
                airplay: false,
                whitelist: ['*'],
                customType: {
                    m3u8: function (video, url) {
                        if (Hls.isSupported()) {
                            if (window.player.hls) window.player.hls.destroy();
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            window.player.hls = hls;
                            
                            // 监听视频尺寸变化
                            hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                                // 延迟一小段时间以确保视频已加载
                                setTimeout(() => {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) {
                                        showResolution(resolution.width, resolution.height);
                                    }
                                }, 1000);
                            });
                            
                            // 首次加载时获取分辨率
                            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                                setTimeout(() => {
                                    const resolution = getVideoResolution(video);
                                    if (resolution) {
                                        showResolution(resolution.width, resolution.height);
                                    }
                                }, 1500);
                            });
                            
                            window.player.on('destroy', () => hls.destroy());
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                            
                            // 原生HLS支持的情况
                            video.addEventListener('loadedmetadata', function() {
                                const resolution = getVideoResolution(video);
                                if (resolution) {
                                    showResolution(resolution.width, resolution.height);
                                }
                            });
                        } else {
                            window.player.notice.show = 'Unsupported playback format: m3u8';
                        }
                    },
                }
            });
            
            // 监听分辨率变化（针对HLS之外的情况）
            window.player.on('video:loadedmetadata', function() {
                const videoElement = window.player.video;
                if (videoElement) {
                    const resolution = getVideoResolution(videoElement);
                    if (resolution) {
                        // 延迟显示，确保视频已完全加载
                        setTimeout(() => {
                            showResolution(resolution.width, resolution.height);
                        }, 1000);
                    }
                }
            });
            
            window.video_hash = resumeKey;
            window.player.on('video:progress', (event) => {
                if (!window.player.currentTime) { return }
                if (window.video_hash != "") localStorage.setItem(window.video_hash, window.player.currentTime)
            })
            
            window.player.on('ready', () => {
                console.log("Artplayer ready")
                window.player.contextmenu.remove('version')
                var progress = parseFloat(localStorage.getItem(window.video_hash))
                if (isNaN(progress)) {
                    progress = 0
                }
                window.player.seek = progress
            })
        });
    </script>
</body>
</html>
