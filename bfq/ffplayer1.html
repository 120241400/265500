
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>忘情播放器</title>
<link rel="stylesheet" type="text/css" href="/bfq/1.css">
</head>
<body onload="init()">
<div id="a1"></div>
<script src="/bfq/2.js"></script>
<script src="/bfq/3.js"></script>
<script type="text/javascript">
Artplayer.DEGUG = false;
const videoid = "98f13708210194c475687be6106a3b84";
let hlsInstance = null;

function setCookie(name, value) {
    const Days = 30;
    const exp = new Date();
    exp.setTime(exp.getTime() + Days * 24 * 60 * 60 * 1000);
    document.cookie = `${name}=${escape(value)};expires=${exp.toGMTString()}`;
}

function getCookie(name) {
    const arr = document.cookie.match(new RegExp(`(^| )${name}=([^;]*)(;|$)`));
    return arr ? unescape(arr[2]) : null;
}

function timeHandler(t) {
    if (t > -1) setCookie(`${videoid}_time`, t);
}

function initHlsPlayer(video, url, art) {
    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            maxBufferLength: 120,
            maxMaxBufferLength: 120,
            startLevel: -1,
            maxBufferSize: 200 * 1024 * 1024,
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 90,
            enableCodecsFetch: true,
            abrEwmaDefaultEstimate: 500000,
            abrEwmaFastLive: 3.0,
            abrEwmaSlowLive: 9.0,
            maxFragLookUpTolerance: 0.25,
            enableManifestCache: true,
            manifestLoadingTimeOut: 10000,
            fragLoadingTimeOut: 15000,
            maxLoadingRetry: 0,
            startLevelLoadRetry: 0,
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            console.error('HLS错误:', data);
        });

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {});
        hlsInstance.on(Hls.Events.FRAG_LOADED, () => {});

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        video.addEventListener('canplay', () => {
            if (art.options.autoplay) {
                art.play();
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('error', (e) => {
            console.error('video错误:', e);
        });
    } else {
        console.error('不支持m3u8格式');
    }
}

function init() {
    let playUrl = "";
    if (location.search) {
        const myurl = new URLSearchParams(location.search.substring(1)).get('url');
        if (myurl) playUrl = myurl;
    }

    let cookieTime = getCookie(`${videoid}_time`);
    cookieTime = cookieTime ? Number(cookieTime) : 0;

    const art = new Artplayer({
        container: '#a1',
        url: playUrl,
        autoplay: true,
        autoSize: false,
        loop: false,
        mutex: true,
        pip: true,
        setting: true,
        flip: false,
        lock: true,
        fastForward: true,
        playbackRate: true,
        aspectRatio: true,
        theme: '#ff0057',
        fullscreen: true,
        fullscreenWeb: true,
        miniProgressBar: true,
        autoOrientation: true,
        airplay: false,
        whitelist: ['*'],
        preload: 'auto',
        customType: {
            m3u8: function (video, url) {
                initHlsPlayer(video, url, art);
            }
        }
    });

    art.on('timeupdate', (info) => {
        timeHandler(info.currentTime);
    });

    if (cookieTime > 0) {
        art.on('ready', () => {
            art.seek(cookieTime);
        });
    }

    art.on('error', (err) => {
        console.error('播放器错误:', err);
    });
}

window.onerror = function () {
    return true;
};
</script>
</body>
</html>
