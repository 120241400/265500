<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-language" content="zh-CN">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="HandheldFriendly" content="true">
    <!-- 修复：不再禁止缩放（user-scalable=0 属无障碍缺陷，IOS/Android 表现不一致） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="format-detection" content="telephone=no">
    <title>领券吧 一个为您省钱的网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }
        /* 修复：使用 fixed + inset 定位，并用 dvh 兜底，避免移动端地址栏收缩导致的高度抖动与底部被裁切 */
        .full-frame {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            background: #FFFFFF;
        }

        /* 加载态 */
        .loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; background: #fff; z-index: 30;
            transition: opacity .3s ease;
        }
        .loading .spinner {
            width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid #ffe1e1; border-top-color: #ff4b4b;
            animation: spin .8s linear infinite;
        }
        .loading p { font-size: 13px; color: #999; letter-spacing: .5px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 淘口令提示浮层 */
        .tip-mask {
            position: fixed; inset: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background: rgba(20, 12, 12, .38);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            opacity: 0; visibility: hidden;
            transition: opacity .28s ease, visibility .28s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tip-mask.show { opacity: 1; visibility: visible; }
        .tip-card {
            width: 100%; max-width: 330px;
            background: #fff; border-radius: 20px;
            overflow: hidden; position: relative;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
            transform: translateY(18px) scale(.94); opacity: 0;
            transition: transform .34s cubic-bezier(.22, 1.2, .36, 1), opacity .28s ease;
        }
        .tip-mask.show .tip-card { transform: translateY(0) scale(1); opacity: 1; }
        .tip-top {
            height: 78px;
            background: linear-gradient(135deg, #ff7a45 0%, #ff3b6b 55%, #ff2d55 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .tip-emoji { font-size: 38px; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.18)); }
        .tip-body { padding: 18px 20px 14px; text-align: center; }
        .tip-title { font-size: 17px; font-weight: 700; color: #1a1a1a; letter-spacing: .3px; }
        .tip-desc { margin-top: 9px; font-size: 13.5px; line-height: 1.75; color: #6b6b6b; }
        .tip-desc b { color: #ff3b6b; font-weight: 600; }
        .tip-btn {
            margin-top: 14px; width: 100%; height: 44px; border: none; border-radius: 22px;
            background: linear-gradient(135deg, #ff7a45, #ff2d55);
            color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .5px;
            box-shadow: 0 8px 18px rgba(255, 61, 90, .3);
            transition: transform .15s ease;
        }
        .tip-btn:active { transform: scale(.97); }
        .tip-btn.done { background: linear-gradient(135deg, #34c759, #1fa64a); box-shadow: 0 8px 18px rgba(31,166,74,.28); }
        .tip-foot {
            padding: 11px 0 14px; font-size: 11.5px; color: #b0b0b0; text-align: center;
            border-top: 1px solid #f2f2f2; position: relative;
        }
        .tip-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #ff2d55; transform-origin: left center; }
        .tip-mask.show .tip-bar { animation: countdown 3s linear forwards; }
        @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        .tip-close {
            position: absolute; top: 8px; right: 10px; width: 28px; height: 28px;
            border: none; background: rgba(255,255,255,.22); color: #fff;
            border-radius: 50%; font-size: 15px; line-height: 1;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在打开领券吧…</p>
    </div>

    <!-- 修复：补充 allow 剪贴板权限（跨域 iframe 复制淘口令必需）、referrerpolicy（保留来源，避免推广归因丢失） -->
    <iframe id="shopFrame" class="full-frame"
            src="https://hpekg.yhzu.cn/"
            title="领券吧 省钱购物"
            loading="eager"
            allow="clipboard-read; clipboard-write; fullscreen; payment"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <!-- 淘口令引导提示 -->
    <div class="tip-mask" id="tipMask" role="dialog" aria-modal="true" aria-labelledby="tipTitle">
        <div class="tip-card" id="tipCard">
            <div class="tip-top">
                <span class="tip-emoji">🧧</span>
                <button class="tip-close" id="tipClose" aria-label="关闭">✕</button>
            </div>
            <div class="tip-body">
                <div class="tip-title" id="tipTitle">用「淘口令」下单更省钱</div>
                <p class="tip-desc">
                    在商品页点击 <b>复制淘口令</b>，再打开 <b>手机淘宝 App</b>，<br>优惠券会自动弹出，付款直接立减。
                </p>
                <button class="tip-btn" id="copyBtn">复制淘口令</button>
            </div>
            <div class="tip-foot">
                <span>轻点任意位置关闭 · <span id="cdText">3</span>s 后自动消失</span>
                <i class="tip-bar"></i>
            </div>
        </div>
    </div>

    <script>
    (function () {
        // 可配置：把默认淘口令填到这里（留空则按钮只做引导）
        var TAO_TOKEN = '';
        // 自动消失时间（毫秒）
        var AUTO_HIDE = 3000;

        var frame   = document.getElementById('shopFrame');
        var loading = document.getElementById('loading');
        var mask    = document.getElementById('tipMask');
        var copyBtn = document.getElementById('copyBtn');
        var cdText  = document.getElementById('cdText');
        var hideTimer = null, cdTimer = null, shown = false;

        if (!TAO_TOKEN) { copyBtn.style.display = 'none'; }

        function hideTip() {
            if (!shown) return;
            shown = false;
            clearTimeout(hideTimer);
            clearInterval(cdTimer);
            mask.classList.remove('show');
            setTimeout(function () { mask.style.display = 'none'; }, 320);
        }

        function showTip() {
            if (shown) return;
            shown = true;
            mask.style.display = 'flex';
            requestAnimationFrame(function () { mask.classList.add('show'); });

            var left = Math.ceil(AUTO_HIDE / 1000);
            cdText.textContent = left;
            cdTimer = setInterval(function () {
                left -= 1;
                if (left <= 0) { clearInterval(cdTimer); return; }
                cdText.textContent = left;
            }, 1000);

            hideTimer = setTimeout(hideTip, AUTO_HIDE);
        }

        // 点击任意位置关闭（遮罩空白处、卡片、关闭按钮都算）
        mask.addEventListener('click', function (e) {
            if (e.target === copyBtn) return;   // 复制按钮单独处理
            hideTip();
        });

        // 一键复制淘口令（Clipboard API + 兼容降级）
        copyBtn.addEventListener('click', function () {
            var text = TAO_TOKEN || '打开领券吧，复制商品淘口令后到淘宝 App 下单更省钱';
            var done = function () {
                copyBtn.textContent = '已复制，打开淘宝 App 吧';
                copyBtn.classList.add('done');
                setTimeout(hideTip, 900);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done, fallback);
            } else { fallback(); }
            function fallback() {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;top:-9999px;opacity:0;';
                document.body.appendChild(ta);
                ta.select(); ta.setSelectionRange(0, text.length);
                try { document.execCommand('copy'); done(); }
                catch (err) { copyBtn.textContent = '请长按页面复制淘口令'; }
                document.body.removeChild(ta);
            }
        });

        // 加载完成再弹提示；超时/失败也有兜底
        var loaded = false;
        frame.addEventListener('load', function () {
            loaded = true;
            loading.style.opacity = '0';
            setTimeout(function () { loading.style.display = 'none'; }, 300);
            setTimeout(showTip, 400);
        });
        frame.addEventListener('error', function () {
            loaded = true;
            loading.innerHTML = '<p style="font-size:14px;color:#ff3b6b">页面加载失败，请检查网络后重试</p>';
        });
        setTimeout(function () {          // 8 秒兜底，避免白屏卡loading
            if (!loaded) {
                loading.style.display = 'none';
                showTip();
            }
        }, 8000);
    })();
    </script>
</body>
</html>
