<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>播放器</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;}
iframe{width:100%;height:100%;border:none;}
#tip{color:#fff;text-align:center;padding-top:50px;font-size:16px;}
</style>
</head>
<body>

<div id="tip">正在加载播放器...</div>

<script>
function getUrlParam(name){
    const reg=new RegExp("(^|&)"+name+"=([^&]*)(&|$)","i");
    const r=location.search.substr(1).match(reg);
    return r?decodeURIComponent(r[2]):"";
}

const video=getUrlParam("url");

if(!video){
    document.body.innerHTML="<div style='color:#fff;text-align:center;padding-top:60px;'>❌ 缺少 url 参数</div>";
}else{

    const ua=navigator.userAgent;
    const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(ua);

    const base=isMobile
        ?"https://www.265500.vip/bfq/wqplayer5.html"
        :"https://www.265500.vip/bfq/ffplayer.html";

    document.getElementById("tip").style.display="none";

    const iframe=document.createElement("iframe");
    iframe.src=base+"?url="+encodeURIComponent(video);
    iframe.allow="autoplay; fullscreen";
    document.body.appendChild(iframe);
}
</script>

</body>
</html>
