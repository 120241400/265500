<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            touch-action: none;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        /* 自定义控制栏 */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px 15px 15px;
            transition: opacity 0.3s;
            opacity: 0;
        }
        
        .controls-overlay.show {
            opacity: 1;
        }
        
        /* 进度条容器 */
        .progress-container {
            position: relative;
            height: 30px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .progress-background {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
        
        .progress-filled {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 3px;
            background: #ff4444;
            border-radius: 2px;
            width: 0;
        }
        
        .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #ff4444;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .progress-container:hover .progress-thumb {
            opacity: 1;
        }
        
        /* 底部控制栏 */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        /* 时间显示 */
        .time-display {
            color: white;
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }
        
        /* 倍速选择器 */
        .speed-selector {
            position: absolute;
            bottom: 60px;
            background: rgba(0,0,0,0.9);
            border-radius: 5px;
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        
        .speed-selector.show {
            display: flex;
        }
        
        .speed-option {
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            text-align: center;
            min-width: 80px;
        }
        
        .speed-option:hover, .speed-option.active {
            background: #333;
        }
        
        /* 音量控制器 */
        .volume-container {
            position: relative;
        }
        
        .volume-slider {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) rotate(270deg);
            transform-origin: left;
            height: 30px;
            display: none;
            background: rgba(0,0,0,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
        }
        
        .volume-slider.show {
            display: block;
        }
        
        /* 全屏按钮 */
        .fullscreen-btn.fullscreen {
            font-size: 18px;
        }
        
        /* 触摸提示 */
        .touch-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            display: none;
            z-index: 100;
        }
        
        /* 加载中 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
        }
        
        /* 错误提示 */
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            display: none;
        }
        
        /* 播放/暂停按钮 */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .play-overlay.show {
            opacity: 1;
        }
        
        /* 双击快进/快退提示 */
        .skip-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 20px;
            display: none;
            z-index: 100;
        }
        
        .skip-indicator.show {
            display: block;
            animation: fadeOut 1s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <div class="loading" id="loading">正在加载视频...</div>
        <div class="error" id="error"></div>
        <div class="skip-indicator" id="skipIndicator"></div>
        <div class="play-overlay" id="playOverlay">▶</div>
        
        <!-- 视频元素 -->
        <video 
            id="videoElement"
            playsinline
            webkit-playsinline
            preload="auto"
        ></video>
        
        <!-- 控制栏 -->
        <div class="controls-overlay" id="controlsOverlay">
            <!-- 进度条 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-background"></div>
                <div class="progress-filled" id="progressFilled"></div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>
            
            <!-- 底部控制栏 -->
            <div class="bottom-controls">
                <div class="left-controls">
                    <button class="control-btn" id="playBtn">⏸</button>
                    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                </div>
                
                <div class="right-controls">
                    <!-- 倍速选择 -->
                    <div class="speed-container">
                        <button class="control-btn" id="speedBtn">1.0x</button>
                        <div class="speed-selector" id="speedSelector">
                            <div class="speed-option" data-speed="0.5">0.5x</div>
                            <div class="speed-option" data-speed="0.75">0.75x</div>
                            <div class="speed-option" data-speed="1" class="active">1.0x</div>
                            <div class="speed-option" data-speed="1.25">1.25x</div>
                            <div class="speed-option" data-speed="1.5">1.5x</div>
                            <div class="speed-option" data-speed="2">2.0x</div>
                        </div>
                    </div>
                    
                    <!-- 音量控制 -->
                    <div class="volume-container">
                        <button class="control-btn" id="volumeBtn">🔊</button>
                        <input 
                            type="range" 
                            class="volume-slider" 
                            id="volumeSlider"
                            min="0" 
                            max="1" 
                            step="0.1" 
                            value="1"
                        >
                    </div>
                    
                    <button class="control-btn" id="fullscreenBtn">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 检测微信浏览器
        function isWeChatBrowser() {
            return /micromessenger/i.test(navigator.userAgent);
        }
        
        // 获取URL参数
        function getVideoUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('url');
        }
        
        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '00:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }
        
        // 显示错误
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        // 隐藏加载
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // 显示跳过提示
        function showSkipIndicator(seconds) {
            const indicator = document.getElementById('skipIndicator');
            indicator.textContent = (seconds > 0 ? '+ ' : '- ') + Math.abs(seconds) + '秒';
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 1000);
        }
        
        // 初始化播放器
        function initPlayer() {
            const videoUrl = getVideoUrl();
            if (!videoUrl) {
                showError('请提供视频URL参数，例如：?url=your_video.m3u8');
                return;
            }
            
            const video = document.getElementById('videoElement');
            const isWechat = isWeChatBrowser();
            
            // 设置视频源
            video.src = videoUrl;
            
            if (isWechat) {
                // 微信环境
                console.log('微信浏览器，使用微信播放器');
                initWechatMode(video);
            } else {
                // 非微信环境
                console.log('非微信浏览器，使用标准播放器');
                initStandardMode(video, videoUrl);
            }
        }
        
        // 初始化微信模式
        function initWechatMode(video) {
            // 微信专用属性
            video.setAttribute('x5-video-player-type', 'h5');
            video.setAttribute('x5-video-player-fullscreen', 'true');
            video.setAttribute('x5-playsinline', 'true');
            video.setAttribute('controls', 'true');
            
            // 微信自动播放处理
            if (typeof WeixinJSBridge !== 'undefined') {
                WeixinJSBridge.invoke('getNetworkType', {}, function() {
                    video.play().catch(e => console.log('自动播放失败'));
                });
            } else {
                document.addEventListener('WeixinJSBridgeReady', function() {
                    WeixinJSBridge.invoke('getNetworkType', {}, function() {
                        video.play().catch(e => console.log('自动播放失败'));
                    });
                }, false);
            }
            
            // 加载完成后初始化UI
            video.addEventListener('loadedmetadata', () => {
                hideLoading();
            });
        }
        
        // 初始化标准模式
        function initStandardMode(video, videoUrl) {
            const controlsOverlay = document.getElementById('controlsOverlay');
            const playBtn = document.getElementById('playBtn');
            const playOverlay = document.getElementById('playOverlay');
            const speedBtn = document.getElementById('speedBtn');
            const speedSelector = document.getElementById('speedSelector');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressFilled = document.getElementById('progressFilled');
            const progressThumb = document.getElementById('progressThumb');
            const timeDisplay = document.getElementById('timeDisplay');
            
            let isDragging = false;
            let controlsTimeout;
            let currentVolume = 1;
            
            // 初始化HLS播放器
            function initHls() {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari原生支持
                    video.src = videoUrl;
                    hideLoading();
                } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        hideLoading();
                        updateDuration();
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS错误:', data);
                        if (data.fatal) {
                            showError('视频加载失败');
                        }
                    });
                } else {
                    showError('您的浏览器不支持HLS视频播放');
                }
            }
            
            // 初始化播放器
            if (videoUrl.includes('.m3u8')) {
                initHls();
            } else {
                video.src = videoUrl;
                video.addEventListener('loadedmetadata', () => {
                    hideLoading();
                    updateDuration();
                });
            }
            
            // 播放/暂停控制
            playBtn.addEventListener('click', togglePlay);
            playOverlay.addEventListener('click', togglePlay);
            
            function togglePlay() {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
            
            video.addEventListener('play', () => {
                playBtn.textContent = '⏸';
                playOverlay.textContent = '⏸';
                showControls();
            });
            
            video.addEventListener('pause', () => {
                playBtn.textContent = '▶';
                playOverlay.textContent = '▶';
                showControls();
            });
            
            // 显示播放/暂停按钮
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
            
            // 鼠标移动时显示控制栏
            video.addEventListener('mousemove', showControls);
            video.addEventListener('touchstart', showControls);
            
            // 控制栏自动隐藏
            function showControls() {
                controlsOverlay.classList.add('show');
                playOverlay.classList.add('show');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        controlsOverlay.classList.remove('show');
                        playOverlay.classList.remove('show');
                    }
                }, 3000);
            }
            
            // 倍速控制
            speedBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speedSelector.classList.toggle('show');
            });
            
            document.querySelectorAll('.speed-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    const speed = parseFloat(e.target.dataset.speed);
                    video.playbackRate = speed;
                    speedBtn.textContent = speed + 'x';
                    
                    // 更新激活状态
                    document.querySelectorAll('.speed-option').forEach(opt => {
                        opt.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    
                    speedSelector.classList.remove('show');
                });
            });
            
            // 音量控制
            volumeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (volumeSlider.classList.contains('show')) {
                    volumeSlider.classList.remove('show');
                } else {
                    volumeSlider.classList.add('show');
                }
            });
            
            volumeSlider.addEventListener('input', (e) => {
                video.volume = e.target.value;
                currentVolume = e.target.value;
                updateVolumeIcon();
            });
            
            volumeSlider.addEventListener('click', (e) => {
                e.stopPropagation();
            });
            
            function updateVolumeIcon() {
                if (video.volume === 0 || video.muted) {
                    volumeBtn.textContent = '🔇';
                } else if (video.volume < 0.5) {
                    volumeBtn.textContent = '🔈';
                } else {
                    volumeBtn.textContent = '🔊';
                }
            }
            
            // 点击音量按钮切换静音
            volumeBtn.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                volumeSlider.value = video.muted ? 0 : currentVolume;
                updateVolumeIcon();
            });
            
            // 全屏控制
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log('全屏请求失败:', err);
                    });
                    fullscreenBtn.textContent = '✕';
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.textContent = '⛶';
                }
            }
            
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    fullscreenBtn.textContent = '⛶';
                }
            });
            
            // 进度条控制
            function updateProgress() {
                if (isDragging || video.duration === Infinity || isNaN(video.duration)) return;
                
                const percent = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = percent + '%';
                progressThumb.style.left = percent + '%';
                
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
            
            function updateDuration() {
                if (video.duration === Infinity || isNaN(video.duration)) {
                    // 对于直播流，显示直播中
                    timeDisplay.textContent = `${formatTime(video.currentTime)} / 直播中`;
                } else {
                    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                }
            }
            
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('loadedmetadata', updateDuration);
            
            // 拖动进度条
            progressContainer.addEventListener('mousedown', startDrag);
            progressContainer.addEventListener('touchstart', startDrag);
            
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('touchmove', doDrag);
            
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
            
            function startDrag(e) {
                isDragging = true;
                controlsOverlay.classList.add('show');
                progressThumb.style.opacity = '1';
                updateProgressBar(e);
            }
            
            function doDrag(e) {
                if (!isDragging) return;
                e.preventDefault();
                updateProgressBar(e);
            }
            
            function stopDrag() {
                if (!isDragging) return;
                isDragging = false;
                progressThumb.style.opacity = '0';
                
                if (video.duration === Infinity || isNaN(video.duration)) {
                    // 直播流不支持跳转
                    return;
                }
                
                // 应用跳转
                const rect = progressContainer.getBoundingClientRect();
                const percent = (dragX - rect.left) / rect.width;
                video.currentTime = percent * video.duration;
            }
            
            let dragX = 0;
            
            function updateProgressBar(e) {
                const rect = progressContainer.getBoundingClientRect();
                dragX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                dragX = Math.max(rect.left, Math.min(dragX, rect.left + rect.width));
                
                const percent = (dragX - rect.left) / rect.width;
                
                if (video.duration === Infinity || isNaN(video.duration)) {
                    // 直播流
                    progressFilled.style.width = (percent * 100) + '%';
                    progressThumb.style.left = (percent * 100) + '%';
                } else {
                    progressFilled.style.width = (percent * 100) + '%';
                    progressThumb.style.left = (percent * 100) + '%';
                    
                    const time = percent * video.duration;
                    timeDisplay.textContent = `${formatTime(time)} / ${formatTime(video.duration)}`;
                }
            }
            
            // 双击快进/快退
            let lastTap = 0;
            video.addEventListener('click', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                
                if (tapLength < 500 && tapLength > 0) {
                    // 双击事件
                    const rect = video.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const width = rect.width;
                    
                    if (x < width / 3) {
                        // 左三分之一：快退10秒
                        video.currentTime = Math.max(0, video.currentTime - 10);
                        showSkipIndicator(-10);
                    } else if (x > width * 2 / 3) {
                        // 右三分之一：快进10秒
                        video.currentTime = Math.min(video.duration, video.currentTime + 10);
                        showSkipIndicator(10);
                    }
                }
                
                lastTap = currentTime;
            });
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case ' ':
                    case 'Spacebar':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        video.currentTime = Math.max(0, video.currentTime - 5);
                        showSkipIndicator(-5);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        video.currentTime = Math.min(video.duration, video.currentTime + 5);
                        showSkipIndicator(5);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        video.volume = Math.min(1, video.volume + 0.1);
                        volumeSlider.value = video.volume;
                        updateVolumeIcon();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        video.volume = Math.max(0, video.volume - 0.1);
                        volumeSlider.value = video.volume;
                        updateVolumeIcon();
                        break;
                    case 'm':
                    case 'M':
                        e.preventDefault();
                        video.muted = !video.muted;
                        updateVolumeIcon();
                        break;
                }
            });
            
            // 错误处理
            video.addEventListener('error', (e) => {
                console.error('视频错误:', e);
                showError('视频加载失败，请检查网络或视频源');
            });
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', (e) => {
                if (!speedSelector.contains(e.target) && e.target !== speedBtn) {
                    speedSelector.classList.remove('show');
                }
                if (!volumeSlider.contains(e.target) && e.target !== volumeBtn) {
                    volumeSlider.classList.remove('show');
                }
            });
        }
        
        // 页面加载
        window.addEventListener('DOMContentLoaded', function() {
            const videoUrl = getVideoUrl();
            if (!videoUrl) {
                showError('请提供视频URL参数，例如：?url=your_video.m3u8');
                return;
            }
            
            if (!isWeChatBrowser() && videoUrl.includes('.m3u8')) {
                // 非微信环境且是m3u8格式，加载hls.js
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                script.onload = initPlayer;
                script.onerror = function() {
                    console.warn('hls.js加载失败');
                    initPlayer();
                };
                document.head.appendChild(script);
            } else {
                initPlayer();
            }
        });
        
        // 防止页面滚动
        document.addEventListener('touchmove', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
