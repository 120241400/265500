
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal MUI Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 hls.js 支持 m3u8 格式 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        .player-ui {
            transition: opacity 0.3s ease;
        }

        .video-container:hover .player-ui,
        .video-container.paused .player-ui {
            opacity: 1;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 直播标签 */
        .live-badge {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-black text-white selection:bg-white selection:text-black">

    <div id="player-container" class="video-container relative w-full h-full bg-black group">

        <video id="video" class="w-full h-full object-contain cursor-pointer" playsinline>
            Your browser does not support the video tag.
        </video>

        <div id="loader" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 hidden">
            <div class="loader"></div>
        </div>

        <div id="error-msg" class="absolute inset-0 flex items-center justify-center pointer-events-none z-30 hidden flex-col gap-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p class="text-gray-400 text-sm">无法加载视频</p>
        </div>

        <div id="big-play-btn" class="absolute inset-0 flex items-center justify-center cursor-pointer z-10 transition-transform duration-200 active:scale-95 hidden">
            <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center hover:bg-white/20 transition-colors border border-white/20 shadow-2xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>

        <div id="controls" class="player-ui absolute bottom-0 left-0 right-0 glass-panel p-4 pb-6 md:pb-8 z-20 flex flex-col gap-2 transition-opacity duration-300 opacity-0 group-hover:opacity-100">

            <div class="relative w-full h-1 group/progress cursor-pointer">
                <div class="absolute top-0 left-0 w-full h-full bg-white/20 rounded-full"></div>
                <div id="buffered-bar" class="absolute top-0 left-0 h-full bg-white/40 rounded-full w-0"></div>
                <div id="progress-fill" class="absolute top-0 left-0 h-full bg-white rounded-full w-0 relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 bg-white rounded-full shadow opacity-0 group-hover/progress:opacity-100 transition-opacity"></div>
                </div>
                <input type="range" id="seek-slider" min="0" max="100" value="0" class="absolute top-[-8px] left-0 w-full h-4 opacity-0 cursor-pointer z-30">
            </div>

            <div class="flex items-center justify-between mt-2">

                <div class="flex items-center gap-4">
                    <button id="play-pause-btn" class="text-white hover:text-gray-300 transition-colors focus:outline-none">
                        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>

                    <!-- 直播标签 (检测到直播流时显示) -->
                    <div id="live-badge" class="hidden live-badge px-2 py-0.5 rounded text-xs font-bold tracking-wider">LIVE</div>

                    <div class="text-xs font-medium text-gray-300 font-mono tracking-wider select-none">
                        <span id="current-time">00:00</span>
                        <span class="text-gray-500 mx-1">/</span>
                        <span id="duration">00:00</span>
                    </div>
                </div>

                <div class="flex items-center gap-4">

                    <div class="flex items-center group/volume">
                        <button id="mute-btn" class="text-white hover:text-gray-300 transition-colors mr-2">
                            <svg id="icon-vol-high" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            <svg id="icon-vol-mute" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                            </svg>
                        </button>
                        <div class="w-0 overflow-hidden group-hover/volume:w-20 transition-all duration-300 ease-out">
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="w-16 h-1 accent-white">
                        </div>
                    </div>

                    <button id="fullscreen-btn" class="text-white hover:text-gray-300 transition-colors focus:outline-none">
                        <svg id="icon-fullscreen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                        </svg>
                        <svg id="icon-fullscreen-exit" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements ---
            const video = document.getElementById('video');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const bigPlayBtn = document.getElementById('big-play-btn');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const seekSlider = document.getElementById('seek-slider');
            const progressFill = document.getElementById('progress-fill');
            const bufferedBar = document.getElementById('buffered-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const volumeSlider = document.getElementById('volume-slider');
            const muteBtn = document.getElementById('mute-btn');
            const iconVolHigh = document.getElementById('icon-vol-high');
            const iconVolMute = document.getElementById('icon-vol-mute');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const iconFullscreen = document.getElementById('icon-fullscreen');
            const iconFullscreenExit = document.getElementById('icon-fullscreen-exit');
            const playerContainer = document.getElementById('player-container');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('error-msg');
            const liveBadge = document.getElementById('live-badge');

            // --- HLS Instance ---
            let hls = null;
            let isLive = false;
            let isDragging = false;

            // --- URL Parameter Parsing ---
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');

            // --- Initialize Player ---
            const initPlayer = (url) => {
                if (!url) {
                    errorMsg.classList.remove('hidden');
                    errorMsg.querySelector('p').textContent = "请在 URL 中添加 ?url=视频地址";
                    bigPlayBtn.classList.add('hidden');
                    return;
                }

                // 检查是否为 m3u8 格式
                const isM3U8 = url.toLowerCase().includes('.m3u8') || url.includes('application/x-mpegURL');

                if (isM3U8 && Hls.isSupported()) {
                    // 使用 hls.js 播放 m3u8
                    hls = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 600,
                    });

                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                        console.log('Manifest loaded, found ' + data.levels.length + ' quality level(s)');
                        video.play().catch(e => console.log("Autoplay blocked:", e));
                    });

                    hls.on(Hls.Events.LEVEL_LOADED, (event, data) => {
                        // 检测是否为直播流
                        if (data.details.live) {
                            isLive = true;
                            liveBadge.classList.remove('hidden');
                            durationEl.parentElement.style.display = 'none'; // 直播隐藏时长显示
                        }
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS Error:', data);
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log('Network error, trying to recover...');
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log('Media error, trying to recover...');
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    showError('视频加载失败: ' + data.details);
                                    break;
                            }
                        }
                    });

                } else if (isM3U8 && video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari 原生支持 HLS
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                } else {
                    // 普通视频格式 (mp4, webm 等)
                    video.src = url;
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                }
            };

            const showError = (msg) => {
                loader.classList.add('hidden');
                errorMsg.classList.remove('hidden');
                errorMsg.querySelector('p').textContent = msg;
            };

            // 初始化
            initPlayer(videoUrl);

            // --- Format Time ---
            const formatTime = (seconds) => {
                if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // --- Play/Pause Logic ---
            const togglePlay = () => {
                if (video.paused || video.ended) {
                    video.play();
                } else {
                    video.pause();
                }
            };

            const updatePlayButtonState = () => {
                if (video.paused) {
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                    bigPlayBtn.classList.remove('hidden');
                    playerContainer.classList.add('paused');
                } else {
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                    bigPlayBtn.classList.add('hidden');
                    playerContainer.classList.remove('paused');
                }
            };

            playPauseBtn.addEventListener('click', togglePlay);
            bigPlayBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);
            video.addEventListener('play', updatePlayButtonState);
            video.addEventListener('pause', updatePlayButtonState);

            // --- Progress & Seeking ---
            const handleProgress = () => {
                if (!isDragging && video.duration && !isLive) {
                    const percent = (video.currentTime / video.duration) * 100;
                    seekSlider.value = percent;
                    progressFill.style.width = `${percent}%`;
                    currentTimeEl.textContent = formatTime(video.currentTime);
                } else if (isLive) {
                    // 直播只显示当前时间
                    currentTimeEl.textContent = formatTime(video.currentTime);
                    progressFill.style.width = '100%';
                }

                // Buffered bar
                if (video.buffered.length > 0) {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const duration = video.duration;
                    if (duration > 0) {
                        bufferedBar.style.width = `${(bufferedEnd / duration) * 100}%`;
                    }
                }
            };

            video.addEventListener('timeupdate', handleProgress);

            video.addEventListener('loadedmetadata', () => {
                if (!isLive) {
                    durationEl.textContent = formatTime(video.duration);
                }
            });

            // Seek interaction (直播不可拖动)
            seekSlider.addEventListener('input', (e) => {
                if (isLive) return;
                isDragging = true;
                const val = e.target.value;
                progressFill.style.width = `${val}%`;
                currentTimeEl.textContent = formatTime((val / 100) * video.duration);
            });

            seekSlider.addEventListener('change', (e) => {
                if (isLive) return;
                isDragging = false;
                const val = e.target.value;
                if (video.duration) {
                    video.currentTime = (val / 100) * video.duration;
                }
            });

            // --- Volume ---
            const updateVolumeIcon = () => {
                if (video.muted || video.volume === 0) {
                    iconVolHigh.classList.add('hidden');
                    iconVolMute.classList.remove('hidden');
                } else {
                    iconVolHigh.classList.remove('hidden');
                    iconVolMute.classList.add('hidden');
                }
            };

            volumeSlider.addEventListener('input', (e) => {
                video.volume = e.target.value;
                video.muted = false;
                updateVolumeIcon();
            });

            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                if (video.muted) {
                    volumeSlider.value = 0;
                } else {
                    volumeSlider.value = video.volume || 1;
                }
                updateVolumeIcon();
            });

            // --- Fullscreen ---
            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    playerContainer.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            };

            fullscreenBtn.addEventListener('click', toggleFullscreen);

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    iconFullscreen.classList.add('hidden');
                    iconFullscreenExit.classList.remove('hidden');
                } else {
                    iconFullscreen.classList.remove('hidden');
                    iconFullscreenExit.classList.add('hidden');
                }
            });

            // --- Loading & Error States ---
            video.addEventListener('waiting', () => {
                loader.classList.remove('hidden');
            });

            video.addEventListener('playing', () => {
                loader.classList.add('hidden');
            });

            video.addEventListener('canplay', () => {
                loader.classList.add('hidden');
            });

            video.addEventListener('error', () => {
                loader.classList.add('hidden');
                showError('视频加载失败');
            });

            // --- Keyboard Shortcuts ---
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;

                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowRight':
                        if (!isLive) video.currentTime += 5;
                        break;
                    case 'ArrowLeft':
                        if (!isLive) video.currentTime -= 5;
                        break;
                    case 'ArrowUp':
                        video.volume = Math.min(1, video.volume + 0.1);
                        volumeSlider.value = video.volume;
                        updateVolumeIcon();
                        break;
                    case 'ArrowDown':
                        video.volume = Math.max(0, video.volume - 0.1);
                        volumeSlider.value = video.volume;
                        updateVolumeIcon();
                        break;
                    case 'KeyF':
                        toggleFullscreen();
                        break;
                }
            });

            updatePlayButtonState();
        });
    </script>
</body>
</html>
