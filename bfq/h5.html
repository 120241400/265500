﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 优化视口配置：确保全屏适配，禁止缩放 -->
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
<!-- 强化X5全屏配置 -->
<meta name="x5-fullscreen" content="true">
<meta name="x5-orientation" content="landscape|portrait">
<meta name="x5-page-mode" content="app">
<title>增强版 X5 播放器</title>
<style>
/* 1. 彻底清除滚动条，重置所有元素的溢出 */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  /* 清除滚动条（兼容多浏览器） */
  scrollbar-width: none; /* 火狐 */
  -ms-overflow-style: none; /* IE/Edge */
}
/* 清除webkit内核滚动条 */
*::-webkit-scrollbar {
  display: none;
}

/* 2. 强制html/body全屏，无溢出 */
html,body{
  width:100vw; /* 视口宽度，替代100%避免滚动 */
  height:100vh; /* 视口高度，替代100% */
  background:#000;
  overflow: hidden !important; /* 核心：禁止溢出产生滚动条 */
  position: fixed; /* 固定视口，防止位移 */
  top: 0;
  left: 0;
}

/* 3. 视频容器强制全屏，适配父容器 */
#video{
  width:100vw !important; /* 强制视口宽度 */
  height:100vh !important; /* 强制视口高度 */
  object-fit: cover; /* 改为cover（铺满），contain会留黑边；如需保持比例用contain则保留 */
  background:#000;
  display: block; /* 清除行内元素默认间距 */
}
</style>
</head>
<body>

<video id="video"
  x5-video-player-type="h5"
  x5-video-player-fullscreen="true"
  x5-video-orientation="landscape|portrait"
  playsinline
  webkit-playsinline
  controls
  crossorigin="anonymous"
></video>

<script>
const cdnList = [
  "https://gcore.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js",
  "https://cdn.jsdmirror.cn/npm/hls.js@1.4.12/dist/hls.min.js",
  "https://unpkg.com/hls.js@1.4.12/dist/hls.min.js"
];

function getUrlParam(){
  let m=new RegExp('[?&]url=([^&#]*)').exec(location.href);
  return m?decodeURIComponent(m[1]):''
}

function loadScript(idx,cb){
  if(idx>=cdnList.length)return
  let s=document.createElement('script')
  s.src=cdnList[idx]
  s.onload=cb
  s.onerror=()=>loadScript(idx+1,cb)
  document.head.appendChild(s)
}

const video=document.getElementById('video')
const m3u8Url=getUrlParam()
if(!m3u8Url)throw new Error('no url')

// 长按2倍速
let pressTimer=null
video.addEventListener('touchstart',()=>{
  pressTimer=setTimeout(()=>video.playbackRate=2,200)
})
video.addEventListener('touchend',()=>{
  clearTimeout(pressTimer)
  video.playbackRate=1
})
video.addEventListener('touchcancel',()=>{
  clearTimeout(pressTimer)
  video.playbackRate=1
})

let hls=null

loadScript(0,()=>{
  if(Hls.isSupported()){
    hls=new Hls({
      maxBufferLength:120,
      maxMaxBufferLength:300,
      enableWorker:true,
      preload:true
    })
    hls.loadSource(m3u8Url)
    hls.attachMedia(video)

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>{})
    })

    // 内嵌 iframe 终极修复：强制同步拖动
    let lastSeekTime=0
    setInterval(()=>{
      if(!hls)return
      if(Math.abs(video.currentTime-lastSeekTime)>0.5){
        try{
          hls.startLoad(video.currentTime)
        }catch(e){}
        lastSeekTime=video.currentTime
      }
    },100)
  }else{
    video.src=m3u8Url
    video.play().catch(()=>{})
  }
})

document.addEventListener('WeixinJSBridgeReady',()=>{
  video.play().catch(()=>{})
})

document.body.addEventListener('touchstart',()=>{
  video.play().catch(()=>{})
},{once:true})

// 额外：监听窗口大小变化，强制适配
window.addEventListener('resize', () => {
  video.style.width = `${window.innerWidth}px`;
  video.style.height = `${window.innerHeight}px`;
});
</script>
</body>
</html>
