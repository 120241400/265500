<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scalecale=1.0,user-scalable=no">
<meta name="x5-fullscreen" content="true">
<meta name="x5-orientation" content="landscape|portrait">
<meta name="x5-page-mode" content="app">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>

<video id="video" x5-video-player-type="h5" x5-video-player-fullscreen="true" x5-video-orientation="landscape|portrait" playsinline webkit-playsinline controls crossorigin="anonymous"></video>

<script>
const cdnList = [
  "https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js",
  "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-10-M/hls.js/1.4.12/hls.min.js",
  "https://lf26-cdn-tos.bytecdntp.com/cdn/expire-10-M/hls.js/1.4.12/hls.min.js",
  "https://unpkg.com/hls.js@1.4.12/dist/hls.min.js"
];

function getUrlParam(){let m=new RegExp('[?&]url=([^&#]*)').exec(location.href);return m?decodeURIComponent(m[1]):''}
function loadScript(idx, cb){if(idx>=cdnList.length)return;let s=document.createElement('script');s.src=cdnList[idx];s.onload=cb;s.onerror=()=>loadScript(idx+1,cb);document.head.appendChild(s)}

const video = document.getElementById('video');
const m3u8Url = getUrlParam();
if (!m3u8Url) throw new Error('no url');

loadScript(0, () => {
  if (Hls.isSupported()) {
    const hls = new Hls({
      maxBufferLength: 120,
      maxMaxBufferLength: 300,
      backBufferLength: 120,
      maxBufferSize: 256 * 1024 * 1024,
      enableWorker: true,
      preload: true
    });

    hls.loadSource(m3u8Url);
    hls.attachMedia(video);

    // 关键修复：允许拖动快进
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });

    video.ontimeupdate = function(){};
    video.onseeking = function(){
      if (hls) hls.startLoad(video.currentTime);
    };
  }
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = m3u8Url;
    video.play().catch(() => {});
  }
});

document.addEventListener('WeixinJSBridgeReady', () => { video.play().catch(() => {}); });
document.body.addEventListener('touchstart', () => { video.play().catch(() => {}); }, { once: true });
</script>
</body>
</html>
