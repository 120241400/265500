<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"> <meta name="x5-fullscreen" content="true"> <meta name="x5-video-player-type" content="h5"> <title>QQ浏览器播放器</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none } html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif } video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1 } /* 中央提示层 */ #tip { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 999; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; backdrop-filter: blur(8px); font-weight: 500 } #tip.show { opacity: 1 } /* 倍速提示 - 右上角黑色背景 */ #speedTip { position: fixed; right: 20px; top: 20px; background: rgba(0,0,0,0.85); color: #fff; padding: 8px 16px; border-radius: 20px; z-index: 1000; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 2px 12px rgba(0,0,0,0.5) } #speedTip.show { opacity: 1 } /* 加载动画 */ #loader { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 998; display: none; flex-direction: column; align-items: center; gap: 12px } #loader.show { display: flex } .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #00BFFF; border-radius: 50%; animation: spin 0.8s linear infinite } @keyframes spin { to { transform: rotate(360deg) } } /* 中心播放按钮 */ #centerPlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.2) } #centerPlay:hover { transform: translate(-50%, -50%) scale(1.1); background: rgba(0,0,0,0.8) } #centerPlay.hide { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.8) } /* 播放图标 */ .icon-play { width: 0; height: 0; border-left: 28px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px } .icon-pause { width: 24px; height: 28px; display: flex; gap: 6px } .icon-pause::before, .icon-pause::after { content: ''; width: 8px; height: 100%; background: #fff; border-radius: 2px } /* 控制栏 */ .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; align-items: center; gap: 12px; z-index: 10; opacity: 0; transition: opacity 0.3s } .controls.show { opacity: 1 } /* 播放/暂停按钮 */ .btn-play { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border: none; color: #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0 } .btn-play:hover { background: rgba(255,255,255,0.25); transform: scale(1.1) } .btn-play:active { transform: scale(0.95) } .btn-play .icon-play { margin-left: 4px; border-left-width: 14px; border-top-width: 8px; border-bottom-width: 8px } .btn-play .icon-pause { width: 12px; height: 14px; gap: 3px } .btn-play .icon-pause::before, .btn-play .icon-pause::after { width: 4px } /* 进度条 */ .progress { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; position: relative } .track { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; position: relative; overflow: hidden; transition: height 0.2s } .progress:hover .track { height: 8px } .buf { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255,255,255,0.3); width: 0; transition: width 0.3s } .bar { position: absolute; left: 0; top: 0; height: 100%; background: #00BFFF; width: 0; transition: width 0.1s linear } .thumb { position: absolute; right: -8px; top: 50%; transform: translateY(-50%) scale(0); width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.4); border: 2px solid #00BFFF } .progress:hover .thumb, .progress:active .thumb { transform: translateY(-50%) scale(1) } .time { font-size: 13px; color: #fff; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.5) } .btns { display: flex; gap: 8px; align-items: center } .btn-speed { height: 32px; padding: 0 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500 } .btn-speed:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4) } .btn-fullscreen { width: 36px; height: 36px; background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s } .btn-fullscreen:hover { background: rgba(255,255,255,0.2); transform: scale(1.1) } .btn-fullscreen svg { width: 18px; height: 18px; fill: currentColor } @media (hover: hover) and (pointer: fine) { .controls { padding: 20px 24px } .progress { height: 28px } .track { height: 6px } .btn-play { width: 44px; height: 44px } .time { font-size: 14px } } video::-webkit-media-controls { display: none !important } video::-webkit-media-controls-enclosure { display: none !important } </style> <base target="_blank"> </head> <body> <video id="v" playsinline webkit-playsinline preload="auto" x5-video-player-type="h5" controlslist="nodownload noremoteplayback" crossorigin="anonymous"></video> <div id="tip"></div> <div id="speedTip">2.0X</div> <div id="loader"><div class="spinner"></div></div> <div id="centerPlay"><div class="icon-play"></div></div> <div class="controls" id="ctrl"> <button class="btn-play" id="play"> <div class="icon-play" id="playIcon"></div> </button> <div class="progress" id="prog"> <div class="track"> <div class="buf" id="buf"></div> <div class="bar" id="bar"><div class="thumb"></div></div> </div> </div> <div class="time" id="time">00:00 / 00:00</div> <div class="btns"> <button class="btn-speed" id="spd">1.0x</button> <button class="btn-fullscreen" id="full" title="全屏"> <svg viewBox="0 0 24 24" id="fullIcon"> <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/> </svg> </button> </div> </div> <script> const $ = id => document.getElementById(id); const v = $('v'), tip = $('tip'), speedTip = $('speedTip'), loader = $('loader'), centerPlay = $('centerPlay'); const ctrl = $('ctrl'), prog = $('prog'), bar = $('bar'), buf = $('buf'), time = $('time'); const playBtn = $('play'), playIcon = $('playIcon'), spdBtn = $('spd'), fullBtn = $('full'), fullIcon = $('fullIcon'); // 状态管理 - 使用对象存储当前值，确保连续性 const state = { isLongPress: false, isDragging: false, isVertical: false, startX: 0, startY: 0, startTime: 0, startVolume: 1, // 滑动开始时的音量值 startBrightness: 1, // 滑动开始时的亮度值 currentVolume: 1, // 当前实际音量 currentBrightness: 1, // 当前实际亮度 origRate: 1, pressTimer: null, ctrlTimer: null, isFullscreen: false, speedIdx: 0, touchStartTime: 0, isPlaying: false }; const speeds = [1, 1.25, 1.5, 2, 0.5]; const LONG_PRESS_DELAY = 400; const SEEK_SENSITIVITY = 0.15; const GESTURE_STEP = 30; // 每30px调整10% // 工具函数 const fmt = t => { if(!t||isNaN(t)) return '00:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` }; const showTip = (t, d=1500) => { tip.textContent=t; tip.classList.add('show'); clearTimeout(window.tipTimer); window.tipTimer=setTimeout(()=>tip.classList.remove('show'), d) }; const showSpeedTip = () => { speedTip.classList.add('show'); }; const hideSpeedTip = () => { speedTip.classList.remove('show'); }; const showLoader = () => loader.classList.add('show'); const hideLoader = () => loader.classList.remove('show'); const showCtrl = () => { ctrl.classList.add('show'); clearTimeout(state.ctrlTimer); state.ctrlTimer=setTimeout(()=>v.paused||ctrl.classList.remove('show'), 3000) }; // 更新播放按钮图标 const updatePlayIcon = (playing) => { playIcon.className = playing ? 'icon-pause' : 'icon-play'; centerPlay.innerHTML = playing ? '' : '<div class="icon-play"></div>'; if(!playing) centerPlay.classList.remove('hide'); else centerPlay.classList.add('hide'); state.isPlaying = playing; }; // 更新全屏按钮图标 const updateFullIcon = (fullscreen) => { fullIcon.innerHTML = fullscreen ? '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>' : '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>'; }; // 更新时长显示 - 只要加载出视频就显示总时长 const updateTimeDisplay = () => { if(v.duration && !isNaN(v.duration)) { const current = fmt(v.currentTime); const total = fmt(v.duration); time.textContent = `${current} / ${total}`; return true; } return false; }; // 预加载与缓存管理器 const cacheManager = { cache: new Map(), // 使用Map存储预加载的视频片段 maxCacheSize: 3, // 最多缓存3个视频 init() { // 初始化IndexedDB用于持久化缓存 this.initDB().then(() => { console.log('缓存数据库初始化完成'); }).catch(err => { console.log('缓存数据库初始化失败，使用内存缓存:', err); }); }, async initDB() { return new Promise((resolve, reject) => { const request = indexedDB.open('VideoCache', 1); request.onerror = () => reject(request.error); request.onsuccess = () => { this.db = request.result; resolve(); }; request.onupgradeneeded = (e) => { const db = e.target.result; if(!db.objectStoreNames.contains('videos')) { db.createObjectStore('videos', { keyPath: 'url' }); } }; }); }, // 预加载视频元数据 preloadMetadata(url) { if(this.cache.has(url)) return; const tempVideo = document.createElement('video'); tempVideo.preload = 'metadata'; tempVideo.src = url; tempVideo.crossOrigin = 'anonymous'; tempVideo.onloadedmetadata = () => { this.cache.set(url, { duration: tempVideo.duration, width: tempVideo.videoWidth, height: tempVideo.videoHeight, timestamp: Date.now() }); // 清理旧缓存 if(this.cache.size > this.maxCacheSize) { const oldest = this.cache.keys().next().value; this.cache.delete(oldest); } }; tempVideo.load(); }, // 后台预加载视频片段 async preloadSegment(url, start, end) { try { const response = await fetch(url, { headers: { 'Range': `bytes=${start}-${end}` }, mode: 'cors' }); const blob = await response.blob(); return blob; } catch(e) { console.log('片段预加载失败:', e); return null; } } }; // 视频加载 const loadVideo = () => { const url = new URLSearchParams(location.search).get('url'); if(url) { const decodedUrl = decodeURIComponent(url); v.src = decodedUrl; // 预加载元数据 cacheManager.preloadMetadata(decodedUrl); // 强制加载 v.load(); // 尝试自动播放 v.play().then(() => { console.log('自动播放成功'); }).catch(() => { console.log('自动播放被阻止，等待用户交互'); updatePlayIcon(false); }); } }; // 视频事件绑定 const bindVideoEvents = () => { // 关键：loadedmetadata时立即显示总时长 v.addEventListener('loadedmetadata', () => { console.log('视频元数据加载完成，时长:', fmt(v.duration)); updateTimeDisplay(); // 立即更新显示总时长 hideLoader(); }); v.addEventListener('loadeddata', () => { updateTimeDisplay(); }); v.onplay = () => { updatePlayIcon(true); showCtrl(); }; v.onpause = () => { updatePlayIcon(false); showCtrl(); }; v.onwaiting = showLoader; v.onplaying = hideLoader; v.onended = () => { updatePlayIcon(false); showTip('播放结束'); }; v.ontimeupdate = () => { if(!v.duration) return; const pct = (v.currentTime/v.duration)*100; bar.style.width=pct+'%'; updateTimeDisplay(); // 更新当前播放时间 }; v.onprogress = () => { if(!v.duration) return; let max=0; for(let i=0;i<v.buffered.length;i++)max=Math.max(max,v.buffered.end(i)); buf.style.width=(max/v.duration*100)+'%'; }; v.onerror = () => { showTip('视频加载失败，请检查链接'); showLoader(); }; v.onstalled = () => showLoader(); }; // 播放控制 const togglePlay = () => { if(v.paused) { v.play().catch(() => showTip('点击播放')); } else { v.pause(); } }; // 倍速切换 - 显示格式改为1.0x 2.0x const toggleSpeed = () => { state.speedIdx=(state.speedIdx+1)%speeds.length; const s=speeds[state.speedIdx]; v.playbackRate=s; // 格式化为1位小数 spdBtn.textContent=s.toFixed(1)+'x'; showTip(s.toFixed(1)+'倍速'); }; // 全屏切换 const toggleFullscreen = async () => { try { if(!document.fullscreenElement) { await document.documentElement.requestFullscreen(); state.isFullscreen = true; } else { await document.exitFullscreen(); state.isFullscreen = false; } updateFullIcon(state.isFullscreen); } catch(err) { showTip('全屏失败'); } }; // 进度条控制 const bindProgressControl = () => { const seek = (e) => { if(!v.duration) return; const r=prog.getBoundingClientRect(); const x = e.clientX || (e.touches && e.touches[0].clientX); const pct = Math.max(0, Math.min(1, (x-r.left)/r.width)); v.currentTime = pct * v.duration; bar.style.width = (pct*100)+'%'; updateTimeDisplay(); }; prog.onclick = seek; prog.ontouchstart = (e) => { state.isDragging = true; seek(e); }; prog.ontouchmove = (e) => { if(state.isDragging) { e.preventDefault(); seek(e); } }; prog.ontouchend = () => { state.isDragging = false; }; prog.onmousedown = (e) => { state.isDragging = true; seek(e); }; document.onmousemove = (e) => { if(state.isDragging) seek(e); }; document.onmouseup = () => { state.isDragging = false; }; }; // 触摸手势 - 修复亮度/音量连续性 const bindTouchGestures = () => { v.ontouchstart = e => { state.touchStartTime = Date.now(); state.startX = e.touches[0].clientX; state.startY = e.touches[0].clientY; state.startTime = v.currentTime; state.isVertical = false; state.isLongPress = false; // 关键：记录滑动开始时的当前值，确保连续性 state.startVolume = state.currentVolume; state.startBrightness = state.currentBrightness; state.pressTimer = setTimeout(() => { state.isLongPress = true; state.origRate = v.playbackRate; v.playbackRate = 2; speedTip.textContent = '2.0X'; // 显示2.0X showSpeedTip(); }, LONG_PRESS_DELAY); }; v.ontouchmove = e => { if(state.isLongPress) { e.preventDefault(); return; } const dx = e.touches[0].clientX - state.startX; const dy = state.startY - e.touches[0].clientY; if(!state.isVertical && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { if(Math.abs(dx) > Math.abs(dy)) { clearTimeout(state.pressTimer); state.isVertical = false; } else { state.isVertical = true; clearTimeout(state.pressTimer); } } if(state.isVertical) { e.preventDefault(); // 使用滑动距离计算调整值，基于起始值 const steps = dy / GESTURE_STEP; // 每30px为一步 if(state.startX < innerWidth/2) { // 左侧：亮度 (10% - 100%) // 基于滑动开始时的亮度值计算 let newBright = state.startBrightness + (steps * 0.1); newBright = Math.max(0.1, Math.min(1.0, newBright)); state.currentBrightness = newBright; document.body.style.filter = `brightness(${newBright})`; showTip(`亮度 ${Math.round(newBright*100)}%`, 800); } else { // 右侧：音量 (0% - 100%) // 基于滑动开始时的音量值计算 let newVol = state.startVolume + (steps * 0.1); newVol = Math.max(0, Math.min(1, newVol)); state.currentVolume = newVol; v.volume = newVol; showTip(`音量 ${Math.round(newVol*100)}%`, 800); } } else if(Math.abs(dx) > 10 && !state.isLongPress) { e.preventDefault(); const dur = v.duration || 0; const t = Math.max(0, Math.min(dur, state.startTime + dx * SEEK_SENSITIVITY)); v.currentTime = t; bar.style.width = (t/dur*100)+'%'; updateTimeDisplay(); showTip(fmt(t), 800); } }; v.ontouchend = e => { clearTimeout(state.pressTimer); if(state.isLongPress) { v.playbackRate = state.origRate; hideSpeedTip(); } else { const touchDuration = Date.now() - state.touchStartTime; const moveDistance = Math.sqrt( Math.pow(e.changedTouches[0].clientX - state.startX, 2) + Math.pow(e.changedTouches[0].clientY - state.startY, 2) ); if(touchDuration < 300 && moveDistance < 10) { togglePlay(); } } setTimeout(()=>tip.classList.remove('show'), 200); }; }; // 键盘快捷键 const bindKeyboardShortcuts = () => { document.onkeydown = (e) => { switch(e.code) { case 'Space': e.preventDefault(); togglePlay(); break; case 'ArrowLeft': v.currentTime = Math.max(0, v.currentTime - 5); showTip('快退 5s'); updateTimeDisplay(); break; case 'ArrowRight': v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); showTip('快进 5s'); updateTimeDisplay(); break; case 'KeyF': toggleFullscreen(); break; } }; }; // 初始化 const init = () => { // 初始化音量 state.currentVolume = v.volume || 1; playBtn.onclick = togglePlay; centerPlay.onclick = togglePlay; spdBtn.onclick = toggleSpeed; fullBtn.onclick = toggleFullscreen; bindVideoEvents(); bindProgressControl(); bindTouchGestures(); bindKeyboardShortcuts(); // 初始化缓存管理器 cacheManager.init(); // 加载视频 loadVideo(); // 点击显示控制栏 document.onclick = e => { if(!e.target.closest('.controls') && !e.target.closest('#centerPlay')) { showCtrl(); } }; // 阻止默认触摸滚动 document.ontouchmove = e => e.preventDefault(); // 初始显示控制栏 setTimeout(showCtrl, 100); }; // 启动 init(); </script> </body> </html>
