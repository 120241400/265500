<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        /* 播放器容器 */
        .video-player {
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        
        /* 自定义播放器控制栏 */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 15px 10px 10px;
            display: none;
            z-index: 100;
        }
        
        /* 控制按钮 */
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            padding: 5px 10px;
            cursor: pointer;
        }
        
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-filled {
            position: absolute;
            height: 100%;
            background: #ff4444;
            border-radius: 2px;
            width: 0;
        }
        
        /* 倍速选择 */
        .speed-selector {
            position: absolute;
            bottom: 50px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            border: 1px solid #333;
            display: none;
            z-index: 101;
        }
        
        .speed-option {
            padding: 8px 12px;
            cursor: pointer;
        }
        
        .speed-option:hover {
            background: #333;
        }
        
        /* 音量控制 */
        .volume-slider {
            width: 60px;
            position: absolute;
            bottom: 50px;
            right: 50px;
            display: none;
        }
        
        /* 错误提示 */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            display: none;
        }
        
        /* 微信播放器样式 */
        .wechat-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }
        
        /* 微信播放器全屏按钮 */
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1001;
        }
        
        /* 微信播放器控件容器 */
        .wechat-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            display: none;
        }
        
        /* 播放/暂停按钮 */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- 标准播放器模式 -->
    <div class="video-wrapper" id="standardMode">
        <video 
            id="videoPlayer"
            class="video-player"
            playsinline
            webkit-playsinline
            preload="auto"
        ></video>
        
        <button class="play-btn" id="playBtn">▶</button>
        
        <!-- 自定义控制栏 -->
        <div class="custom-controls" id="customControls">
            <div style="display: flex; align-items: center; margin-bottom: 5px;">
                <button class="control-btn" id="playPauseBtn">⏸</button>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                </div>
                <div style="margin-left: 10px;">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <button class="control-btn" id="speedBtn">倍速</button>
                    <button class="control-btn" id="volumeBtn">音量</button>
                </div>
                <button class="control-btn" id="fullscreenBtn">⛶</button>
            </div>
        </div>
        
        <!-- 倍速选择 -->
        <div class="speed-selector" id="speedSelector">
            <div class="speed-option" data-speed="0.5">0.5x</div>
            <div class="speed-option" data-speed="0.75">0.75x</div>
            <div class="speed-option" data-speed="1">1.0x</div>
            <div class="speed-option" data-speed="1.25">1.25x</div>
            <div class="speed-option" data-speed="1.5">1.5x</div>
            <div class="speed-option" data-speed="2">2.0x</div>
        </div>
        
        <!-- 音量控制 -->
        <input 
            type="range" 
            class="volume-slider" 
            id="volumeSlider"
            min="0" 
            max="1" 
            step="0.1" 
            value="1"
        >
        
        <!-- 错误提示 -->
        <div class="error-message" id="errorMessage"></div>
    </div>
    
    <!-- 微信播放器模式 -->
    <div class="wechat-mode" id="wechatMode" style="display: none;">
        <div id="wechatVideoWrapper" style="width: 100%; height: 100%;"></div>
        <button class="fullscreen-btn" id="wechatFullscreenBtn">全屏</button>
    </div>

    <script>
        // 检测微信浏览器
        function isWeChatBrowser() {
            return /micromessenger/i.test(navigator.userAgent);
        }
        
        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // 隐藏错误
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        // 初始化标准播放器
        function initStandardPlayer() {
            const videoUrl = getUrlParam('url');
            if (!videoUrl) {
                showError('请提供视频URL参数，例如：?url=your_video.m3u8');
                return;
            }
            
            const video = document.getElementById('videoPlayer');
            const playBtn = document.getElementById('playBtn');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const speedBtn = document.getElementById('speedBtn');
            const volumeBtn = document.getElementById('volumeBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const speedSelector = document.getElementById('speedSelector');
            const volumeSlider = document.getElementById('volumeSlider');
            const progressBar = document.getElementById('progressBar');
            const progressFilled = document.getElementById('progressFilled');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');
            
            // 设置视频源
            video.src = videoUrl;
            
            // 添加controls属性
            video.setAttribute('controls', 'true');
            
            // 播放/暂停控制
            playBtn.addEventListener('click', () => {
                video.play();
                playBtn.style.display = 'none';
            });
            
            video.addEventListener('play', () => {
                playBtn.style.display = 'none';
                playPauseBtn.textContent = '⏸';
            });
            
            video.addEventListener('pause', () => {
                playPauseBtn.textContent = '▶';
            });
            
            playPauseBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
            
            // 倍速控制
            let currentSpeed = 1;
            speedBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speedSelector.style.display = speedSelector.style.display === 'block' ? 'none' : 'block';
            });
            
            document.querySelectorAll('.speed-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    const speed = parseFloat(e.target.dataset.speed);
                    video.playbackRate = speed;
                    currentSpeed = speed;
                    speedBtn.textContent = `${speed}x`;
                    speedSelector.style.display = 'none';
                });
            });
            
            // 音量控制
            volumeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                volumeSlider.style.display = volumeSlider.style.display === 'block' ? 'none' : 'block';
            });
            
            volumeSlider.addEventListener('input', (e) => {
                video.volume = e.target.value;
            });
            
            // 全屏控制
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`全屏请求失败: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });
            
            // 进度条控制
            function updateProgress() {
                const percent = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(video.currentTime);
            }
            
            video.addEventListener('timeupdate', updateProgress);
            
            video.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(video.duration);
            });
            
            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                video.currentTime = pos * video.duration;
            });
            
            // 显示/隐藏控制栏
            let controlsTimeout;
            const customControls = document.getElementById('customControls');
            
            function showControls() {
                customControls.style.display = 'block';
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        customControls.style.display = 'none';
                    }
                }, 3000);
            }
            
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
            
            video.addEventListener('mousemove', showControls);
            video.addEventListener('touchstart', showControls);
            
            // 监听播放结束
            video.addEventListener('ended', () => {
                playBtn.style.display = 'block';
                playBtn.textContent = '▶';
            });
            
            // 处理HLS视频
            if (videoUrl.includes('.m3u8')) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari等原生支持HLS
                    video.src = videoUrl;
                } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    // 使用hls.js
                    const hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        console.log('HLS视频加载完成');
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            showError('视频加载失败，请检查视频源');
                        }
                    });
                } else {
                    showError('您的浏览器不支持HLS视频播放');
                }
            }
            
            // 点击其他地方关闭控制菜单
            document.addEventListener('click', (e) => {
                if (!speedSelector.contains(e.target) && e.target !== speedBtn) {
                    speedSelector.style.display = 'none';
                }
                if (!volumeSlider.contains(e.target) && e.target !== volumeBtn) {
                    volumeSlider.style.display = 'none';
                }
            });
        }
        
        // 初始化微信播放器模式
        function initWechatPlayer() {
            const videoUrl = getUrlParam('url');
            if (!videoUrl) {
                showError('请提供视频URL参数，例如：?url=your_video.m3u8');
                return;
            }
            
            const standardMode = document.getElementById('standardMode');
            const wechatMode = document.getElementById('wechatMode');
            const videoWrapper = document.getElementById('wechatVideoWrapper');
            const fullscreenBtn = document.getElementById('wechatFullscreenBtn');
            
            // 切换到微信模式
            standardMode.style.display = 'none';
            wechatMode.style.display = 'block';
            
            // 创建微信专用video元素
            const video = document.createElement('video');
            video.id = 'wechatVideo';
            video.src = videoUrl;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'contain';
            video.style.backgroundColor = '#000';
            
            // 微信专用属性
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.setAttribute('x5-playsinline', 'true');
            video.setAttribute('x5-video-player-type', 'h5');
            video.setAttribute('x5-video-player-fullscreen', 'true');
            video.setAttribute('controls', 'true');
            
            // 添加到页面
            videoWrapper.innerHTML = '';
            videoWrapper.appendChild(video);
            
            // 全屏按钮
            fullscreenBtn.addEventListener('click', () => {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.mozRequestFullScreen) {
                    video.mozRequestFullScreen();
                }
            });
            
            // 自动播放处理
            video.play().catch(e => {
                console.log('自动播放失败，用户需点击播放');
                // 显示播放按钮
                const playBtn = document.createElement('button');
                playBtn.textContent = '播放视频';
                playBtn.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    padding: 15px 30px;
                    background: #ff4444;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    font-size: 16px;
                    cursor: pointer;
                `;
                playBtn.addEventListener('click', () => {
                    video.play();
                    playBtn.remove();
                });
                videoWrapper.appendChild(playBtn);
            });
            
            // 监听播放状态
            video.addEventListener('play', () => {
                fullscreenBtn.style.display = 'none';
            });
            
            video.addEventListener('pause', () => {
                fullscreenBtn.style.display = 'block';
            });
        }
        
        // 页面加载完成
        window.addEventListener('DOMContentLoaded', function() {
            const videoUrl = getUrlParam('url');
            if (!videoUrl) {
                showError('请提供视频URL参数，例如：?url=your_video.m3u8');
                return;
            }
            
            if (isWeChatBrowser()) {
                // 微信环境
                console.log('微信浏览器，启用微信播放器模式');
                
                // 创建微信专用video
                initWechatPlayer();
                
            } else {
                // 非微信环境
                console.log('非微信浏览器，使用标准播放器');
                
                // 加载hls.js库
                if (videoUrl.includes('.m3u8')) {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                    script.onload = initStandardPlayer;
                    script.onerror = function() {
                        console.warn('hls.js加载失败，尝试使用原生播放');
                        initStandardPlayer();
                    };
                    document.head.appendChild(script);
                } else {
                    initStandardPlayer();
                }
            }
            
            // 防止页面滚动
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        });
    </script>
</body>
</html>
