<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aliplayer 智能播放器</title>
    <link rel="stylesheet" href="https://g.alicdn.com/de/prismplayer/2.9.3/skins/default/aliplayer-min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }

        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 隐藏字幕按钮 */
        .prism-cc-btn {
            display: none !important;
        }

        /* 错误提示样式 - 文字形式，无弹窗 */
        .error-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            text-align: center;
            display: none;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
        }

        .error-tip.show {
            display: block;
        }

        /* 手势提示 */
        .gesture-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .gesture-hint.show {
            opacity: 1;
        }

        /* 短剧竖屏适配 */
        .short-video-mode video {
            object-fit: contain !important;
            height: 100% !important;
            width: auto !important;
            max-width: 100% !important;
        }

        /* 全屏时的竖屏短剧样式 */
        .prism-fullscreen.short-video-mode video {
            object-fit: contain !important;
        }

        /* 进度条自动隐藏 */
        .prism-controlbar {
            transition: opacity 0.3s ease;
        }

        .prism-controlbar.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* 进度条hover时不隐藏 */
        .prism-controlbar:hover {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* 双击时的视觉反馈 */
        .double-tap-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 998;
        }

        .double-tap-indicator.show {
            opacity: 1;
            animation: tapPulse 0.3s ease;
        }

        @keyframes tapPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div id="player-container">
        <div id="player"></div>
        <div class="error-tip" id="errorTip">视频加载失败，请检查链接或网络</div>
        <div class="gesture-hint" id="gestureHint"></div>
        <div class="double-tap-indicator" id="tapIndicator"></div>
    </div>

    <script src="https://g.alicdn.com/de/prismplayer/2.9.3/aliplayer-min.js"></script>
    <script src="https://player.alicdn.com/aliplayer/presentation/js/aliplayercomponents.min.js"></script>

    <script>
        // 获取URL参数
        function getUrlParam(name) {
            const reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            const r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        // 格式化时间为 HH:MM:SS 或 MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";

            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        const videoUrl = getUrlParam('url');
        const errorTip = document.getElementById('errorTip');
        const gestureHint = document.getElementById('gestureHint');
        const tapIndicator = document.getElementById('tapIndicator');

        // 全局状态变量 - 用于记忆音量和亮度
        let currentVolume = 0.8;  // 默认音量80%
        let currentBrightness = 100;  // 默认亮度100%
        let lastSetVolume = 0.8;  // 上次设置的音量
        let lastSetBrightness = 100;  // 上次设置的亮度
        let dragStartValue = 0; // 拖动起始值（音量/亮度）

        if (!videoUrl) {
            errorTip.textContent = '请提供视频地址，格式: ?url=视频地址';
            errorTip.classList.add('show');
        } else {
            // 初始化播放器
            const player = new Aliplayer({
                id: 'player',
                source: videoUrl,
                width: '100%',
                height: '100%',
                autoplay: false,
                preload: true,
                cover: '',
                // 预加载240秒
                playsinline: true,
                // 关键配置：预加载
                loadVideoTimeout: 240000,
                // 启用H5模式以获得更好的移动端支持
                useH5Prism: true,
                // 启用原生控件以支持重力感应
                useNativeControls: false,
                // 倍速播放配置
                skinLayout: [
                    {name: "bigPlayButton", align: "cc", x: 30, y: 80},
                    {name: "H5Loading", align: "cc"},
                    {name: "errorDisplay", align: "tlabs", x: 0, y: 0},
                    {name: "infoDisplay"},
                    {name: "tooltip", align: "blabs", x: 0, y: 56},
                    {name: "thumbnail"},
                    {
                        name: "controlBar", align: "blabs", x: 0, y: 0,
                        children: [
                            {name: "progress", align: "blabs", x: 0, y: 44},
                            {name: "playButton", align: "tl", x: 15, y: 12},
                            {name: "timeDisplay", align: "tl", x: 10, y: 7},
                            {name: "fullScreenButton", align: "tr", x: 10, y: 12},
                            {name: "setting", align: "tr", x: 15, y: 12},  // 设置按钮
                            {name: "volume", align: "tr", x: 5, y: 10}
                        ]
                    }
                ]
            }, function(player) {
                console.log('播放器创建成功');

                // 检测是否为短剧（竖屏视频）
                player.on('loadedmetadata', function() {
                    const video = player._el.querySelector('video');
                    if (video) {
                        const isPortrait = video.videoHeight > video.videoWidth;
                        if (isPortrait) {
                            document.body.classList.add('short-video-mode');
                        }
                        // 初始化音量
                        video.volume = currentVolume;
                    }
                });

                // 错误处理 - 显示文字提示，无弹窗
                player.on('error', function(e) {
                    errorTip.classList.add('show');
                    console.error('播放错误:', e);
                });

                // 隐藏错误提示当播放正常时
                player.on('play', function() {
                    errorTip.classList.remove('show');
                });

                // 音量变化时更新记忆值
                player.on('volumechange', function() {
                    const video = getVideoElement();
                    if (video) {
                        currentVolume = video.volume;
                        lastSetVolume = video.volume;
                    }
                });
            });

            // 获取或创建视频元素引用
            function getVideoElement() {
                return document.querySelector('.prism-player video') || 
                       document.querySelector('#player video');
            }

            // 显示手势提示
            function showHint(text) {
                gestureHint.textContent = text;
                gestureHint.classList.add('show');
                setTimeout(() => {
                    gestureHint.classList.remove('show');
                }, 1000);
            }

            // 显示双击反馈
            function showTapFeedback() {
                tapIndicator.classList.add('show');
                setTimeout(() => {
                    tapIndicator.classList.remove('show');
                }, 300);
            }

            // 进度条自动隐藏控制
            let controlBarHideTimer = null;
            const controlBar = document.querySelector('.prism-controlbar');

            function showControlBar() {
                if (controlBar) {
                    controlBar.classList.remove('hide');
                }
                // 清除之前的定时器
                if (controlBarHideTimer) {
                    clearTimeout(controlBarHideTimer);
                }
                // 3秒后隐藏
                controlBarHideTimer = setTimeout(() => {
                    // 检查是否正在交互
                    if (!isDragging && controlBar) {
                        controlBar.classList.add('hide');
                    }
                }, 3000);
            }

            // 监听播放器交互来显示控制条
            const playerEl = document.getElementById('player');

            // 鼠标/触摸移动时显示控制条
            playerEl.addEventListener('mousemove', showControlBar);
            playerEl.addEventListener('touchstart', showControlBar);

            // 移动端手势控制
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;
            let isLongPress = false;
            let longPressTimer = null;
            let isDragging = false;
            let dragType = null; // 'progress', 'volume', 'brightness'
            let dragStartTime = 0; // 拖动开始时的播放时间（秒）

            // 双击检测
            let lastTapTime = 0;
            let lastTapX = 0;
            let lastTapY = 0;

            // 触摸开始
            playerEl.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;

                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTime = Date.now();
                isDragging = false;
                dragType = null;

                // 双击检测 (300ms内，距离小于40px)
                const now = Date.now();
                const timeDiff = now - lastTapTime;
                const distance = Math.sqrt(
                    Math.pow(touch.clientX - lastTapX, 2) + 
                    Math.pow(touch.clientY - lastTapY, 2)
                );

                if (timeDiff < 300 && distance < 40) {
                    // 双击 - 暂停/播放
                    e.preventDefault();
                    clearTimeout(longPressTimer);

                    showTapFeedback();

                    if (player) {
                        if (player.paused && player.paused()) {
                            player.play();
                            showHint('播放');
                        } else {
                            player.pause();
                            showHint('暂停');
                        }
                    }

                    lastTapTime = 0; // 重置，防止三连击误判
                    return;
                }

                lastTapTime = now;
                lastTapX = touch.clientX;
                lastTapY = touch.clientY;

                // 长按检测（2倍速）
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    if (player && player.setSpeed) {
                        player.setSpeed(2);
                        showHint('2倍速播放');
                    }
                }, 500);
            }, {passive: false});

            // 触摸移动
            playerEl.addEventListener('touchmove', function(e) {
                if (e.touches.length !== 1) return;

                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                const absX = Math.abs(deltaX);
                const absY = Math.abs(deltaY);

                // 取消长按
                if (absX > 10 || absY > 10) {
                    clearTimeout(longPressTimer);
                }

                // 确定拖动类型
                if (!isDragging && (absX > 30 || absY > 30)) {
                    isDragging = true;
                    const screenWidth = window.innerWidth;

                    if (absX > absY) {
                        // 水平滑动 - 快进/快退
                        dragType = 'progress';
                        // 使用 Aliplayer API 获取当前播放时间
                        dragStartTime = player && player.getCurrentTime ? player.getCurrentTime() : 0;
                    } else {
                        // 垂直滑动 - 根据位置判断音量或亮度
                        if (touchStartX < screenWidth / 2) {
                            dragType = 'brightness'; // 左侧亮度
                            dragStartValue = lastSetBrightness; // 使用上次设置的亮度作为基准
                        } else {
                            dragType = 'volume'; // 右侧音量
                            dragStartValue = lastSetVolume; // 使用上次设置的音量作为基准
                        }
                    }
                }

                if (isDragging) {
                    e.preventDefault();
                    const video = getVideoElement();

                    if (dragType === 'progress') {
                        // 滑动快进/快退 - 实时更新进度条和时间显示
                        const duration = player && player.getDuration ? player.getDuration() : (video ? video.duration : 0);
                        const seekRatio = (deltaX / window.innerWidth) * 0.5;
                        const newTime = Math.max(0, Math.min(duration, dragStartTime + seekRatio * duration));
                        
                        // 实时更新进度条
                        const progressBar = document.querySelector('.prism-progress-played');
                        const progressDot = document.querySelector('.prism-progress-dot');
                        if (progressBar && duration > 0) {
                            const progressPercent = (newTime / duration) * 100;
                            progressBar.style.width = `${progressPercent}%`;
                            if (progressDot) {
                                progressDot.style.left = `${progressPercent}%`;
                            }
                        }
                        
                        // 实时更新时间显示
                        const timeDisplay = document.querySelector('.prism-time-display');
                        if (timeDisplay) {
                            const currentTimeStr = formatTime(newTime);
                            const durationStr = formatTime(duration);
                            timeDisplay.textContent = `${currentTimeStr}/${durationStr}`;
                        }
                        
                        // 简化提示文案，仅显示目标时间
                        const currentTimeStr = formatTime(newTime);
                        if (Math.abs(deltaX) > 20) {
                            showHint(currentTimeStr);
                        }
                    } else if (dragType === 'volume') {
                        // 滑动调节音量 - 基于上次设置的值
                        const deltaPercent = -(deltaY / window.innerHeight) * 1.5;
                        const newVolume = Math.max(0, Math.min(1, dragStartValue + deltaPercent));

                        if (video) {
                            video.volume = newVolume;
                            currentVolume = newVolume;
                        }
                        showHint(`音量 ${Math.round(newVolume * 100)}%`);
                    } else if (dragType === 'brightness') {
                        // 滑动调节亮度 - 基于上次设置的值，最高100%
                        const deltaPercent = -(deltaY / window.innerHeight) * 100;
                        const newBrightness = Math.max(0, Math.min(100, dragStartValue + deltaPercent));

                        // 通过CSS filter调节亮度，最低30%保证可见
                        const brightnessValue = Math.max(0.3, newBrightness / 100);
                        playerEl.style.filter = `brightness(${brightnessValue})`;

                        currentBrightness = newBrightness;
                        showHint(`亮度 ${Math.round(newBrightness)}%`);
                    }
                }
            }, {passive: false});

            // 触摸结束
            playerEl.addEventListener('touchend', function(e) {
                clearTimeout(longPressTimer);

                const video = getVideoElement();

                if (isLongPress) {
                    // 恢复倍速
                    if (player && player.setSpeed) {
                        player.setSpeed(1);
                    }
                }

                if (isDragging && dragType === 'progress' && player) {
                    // 应用进度跳转 - 使用 Aliplayer seek 方法
                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const duration = player.getDuration ? player.getDuration() : 0;
                    const seekRatio = (deltaX / window.innerWidth) * 0.5;
                    const newTime = Math.max(0, Math.min(duration, dragStartTime + seekRatio * duration));
                    
                    // 使用 player.seek() 跳转到目标时间
                    player.seek(newTime);
                }

                // 保存最终设置的值作为下次的基准
                if (dragType === 'volume') {
                    lastSetVolume = currentVolume;
                } else if (dragType === 'brightness') {
                    lastSetBrightness = currentBrightness;
                }

                // 延迟重置拖动状态，让控制条有机会保持显示
                setTimeout(() => {
                    isDragging = false;
                    dragType = null;
                    // 重新开始控制条隐藏计时
                    showControlBar();
                }, 100);
            });

            // 监听全屏变化，自动适配短剧
            player.on('requestFullScreen', function() {
                const video = getVideoElement();
                if (video && video.videoHeight > video.videoWidth) {
                    // 竖屏视频全屏时强制竖屏
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('portrait').catch(() => {});
                    }
                }
            });

            player.on('cancelFullScreen', function() {
                // 退出全屏时解锁方向
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });

            // 重力感应支持
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(e) {
                    // Aliplayer 内部已处理重力感应全屏切换
                });
            }

            // 预加载处理 - 设置视频预加载属性
            setTimeout(() => {
                const video = getVideoElement();
                if (video) {
                    video.preload = "auto";
                    video.volume = currentVolume;
                    // 尝试预加载240秒内容
                    if (video.buffered && video.buffered.length > 0) {
                        try {
                            video.currentTime = 0;
                        } catch(e) {}
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
