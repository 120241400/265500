<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>忘情ffplayer</title>
    <!-- 保留核心样式文件 -->
    <link rel="stylesheet" type="text/css" href="./1.css">
</head>
<body onload="init()">
    <!-- 播放器容器 -->
    <div id="a1"></div>

    <!-- 引入播放器核心JS -->
    <script src="./2.js"></script>
    <script src="./3.js"></script>

    <script type="text/javascript">
        // 核心配置变量（仅保留使用到的）
        Artplayer.DEGUG = false;
        const videoid = "98f13708210194c475687be6106a3b84";
        
        // Cookie操作工具函数（播放进度缓存）
        function setCookie(name, value) {
            const Days = 30;
            const exp = new Date();
            exp.setTime(exp.getTime() + Days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${escape(value)};expires=${exp.toGMTString()}`;
        }

        function getCookie(name) {
            const arr = document.cookie.match(new RegExp(`(^| )${name}=([^;]*)(;|$)`));
            return arr ? unescape(arr[2]) : null;
        }

        // 播放进度保存
        function timeHandler(t) {
            if (t > -1) setCookie(`${videoid}_time`, t);
        }

        // 初始化播放器
        function init() {
            // 解析URL参数中的播放地址
            let playUrl = "";
            if (location.search) {
                const myurl = new URLSearchParams(location.search.substring(1)).get('url');
                if (myurl) playUrl = myurl;
            }

            // 获取缓存的播放进度
            let cookieTime = getCookie(`${videoid}_time`);
            cookieTime = cookieTime ? Number(cookieTime) : 0;

            // 初始化Artplayer播放器
            const art = new Artplayer({
                container: '#a1',
                url: playUrl,
                autoplay: true,
                autoSize: false,
                loop: false,
                mutex: true,
                pip: true,
                setting: true,
                flip: false,
                lock: true,
                fastForward: true,
                playbackRate: true,
                aspectRatio: true,
                theme: '#ff0057',
                fullscreen: true,
                fullscreenWeb: true,
                miniProgressBar: true,
                autoOrientation: true,
                airplay: false,
                whitelist: ['*'], // 移除重复配置
                // 自定义m3u8格式支持
                customType: {
                    m3u8: function (video, url) {
                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        } else {
                            art.notice.show = '不支持播放格式：m3u8';
                        }
                    }
                }
            });

            // 监听播放时间变化，保存进度
            art.on('timeupdate', (info) => {
                timeHandler(info.currentTime);
            });

            // 如果有缓存进度，跳转到对应位置
            if (cookieTime > 0) {
                art.seek(cookieTime);
            }
        }

        // 屏蔽全局错误（保留原有需求）
        window.onerror = function () {
            return true;
        };
    </script>
</body>
</html>
