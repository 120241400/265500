<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200关数独挑战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: '微软雅黑', sans-serif; }
        body { 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { 
            width: 100%; 
            max-width: 520px; 
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        /* 选关界面样式 */
        #level-select { display: none; }
        .title { 
            text-align: center; 
            color: #333; 
            margin-bottom: 20px; 
            font-size: 28px;
            font-weight: bold;
        }
        .difficulty-tag { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 14px; 
            color: #666;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .tag-easy { color: #2ecc71; }
        .tag-medium { color: #f39c12; }
        .tag-hard { color: #e74c3c; }
        .level-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .level-btn {
            padding: 16px 0; 
            border: none; 
            border-radius: 10px; 
            background: #f8f9fa; 
            font-size: 16px;
            font-weight: 500;
            cursor: pointer; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
            transition: all 0.2s;
            color: #333;
        }
        .level-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            background: #e9ecef;
        }
        .level-btn.completed { 
            background: #2ecc71; 
            color: white; 
        }
        .level-btn.current { 
            background: #3498db; 
            color: white; 
        }
        .level-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 游戏界面样式 */
        #game-board { display: none; }
        .game-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
            gap: 12px;
        }
        .level-info { 
            font-size: 20px; 
            font-weight: bold; 
            color: #333;
        }
        .game-btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .game-btn {
            padding: 8px 16px; 
            border: none; 
            border-radius: 8px; 
            background: #3498db; 
            color: white;
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.2s;
        }
        .game-btn:hover { 
            background: #2980b9; 
            transform: translateY(-1px);
        }
        .game-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .sudoku-grid {
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            gap: 1px; 
            background: #2c3e50;
            border: 2px solid #2c3e50; 
            margin-bottom: 24px;
            border-radius: 4px;
            overflow: hidden;
        }
        .sudoku-cell {
            background: white; 
            aspect-ratio: 1; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer;
            user-select: none; 
            position: relative;
            transition: background 0.2s;
        }
        .sudoku-cell.fixed { 
            background: #ecf0f1; 
            color: #2c3e50; 
            pointer-events: none; 
        }
        .sudoku-cell.selected { 
            background: #d6eaf8; 
        }
        .sudoku-cell.error { 
            color: #e74c3c; 
            background: #fadbd8; 
        }
        /* 3x3宫格粗边框 */
        .sudoku-cell:nth-child(3n) { 
            border-right: 2px solid #2c3e50; 
        }
        .sudoku-cell:nth-child(9n) { 
            border-right: none; 
        }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { 
            border-bottom: 2px solid #2c3e50; 
        }

        .number-pad { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
        }
        .num-btn {
            padding: 16px 0; 
            border: none; 
            border-radius: 10px; 
            background: #f8f9fa; 
            font-size: 20px;
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
            transition: all 0.2s;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .num-btn:hover { 
            background: #e9ecef; 
            transform: translateY(-1px);
        }
        .num-btn.clear { 
            background: #e74c3c; 
            color: white; 
        }
        .num-btn.clear:hover { 
            background: #c0392b; 
        }
        
        /* 弹窗样式 */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            max-width: 90%;
            width: 360px;
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h2 { 
            color: #2ecc71; 
            margin-bottom: 16px; 
            font-size: 26px;
        }
        .modal-content p { 
            margin-bottom: 24px; 
            color: #666; 
            font-size: 16px;
        }
        .modal-btn {
            padding: 12px 28px; 
            border: none; 
            border-radius: 8px; 
            background: #3498db; 
            color: white;
            cursor: pointer; 
            font-size: 16px; 
            margin: 0 8px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .modal-btn:hover { 
            background: #2980b9; 
            transform: translateY(-1px);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            .title {
                font-size: 24px;
            }
            .difficulty-tag {
                gap: 12px;
                font-size: 12px;
            }
            .level-grid {
                gap: 8px;
            }
            .level-btn {
                padding: 12px 0;
                font-size: 14px;
            }
            .level-info {
                font-size: 18px;
            }
            .game-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .sudoku-cell {
                font-size: 18px;
            }
            .num-btn {
                padding: 12px 0;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 选关界面 -->
        <div id="level-select">
            <h1 class="title">数独挑战 200关</h1>
            <div class="difficulty-tag">
                <span class="tag-easy">■ 简单 1-60关</span>
                <span class="tag-medium">■ 中等 61-130关</span>
                <span class="tag-hard">■ 困难 131-200关</span>
            </div>
            <div class="level-grid" id="level-grid"></div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-board">
            <div class="game-header">
                <div class="level-info" id="level-info">第 1 关</div>
                <div class="game-btn-group">
                    <button class="game-btn" id="prev-btn" onclick="prevLevel()">上一关</button>
                    <button class="game-btn" id="next-btn" onclick="nextLevel()">下一关</button>
                    <button class="game-btn" onclick="goToSelect()">选关</button>
                    <button class="game-btn" onclick="resetLevel()">重置</button>
                </div>
            </div>
            <div class="sudoku-grid" id="sudoku-grid"></div>
            <div class="number-pad">
                <button class="num-btn" onclick="inputNumber(1)">1</button>
                <button class="num-btn" onclick="inputNumber(2)">2</button>
                <button class="num-btn" onclick="inputNumber(3)">3</button>
                <button class="num-btn" onclick="inputNumber(4)">4</button>
                <button class="num-btn" onclick="inputNumber(5)">5</button>
                <button class="num-btn" onclick="inputNumber(6)">6</button>
                <button class="num-btn" onclick="inputNumber(7)">7</button>
                <button class="num-btn" onclick="inputNumber(8)">8</button>
                <button class="num-btn" onclick="inputNumber(9)">9</button>
                <button class="num-btn clear" onclick="inputNumber(0)">清除</button>
            </div>
        </div>
    </div>

    <!-- 胜利弹窗 -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>🎉 恭喜通关！</h2>
            <p id="win-msg">你完成了第 X 关</p>
            <button class="modal-btn" onclick="nextLevel()">下一关</button>
            <button class="modal-btn" onclick="goToSelect()">返回选关</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentLevel = 1;
        let solution = [];
        let puzzle = [];
        let selectedCell = null;
        let completedLevels = parseInt(localStorage.getItem('sudoku_completed') || '0');

        // 伪随机数生成器（保证同一关卡题目固定）
        function seededRandom(seed) {
            let state = seed;
            return function() {
                state = (1664525 * state + 1013904223) % 4294967296;
                return state / 4294967296;
            };
        }

        // 生成完整数独终盘
        function generateFullSudoku(seed) {
            const random = seededRandom(seed);
            const board = Array(9).fill().map(() => Array(9).fill(0));
            
            // 随机填充第一行
            const firstRow = [1,2,3,4,5,6,7,8,9].sort(() => random() - 0.5);
            for (let i = 0; i < 9; i++) board[0][i] = firstRow[i];
            
            // 回溯填充剩余格子
            function fill(board) {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (board[i][j] === 0) {
                            const nums = [1,2,3,4,5,6,7,8,9].sort(() => random() - 0.5);
                            for (let num of nums) {
                                if (isValid(board, i, j, num)) {
                                    board[i][j] = num;
                                    if (fill(board)) return true;
                                    board[i][j] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }
            
            fill(board);
            return board;
        }

        // 检查数字放置是否合法
        function isValid(board, row, col, num) {
            // 检查行
            for (let i = 0; i < 9; i++) {
                if (board[row][i] === num && i !== col) return false;
            }
            // 检查列
            for (let i = 0; i < 9; i++) {
                if (board[i][col] === num && i !== row) return false;
            }
            // 检查3x3宫
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[boxRow + i][boxCol + j] === num && (boxRow + i !== row || boxCol + j !== col)) return false;
                }
            }
            return true;
        }

        // 挖洞生成唯一解题目
        function generatePuzzle(level) {
            const seed = level * 1000;
            const fullBoard = generateFullSudoku(seed);
            solution = fullBoard.map(row => [...row]);
            const puzzleBoard = fullBoard.map(row => [...row]);
            
            // 根据难度设置挖洞数量
            let holeCount;
            if (level <= 60) holeCount = 35; // 简单
            else if (level <= 130) holeCount = 45; // 中等
            else holeCount = 55; // 困难
            
            let holes = 0;
            while (holes < holeCount) {
                const row = Math.floor(Math.random() * 9);
                const col = Math.floor(Math.random() * 9);
                if (puzzleBoard[row][col] !== 0) {
                    const backup = puzzleBoard[row][col];
                    puzzleBoard[row][col] = 0;
                    if (countSolutions(puzzleBoard) !== 1) {
                        puzzleBoard[row][col] = backup;
                    } else {
                        holes++;
                    }
                }
            }
            return puzzleBoard;
        }

        // 计算解的个数（保证唯一解）
        function countSolutions(board) {
            let count = 0;
            function solve(b) {
                if (count >= 2) return;
                let empty = null;
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (b[i][j] === 0) {
                            empty = [i, j];
                            break;
                        }
                    }
                    if (empty) break;
                }
                if (!empty) {
                    count++;
                    return;
                }
                const [row, col] = empty;
                for (let num = 1; num <= 9; num++) {
                    if (isValid(b, row, col, num)) {
                        b[row][col] = num;
                        solve(b);
                        b[row][col] = 0;
                    }
                }
            }
            const boardCopy = board.map(row => [...row]);
            solve(boardCopy);
            return count;
        }

        // 渲染选关界面
        function renderLevelSelect() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 200; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = i;
                if (i <= completedLevels) btn.classList.add('completed');
                if (i === currentLevel) btn.classList.add('current');
                btn.onclick = () => startLevel(i);
                grid.appendChild(btn);
            }
        }

        // 开始指定关卡
        function startLevel(level) {
            currentLevel = level;
            puzzle = generatePuzzle(level);
            solution = solution || generateFullSudoku(level * 1000);
            selectedCell = null;

            // 更新关卡切换按钮状态
            document.getElementById('prev-btn').disabled = level === 1;
            document.getElementById('next-btn').disabled = level === 200;

            // 更新关卡信息
            const difficulty = level <= 60 ? '(简单)' : level <= 130 ? '(中等)' : '(困难)';
            document.getElementById('level-info').textContent = `第 ${level} 关 ${difficulty}`;

            // 切换界面
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('game-board').style.display = 'block';
            
            renderSudoku();
        }

        // 渲染数独棋盘
        function renderSudoku() {
            const grid = document.getElementById('sudoku-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'sudoku-cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    if (puzzle[i][j] !== 0) {
                        cell.textContent = puzzle[i][j];
                        cell.classList.add('fixed');
                    } else {
                        cell.onclick = () => selectCell(cell);
                    }
                    grid.appendChild(cell);
                }
            }
        }

        // 选中格子
        function selectCell(cell) {
            if (cell.classList.contains('fixed')) return;
            document.querySelectorAll('.sudoku-cell').forEach(c => c.classList.remove('selected'));
            cell.classList.add('selected');
            selectedCell = cell;
        }

        // 输入数字
        function inputNumber(num) {
            if (!selectedCell || selectedCell.classList.contains('fixed')) return;
            const row = parseInt(selectedCell.dataset.row);
            const col = parseInt(selectedCell.dataset.col);
            
            if (num === 0) {
                selectedCell.textContent = '';
                selectedCell.classList.remove('error');
                puzzle[row][col] = 0;
            } else {
                selectedCell.textContent = num;
                puzzle[row][col] = num;
                // 检查是否正确
                if (num !== solution[row][col]) {
                    selectedCell.classList.add('error');
                } else {
                    selectedCell.classList.remove('error');
                }
            }
            checkWin();
        }

        // 检查是否胜利
        function checkWin() {
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (puzzle[i][j] !== solution[i][j]) return;
                }
            }
            // 通关
            if (currentLevel > completedLevels) {
                completedLevels = currentLevel;
                localStorage.setItem('sudoku_completed', completedLevels);
            }
            document.getElementById('win-msg').textContent = `你完成了第 ${currentLevel} 关！`;
            document.getElementById('win-modal').style.display = 'flex';
        }

        // 下一关
        function nextLevel() {
            document.getElementById('win-modal').style.display = 'none';
            if (currentLevel < 200) startLevel(currentLevel + 1);
            else goToSelect();
        }

        // 上一关
        function prevLevel() {
            if (currentLevel > 1) {
                document.getElementById('win-modal').style.display = 'none';
                startLevel(currentLevel - 1);
            }
        }

        // 重置当前关卡
        function resetLevel() {
            if (confirm('确定要重置当前关卡吗？')) {
                startLevel(currentLevel);
            }
        }

        // 返回选关界面
        function goToSelect() {
            document.getElementById('win-modal').style.display = 'none';
            document.getElementById('game-board').style.display = 'none';
            document.getElementById('level-select').style.display = 'block';
            renderLevelSelect();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('game-board').style.display === 'none') return;
            const key = e.key;
            if (key >= '1' && key <= '9') inputNumber(parseInt(key));
            else if (key === 'Backspace' || key === 'Delete' || key === '0') inputNumber(0);
            else if (selectedCell && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
                let row = parseInt(selectedCell.dataset.row);
                let col = parseInt(selectedCell.dataset.col);
                if (key === 'ArrowUp') row = Math.max(0, row - 1);
                if (key === 'ArrowDown') row = Math.min(8, row + 1);
                if (key === 'ArrowLeft') col = Math.max(0, col - 1);
                if (key === 'ArrowRight') col = Math.min(8, col + 1);
                const nextCell = document.querySelector(`.sudoku-cell[data-row="${row}"][data-col="${col}"]`);
                if (nextCell && !nextCell.classList.contains('fixed')) selectCell(nextCell);
            }
        });

        // 初始化：打开直接进入第1关
        startLevel(1);
    </script>
</body>
</html>
