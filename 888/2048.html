<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf8ef;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #776e65;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .game {
    width: min(92vw, 460px);
    max-height: 100vh;
  }

  /* ---------- 顶部 ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: clamp(32px, 9vw, 46px);
    letter-spacing: -1px;
    color: #776e65;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    border-radius: 7px;
    padding: 6px 14px;
    min-width: 74px;
    text-align: center;
  }

  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #eee4da;
  }

  .score-box .value {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.25;
    color: #fff;
  }

  /* ---------- 说明栏 ---------- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 14px 0 10px;
  }

  .hint {
    margin: 0;
    font-size: 13px;
    color: #8f857d;
  }

  .hint strong { color: #776e65; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #f9f6f2;
    background: #8f7a66;
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background .15s, transform .05s;
    white-space: nowrap;
  }

  .btn:hover { background: #9f8b77; }
  .btn:active { transform: translateY(1px); }

  /* ---------- 棋盘 ---------- */
  .board {
    --pad: 10px;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #bbada0;
    border-radius: 10px;
    padding: var(--pad);
    touch-action: none;
    overflow: hidden;
  }

  .grid, .tiles {
    position: absolute;
    inset: var(--pad);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }

  .cell {
    margin: 6px;
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }

  .tiles { pointer-events: none; }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: 25%;
    height: 25%;
    padding: 6px;
    transition: transform .1s ease-in-out;
    will-change: transform;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    line-height: 1;
  }

  /* 字号随位数缩小 */
  .len-2 { font-size: min(9vw, 44px); }
  .len-3 { font-size: min(7.4vw, 36px); }
  .len-4 { font-size: min(6vw, 29px); }
  .len-5 { font-size: min(4.8vw, 23px); }

  @keyframes appear {
    from { opacity: 0; transform: scale(.25); }
    to   { opacity: 1; transform: scale(1); }
  }
  .tile-inner.appear { animation: appear .14s ease-out; }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .tile-inner.merged { animation: pop .16s ease-out; }

  /* ---------- 结束遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(238, 228, 218, 0.78);
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-content {
    text-align: center;
    padding: 20px;
    animation: appear .3s ease-out;
  }

  .overlay h2 {
    margin: 0 0 8px;
    font-size: clamp(26px, 7vw, 36px);
    color: #776e65;
  }

  .overlay p {
    margin: 0 0 18px;
    font-size: 14px;
    color: #857b72;
  }

  .overlay .btn + .btn { margin-left: 8px; }
</style>
</head>
<body>

<div class="game">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="bar">
    <p class="hint">合并相同数字，凑出 <strong>2048</strong>！</p>
    <button class="btn" id="restart">新游戏</button>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-content">
        <h2 id="overlay-title">游戏结束</h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="continue-btn">继续游戏</button>
        <button class="btn" id="retry-btn">再来一局</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SIZE = 4;
  const MOVE_MS = 100;          // 与 CSS 中 .tile 的 transition 时长保持一致

  /* ---------- DOM ---------- */
  const gridEl      = document.getElementById('grid');
  const layerEl     = document.getElementById('tiles');
  const scoreEl     = document.getElementById('score');
  const bestEl      = document.getElementById('best');
  const boardEl     = document.getElementById('board');
  const overlayEl   = document.getElementById('overlay');
  const overlayTitle= document.getElementById('overlay-title');
  const overlayMsg  = document.getElementById('overlay-msg');
  const continueBtn = document.getElementById('continue-btn');
  const retryBtn    = document.getElementById('retry-btn');
  const restartBtn  = document.getElementById('restart');

  /* 背景格子 */
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    gridEl.appendChild(d);
  }

  /* ---------- 配色 ---------- */
  const COLORS = {
    2:    ['#eee4da', '#776e65'],
    4:    ['#ede0c8', '#776e65'],
    8:    ['#f2b179', '#f9f6f2'],
    16:   ['#f59563', '#f9f6f2'],
    32:   ['#f67c5f', '#f9f6f2'],
    64:   ['#f65e3b', '#f9f6f2'],
    128:  ['#edcf72', '#f9f6f2'],
    256:  ['#edcc61', '#f9f6f2'],
    512:  ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2']
  };
  const SUPER_COLORS = ['#3c3a32', '#f9f6f2'];

  const colorOf = v => COLORS[v] || SUPER_COLORS;

  const lenClass = v =>
    v < 100 ? 'len-2' : v < 1000 ? 'len-3' : v < 10000 ? 'len-4' : 'len-5';

  /* ---------- 状态 ---------- */
  let tiles = [];        // { id, value, r, c, el, inner, span }
  let uid = 0;
  let score = 0;
  let best = 0;
  let busy = false;      // 动画中，屏蔽输入
  let paused = false;    // 弹窗中，屏蔽输入
  let won = false;

  /* ---------- 最高分持久化 ---------- */
  function loadBest() {
    try { return parseInt(localStorage.getItem('best2048') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('best2048', String(v)); } catch (e) {}
  }

  /* ---------- 方块元素 ---------- */
  function makeEl(t) {
    const el = document.createElement('div');
    el.className = 'tile';

    const inner = document.createElement('div');
    const [bg, fg] = colorOf(t.value);
    inner.className = 'tile-inner ' + lenClass(t.value);
    inner.style.background = bg;
    inner.style.color = fg;

    const span = document.createElement('span');
    span.textContent = t.value;

    inner.appendChild(span);
    el.appendChild(inner);

    // 插入前先定好位置，避免从左上角“飞”过来
    el.style.transform = `translate(${t.c * 100}%, ${t.r * 100}%)`;
    layerEl.appendChild(el);

    t.el = el;
    t.inner = inner;
    t.span = span;
  }

  function updateVisual(t, pop) {
    const [bg, fg] = colorOf(t.value);
    t.inner.className = 'tile-inner ' + lenClass(t.value);
    t.inner.style.background = bg;
    t.inner.style.color = fg;
    t.span.textContent = t.value;

    if (pop) {
      t.inner.classList.remove('merged');
      void t.inner.offsetWidth;      // 强制重排以重启动画
      t.inner.classList.add('merged');
    }
  }

  /* ---------- 基础工具 ---------- */
  function boardMatrix() {
    const b = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    for (const t of tiles) b[t.r][t.c] = t;
    return b;
  }

  function emptyCells() {
    const b = boardMatrix();
    const out = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!b[r][c]) out.push([r, c]);
    return out;
  }

  function addRandomTile() {
    const empty = emptyCells();
    if (!empty.length) return;
    const [r, c] = empty[(Math.random() * empty.length) | 0];
    const t = { id: ++uid, value: Math.random() < 0.9 ? 2 : 4, r, c };
    makeEl(t);
    t.inner.classList.add('appear');
    tiles.push(t);
  }

  function updateScore() {
    if (score > best) {
      best = score;
      saveBest(best);
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function isGameOver() {
    const b = boardMatrix();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = b[r][c];
        if (!t) return false;
        if (c + 1 < SIZE && b[r][c + 1] && b[r][c + 1].value === t.value) return false;
        if (r + 1 < SIZE && b[r + 1][c] && b[r + 1][c].value === t.value) return false;
      }
    }
    return true;
  }

  /* ---------- 核心：移动 ---------- */
  function move(dir) {
    if (busy || paused) return;

    const b = boardMatrix();
    const merges = [];
    let moved = false;

    const rowOrder = dir === 'down'  ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const colOrder = dir === 'right' ? [3, 2, 1, 0] : [0, 1, 2, 3];

    // 按移动方向，把每一条行/列整理成 “格子坐标 + 方块序列”
    const lines = [];
    if (dir === 'left' || dir === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const cells = colOrder.map(c => [r, c]);
        lines.push({ cells, items: cells.map(([rr, cc]) => b[rr][cc]).filter(Boolean) });
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        const cells = rowOrder.map(r => [r, c]);
        lines.push({ cells, items: cells.map(([rr, cc]) => b[rr][cc]).filter(Boolean) });
      }
    }

    for (const { cells, items } of lines) {
      // 1) 压缩 + 合并
      const result = [];
      let i = 0;
      while (i < items.length) {
        if (i + 1 < items.length && items[i].value === items[i + 1].value) {
          result.push({ value: items[i].value * 2, pair: [items[i], items[i + 1]] });
          i += 2;
        } else {
          result.push({ value: items[i].value, pair: [items[i]] });
          i += 1;
        }
      }

      // 2) 分配到目标格子
      for (let idx = 0; idx < result.length; idx++) {
        const [r, c] = cells[idx];
        const res = result[idx];
        const survivor = res.pair[0];

        if (survivor.r !== r || survivor.c !== c) moved = true;
        survivor.r = r;
        survivor.c = c;

        if (res.pair.length === 2) {
          moved = true;
          const victim = res.pair[1];
          victim.r = r;
          victim.c = c;
          merges.push({ survivor, victim, value: res.value });
        }
      }
    }

    if (!moved) return;

    busy = true;

    // 让所有方块平滑滑到新位置
    for (const t of tiles) {
      t.el.style.transform = `translate(${t.c * 100}%, ${t.r * 100}%)`;
    }

    setTimeout(() => {
      // 处理合并
      for (const m of merges) {
        m.victim.el.remove();
        const idx = tiles.indexOf(m.victim);
        if (idx >= 0) tiles.splice(idx, 1);

        m.survivor.value = m.value;
        score += m.value;
        updateVisual(m.survivor, true);
      }

      updateScore();
      addRandomTile();
      busy = false;

      // 判定胜负
      if (isGameOver()) {
        paused = true;
        showOverlay('游戏结束', '最终得分：' + score, false);
      } else if (!won && tiles.some(t => t.value >= 2048)) {
        won = true;
        paused = true;
        showOverlay('你赢了！🎉', '继续挑战更高分吧', true);
      }
    }, MOVE_MS);
  }

  /* ---------- 弹窗 ---------- */
  function showOverlay(title, msg, showContinue) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    continueBtn.style.display = showContinue ? 'inline-block' : 'none';
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  /* ---------- 新游戏 ---------- */
  function newGame() {
    layerEl.innerHTML = '';
    tiles = [];
    uid = 0;
    score = 0;
    busy = false;
    paused = false;
    won = false;

    hideOverlay();
    updateScore();
    addRandomTile();
    addRandomTile();
  }

  /* ---------- 输入：键盘 ---------- */
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', e => {
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  }, { passive: false });

  /* ---------- 输入：触摸滑动 ---------- */
  let touchStart = null;

  boardEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { touchStart = null; return; }
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchmove', e => {
    if (touchStart) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;   // 视为点击

    if (ax > ay) move(dx > 0 ? 'right' : 'left');
    else         move(dy > 0 ? 'down'  : 'up');
  }, { passive: true });

  /* ---------- 按钮 ---------- */
  restartBtn.addEventListener('click', newGame);
  retryBtn.addEventListener('click', newGame);
  continueBtn.addEventListener('click', () => {
    paused = false;
    hideOverlay();
  });

  /* ---------- 启动 ---------- */
  best = loadBest();
  newGame();
})();
</script>
</body>
</html>
