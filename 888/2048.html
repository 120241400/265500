<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2048</title>
<style>
  /* ============ 基础 ============ */
  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }

  body {
    height: 100%;
    margin: 0;
    display: table;                /* 兼容老浏览器的居中方案 */
    width: 100%;
    background: #faf8ef;
    color: #776e65;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-touch-callout: none;
  }

  .wrap {
    display: table-cell;
    vertical-align: middle;
    padding: 10px 0;
  }

  .game {
    width: 92%;
    max-width: 460px;
    margin: 0 auto;
  }

  /* ============ 顶部 ============ */
  .header {
    overflow: hidden;
    margin-bottom: 10px;
  }

  h1 {
    float: left;
    margin: 0;
    font-size: 38px;
    line-height: 1.15;
    letter-spacing: -1px;
    color: #776e65;
  }

  .scores {
    float: right;
    font-size: 0;                  /* 消除 inline-block 间隙 */
    padding-top: 2px;
  }

  .score-box {
    display: inline-block;
    vertical-align: top;
    background: #bbada0;
    -webkit-border-radius: 7px;
    border-radius: 7px;
    padding: 5px 12px;
    min-width: 72px;
    text-align: center;
    margin-left: 8px;
    font-size: 14px;
  }

  .score-box .label {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #eee4da;
    line-height: 1.3;
  }

  .score-box .value {
    font-size: 21px;
    font-weight: bold;
    line-height: 1.25;
    color: #ffffff;
  }

  /* ============ 说明栏 ============ */
  .bar {
    overflow: hidden;
    margin: 12px 0 10px;
  }

  .hint {
    float: left;
    margin: 9px 0 0 0;
    font-size: 13px;
    line-height: 1.35;
    color: #8f857d;
    max-width: 58%;
  }

  .hint strong { color: #776e65; }

  .btn {
    float: right;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #f9f6f2;
    background: #8f7a66;
    border: 0;
    -webkit-border-radius: 7px;
    border-radius: 7px;
    padding: 9px 18px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  }

  .btn:active { background: #7f6a56; }

  /* ============ 棋盘 ============ */
  .board-outer {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 100%;          /* 正方形自适应 */
  }

  .board {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #bbada0;
    -webkit-border-radius: 8px;
    border-radius: 8px;
    touch-action: none;
  }

  .grid, .tiles {
    position: absolute;
    top: 2.5%;
    left: 2.5%;
    width: 95%;
    height: 95%;
  }

  .tiles { pointer-events: none; }

  .cell {
    float: left;
    width: 25%;
    height: 25%;
    padding: 1.6%;
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
  }

  .cell:before {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background: rgba(238, 228, 218, 0.35);
    -webkit-border-radius: 5px;
    border-radius: 5px;
  }

  /* ============ 方块 ============ */
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: 25%;
    height: 25%;
    padding: 1.6%;
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
    -webkit-transition: left 0.1s ease-in-out, top 0.1s ease-in-out;
    -moz-transition: left 0.1s ease-in-out, top 0.1s ease-in-out;
    -o-transition: left 0.1s ease-in-out, top 0.1s ease-in-out;
    transition: left 0.1s ease-in-out, top 0.1s ease-in-out;
  }

  .tile-inner {
    display: table;                /* 兼容性最好的垂直居中 */
    width: 100%;
    height: 100%;
    -webkit-border-radius: 5px;
    border-radius: 5px;
    text-align: center;
    font-weight: bold;
  }

  .tile-inner > span {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    line-height: 1;
  }

  .len-2 { font-size: 1em; }
  .len-3 { font-size: 0.84em; }
  .len-4 { font-size: 0.68em; }
  .len-5 { font-size: 0.56em; }

  /* ---- 新方块出现 ---- */
  @-webkit-keyframes appear {
    from { opacity: 0; -webkit-transform: scale(0.25); }
    to   { opacity: 1; -webkit-transform: scale(1); }
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.25); }
    to   { opacity: 1; transform: scale(1); }
  }
  .tile.appear {
    -webkit-animation: appear 0.14s ease-out;
    animation: appear 0.14s ease-out;
  }

  /* ---- 合并弹跳 ---- */
  @-webkit-keyframes pop {
    0%   { -webkit-transform: scale(1); }
    50%  { -webkit-transform: scale(1.16); }
    100% { -webkit-transform: scale(1); }
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .tile.merged {
    -webkit-animation: pop 0.16s ease-out;
    animation: pop 0.16s ease-out;
  }

  /* ============ 结束遮罩 ============ */
  .overlay {
    display: table;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(238, 228, 218, 0.78);
    -webkit-border-radius: 8px;
    border-radius: 8px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 10;
    -webkit-transition: opacity 0.25s, visibility 0.25s;
    transition: opacity 0.25s, visibility 0.25s;
  }

  .overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .overlay-content {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    padding: 16px;
  }

  .overlay h2 {
    margin: 0 0 8px 0;
    font-size: 30px;
    line-height: 1.2;
    color: #776e65;
  }

  .overlay p {
    margin: 0 0 18px 0;
    font-size: 14px;
    color: #857b72;
  }

  .overlay .btn {
    float: none;
    display: inline-block;
    vertical-align: middle;
  }

  .overlay .btn + .btn { margin-left: 8px; }

  /* ============ 小屏微调 ============ */
  @media (max-width: 360px) {
    h1 { font-size: 30px; }
    .score-box { min-width: 62px; padding: 4px 9px; }
    .score-box .value { font-size: 18px; }
    .hint { font-size: 12px; }
    .btn { font-size: 13px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="game">

    <div class="header">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">得分</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="bar">
      <p class="hint">合并相同数字，凑出 <strong>2048</strong>！</p>
      <button class="btn" id="restart" type="button">新游戏</button>
    </div>

    <div class="board-outer">
      <div class="board" id="board">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="overlay-title">游戏结束</h2>
            <p id="overlay-msg"></p>
            <button class="btn" id="continue-btn" type="button">继续游戏</button>
            <button class="btn" id="retry-btn" type="button">再来一局</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量
     ========================================================= */
  var SIZE = 4;
  var MOVE_MS = 100;          // 与 CSS transition 时长保持一致

  /* =========================================================
     DOM 引用
     ========================================================= */
  var gridEl       = document.getElementById('grid');
  var layerEl      = document.getElementById('tiles');
  var scoreEl      = document.getElementById('score');
  var bestEl       = document.getElementById('best');
  var boardEl      = document.getElementById('board');
  var overlayEl    = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayMsg   = document.getElementById('overlay-msg');
  var continueBtn  = document.getElementById('continue-btn');
  var retryBtn     = document.getElementById('retry-btn');
  var restartBtn   = document.getElementById('restart');

  /* =========================================================
     兼容层：passive 事件检测
     ========================================================= */
  var passiveSupported = false;
  try {
    var testOpts = Object.defineProperty({}, 'passive', {
      get: function () { passiveSupported = true; return false; }
    });
    window.addEventListener('test-passive', function () {}, testOpts);
    window.removeEventListener('test-passive', function () {}, testOpts);
  } catch (err) { /* 老浏览器忽略 */ }

  function on(el, type, fn, usePassive) {
    if (passiveSupported) {
      el.addEventListener(type, fn, { passive: !!usePassive });
    } else {
      el.addEventListener(type, fn, false);
    }
  }

  /* =========================================================
     兼容层：class 操作（不依赖 classList）
     ========================================================= */
  function hasClass(el, cls) {
    return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') !== -1;
  }

  function addClass(el, cls) {
    if (!hasClass(el, cls)) {
      el.className = el.className ? el.className + ' ' + cls : cls;
    }
  }

  function removeClass(el, cls) {
    var s = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ');
    s = s.replace(/^\s+/, '').replace(/\s+$/, '');
    el.className = s;
  }

  /* =========================================================
     生成背景格子
     ========================================================= */
  (function buildGrid() {
    for (var i = 0; i < SIZE * SIZE; i++) {
      var d = document.createElement('div');
      d.className = 'cell';
      gridEl.appendChild(d);
    }
  })();

  /* =========================================================
     配色
     ========================================================= */
  var COLORS = {
    2:    ['#eee4da', '#776e65'],
    4:    ['#ede0c8', '#776e65'],
    8:    ['#f2b179', '#f9f6f2'],
    16:   ['#f59563', '#f9f6f2'],
    32:   ['#f67c5f', '#f9f6f2'],
    64:   ['#f65e3b', '#f9f6f2'],
    128:  ['#edcf72', '#f9f6f2'],
    256:  ['#edcc61', '#f9f6f2'],
    512:  ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2']
  };
  var SUPER_COLOR = ['#3c3a32', '#f9f6f2'];

  function colorOf(v) {
    return COLORS[v] || SUPER_COLOR;
  }

  function lenClass(v) {
    if (v < 100)   return 'len-2';
    if (v < 1000)  return 'len-3';
    if (v < 10000) return 'len-4';
    return 'len-5';
  }

  /* =========================================================
     游戏状态
     ========================================================= */
  var tiles  = [];      // { id, value, r, c, el, inner, span }
  var uid    = 0;
  var score  = 0;
  var best   = 0;
  var busy   = false;   // 动画中，屏蔽输入
  var paused = false;   // 弹窗中，屏蔽输入
  var won    = false;

  /* =========================================================
     最高分持久化
     ========================================================= */
  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem('best2048'), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(v) {
    try { localStorage.setItem('best2048', String(v)); } catch (e) {}
  }

  /* =========================================================
     方块创建 / 更新
     ========================================================= */
  function makeEl(t) {
    var el = document.createElement('div');
    el.className = 'tile';

    var inner = document.createElement('div');
    var colors = colorOf(t.value);
    inner.className = 'tile-inner ' + lenClass(t.value);
    inner.style.background = colors[0];
    inner.style.color = colors[1];

    var span = document.createElement('span');
    span.appendChild(document.createTextNode(String(t.value)));

    inner.appendChild(span);
    el.appendChild(inner);

    // 先设置位置再插入，避免出现“从左上角飞过来”的动画
    el.style.left = (t.c * 25) + '%';
    el.style.top  = (t.r * 25) + '%';

    layerEl.appendChild(el);

    t.el = el;
    t.inner = inner;
    t.span = span;
  }

  function setPos(t) {
    t.el.style.left = (t.c * 25) + '%';
    t.el.style.top  = (t.r * 25) + '%';
  }

  function setText(node, text) {
    while (node.firstChild) node.removeChild(node.firstChild);
    node.appendChild(document.createTextNode(text));
  }

  function updateVisual(t, pop) {
    var colors = colorOf(t.value);

    t.inner.className = 'tile-inner ' + lenClass(t.value);
    t.inner.style.background = colors[0];
    t.inner.style.color = colors[1];

    setText(t.span, String(t.value));

    if (pop) {
      removeClass(t.el, 'merged');
      // 强制重排以重新触发动画
      var dummy = t.el.offsetWidth;
      addClass(t.el, 'merged');
    }
  }

  /* =========================================================
     棋盘工具
     ========================================================= */
  function boardMatrix() {
    var b = [];
    var r, c;
    for (r = 0; r < SIZE; r++) {
      var row = [];
      for (c = 0; c < SIZE; c++) row.push(null);
      b.push(row);
    }
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      b[t.r][t.c] = t;
    }
    return b;
  }

  function emptyCells() {
    var b = boardMatrix();
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!b[r][c]) out.push([r, c]);
      }
    }
    return out;
  }

  function indexOfTile(t) {
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i] === t) return i;
    }
    return -1;
  }

  function has2048() {
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].value >= 2048) return true;
    }
    return false;
  }

  function addRandomTile() {
    var empty = emptyCells();
    if (!empty.length) return;

    var idx = Math.floor(Math.random() * empty.length);
    var pos = empty[idx];

    var t = {
      id: ++uid,
      value: Math.random() < 0.9 ? 2 : 4,
      r: pos[0],
      c: pos[1]
    };

    makeEl(t);
    addClass(t.el, 'appear');
    tiles.push(t);
  }

  function updateScore() {
    if (score > best) {
      best = score;
      saveBest(best);
    }
    scoreEl.innerHTML = score;
    bestEl.innerHTML  = best;
  }

  function isGameOver() {
    var b = boardMatrix();
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var t = b[r][c];
        if (!t) return false;
        if (c + 1 < SIZE && b[r][c + 1] && b[r][c + 1].value === t.value) return false;
        if (r + 1 < SIZE && b[r + 1][c] && b[r + 1][c].value === t.value) return false;
      }
    }
    return true;
  }

  /* =========================================================
     核心：移动
     ========================================================= */
  function move(dir) {
    if (busy || paused) return;

    var b = boardMatrix();
    var merges = [];
    var moved = false;
    var i, r, c;

    var rowOrder = (dir === 'down')  ? [3, 2, 1, 0] : [0, 1, 2, 3];
    var colOrder = (dir === 'right') ? [3, 2, 1, 0] : [0, 1, 2, 3];

    // 把每一行 / 列整理成 “目标坐标序列 + 现有方块序列”
    var lines = [];

    if (dir === 'left' || dir === 'right') {
      for (r = 0; r < SIZE; r++) {
        var cellsH = [];
        for (i = 0; i < SIZE; i++) cellsH.push([r, colOrder[i]]);

        var itemsH = [];
        for (i = 0; i < SIZE; i++) {
          var th = b[cellsH[i][0]][cellsH[i][1]];
          if (th) itemsH.push(th);
        }
        lines.push({ cells: cellsH, items: itemsH });
      }
    } else {
      for (c = 0; c < SIZE; c++) {
        var cellsV = [];
        for (i = 0; i < SIZE; i++) cellsV.push([rowOrder[i], c]);

        var itemsV = [];
        for (i = 0; i < SIZE; i++) {
          var tv = b[cellsV[i][0]][cellsV[i][1]];
          if (tv) itemsV.push(tv);
        }
        lines.push({ cells: cellsV, items: itemsV });
      }
    }

    // 逐行 / 逐列处理
    for (var li = 0; li < lines.length; li++) {
      var cellsArr = lines[li].cells;
      var itemsArr = lines[li].items;

      // 1) 压缩 + 合并
      var result = [];
      var k = 0;
      while (k < itemsArr.length) {
        if (k + 1 < itemsArr.length && itemsArr[k].value === itemsArr[k + 1].value) {
          result.push({
            value: itemsArr[k].value * 2,
            pair: [itemsArr[k], itemsArr[k + 1]]
          });
          k += 2;
        } else {
          result.push({
            value: itemsArr[k].value,
            pair: [itemsArr[k]]
          });
          k += 1;
        }
      }

      // 2) 分配目标位置
      for (var ri = 0; ri < result.length; ri++) {
        var pos = cellsArr[ri];
        var res = result[ri];
        var survivor = res.pair[0];

        if (survivor.r !== pos[0] || survivor.c !== pos[1]) moved = true;
        survivor.r = pos[0];
        survivor.c = pos[1];

        if (res.pair.length === 2) {
          moved = true;
          var victim = res.pair[1];
          victim.r = pos[0];
          victim.c = pos[1];
          merges.push({ survivor: survivor, victim: victim, value: res.value });
        }
      }
    }

    if (!moved) return;

    busy = true;

    // 让所有方块滑向新位置
    for (i = 0; i < tiles.length; i++) setPos(tiles[i]);

    setTimeout(function () {
      // ---- 处理合并 ----
      for (var mi = 0; mi < merges.length; mi++) {
        var m = merges[mi];

        if (m.victim.el.parentNode) {
          m.victim.el.parentNode.removeChild(m.victim.el);
        }
        var idx = indexOfTile(m.victim);
        if (idx >= 0) tiles.splice(idx, 1);

        m.survivor.value = m.value;
        score += m.value;
        updateVisual(m.survivor, true);
      }

      updateScore();
      addRandomTile();

      busy = false;

      // ---- 判定胜负 ----
      if (isGameOver()) {
        paused = true;
        showOverlay('游戏结束', '最终得分：' + score, false);
      } else if (!won && has2048()) {
        won = true;
        paused = true;
        showOverlay('你赢了！', '继续挑战更高分吧', true);
      }
    }, MOVE_MS);
  }

  /* =========================================================
     遮罩层
     ========================================================= */
  function showOverlay(title, msg, showContinue) {
    overlayTitle.innerHTML = title;
    overlayMsg.innerHTML = msg;
    continueBtn.style.display = showContinue ? 'inline-block' : 'none';
    addClass(overlayEl, 'show');
  }

  function hideOverlay() {
    removeClass(overlayEl, 'show');
  }

  /* =========================================================
     新游戏
     ========================================================= */
  function newGame() {
    while (layerEl.firstChild) {
      layerEl.removeChild(layerEl.firstChild);
    }

    tiles  = [];
    uid    = 0;
    score  = 0;
    busy   = false;
    paused = false;
    won    = false;

    hideOverlay();
    updateScore();

    addRandomTile();
    addRandomTile();
  }

  /* =========================================================
     字号自适应（替代 vw / clamp）
     ========================================================= */
  function resizeFont() {
    var w = boardEl.offsetWidth;
    if (!w) return;

    var base = Math.round(w / 4 * 0.40);
    if (base > 46) base = 46;
    if (base < 14) base = 14;

    layerEl.style.fontSize = base + 'px';
  }

  /* =========================================================
     键盘输入
     ========================================================= */
  var KEYMAP = {
    'ArrowUp': 'up',    'ArrowDown': 'down',
    'ArrowLeft': 'left','ArrowRight': 'right',
    'w': 'up', 's': 'down', 'a': 'left', 'd': 'right',
    'W': 'up', 'S': 'down', 'A': 'left', 'D': 'right',
    // 部分老浏览器只有 keyCode
    '38': 'up', '40': 'down', '37': 'left', '39': 'right',
    '87': 'up', '83': 'down', '65': 'left', '68': 'right'
  };

  function onKeyDown(e) {
    var dir = KEYMAP[e.key] || KEYMAP[e.keyCode];
    if (!dir) return;
    if (e.preventDefault) e.preventDefault();
    move(dir);
  }

  if (window.addEventListener) {
    window.addEventListener('keydown', onKeyDown, false);
  } else if (window.attachEvent) {
    window.attachEvent('onkeydown', onKeyDown);
  }

  /* =========================================================
     触摸输入
     ========================================================= */
  var touchStart = null;

  on(boardEl, 'touchstart', function (e) {
    if (e.touches.length !== 1) { touchStart = null; return; }
    var t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, true);

  on(boardEl, 'touchmove', function (e) {
    if (touchStart && e.preventDefault) {
      e.preventDefault();          // 阻止页面滚动
    }
  }, false);

  on(boardEl, 'touchend', function (e) {
    if (!touchStart) return;

    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;

    var ax = dx < 0 ? -dx : dx;
    var ay = dy < 0 ? -dy : dy;

    if ((ax > ay ? ax : ay) < 24) return;   // 视为点击

    if (ax > ay) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, true);

  /* =========================================================
     按钮
     ========================================================= */
  restartBtn.onclick = newGame;
  retryBtn.onclick = newGame;
  continueBtn.onclick = function () {
    paused = false;
    hideOverlay();
  };

  /* =========================================================
     窗口尺寸变化
     ========================================================= */
  if (window.addEventListener) {
    window.addEventListener('resize', resizeFont, false);
    window.addEventListener('orientationchange', function () {
      setTimeout(resizeFont, 250);
    }, false);
  } else if (window.attachEvent) {
    window.attachEvent('onresize', resizeFont);
  }

  /* =========================================================
     启动
     ========================================================= */
  best = loadBest();
  resizeFont();
  newGame();

})();
</script>
</body>
</html>
