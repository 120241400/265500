<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>数字华容道</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0b1220;
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(59,130,246,.28), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, rgba(168,85,247,.25), transparent 60%);
    background-attachment:fixed;
    color:#e2e8f0;
    overflow-x:hidden;
  }

  h1{
    font-size:19px;margin:0;font-weight:600;letter-spacing:3px;
    background:linear-gradient(90deg,#93c5fd,#c4b5fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* 关卡按钮 */
  .levels{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
  .levels button{
    padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:#cbd5e1;transition:.2s;
  }
  .levels button:hover{background:rgba(255,255,255,.12);}
  .levels button.active{
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    color:#fff;border-color:transparent;
    box-shadow:0 4px 16px rgba(99,102,241,.45);
  }

  /* 数据栏 */
  .stats{display:flex;gap:26px;}
  .stat{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .stat span{font-size:11px;color:#64748b;letter-spacing:1px;}
  .stat b{font-size:15px;color:#fff;font-variant-numeric:tabular-nums;font-weight:600;}

  /* 棋盘 */
  .board-wrap{
    position:relative;
    --board-size:max(190px, min(92vw, calc(100vh - 300px), 520px));
    width:var(--board-size);
    height:var(--board-size);
    flex:0 0 auto;
  }
  #board{
    position:absolute;inset:0;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    box-shadow:inset 0 2px 24px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .tile{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    color:#1e293b;
    background:linear-gradient(160deg,#ffffff,#dde5f0);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 4px 10px rgba(0,0,0,.35);
    cursor:pointer;user-select:none;
    transition:transform .15s cubic-bezier(.3,.9,.4,1), filter .15s;
    will-change:transform;
    font-variant-numeric:tabular-nums;
  }
  .tile:active{filter:brightness(.9);}
  #board.no-anim .tile{transition:none;}

  /* 提示 */
  .hint{
    margin:0;max-width:min(92vw,520px);text-align:center;
    font-size:12px;line-height:1.7;color:#64748b;
  }

  /* 按钮 */
  .actions{display:flex;gap:10px;}
  .btn{
    padding:9px 22px;border-radius:999px;font-size:14px;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);
    color:#e2e8f0;transition:.2s;
  }
  .btn:hover{background:rgba(255,255,255,.14);}
  .btn:active{transform:scale(.97);}
  .btn.primary{
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    border-color:transparent;color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,.4);
  }

  /* 胜利弹层 */
  .win-overlay{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(6,10,20,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .win-overlay.show{opacity:1;pointer-events:auto;}
  .win-card{
    text-align:center;padding:28px 34px;border-radius:22px;
    background:linear-gradient(160deg,#1e293b,#0f172a);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    transform:translateY(14px) scale(.94);
    transition:transform .38s cubic-bezier(.2,1.3,.4,1);
  }
  .win-overlay.show .win-card{transform:none;}
  .win-emoji{font-size:42px;line-height:1;}
  .win-card h2{margin:12px 0 8px;font-size:20px;color:#fff;font-weight:600;}
  .win-card p{margin:0 0 20px;color:#94a3b8;font-size:14px;line-height:1.8;}
  .win-card p b{color:#fff;font-size:16px;}
  .newrec{color:#fbbf24;font-weight:700;}
  .win-actions{display:flex;gap:10px;justify-content:center;}
</style>
</head>
<body>

  <h1>数字华容道</h1>

  <nav class="levels" id="levels">
    <button data-n="3">3×3 入门</button>
    <button data-n="4" class="active">4×4 经典</button>
    <button data-n="5">5×5 挑战</button>
    <button data-n="6">6×6 大师</button>
  </nav>

  <div class="stats">
    <div class="stat"><span>步数</span><b id="movesCount">0</b></div>
    <div class="stat"><span>时间</span><b id="timeCount">00:00</b></div>
    <div class="stat"><span>最佳</span><b id="bestCount">--</b></div>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <p class="hint">点击空格旁边的方块即可滑动，把数字按 1、2、3… 排好，右下角留空即获胜（也可用键盘方向键）</p>

  <div class="actions">
    <button id="restartBtn" class="btn">重新开始</button>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <div class="win-emoji">🎉</div>
      <h2>恭喜过关！</h2>
      <p id="winStats"></p>
      <div class="win-actions">
        <button id="againBtn" class="btn primary">再来一局</button>
        <button id="closeWinBtn" class="btn">看看棋盘</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const boardEl  = document.getElementById('board');
  const movesEl  = document.getElementById('movesCount');
  const timeEl   = document.getElementById('timeCount');
  const bestEl   = document.getElementById('bestCount');
  const overlay  = document.getElementById('winOverlay');
  const winStats = document.getElementById('winStats');

  let n = 4;                 // 棋盘边长
  let state = [];            // state[格子下标] = 数字（0 表示空格）
  let posOf = new Map();     // 数字 -> 当前格子下标
  let tileEls = new Map();   // 数字 -> DOM 元素
  let moves = 0;
  let startTime = 0;
  let timerId = null;
  let playing = false;
  let g = 0, T = 0;          // 间隙、方块边长

  /* ---------------- 基础工具 ---------------- */

  function neighbors(i) {
    const r = Math.floor(i / n), c = i % n, out = [];
    if (r > 0)     out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0)     out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function isSolved() {
    for (let i = 0; i < n * n - 1; i++) if (state[i] !== i + 1) return false;
    return state[n * n - 1] === 0;
  }

  /* ---------------- 生成棋子 ---------------- */

  function buildTiles() {
    boardEl.innerHTML = '';
    tileEls.clear();
    posOf.clear();

    state = new Array(n * n);
    for (let i = 0; i < n * n - 1; i++) state[i] = i + 1;
    state[n * n - 1] = 0;
    state.forEach((v, i) => posOf.set(v, i));

    const total = n * n - 1;
    for (let v = 1; v <= total; v++) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.textContent = v;

      // 按数字给一点渐变色，看起来更舒服
      const hue = 190 + (v / total) * 140;
      el.style.background = `linear-gradient(160deg, hsl(${hue} 100% 97%), hsl(${hue} 78% 86%))`;
      el.style.color = `hsl(${hue} 45% 24%)`;

      el.addEventListener('click', () => onTileClick(v));
      boardEl.appendChild(el);
      tileEls.set(v, el);
    }
  }

  /* ---------------- 打乱（保证一定有解） ---------------- */

  function doShuffle() {
    let prev = -1;
    const steps = n * n * 40;
    for (let s = 0; s < steps; s++) {
      const empty = posOf.get(0);
      let cands = neighbors(empty);
      if (prev >= 0) {
        const filtered = cands.filter(i => i !== prev);
        if (filtered.length) cands = filtered;
      }
      const pick = cands[(Math.random() * cands.length) | 0];
      const val = state[pick];
      state[empty] = val;
      state[pick] = 0;
      posOf.set(val, empty);
      posOf.set(0, pick);
      prev = empty;
    }
    if (isSolved()) doShuffle(); // 极小概率刚好复原，重来
  }

  /* ---------------- 布局与渲染 ---------------- */

  function layout() {
    const W = boardEl.clientWidth;
    if (!W) return;

    g = W / (7 * n);                        // 间隙
    T = (W - (n + 1) * g) / n;              // 方块边长

    const fontSize = Math.max(11, T * 0.42);
    const radius   = Math.max(5, T * 0.16);

    tileEls.forEach(el => {
      el.style.width  = T + 'px';
      el.style.height = T + 'px';
      el.style.fontSize = fontSize + 'px';
      el.style.borderRadius = radius + 'px';
    });

    render(false);
  }

  function render(animate = true) {
    const noAnim = !animate;
    if (noAnim) boardEl.classList.add('no-anim');

    tileEls.forEach((el, val) => {
      const idx = posOf.get(val);
      const r = Math.floor(idx / n), c = idx % n;
      el.style.transform =
        `translate(${g + c * (T + g)}px, ${g + r * (T + g)}px)`;
    });

    if (noAnim) {
      void boardEl.offsetWidth;   // 强制重排，避免触发过渡
      boardEl.classList.remove('no-anim');
    }
  }

  /* ---------------- 交互 ---------------- */

  function onTileClick(v) {
    if (!playing) return;
    const idx = posOf.get(v);
    const empty = posOf.get(0);
    if (neighbors(idx).indexOf(empty) !== -1) slide(idx);
  }

  function slide(idx) {
    const empty = posOf.get(0);
    if (neighbors(idx).indexOf(empty) === -1) return;

    const val = state[idx];
    state[empty] = val;
    state[idx] = 0;
    posOf.set(val, empty);
    posOf.set(0, idx);

    moves++;
    movesEl.textContent = moves;
    if (moves === 1) startTimer();

    render();
    if (isSolved()) winGame();
  }

  /* ---------------- 计时 ---------------- */

  function startTimer() {
    startTime = Date.now();
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeEl.textContent = fmtTime(Date.now() - startTime);
    }, 200);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  /* ---------------- 记录 ---------------- */

  function updateBest() {
    let b = 0;
    try { b = Number(localStorage.getItem('hrd-best-' + n) || 0); } catch (e) {}
    bestEl.textContent = b ? fmtTime(b) : '--';
  }

  /* ---------------- 胜利 ---------------- */

  function winGame() {
    playing = false;
    stopTimer();
    const used = Date.now() - startTime;
    timeEl.textContent = fmtTime(used);

    let isNew = false;
    try {
      const key = 'hrd-best-' + n;
      const prev = Number(localStorage.getItem(key) || 0);
      if (prev === 0 || used < prev) {
        localStorage.setItem(key, String(used));
        isNew = true;
      }
    } catch (e) {}
    updateBest();

    winStats.innerHTML =
      `用时 <b>${fmtTime(used)}</b> · 步数 <b>${moves}</b>` +
      (isNew ? '<br><span class="newrec">🏆 新纪录！</span>' : '');

    setTimeout(() => overlay.classList.add('show'), 320);
  }

  /* ---------------- 新一局 ---------------- */

  function newGame(size) {
    n = size;
    overlay.classList.remove('show');
    playing = false;
    stopTimer();

    moves = 0;
    movesEl.textContent = '0';
    timeEl.textContent = '00:00';

    buildTiles();
    doShuffle();
    layout();          // 内部调用 render(false)
    updateBest();

    playing = true;
  }

  /* ---------------- 事件绑定 ---------------- */

  document.querySelectorAll('[data-n]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-n]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      newGame(Number(btn.dataset.n));
    });
  });

  document.getElementById('restartBtn').addEventListener('click', () => newGame(n));
  document.getElementById('againBtn').addEventListener('click', () => newGame(n));
  document.getElementById('closeWinBtn').addEventListener('click', () => overlay.classList.remove('show'));

  // 键盘方向键
  document.addEventListener('keydown', e => {
    if (!playing) return;
    const empty = posOf.get(0);
    const r = Math.floor(empty / n), c = empty % n;
    let target = -1;

    if (e.key === 'ArrowUp'    && r < n - 1) target = empty + n;
    else if (e.key === 'ArrowDown'  && r > 0)     target = empty - n;
    else if (e.key === 'ArrowLeft'  && c < n - 1) target = empty + 1;
    else if (e.key === 'ArrowRight' && c > 0)     target = empty - 1;

    if (target >= 0) { e.preventDefault(); slide(target); }
  });

  // 窗口尺寸变化
  let rzTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(layout, 80);
  });

  /* ---------------- 启动 ---------------- */
  newGame(4);   // 首次打开直接进入 4×4 经典关卡

})();
</script>
</body>
</html>
