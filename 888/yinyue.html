<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cyber Vinyl · 赛博黑胶电台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   变量
   ============================================================ */
:root{
  --cyan:#25e2ff;
  --magenta:#ff4fd8;
  --violet:#8b5cf6;
  --bg:#05060c;
  --txt:#eaf0ff;
  --muted:#8a93b2;
  --stroke:rgba(255,255,255,.10);
  --radius:34px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  min-height:100vh;
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  padding:12px;
  padding:clamp(12px,2.4vw,40px);
  background:var(--bg);
  color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ============================================================
   背景层
   ============================================================ */
.bg-image{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-4;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:background-image .8s ease-in-out, opacity 1.2s ease;
  transition:background-image .8s ease-in-out, opacity 1.2s ease;
}
.bg-image.on{ opacity:.6; }

.bg-veil{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-3;
  pointer-events:none;
  background:
    radial-gradient(60vw 60vw at 10% 6%,  rgba(37,226,255,.12), transparent 62%),
    radial-gradient(55vw 55vw at 90% 94%, rgba(255,79,216,.10), transparent 62%),
    radial-gradient(75vw 75vw at 50% 50%, rgba(5,6,12,.04), rgba(5,6,12,.58) 78%),
    linear-gradient(180deg, rgba(5,6,12,.30), rgba(5,6,12,.62));
}

.orb{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  -webkit-filter:blur(90px);
  opacity:.32;
  z-index:-2;
  pointer-events:none;
  animation:float 20s ease-in-out infinite;
  -webkit-animation:float 20s ease-in-out infinite;
}
.orb.a{
  width:440px;height:440px;
  top:-140px;left:-120px;
  background:radial-gradient(circle,#25e2ff,transparent 70%);
}
.orb.b{
  width:400px;height:400px;
  bottom:-160px;right:-130px;
  background:radial-gradient(circle,#ff4fd8,transparent 70%);
  animation-delay:-8s;
  -webkit-animation-delay:-8s;
}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1);}
  50%    {transform:translate(40px,-34px) scale(1.08);}
}
@-webkit-keyframes float{
  0%,100%{-webkit-transform:translate(0,0) scale(1);}
  50%    {-webkit-transform:translate(40px,-34px) scale(1.08);}
}

/* ============================================================
   主卡片
   ============================================================ */
.player{
  position:relative;
  width:100%;
  max-width:1040px;
  display:grid;
  grid-template-columns:minmax(0,.95fr) minmax(0,1fr);
  gap:24px;
  gap:clamp(24px,4vw,60px);
  padding:24px;
  padding:clamp(24px,3.2vw,48px);
  border-radius:var(--radius);
  /* 老内核回退：偏实心的深色底，保证文字可读 */
  background:linear-gradient(150deg, rgba(26,31,52,.94), rgba(8,10,20,.94));
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  box-shadow:
    0 50px 120px -40px rgba(0,0,0,.95),
    0 0 0 1px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.14);
  overflow:hidden;
  -webkit-transition:box-shadow .6s ease;
  transition:box-shadow .6s ease;
}

/* 支持毛玻璃时才使用半透明玻璃质感 */
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .player{
    background:linear-gradient(150deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.018) 45%,
        rgba(255,255,255,.05));
  }
}

.player.playing{
  box-shadow:
    0 50px 120px -40px rgba(0,0,0,.95),
    0 0 90px -30px rgba(37,226,255,.45),
    0 0 0 1px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.14);
}

/* 注意：原来卡片边缘那条「旋转的流光线条」(.player::before + conic-gradient + mask)
   已整体移除 —— 老内核不支持 mask-composite，会渲染成一大块色块。 */

/* ============================================================
   左侧 · 唱盘
   ============================================================ */
.deck{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  gap:16px;
  gap:clamp(16px,2.4vw,28px);
  min-width:0;
}

.viz{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:end;
  -webkit-align-items:flex-end;
  align-items:flex-end;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  height:34px;
  opacity:.5;
  -webkit-transition:opacity .5s ease;
  transition:opacity .5s ease;
}
.viz.active{opacity:1;}

.viz .bar{
  display:block;
  width:4px;
  height:30px;
  margin:0 2.5px;
  border-radius:99px;
  background:linear-gradient(to top,var(--cyan),var(--violet) 55%,var(--magenta));
  -webkit-transform-origin:bottom center;
  transform-origin:bottom center;
  -webkit-transform:scaleY(.15);
  transform:scaleY(.15);
  animation:eq .8s ease-in-out infinite alternate;
  -webkit-animation:eq .8s ease-in-out infinite alternate;
  animation-play-state:paused;
  -webkit-animation-play-state:paused;
}
.viz.active .bar{
  animation-play-state:running;
  -webkit-animation-play-state:running;
}
@keyframes eq{
  from{transform:scaleY(.15);}
  to  {transform:scaleY(1);}
}
@-webkit-keyframes eq{
  from{-webkit-transform:scaleY(.15);}
  to  {-webkit-transform:scaleY(1);}
}

/* 唱盘：用 padding-top 撑正方形，替代 aspect-ratio（老内核不支持） */
.platter{
  position:relative;
  width:100%;
  max-width:340px;
  margin:0 auto;
  flex:none;
}
.platter::before{
  content:"";
  display:block;
  width:100%;
  padding-top:100%;
}

.vinyl{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 4px),
    radial-gradient(circle at 50% 50%,
      #1c1e29 0%, #12131b 35%, #0a0b11 68%, #14161f 100%);
  box-shadow:
    0 30px 60px -18px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.07),
    0 0 60px -12px rgba(37,226,255,.20),
    inset 0 0 50px rgba(0,0,0,.85);
  animation:spin 4s linear infinite;
  -webkit-animation:spin 4s linear infinite;
  animation-play-state:paused;
  -webkit-animation-play-state:paused;
  will-change:transform;
  -webkit-transition:box-shadow .6s ease;
  transition:box-shadow .6s ease;
}
.vinyl.playing{
  animation-play-state:running;
  -webkit-animation-play-state:running;
  box-shadow:
    0 30px 60px -18px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.10),
    0 0 90px -12px rgba(255,79,216,.45),
    inset 0 0 50px rgba(0,0,0,.85);
}
.vinyl::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  border-radius:50%;
  background:conic-gradient(from 200deg,
      transparent 0deg,
      rgba(255,255,255,.14) 16deg,
      transparent 52deg,
      transparent 172deg,
      rgba(255,255,255,.09) 198deg,
      transparent 248deg,
      transparent 360deg);
  mix-blend-mode:screen;
  pointer-events:none;
}

@keyframes spin{to{transform:rotate(360deg);}}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg);}}

.vinyl-label{
  position:absolute;
  top:50%;
  left:50%;
  width:38%;
  height:38%;
  margin:-19% 0 0 -19%;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,var(--cyan),var(--violet) 50%,var(--magenta));
  box-shadow:
    0 0 28px rgba(37,226,255,.4),
    inset 0 0 0 1px rgba(255,255,255,.28);
}
.vinyl-label img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:.85;
  -webkit-transition:opacity .4s;
  transition:opacity .4s;
}
.vinyl-label::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:14%;
  height:14%;
  margin:-7% 0 0 -7%;
  border-radius:50%;
  background:radial-gradient(circle,#05060c 45%, #23263a 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 0 2px rgba(255,255,255,.10);
}

.tonearm{
  position:absolute;
  top:1.5%;
  right:-8%;
  width:54%;
  height:7px;
  border-radius:99px;
  background:linear-gradient(180deg,#f2f5ff,#9aa2b8 45%,#4b5064);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.6);
  -webkit-transform-origin:calc(100% - 3px) 50%;
  transform-origin:calc(100% - 3px) 50%;
  -webkit-transform:rotate(-24deg);
  transform:rotate(-24deg);
  -webkit-transition:-webkit-transform 1s cubic-bezier(.34,1.16,.36,1);
  transition:transform 1s cubic-bezier(.34,1.16,.36,1);
  z-index:6;
  pointer-events:none;
}
.tonearm.playing{
  -webkit-transform:rotate(-42deg);
  transform:rotate(-42deg);
}

.tonearm::before{
  content:"";
  position:absolute;
  left:-9px;top:-6px;
  width:22px;height:19px;
  border-radius:4px;
  background:linear-gradient(135deg,#ff2e7e,#b3005a);
  box-shadow:0 3px 10px rgba(255,46,126,.55), inset 0 1px 0 rgba(255,255,255,.45);
}
.tonearm::after{
  content:"";
  position:absolute;
  left:-4px;top:9px;
  width:7px;height:7px;
  border-radius:50%;
  background:#0a0b12;
  box-shadow:0 0 0 1px rgba(255,255,255,.22);
}

.tonearm-pivot{
  position:absolute;
  top:-9.5px;
  right:-10px;
  width:26px;height:26px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #eef2ff, #9aa3ba 48%, #4a4f62);
  box-shadow:0 4px 12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.55);
  z-index:7;
}

/* ============================================================
   右侧 · 控制面板
   ============================================================ */
.panel{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  gap:14px;
  gap:clamp(14px,1.6vw,20px);
  min-width:0;
}

.badge{
  display:inline-block;
  display:-webkit-inline-box;
  display:-webkit-inline-flex;
  display:inline-flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  padding:6px 14px;
  border-radius:99px;
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--cyan);
  background:rgba(37,226,255,.08);
  border:1px solid rgba(37,226,255,.25);
  width:max-content;
  width:-webkit-max-content;
}
.badge .dot{
  display:inline-block;
  width:6px;height:6px;
  margin-right:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
  animation:pulse 1.6s ease-in-out infinite;
  -webkit-animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%    {opacity:.3;transform:scale(.65);}
}
@-webkit-keyframes pulse{
  0%,100%{opacity:1;-webkit-transform:scale(1);}
  50%    {opacity:.3;-webkit-transform:scale(.65);}
}

.track-name{
  font-size:2rem;
  font-size:clamp(1.5rem,2.6vw,2.15rem);
  font-weight:800;
  line-height:1.15;
  letter-spacing:.01em;
  color:#ffffff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-bottom:2px;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .track-name{
    background:linear-gradient(100deg,#ffffff 12%, #a5f3ff 48%, #ffb3f0 82%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
}

.track-sub{
  font-size:.8rem;
  color:var(--muted);
  letter-spacing:.1em;
}

.progress-wrap{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  margin-top:2px;
}
.progress{
  position:relative;
  height:6px;
  border-radius:99px;
  background:rgba(255,255,255,.08);
  cursor:pointer;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.progress-fill{
  position:absolute;
  left:0;top:0;bottom:0;
  width:0%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--magenta));
  box-shadow:0 0 14px rgba(37,226,255,.65);
  -webkit-transition:width .15s linear;
  transition:width .15s linear;
}
.progress.is-live .progress-fill{
  width:100% !important;
  background:repeating-linear-gradient(115deg,
      rgba(37,226,255,.9) 0 10px,
      rgba(139,92,246,.9) 10px 20px,
      rgba(255,79,216,.9) 20px 30px);
  background-size:60px 100%;
  animation:slide 1.4s linear infinite;
  -webkit-animation:slide 1.4s linear infinite;
}
@keyframes slide{to{background-position:60px 0;}}
@-webkit-keyframes slide{to{background-position:60px 0;}}

.times{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-pack:justify;
  -webkit-justify-content:space-between;
  justify-content:space-between;
  margin-top:8px;
  font-size:.74rem;
  letter-spacing:.08em;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  font-family:"SF Mono","Courier New",monospace;
}

.controls{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  gap:16px;
  gap:clamp(16px,3vw,34px);
  margin:6px 0 2px;
}
.btn{
  position:relative;
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  width:52px;height:52px;
  border-radius:50%;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.045);
  color:#c9d2ea;
  font-size:1.05rem;
  cursor:pointer;
  -webkit-transition:transform .28s cubic-bezier(.34,1.4,.5,1),
      color .25s, border-color .25s, box-shadow .25s, background .25s;
  transition:transform .28s cubic-bezier(.34,1.4,.5,1),
      color .25s, border-color .25s, box-shadow .25s, background .25s;
  -webkit-appearance:none;
  appearance:none;
  outline:none;
}
.btn:hover{
  color:#fff;
  border-color:rgba(37,226,255,.55);
  background:rgba(37,226,255,.07);
  box-shadow:0 0 24px -4px rgba(37,226,255,.6);
  -webkit-transform:translateY(-2px);
  transform:translateY(-2px);
}
.btn:active{
  -webkit-transform:scale(.92);
  transform:scale(.92);
}

.btn.primary{
  width:74px;height:74px;
  font-size:1.4rem;
  color:#04060d;
  border:none;
  background:linear-gradient(135deg,var(--cyan),var(--violet) 50%,var(--magenta));
  animation:glowPulse 3.6s ease-in-out infinite;
  -webkit-animation:glowPulse 3.6s ease-in-out infinite;
}
.btn.primary:hover{
  color:#04060d;
  -webkit-transform:scale(1.06);
  transform:scale(1.06);
}
.btn.primary:active{
  -webkit-transform:scale(.97);
  transform:scale(.97);
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 30px -6px rgba(37,226,255,.65),
                    0 14px 30px -12px rgba(0,0,0,.9);}
  50%    {box-shadow:0 0 50px -2px rgba(255,79,216,.75),
                    0 14px 30px -12px rgba(0,0,0,.9);}
}

/* 播放列表 */
.playlist-head{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:justify;
  -webkit-justify-content:space-between;
  justify-content:space-between;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.07);
  font-size:.7rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.playlist-head span{letter-spacing:.08em;opacity:.7;}

.playlist{
  position:relative;
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  max-height:216px;
  overflow-y:auto;
  padding-right:6px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
  -webkit-overflow-scrolling:touch;
}
.playlist::-webkit-scrollbar{width:5px;}
.playlist::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:99px;
}
.playlist::-webkit-scrollbar-track{background:transparent;}

.track{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  width:100%;
  padding:10px 12px;
  margin-bottom:5px;
  border-radius:14px;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:.87rem;
  text-align:left;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  outline:none;
  -webkit-transition:background .25s, color .25s, border-color .25s, transform .22s;
  transition:background .25s, color .25s, border-color .25s, transform .22s;
}
.track:hover{
  background:rgba(255,255,255,.05);
  color:#dbe4ff;
  -webkit-transform:translateX(3px);
  transform:translateX(3px);
}
.track.active{
  background:linear-gradient(90deg, rgba(37,226,255,.16), rgba(255,79,216,.09));
  border-color:rgba(37,226,255,.35);
  color:#fff;
}

.track-idx{
  flex:none;
  -webkit-flex:none;
  width:22px;
  margin-right:12px;
  text-align:center;
  font-size:.7rem;
  font-variant-numeric:tabular-nums;
  opacity:.55;
}
.track.active .track-idx{color:var(--cyan);opacity:1;}

.track-title{
  -webkit-box-flex:1;
  -webkit-flex:1;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:left;
}

.track-eq{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:end;
  -webkit-align-items:flex-end;
  align-items:flex-end;
  height:13px;
  margin-left:10px;
  opacity:0;
  -webkit-transition:opacity .3s;
  transition:opacity .3s;
}
.track.active .track-eq{opacity:1;}
.track-eq i{
  display:block;
  width:2.5px;
  height:100%;
  margin-left:2px;
  border-radius:99px;
  background:linear-gradient(to top,var(--cyan),var(--magenta));
  -webkit-transform-origin:bottom center;
  transform-origin:bottom center;
  animation:eq2 .68s ease-in-out infinite alternate;
  -webkit-animation:eq2 .68s ease-in-out infinite alternate;
}
.track-eq i:nth-child(1){animation-delay:-.22s;-webkit-animation-delay:-.22s;}
.track-eq i:nth-child(2){animation-delay:-.48s;-webkit-animation-delay:-.48s;}
.track-eq i:nth-child(3){animation-delay:-.10s;-webkit-animation-delay:-.10s;}
@keyframes eq2{
  from{transform:scaleY(.28);}
  to  {transform:scaleY(1);}
}
@-webkit-keyframes eq2{
  from{-webkit-transform:scaleY(.28);}
  to  {-webkit-transform:scaleY(1);}
}

audio{display:none;}

/* ============================================================
   响应式 · 平板 / 手机
   ============================================================ */
@media (max-width:900px){
  body{padding:10px;}

  .player{
    display:-webkit-box;
    display:-webkit-flex;
    display:flex;
    -webkit-box-orient:vertical;
    -webkit-box-direction:normal;
    -webkit-flex-direction:column;
    flex-direction:column;
    width:100%;
    max-width:420px;
    padding:20px 16px 22px;
    border-radius:26px;
  }

  /* 移动端隐藏频道列表 */
  .playlist-head,
  .playlist{display:none;}

  /* —— 左侧唱盘 —— */
  .deck{margin-bottom:14px;}

  .viz{height:24px;margin-bottom:12px;}
  .viz .bar{width:3.5px;height:22px;margin:0 2px;}

  .platter{max-width:230px;}

  /* —— 右侧面板：改用块级 + margin，避开老内核对 flex gap 的不支持 —— */
  .panel{display:block;text-align:center;}

  .badge{margin:0 auto 12px;}

  .track-name{
    font-size:1.3rem;
    text-align:center;
    margin-bottom:6px;
  }
  .track-sub{
    text-align:center;
    font-size:.72rem;
    margin-bottom:12px;
  }

  .progress-wrap{margin:0 0 14px;}

  .controls{gap:0;margin:0;}
  .controls .btn{margin:0 11px;}

  .btn{width:48px;height:48px;font-size:.95rem;}
  .btn.primary{width:64px;height:64px;font-size:1.2rem;}

  .orb{filter:blur(60px);-webkit-filter:blur(60px);opacity:.22;}
}

/* 极小屏手机 */
@media (max-width:400px){
  .player{padding:18px 14px 20px;}
  .platter{max-width:195px;}
  .viz{height:20px;}
  .viz .bar{height:18px;}
  .btn{width:44px;height:44px;font-size:.9rem;}
  .btn.primary{width:58px;height:58px;font-size:1.1rem;}
  .controls .btn{margin:0 8px;}
  .track-name{font-size:1.15rem;}
  .times{font-size:.68rem;}
}

/* 矮屏手机（横屏或小尺寸） */
@media (max-height:620px) and (max-width:900px){
  .platter{max-width:170px;}
  .viz{height:18px;margin-bottom:8px;}
  .viz .bar{height:16px;}
  .deck{margin-bottom:10px;}
  .player{padding:16px 14px 18px;}
}

@media (prefers-reduced-motion:reduce){
  *{
    animation-duration:.001ms !important;
    -webkit-animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-image" id="bgImage"></div>
<div class="bg-veil"></div>
<div class="orb a"></div>
<div class="orb b"></div>

<!-- 播放器 -->
<main class="player" id="player">

  <!-- 左：唱盘 -->
  <section class="deck">
    <div class="viz" id="visualizer"></div>

    <div class="platter">
      <div class="tonearm" id="tonearm">
        <div class="tonearm-pivot"></div>
      </div>
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label">
          <img id="albumArt" src="" alt="">
        </div>
      </div>
    </div>
  </section>

  <!-- 右：控制面板 -->
  <section class="panel">
    <div class="badge"><span class="dot"></span>Live · 正在直播</div>

    <h1 class="track-name" id="songName">加载中…</h1>
    <p class="track-sub" id="trackSub">FM · 在线电台</p>

    <div class="progress-wrap">
      <div class="progress" id="progressArea">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="times">
        <span id="currentTime">00:00</span>
        <span id="durationTime">LIVE</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" title="上一台" aria-label="上一台">
        <i class="fas fa-backward-step"></i>
      </button>
      <button class="btn primary" id="playPauseBtn" title="播放 / 暂停" aria-label="播放或暂停">
        <i class="fas fa-play"></i>
      </button>
      <button class="btn" id="nextBtn" title="下一台" aria-label="下一台">
        <i class="fas fa-forward-step"></i>
      </button>
    </div>

    <div class="playlist-head">频道列表 <span id="listCount"></span></div>
    <div class="playlist" id="playlist"></div>
  </section>

  <audio id="mainAudio" preload="none"></audio>
</main>

<script>
/* ============================================================
   数据
   ============================================================ */
var allMusic = [
  { name:"清晨音乐台",     img:"https://pic.qtfm.cn/2022/0211/20220211102019.jpeg",        src:"https://lhttp-hw.qtfm.cn/live/4915/64k.mp3" },
  { name:"上海动感101",    img:"https://pic.qtfm.cn/2014/0909/20140909123511693.jpg",     src:"https://lhttp-hw.qtfm.cn/live/274/64k.mp3" },
  { name:"厦门音乐台",     img:"https://pic.qtfm.cn/2022/1207/20221207073949.png",        src:"https://lhttp-hw.qtfm.cn/live/1739/64k.mp3" },
  { name:"动听音乐台",     img:"https://pic.qtfm.cn/2021/0411/20210411040015.jpeg",        src:"https://lhttp-hw.qtfm.cn/live/5022107/64k.mp3" },
  { name:"浙江音乐调频",   img:"https://pic.qtfm.cn/2020/0408/20200408094917.jpeg",        src:"https://lhttp-hw.qtfm.cn/live/4866/64k.mp3" },
  { name:"顺德音乐之声",   img:"https://pic.qtfm.cn/2022/0616/20220616044011.jpeg",        src:"https://lhttp-hw.qtfm.cn/live/20500150/64k.mp3" },
  { name:"音乐怀旧好声音", img:"https://pic.qtfm.cn/2022/0115/20220115043946.gif",         src:"https://lhttp-hw.qtfm.cn/live/5021381/64k.mp3" },
  { name:"广西音乐台",     img:"https://pic.qtfm.cn/2015/0225/20150225111148873.png",      src:"https://lhttp-hw.qtfm.cn/live/4875/64k.mp3" },
  { name:"亚洲粤语台",     img:"https://pic.qtfm.cn/2022/1019/20221019042732.jpeg",        src:"https://lhttp-hw.qtfm.cn/live/15318569/64k.mp3" }
];

/* ============================================================
   DOM
   ============================================================ */
var audio         = document.getElementById('mainAudio');
var player        = document.getElementById('player');
var vinyl         = document.getElementById('vinyl');
var tonearm       = document.getElementById('tonearm');
var albumArt      = document.getElementById('albumArt');
var songName      = document.getElementById('songName');
var trackSub      = document.getElementById('trackSub');
var vizEl         = document.getElementById('visualizer');
var playlistEl    = document.getElementById('playlist');
var listCountEl   = document.getElementById('listCount');
var playPauseBtn  = document.getElementById('playPauseBtn');
var prevBtn       = document.getElementById('prevBtn');
var nextBtn       = document.getElementById('nextBtn');
var progressArea  = document.getElementById('progressArea');
var progressBar   = document.getElementById('progressBar');
var currentTimeEl = document.getElementById('currentTime');
var durationTimeEl= document.getElementById('durationTime');
var bgImageEl     = document.getElementById('bgImage');

/* 平滑滚动能力检测（老内核不支持 scrollTo 的对象参数） */
var SUPPORT_SMOOTH_SCROLL =
  ('scrollBehavior' in document.documentElement.style);

/* ============================================================
   状态
   ============================================================ */
var musicIndex = 0;
var isPlaying  = false;
var errorLock  = false;

/* ============================================================
   工具
   ============================================================ */
function fmt(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ============================================================
   频谱可视化
   ============================================================ */
function buildVisualizer(){
  var COUNT = 14;
  var frag = document.createDocumentFragment();

  for (var i = 0; i < COUNT; i++){
    var bar = document.createElement('span');
    bar.className = 'bar';
    var dur = (0.5 + Math.random() * 0.55).toFixed(2) + 's';
    var dly = (-Math.random() * 0.9).toFixed(2) + 's';
    bar.style.animationDuration = dur;
    bar.style.webkitAnimationDuration = dur;
    bar.style.animationDelay = dly;
    bar.style.webkitAnimationDelay = dly;
    frag.appendChild(bar);
  }
  vizEl.appendChild(frag);
}

/* ============================================================
   播放列表
   ============================================================ */
function buildPlaylist(){
  var frag = document.createDocumentFragment();

  allMusic.forEach(function(item, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'track';
    btn.setAttribute('data-index', i);

    var idx = document.createElement('span');
    idx.className = 'track-idx';
    idx.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);

    var title = document.createElement('span');
    title.className = 'track-title';
    title.textContent = item.name;

    var eq = document.createElement('span');
    eq.className = 'track-eq';
    eq.innerHTML = '<i></i><i></i><i></i>';

    btn.appendChild(idx);
    btn.appendChild(title);
    btn.appendChild(eq);

    btn.addEventListener('click', function(){
      if (i === musicIndex){
        isPlaying ? pause() : play();
        return;
      }
      loadMusic(i, isPlaying);
    });

    frag.appendChild(btn);
  });

  playlistEl.appendChild(frag);
  listCountEl.textContent = allMusic.length + ' 个电台';
}

/* ============================================================
   更新选中项
   ============================================================ */
function updateActiveTrack(scroll){
  var items = playlistEl.querySelectorAll('.track');
  for (var i = 0; i < items.length; i++){
    if (i === musicIndex){
      items[i].className = 'track active';
    }else{
      items[i].className = 'track';
    }
  }

  if (!scroll) return;
  if (!playlistEl.clientHeight) return;   // 列表被隐藏时直接跳过

  var active = playlistEl.querySelector('.track.active');
  if (!active) return;

  var target = active.offsetTop -
      (playlistEl.clientHeight - active.offsetHeight) / 2;
  var maxScroll = playlistEl.scrollHeight - playlistEl.clientHeight;
  var top = Math.max(0, Math.min(target, maxScroll));

  if (SUPPORT_SMOOTH_SCROLL){
    try{
      playlistEl.scrollTo({ top: top, behavior: 'smooth' });
    }catch(e){
      playlistEl.scrollTop = top;
    }
  }else{
    playlistEl.scrollTop = top;   // 老内核直接跳转
  }
}

/* ============================================================
   随机背景图
   ============================================================ */
function loadRandomBackground(){
  var randomImageUrl = 'https://picsum.photos/1920/1080?t=' + new Date().getTime();
  var img = new Image();

  img.onload = function(){
    bgImageEl.style.backgroundImage = "url('" + randomImageUrl + "')";
    bgImageEl.className = 'bg-image on';
  };
  img.onerror = function(){
    bgImageEl.className = 'bg-image';
  };

  img.src = randomImageUrl;
}

/* ============================================================
   加载 / 播放控制
   ============================================================ */
function loadMusic(index, autoplay){
  musicIndex = index;
  var m = allMusic[index];

  songName.textContent = m.name;
  trackSub.textContent = 'FM · 在线电台 · 第 ' + (index + 1) + ' 台';

  albumArt.style.opacity = '';
  albumArt.src = m.img;

  audio.src = m.src;

  progressBar.style.width = '0%';
  currentTimeEl.textContent  = '00:00';
  durationTimeEl.textContent = 'LIVE';
  progressArea.className = 'progress is-live';

  updateActiveTrack(true);
  loadRandomBackground();

  if (autoplay) play();
}

function play(){
  var p = audio.play();

  if (p && typeof p.then === 'function'){
    p.then(function(){
      isPlaying = true;
      syncUI();
    })['catch'](function(err){
      isPlaying = false;
      syncUI();
      if (window.console) console.warn('播放被阻止：', err);
    });
  }else{
    // 老内核：play() 无 Promise
    isPlaying = true;
    syncUI();
  }
}

function pause(){
  audio.pause();
  isPlaying = false;
  syncUI();
}

function syncUI(){
  playPauseBtn.innerHTML = isPlaying
    ? '<i class="fas fa-pause"></i>'
    : '<i class="fas fa-play"></i>';

  toggleClass(vinyl, 'playing', isPlaying);
  toggleClass(tonearm, 'playing', isPlaying);
  toggleClass(vizEl, 'active', isPlaying);
  toggleClass(player, 'playing', isPlaying);
}

function toggleClass(el, cls, on){
  if (!el) return;
  if (on){
    if (el.className.indexOf(cls) === -1){
      el.className = (el.className + ' ' + cls).replace(/^\s+|\s+$/g, '');
    }
  }else{
    el.className = (' ' + el.className + ' ')
      .replace(' ' + cls + ' ', ' ')
      .replace(/^\s+|\s+$/g, '');
  }
}

function nextMusic(){
  loadMusic((musicIndex + 1) % allMusic.length, isPlaying);
}

function prevMusic(){
  loadMusic((musicIndex - 1 + allMusic.length) % allMusic.length, isPlaying);
}

/* ============================================================
   事件
   ============================================================ */
playPauseBtn.addEventListener('click', function(){
  isPlaying ? pause() : play();
});

nextBtn.addEventListener('click', nextMusic);
prevBtn.addEventListener('click', prevMusic);

audio.addEventListener('timeupdate', function(){
  var cur = audio.currentTime || 0;
  var dur = audio.duration;

  currentTimeEl.textContent = fmt(cur);

  if (isFinite(dur) && dur > 0){
    progressArea.className = 'progress';
    progressBar.style.width = (cur / dur * 100).toFixed(2) + '%';
    durationTimeEl.textContent = fmt(dur);
  }else{
    progressArea.className = 'progress is-live';
    durationTimeEl.textContent = 'LIVE';
  }
});

progressArea.addEventListener('click', function(e){
  var dur = audio.duration;
  if (!isFinite(dur) || dur <= 0) return;

  var rect  = progressArea.getBoundingClientRect();
  var ratio = (e.clientX - rect.left) / rect.width;
  ratio = Math.min(Math.max(ratio, 0), 1);
  audio.currentTime = ratio * dur;
});

audio.addEventListener('ended', nextMusic);

audio.addEventListener('error', function(){
  if (errorLock) return;
  errorLock = true;
  setTimeout(function(){
    errorLock = false;
    nextMusic();
  }, 1500);
});

albumArt.addEventListener('error', function(){
  albumArt.style.opacity = '0';
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  var code = e.code || e.keyCode;

  if (code === 'Space' || code === 32){
    e.preventDefault();
    isPlaying ? pause() : play();
  }else if (code === 'ArrowRight' || code === 39){
    nextMusic();
  }else if (code === 'ArrowLeft' || code === 37){
    prevMusic();
  }
});

/* ============================================================
   初始化
   ============================================================ */
function init(){
  buildVisualizer();
  buildPlaylist();
  loadMusic(0, false);
  loadRandomBackground();
}

if (window.addEventListener){
  window.addEventListener('load', init);
}else{
  window.attachEvent('onload', init);
}
</script>
</body>
</html>
