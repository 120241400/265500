<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>开奖大厅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* 内嵌网页：占满整个视口，顶部和底部各被遮挡条盖住一部分 */
  #frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* 顶部红色遮挡，高度 50px */
  #topMask {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 65px;
    background: #e60012;
    color: #fff;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: env(safe-area-inset-top);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 2px;
    user-select: none;
  }

  #topMask .title {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }

  /* 底部红色悬浮遮挡，高度 77px */
  #bottomMask {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 77px;
    background: #e60012;
    color: #fff;
    z-index: 9999;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-bottom: env(safe-area-inset-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 2px;
    user-select: none;
  }

  #bottomMask .slogan {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }

  #bottomMask .sub {
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, .75);
    white-space: nowrap;
  }
</style>
</head>
<body>

  <iframe
    id="frame"
    src="https://lotto.sina.cn/open/?dfc=0"
    allowfullscreen
    referrerpolicy="no-referrer">
  </iframe>

  <div id="topMask">
    <div class="title">福彩体彩开奖查询</div>
  </div>

  <div id="bottomMask">
    <div class="slogan">未满 18 周岁禁止购彩</div>
  </div>

</body>
</html>
