
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #333;
            padding: 1rem;
            line-height: 1.5;
        }
        
        .container {
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .code {
            font-size: 4rem;
            font-weight: 300;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        
        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
            color: #212529;
        }
        
        p {
            color: var(--secondary-color);
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        
        .links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .links a {
            display: block;
            padding: 0.875rem 1.5rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .links a:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,123,255,0.2);
        }
        
        .links a:active {
            transform: translateY(0);
        }
        
        .links a:nth-child(2) {
            background: #6c757d;
        }
        
        .links a:nth-child(2):hover {
            background: #545b62;
        }
        
        .links a:nth-child(3) {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        
        .links a:nth-child(3):hover {
            background: rgba(0,123,255,0.1);
        }
        
        /* 平板及以上 */
        @media (min-width: 640px) {
            .container {
                padding: 3rem;
            }
            
            .code {
                font-size: 5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .links {
                flex-direction: row;
                justify-content: center;
                gap: 1rem;
            }
            
            .links a {
                flex: 0 1 auto;
            }
        }
        
        /* 深色模式支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background: #121212;
                color: #e9ecef;
            }
            
            .container {
                background: #1e1e1e;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }
            
            h1 {
                color: #f8f9fa;
            }
            
            p {
                color: #adb5bd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>页面不存在</h1>
        <p>您访问的页面可能已被移动或删除</p>
        <div class="links">
            <a href="javascript:history.back()">返回上一页</a>
        </div>
    </div>
</body>
</html>
